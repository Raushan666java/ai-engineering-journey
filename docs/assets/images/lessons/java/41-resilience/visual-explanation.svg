  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">&lt;type&gt;pom&lt;/type&gt;</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">&lt;scope&gt;import&lt;/s | 2: {} (call #{})&quot;,</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">orderId, amount, callCounter.get());

