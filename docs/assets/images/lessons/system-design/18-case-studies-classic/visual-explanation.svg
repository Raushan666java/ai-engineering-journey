    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Append a counter: When a collision is detected, append a sequence</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">number and re-hash.</text>
