    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define the four phases of the NIST SP 800-61 Incident Response</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">lifecycle → Master the six-phase digital forensics methodology</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Identification → Preservation → Collection → Examination → Analysis →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Presentation) → Understand chain of custody documentation and legal</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">admissibility requirements → Apply the Order of Volatility to</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">prioritize evidence collection in live environments → Execute disk</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">forensics analysis on NTFS, FAT, and ext4 file systems including MFT</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">parsing, file carving, and deleted file recovery → Perform memory</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">forensics using Volatility 3 to extract processes, network</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">connections, DLLs, and injected code → Conduct network forensics with</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">Wireshark and Zeek to identify C2 traffic and extract artifacts →</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">Understand mobile forensics acquisition techniques for Android and iOS</text>
