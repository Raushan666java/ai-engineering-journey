<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Code Generation</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Registers: A set of general-purpose registers (e.g., 32 on MIPS, 16 on</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">ARM, 16 on x86-64...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Leader identification → Partition algorithm → Algorithm →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Chaitin&apos;s algorithm → Rule format → Bottom-up DP algorithm</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Burke-McKeeman)</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Registers: A set of general-purpose registers (e.g., 32 on MIPS, 16 on</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">ARM, 16 on x86-64 general-purpose). Registers are the fastest storage</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">tier and  → Memory: A byte-addressable memory accessed via load/store</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">instructions. → Instruction set: Arithmetic (`add`, `sub`, `mul`),</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">load/store (`ld`, `st`), branch (`beq`, `bne`, `j`), and procedure</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">call (`jal`) instructions. → The first instruction of the program. →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Any instruction that is a jump target (label target). → Any</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">instruction following a jump or conditional jump. → Mark leaders: →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">instruction 1 is a leader</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {this.id}:\n` +
            this.instructions.map((instr, i) =&gt;</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">` | 2: {spilledVar}`);
                regMap.delete(spilledVar);</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">}

            regMap.set | 3: {spillVar}` });</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">regMap.delete(spillVar);
                memMap.set(spillVar, memL |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">4: {cond}` });
                continue;
            }</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">// Handle &quot;call&quot; pseudo-op
    | 5: {instr.result}` });</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">}
                continue;
            }

            // H | 6:</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">{result} =</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Code generation maps IR to target machine instructions. Basic blocks</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">partition code for analysis...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Code Generation</text>
</svg>