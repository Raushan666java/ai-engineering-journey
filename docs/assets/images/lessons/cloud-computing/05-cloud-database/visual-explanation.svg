<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Cloud Database Services</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: managed database costs against self-hosted alternatives.</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">AWS RDS → Key Features: → Read Replica Architecture: → Amazon</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">DynamoDB: → DynamoDB Capacity Modes: → Amazon ElastiCache:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Consistency (C): Every read receives the most recent write or an</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">error. → Availability (A): Every request receives a non-error</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">response, without necessarily containing the most recent write. →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Partition Tolerance (P): The system continues to operate despite</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">network partitions. → Provisioned: Specify read/write capacity units.</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Good for predictable workloads. Auto-scaling adjusts within limits. →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">On-Demand: Pay per request. Good for unpredictable workloads.</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unlimited throughput but higher per-request cost. → Cache-Aside:</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Application checks cache first, fetches from DB on miss, writes to</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">cache. → Write-Through: Data is written to cache and DB</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">simultaneously. → Write-Behind: Data is written to cache first, DB</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">update is queued asynchronously.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {Math.ceil(dataTransferHours)}h`,
      &quot;replication&quot;:</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;~5min&quot;,
      &quot;dual-write&quot;: &quot;~1min&quot;,</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 5.1: Multi-AZ Deployment for HA:  \\\ash aws rds</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">create-db-instance \ --db-instance-identifier my-production-db...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- The CAP theorem forces a choice between consistency and availability</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">during partitions.
-...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Cloud Database Services</text>
</svg>