  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Subject-verb agreement: identify the true subject; ignore</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">intervening phrases
- Tense...</text>
