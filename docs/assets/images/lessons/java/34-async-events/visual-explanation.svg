    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">`CompletableFuture`: the preferred return type for async methods</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">Ã¢â‚¬â€ it enables composition,...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rejection Policy comparison: → Pool scaling behavior: → Composing</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">async results: → Error recovery with CompletableFuture: → 7.1</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement AsyncConfigurer: → 7.2 Custom AsyncUncaughtExceptionHandler:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">If running threads &amp;lt; `corePoolSize`, a new thread is created. →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">If running threads &gt;= `corePoolSize`, the task is queued. → If the</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">queue is full and running threads &amp;lt; `maxPoolSize`, a new thread</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">is created. → If the queue is full and running threads &gt;=</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">`maxPoolSize`, the rejection policy kicks in. → The caller must invoke</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">the method from outside the class. Self-invocation bypasses the proxy.</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ The `void` return means the caller cannot know if the method failed.</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Exceptions are silently lost unless a custom</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">`AsyncUncaughtExceptionHandler` is i → Get the result or timeout →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Compose with other futures (`thenApply`, `thenCompose`, `thenCombine`)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="55" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="55" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: 500 and one for totals &amp;lt;=</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">`@EnableAsync`; Thread pool tuning; `CompletableFuture`</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Async Processing &amp; Spring Events</text>
</svg>