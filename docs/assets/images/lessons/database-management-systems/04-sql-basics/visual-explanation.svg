  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key Decision: VARCHAR vs CHAR → Real-World Analogy: → Numbered Steps:</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Pseudocode: → SQL Syntax: → Sample Data (for later DML examples):</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
