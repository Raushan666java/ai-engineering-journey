<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">3.8.3 Numbered Steps</text>
    <line x1="56" y1="116" x2="544" y2="116" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="136" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Evaluate `condition` (which</text>
    <text x="56" y="156" font-size="13" fill="#333" font-family="Arial, sans-serif">    must be scalar --- any</text>
    <text x="56" y="176" font-size="13" fill="#333" font-family="Arial, sans-serif">    non-zero is true) 2</text>
    <text x="56" y="196" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  If condition is true</text>
    <text x="56" y="216" font-size="13" fill="#333" font-family="Arial, sans-serif">    (non-zero), evaluate</text>
    <text x="56" y="236" font-size="13" fill="#333" font-family="Arial, sans-serif">    `expression_if_true`;</text>
    <text x="56" y="256" font-size="13" fill="#333" font-family="Arial, sans-serif">    skip...</text>
    <text x="56" y="276" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  If condition is false</text>
    <text x="56" y="296" font-size="13" fill="#333" font-family="Arial, sans-serif">    (zero), evaluate</text>
    <text x="56" y="316" font-size="13" fill="#333" font-family="Arial, sans-serif">    `expression_if_false`;</text>
    <text x="56" y="336" font-size="13" fill="#333" font-family="Arial, sans-serif">    skip...</text>
    <line x1="56" y1="342" x2="544" y2="342" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="362" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">Evaluate `condition`</text>
    <text x="56" y="378" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">(which must be scalar ---</text>
    <text x="56" y="394" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">any non-zero is...</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>