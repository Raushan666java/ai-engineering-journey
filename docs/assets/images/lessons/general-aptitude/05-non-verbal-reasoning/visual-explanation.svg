    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Observe the first 2-3 figures carefully → Identify what changes</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">(rotation, shading, count, position) → Identify what stays constant →</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">Apply the rule to predict the next figure → Check all answer options</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">before confirming → Rotation + shading change → Element</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">addition/subtraction → Position swapping</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: \binom{n}{2} | Counting Squares/Rectangles:: m \times n | Counting</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">Squares/Rectangles:: \sum_{i=1}^{m} \sum_{j=1}^{n} (m-i+1)(n-j+1) | 4:</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">m \times n | 5: \frac{m(m+1)}{2} \times \frac{n(n+1)}{2} | Areas in a</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">Two-Set Venn:: A - (A \cap B)</text>
