    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Docker CLI (`docker`): User-facing command-line tool. Sends commands</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">to the daemon via REST API. → Docker Daemon (`dockerd`): Background</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">service that manages containers, images, volumes, and networks. →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">containerd: Industry-standard container runtime. Manages container</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">lifecycle (create, start, stop, delete). → containerd-shim:</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Per-container process that keeps the container running even if the</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">daemon restarts. → runc: OCI-compliant runtime that uses Linux</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">namespaces and cgroups to create containers. → Named volumes: Managed</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">by Docker, persistent, stored in `/var/lib/docker/volumes/` → Bind</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">mounts: Map host directory into container (for development) → tmpfs</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">mounts: Temporary, in-memory storage (for secrets, scratch space)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
