<text x="440" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">north star · guardrail</text>
<rect x="320" y="236" width="240" height="52" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
<text x="440" y="263" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Prototype</text>
<text x="440" y="277" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fastest useful version</text>
<rect x="320" y="308" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
