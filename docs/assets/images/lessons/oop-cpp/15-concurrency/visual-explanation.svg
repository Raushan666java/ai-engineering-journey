  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish concurrency from parallelism with real-world analogies →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create and manage threads with `std::thread` → join, detach, RAII</text>
