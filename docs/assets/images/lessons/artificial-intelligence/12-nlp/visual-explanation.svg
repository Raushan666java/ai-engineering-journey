  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 12: Natural Language Processing</text>
