<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#ffffff" rx="6"/>
  <!-- Top decoration -->
  <rect x="0" y="0" width="600" height="4" fill="url(#qgrad)"/>
  <defs>
    <linearGradient id="qgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
    <text x="300" y="60" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Boolean Algebra</text>
  <text x="300" y="82" font-size="12" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Self-Test Quiz — 4 Questions</text>
  <rect x="30" y="110" width="540" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="118" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="131" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q1</text>
        <text x="45" y="132" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">The adjacency theorem states:</text>
        <text x="55" y="156" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) x + x?y = x</text>
  <text x="55" y="170" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) x?y + x?y&apos; = x</text>
  <text x="55" y="184" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) (x?y)&apos; = x&apos; + y&apos;</text>
  <text x="55" y="198" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) x?x&apos; = 0</text>
      <text x="45" y="224" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="248" width="540" height="142" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="256" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="269" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q2</text>
        <text x="45" y="270" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">De Morgan&apos;s theorem converts an AND-OR</text>
  <text x="45" y="286" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">expression to:</text>
        <text x="55" y="310" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) SOP form</text>
  <text x="55" y="324" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) An equivalent NAND-NAND expression</text>
  <text x="55" y="338" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) POS form</text>
  <text x="55" y="352" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) A minterm list</text>
      <text x="45" y="378" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="402" width="540" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="410" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="423" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q3</text>
        <text x="45" y="424" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">Which gate set is NOT functionally complete?</text>
        <text x="55" y="448" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) {NAND}</text>
  <text x="55" y="462" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) {AND, OR}</text>
  <text x="55" y="476" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) {NOR}</text>
  <text x="55" y="490" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) {AND, NOT}</text>
      <text x="45" y="516" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="540" width="540" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="548" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="561" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q4</text>
        <text x="45" y="562" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">The XOR of four inputs equals 1 when:</text>
        <text x="55" y="586" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) All inputs are 1</text>
  <text x="55" y="600" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) Exactly one input is 1</text>
  <text x="55" y="614" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) An odd number of inputs are 1</text>
  <text x="55" y="628" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) An even number of inputs are 1</text>
      <text x="45" y="654" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
</svg>