    <text x="85" y="247" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">ओशो के &apos;देखना बनाम देखना&apos; (looking vs seeing) के भेद को</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">समझना → त्राटक को एकाग्रता नहीं बल्कि जागरूकता के रूप में समझना →</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">विज्ञान भैरव तंत्र की १५+ दृश्य तकनीकों को ओशो के नज़रिए से समझना →</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">प्रकाश और अन्धकार दोनों को ध्यान के साधन के रूप में जानना → TypeScript</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">त्राटक टाइमर को ओशो के निर्देशों के साथ कार्यान्वित करना → देखना बनाम</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">देखना — ओशो ने &apos;एकाग्रता&apos; और &apos;जागरूकता&apos; में भेद</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">किया → त्राटक — एकाग्रता नहीं, बल्कि शिथिल जागरूकता → अग्नि त्राटक —</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">बाहर की अग्नि भीतर की अग्नि को जगाती है</text>
