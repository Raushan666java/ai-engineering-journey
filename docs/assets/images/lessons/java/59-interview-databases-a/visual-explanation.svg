    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">`validate`: Checks that the database schema matches your entities.</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Throws an exception on mismatch. Safe for production → it never</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">modifies the schema → `update`: Automatically alters the schema to</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">match your entities (adds new tables/columns, but never drops</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">anything). Not safe for production → it can → `create`: Drops all</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">existing tables and recreates them from your entities. Data loss</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">guaranteed. Useful for testing only. → `create-drop`: Same as</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">`create`, but also drops the schema when the session factory closes.</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Ideal for embedded databases in unit tests. → Always prefer `LAZY` for</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">`@OneToMany` and `@ManyToMany`. Eager loading a large collection can</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">pull in the entire database. → `@ManyToOne` defaults to `EAGER`.</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">Consider changing it to `LAZY` and using `JOIN FETCH` when you</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">actually need the parent. → `@Basic` (scalar fields) is always `EAGER`</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ there is no lazy loading for simple columns unless you enable</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">bytecode enhancement. → Eager loading via `@ManyToOne` can cascade</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">into multiple joins: `Order → Customer → Address → Country`. One</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">simple query becomes a 4-table Cartesian p</text>
