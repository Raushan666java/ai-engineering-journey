{% block scripts %}
{{ super() }}
<script>
(function() {
  // ========================================================================
  // Advanced Lightbox — Image Gallery + Zoom + Pan + Touch
  // ========================================================================
  var overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = [
    '<div class="lb-close" title="Close (Esc)">&times;</div>',
    '<div class="lb-prev" title="Previous (&larr;)">&#10094;</div>',
    '<div class="lb-next" title="Next (&rarr;)">&#10095;</div>',
    '<div class="lb-counter"></div>',
    '<div class="lb-download" title="Download">&#10515;</div>',
    '<div class="lb-zoom-toggle" title="Toggle Actual Size (0)">&#9670;</div>',
    '<div class="lb-stage">',
    '  <div class="lb-zoom-hint">Scroll to zoom &bull; Drag to pan &bull; Click edge to close</div>',
    '  <div class="lb-content"></div>',
    '</div>',
    '<div class="lb-caption"></div>',
  ].join('');
  document.body.appendChild(overlay);

  var lbContent = overlay.querySelector('.lb-content');
  var lbCaption = overlay.querySelector('.lb-caption');
  var lbCounter = overlay.querySelector('.lb-counter');
  var lbStage = overlay.querySelector('.lb-stage');
  var lbZoomHint = overlay.querySelector('.lb-zoom-hint');
  var lbZoomToggle = overlay.querySelector('.lb-zoom-toggle');
  var fitMode = true; // true = fit screen, false = native resolution

  var galleryItems = [];
  var currentIndex = 0;
  var zoomLevel = 1;
  var panX = 0, panY = 0;
  var isPanning = false, panStartX, panStartY;
  var touchStartX, touchStartY, touchDist = 0;

  function isExpandableImage(img) {
    var src = img.getAttribute('src') || '';
    if (!src || src.startsWith('data:')) return false;
    if (img.closest('nav') || img.closest('header') || img.closest('footer') || img.closest('.md-header') || img.closest('.md-nav') || img.closest('.md-tabs')) return false;
    if (img.classList.contains('twemoji') || img.classList.contains('md-icon') || img.classList.contains('emoji')) return false;
    if (img.hasAttribute('width') && parseInt(img.getAttribute('width')) < 60) return false;
    if (img.hasAttribute('height') && parseInt(img.getAttribute('height')) < 60) return false;
    return true;
  }

  function getPageImages() {
    var imgs = [];
    document.querySelectorAll('img').forEach(function(img) {
      if (!isExpandableImage(img)) return;
      var src = img.getAttribute('src') || '';
      if (src) imgs.push({ src: src, alt: img.getAttribute('alt') || '', element: img });
    });
    return imgs;
  }

  function openLightbox(items, index) {
    galleryItems = items;
    currentIndex = index;
    zoomLevel = 1; panX = 0; panY = 0; fitMode = true;
    renderItem();
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    lbContent.innerHTML = '';
  }

  function toggleFitMode() {
    fitMode = !fitMode;
    if (fitMode) { zoomLevel = 1; panX = 0; panY = 0; }
    else { zoomLevel = 2; panX = 0; panY = 0; }
    lbZoomToggle.classList.toggle('lb-active', !fitMode);
    applyContentStyles();
    applyTransform();
  }

  function applyContentStyles() {
    var img = lbContent.querySelector('img');
    var svg = lbContent.querySelector('svg');
    var el = img || svg;
    if (!el) return;
    if (fitMode) {
      el.style.maxWidth = '98vw';
      el.style.maxHeight = '95vh';
      el.style.width = '';
      el.style.height = '';
    } else {
      el.style.maxWidth = '';
      el.style.maxHeight = '';
      el.style.width = el.naturalWidth ? el.naturalWidth + 'px' : '';
      el.style.height = el.naturalHeight ? el.naturalHeight + 'px' : '';
    }
  }

  function renderItem() {
    if (!galleryItems.length) return;
    var item = galleryItems[currentIndex];
    zoomLevel = 1; panX = 0; panY = 0; fitMode = true;
    if (lbZoomToggle) lbZoomToggle.classList.remove('lb-active');
    lbZoomHint.style.opacity = '1';

    // Counter
    lbCounter.textContent = (currentIndex + 1) + ' / ' + galleryItems.length;
    overlay.querySelector('.lb-prev').style.display = galleryItems.length > 1 ? '' : 'none';
    overlay.querySelector('.lb-next').style.display = galleryItems.length > 1 ? '' : 'none';

    // Content
    lbContent.innerHTML = '';
    var el;
    if (item.isMermaid) {
      el = item.svg.cloneNode(true);
      el.style.cssText = 'max-width: 98vw; max-height: 95vh; width: auto; height: auto; display: block; margin: 0 auto; background: #fff; border-radius: 8px;';
    } else {
      el = document.createElement('img');
      el.src = item.src;
      el.alt = item.alt;
      el.style.cssText = 'max-width: 98vw; max-height: 95vh; width: auto; height: auto; display: block; margin: 0 auto; border-radius: 8px; cursor: grab;';
      el.draggable = false;
      el.style.imageRendering = 'auto';
      el.style.WebkitOptimizeContrast = 'true';
      el.style.MsInterpolationMode = 'bicubic';
    }
    el.style.transform = 'scale(' + zoomLevel + ') translate(' + panX + 'px, ' + panY + 'px)';
    el.style.transition = 'transform 0.15s ease';
    lbContent.appendChild(el);

    // Caption
    var captionText = item.alt || (item.isMermaid ? 'Mermaid Diagram' : '');
    lbCaption.textContent = captionText;
    lbCaption.style.display = captionText ? '' : 'none';

    // Download link
    var dlBtn = overlay.querySelector('.lb-download');
    if (!item.isMermaid && item.src) {
      dlBtn.style.display = '';
      dlBtn.setAttribute('data-src', item.src);
    } else {
      dlBtn.style.display = 'none';
    }
  }

  function applyTransform() {
    var el = lbContent.firstChild;
    if (!el) return;
    el.style.transform = 'scale(' + zoomLevel + ') translate(' + panX + 'px, ' + panY + 'px)';
  }

  // --- Click delegation on overlay ---
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay || e.target.classList.contains('lb-stage')) {
      closeLightbox();
    }
    if (e.target.closest('.lb-close')) closeLightbox();
    if (e.target.closest('.lb-prev')) { navigate(-1); }
    if (e.target.closest('.lb-next')) { navigate(1); }
    if (e.target.closest('.lb-zoom-toggle')) { toggleFitMode(); }
    if (e.target.closest('.lb-download')) {
      var src = e.target.closest('.lb-download').getAttribute('data-src');
      if (src) {
        var a = document.createElement('a');
        a.href = src; a.download = src.split('/').pop();
        a.click();
      }
    }
  });

  function navigate(dir) {
    currentIndex = (currentIndex + dir + galleryItems.length) % galleryItems.length;
    renderItem();
  }

  // --- Keyboard ---
  document.addEventListener('keydown', function(e) {
    if (!overlay.classList.contains('active')) return;
    switch (e.key) {
      case 'Escape': closeLightbox(); break;
      case 'ArrowLeft': navigate(-1); e.preventDefault(); break;
      case 'ArrowRight': navigate(1); e.preventDefault(); break;
      case '+': case '=': zoomLevel = Math.min(10, zoomLevel + 0.25); applyTransform(); e.preventDefault(); break;
      case '-': zoomLevel = Math.max(0.25, zoomLevel - 0.25); applyTransform(); e.preventDefault(); break;
      case '0': toggleFitMode(); e.preventDefault(); break;
    }
  });

  // --- Mouse wheel zoom ---
  lbStage.addEventListener('wheel', function(e) {
    if (!overlay.classList.contains('active')) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.15 : 0.15;
    zoomLevel = Math.max(0.25, Math.min(10, zoomLevel + delta));
    lbZoomHint.style.opacity = '0';
    applyTransform();
  }, { passive: false });

  // --- Drag to pan ---
  lbContent.addEventListener('mousedown', function(e) {
    if (zoomLevel <= 1) return;
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    var el = lbContent.firstChild;
    if (el) el.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isPanning) return;
    panX = e.clientX - panStartX;
    panY = e.clientY - panStartY;
    applyTransform();
  });

  document.addEventListener('mouseup', function() {
    if (isPanning) {
      isPanning = false;
      var el = lbContent.firstChild;
      if (el) el.style.cursor = 'grab';
    }
  });

  // --- Touch support ---
  lbContent.addEventListener('touchstart', function(e) {
    var t = e.touches;
    if (t.length === 1) {
      touchStartX = t[0].clientX;
      touchStartY = t[0].clientY;
      if (zoomLevel > 1) {
        isPanning = true;
        panStartX = t[0].clientX - panX;
        panStartY = t[0].clientY - panY;
      }
    } else if (t.length === 2) {
      isPanning = false;
      touchDist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    }
  }, { passive: true });

  lbContent.addEventListener('touchmove', function(e) {
    var t = e.touches;
    if (t.length === 1 && isPanning) {
      panX = t[0].clientX - panStartX;
      panY = t[0].clientY - panStartY;
      applyTransform();
    } else if (t.length === 2) {
      var dist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      if (touchDist > 0) {
        zoomLevel = Math.max(0.25, Math.min(10, zoomLevel * (dist / touchDist)));
        lbZoomHint.style.opacity = '0';
        applyTransform();
      }
      touchDist = dist;
    }
  }, { passive: true });

  lbContent.addEventListener('touchend', function(e) {
    if (!isPanning && e.changedTouches.length === 1 && zoomLevel <= 1) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 60) {
        navigate(dx > 0 ? -1 : 1);
      }
    }
    isPanning = false;
  }, { passive: true });

  // --- Collect images on the page (SITE-WIDE) ---
  function collectAndBindImages() {
    document.querySelectorAll('img').forEach(function(img) {
      if (img._lbBound || !isExpandableImage(img)) return;
      img._lbBound = true;
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var allImgs = document.querySelectorAll('img');
        var src = this.getAttribute('src');
        var items = [];
        var idx = 0;
        allImgs.forEach(function(other, i) {
          if (!isExpandableImage(other)) return;
          var s = other.getAttribute('src');
          if (s) {
            if (s === src) idx = items.length;
            items.push({ src: s, alt: other.getAttribute('alt') || '' });
          }
        });
        if (idx < 0 || idx >= items.length) idx = 0;
        openLightbox(items, idx);
      });
    });
  }

  collectAndBindImages();
  var imgObserver = new MutationObserver(collectAndBindImages);
  imgObserver.observe(document.body, { childList: true, subtree: true });

  // ========================================================================
  // Collapsible Mermaid wrappers
  // ========================================================================
  document.querySelectorAll('.mermaid').forEach(function(el) {
    if (el.closest('.tp-mermaid-wrap')) return;
    var wrap = document.createElement('details');
    wrap.className = 'tp-mermaid-wrap';
    wrap.style.cssText = 'margin: 1.2rem 0; border: 1px solid var(--md-default-fg-color--lightest, #e0e0e0); border-radius: 8px; overflow: hidden;';
    var summary = document.createElement('summary');
    summary.style.cssText = 'padding: 0.5rem 1rem; cursor: pointer; font-size: 0.82rem; font-weight: 500; background: var(--md-code-bg-color, #f5f5f5); border-bottom: 1px solid var(--md-default-fg-color--lightest, #e0e0e0); user-select: none;';
    summary.textContent = '\u{1F4CA} Click to expand diagram';
    var inner = document.createElement('div');
    inner.style.cssText = 'padding: 1rem;';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(summary);
    wrap.appendChild(inner);
    inner.appendChild(el);

    // Bind Mermaid click for lightbox
    el.style.cursor = 'zoom-in';
    el.addEventListener('click', function(e) {
      if (e.target.closest('summary')) return;
      var svg = el.querySelector('svg');
      if (svg) {
        openLightbox([{ isMermaid: true, svg: svg, alt: 'Mermaid Diagram' }], 0);
        e.preventDefault();
      }
    });
  });

  // ========================================================================
  // Interactive Features — Reading Time, Progress, Problem of Day, Scrollbar
  // ========================================================================

  // --- Inject CSS for new features ---
  const featureStyle = document.createElement('style');
  featureStyle.textContent = [
    '.tp-reading-time {',
    '  display: inline-block;',
    '  font-size: 0.78rem;',
    '  font-weight: 600;',
    '  color: var(--tp-green, #40a944);',
    '  background: rgba(64, 169, 68, 0.1);',
    '  padding: 0.2rem 0.6rem;',
    '  border-radius: 4px;',
    '  margin-bottom: 0.3rem;',
    '  letter-spacing: 0.3px;',
    '}',
    '.tp-last-updated {',
    '  display: block;',
    '  font-size: 0.72rem;',
    '  color: var(--md-typeset-color, #888);',
    '  opacity: 0.65;',
    '  margin-bottom: 0.8rem;',
    '  margin-top: -0.1rem;',
    '}',
    '.tp-progress-wrapper {',
    '  margin-bottom: 1rem;',
    '}',
    '.tp-progress-container {',
    '  width: 100%;',
    '  height: 6px;',
    '  background: var(--md-default-fg-color--lightest, #e0e0e0);',
    '  border-radius: 3px;',
    '  overflow: hidden;',
    '}',
    '.tp-progress-fill {',
    '  height: 100%;',
    '  background: var(--tp-green, #40a944);',
    '  border-radius: 3px;',
    '  transition: width 0.4s ease;',
    '  width: 0%;',
    '}',
    '.tp-progress-label {',
    '  font-size: 0.72rem;',
    '  color: var(--md-typeset-color, #888);',
    '  margin-bottom: 0.25rem;',
    '  display: block;',
    '}',
    '.tp-complete-btn {',
    '  display: inline-flex;',
    '  align-items: center;',
    '  gap: 0.4rem;',
    '  padding: 0.5rem 1.1rem;',
    '  border: 1px solid var(--tp-green, #40a944);',
    '  border-radius: 6px;',
    '  background: transparent;',
    '  color: var(--tp-green, #40a944);',
    '  font-size: 0.82rem;',
    '  font-weight: 500;',
    '  cursor: pointer;',
    '  transition: all 0.2s;',
    '  margin-top: 2rem;',
    '  margin-bottom: 1rem;',
    '}',
    '.tp-complete-btn:hover {',
    '  background: var(--tp-green, #40a944);',
    '  color: #fff;',
    '}',
    '.tp-complete-btn.is-completed {',
    '  background: var(--tp-green, #40a944);',
    '  color: #fff;',
    '  opacity: 0.85;',
    '}',
    '.tp-complete-btn.is-completed:hover {',
    '  opacity: 1;',
    '}',
    '.tp-problem-card {',
    '  border: 1px solid var(--md-default-fg-color--lightest, #ddd);',
    '  border-left: 4px solid #667eea;',
    '  background: var(--md-code-bg-color, #f8f9fa);',
    '  border-radius: 6px;',
    '  padding: 0.75rem 1rem;',
    '  margin-bottom: 1.2rem;',
    '  display: flex;',
    '  align-items: center;',
    '  justify-content: space-between;',
    '  flex-wrap: wrap;',
    '  gap: 0.5rem;',
    '  font-size: 0.85rem;',
    '}',
    '.tp-problem-card .tp-problem-label {',
    '  font-weight: 600;',
    '  color: #667eea;',
    '}',
    '.tp-problem-card a {',
    '  color: var(--md-typeset-a-color, #4051b5);',
    '  text-decoration: underline;',
    '  text-underline-offset: 2px;',
    '  font-weight: 500;',
    '}',
    '.tp-problem-card a:hover {',
    '  opacity: 0.8;',
    '}',
    '.tp-difficulty-badge {',
    '  display: inline-block;',
    '  font-size: 0.65rem;',
    '  font-weight: 700;',
    '  padding: 0.15rem 0.5rem;',
    '  border-radius: 10px;',
    '  text-transform: uppercase;',
    '  letter-spacing: 0.5px;',
    '  white-space: nowrap;',
    '}',
    '.tp-difficulty-easy {',
    '  background: rgba(76, 175, 80, 0.15);',
    '  color: #2e7d32;',
    '}',
    '.tp-difficulty-medium {',
    '  background: rgba(255, 160, 0, 0.15);',
    '  color: #e65100;',
    '}',
    '.tp-difficulty-hard {',
    '  background: rgba(244, 67, 54, 0.15);',
    '  color: #c62828;',
    '}',
    '.tp-scroll-progress {',
    '  position: fixed;',
    '  top: 0;',
    '  left: 0;',
    '  width: 0%;',
    '  height: 3px;',
    '  background: var(--tp-green, #40a944);',
    '  z-index: 9999;',
    '  transition: opacity 0.2s;',
    '  opacity: 0;',
    '  pointer-events: none;',
    '}',
    '.tp-scroll-progress.visible {',
    '  opacity: 1;',
    '}',
  ].join('\n');
  document.head.appendChild(featureStyle);

  // --- Utility: derive course slug from path ---
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let courseSlug = null;
  if (pathParts.length >= 2 && pathParts[0] === 'courses') {
    courseSlug = pathParts[1];
  }
  const isChapterPage = courseSlug !== null && pathParts.length >= 3;

  // --- Utility: simple string hash (deterministic) ---
  function tpHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h = ((h << 5) - h) + ch;
      h |= 0;
    }
    return Math.abs(h);
  }

  // --- Cache md-content reference ---
  const mdContent = document.querySelector('.md-content');
  if (!mdContent) { return; }

  // ---- 1. Reading Time Estimate ----
  const contentText = mdContent.textContent || '';
  const words = contentText.trim().split(/\s+/).filter(Boolean);
  const wordCount = words.length;
  const readingTime = Math.max(1, Math.round(wordCount / 200));

  const readingBadge = document.createElement('span');
  readingBadge.className = 'tp-reading-time';
  readingBadge.textContent = '\uD83D\uDCD6 ' + readingTime + ' min read';

  // ---- 3. Last Updated Date (inserted before reading badge at h1) ----
  const lastUpdated = document.createElement('span');
  lastUpdated.className = 'tp-last-updated';
  lastUpdated.textContent = '\uD83D\uDCC5 Last updated: July 2026';

  // ---- 4. Problem of the Day widget (only on coding-problems pages) ----
  let problemCard = null;
  if (window.location.pathname.indexOf('coding-problems') !== -1) {
    const headings = mdContent.querySelectorAll('h2, h3');
    if (headings.length > 0) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const seed = todayStr + window.location.pathname;
      const hashVal = tpHash(seed);
      const idx = hashVal % headings.length;
      const section = headings[idx];
      const sectionName = (section.textContent || '').trim();
      const sectionId = section.id;

      const diffLevels = ['easy', 'medium', 'hard'];
      const diffLabels = ['Easy', 'Medium', 'Hard'];
      const levelIdx = hashVal % 3;
      const diffBadge = document.createElement('span');
      diffBadge.className = 'tp-difficulty-badge tp-difficulty-' + diffLevels[levelIdx];
      diffBadge.textContent = diffLabels[levelIdx];

      const link = document.createElement('a');
      link.href = '#' + sectionId;
      link.textContent = sectionName;

      const labelSpan = document.createElement('span');
      labelSpan.className = 'tp-problem-label';
      labelSpan.textContent = '\uD83D\uDCA1 Problem of the Day: ';

      const linkWrap = document.createElement('span');
      linkWrap.appendChild(labelSpan);
      linkWrap.appendChild(link);

      problemCard = document.createElement('div');
      problemCard.className = 'tp-problem-card';
      problemCard.appendChild(linkWrap);
      problemCard.appendChild(diffBadge);
    }
  }

  // ---- Insert elements at top of content in correct order ----
  const firstHeading = mdContent.querySelector('h1');

  if (firstHeading) {
    // Insert in reverse order so they stack correctly before h1

    // 3) Last updated (closest to h1)
    mdContent.insertBefore(lastUpdated, firstHeading);
    // 2) Reading badge
    mdContent.insertBefore(readingBadge, firstHeading);
    // 1) Problem card (farthest from h1)
    if (problemCard) {
      mdContent.insertBefore(problemCard, firstHeading);
    }
  } else {
    // No h1 — append to start of md-content
    if (problemCard) {
      mdContent.insertBefore(problemCard, mdContent.firstChild);
    }
    mdContent.insertBefore(readingBadge, mdContent.firstChild);
    mdContent.insertBefore(lastUpdated, mdContent.firstChild);
  }

  // ---- 2. Chapter Progress Tracking ----
  if (isChapterPage) {
    // --- Mark as Complete button ---
    const completeBtn = document.createElement('button');
    completeBtn.className = 'tp-complete-btn';
    const storageKey = 'tp-complete-' + window.location.pathname;
    const initialCompleted = localStorage.getItem(storageKey) === 'true';

    if (initialCompleted) {
      completeBtn.classList.add('is-completed');
      completeBtn.textContent = '\u2705 Completed';
    } else {
      completeBtn.textContent = '\u2705 Mark as Complete';
    }

    // Progress bar updater (shared between initial render and button click)
    let progressFillEl = null;
    let progressLabelEl = null;
    let progressWrapperEl = null;

    const updateProgress = function() {
      // Count nav links belonging to this course
      const navLinks = document.querySelectorAll(
        '.md-nav__link[href*="/courses/' + courseSlug + '/"]'
      );
      let total = 0;
      let completed = 0;
      const seen = {};

      navLinks.forEach(function(link) {
        let href = link.getAttribute('href');
        if (!href) return;
        // Resolve relative to absolute
        let absHref = href;
        if (absHref.indexOf('//') === -1) {
          absHref = window.location.origin + (absHref.charAt(0) === '/' ? '' : '/') + absHref;
        }
        let urlObj = null;
        try { urlObj = new URL(absHref); } catch (e) { return; }
        const path = urlObj.pathname;
        // Skip index pages
        if (path === '/courses/' + courseSlug + '/' ||
            path === '/courses/' + courseSlug + '/index.html') {
          return;
        }
        if (seen[path]) return;
        seen[path] = true;
        total++;
        if (localStorage.getItem('tp-complete-' + path) === 'true') {
          completed++;
        }
      });

      if (total > 0 && progressFillEl && progressLabelEl) {
        const pct = Math.round((completed / total) * 100);
        progressFillEl.style.width = pct + '%';
        progressLabelEl.textContent = 'Course progress: ' + completed + '/' + total + ' chapters (' + pct + '%)';
        if (progressWrapperEl) {
          progressWrapperEl.style.display = '';
        }
      }
    };

    completeBtn.addEventListener('click', function() {
      const cur = localStorage.getItem(storageKey) === 'true';
      if (cur) {
        localStorage.removeItem(storageKey);
        this.classList.remove('is-completed');
        this.textContent = '\u2705 Mark as Complete';
      } else {
        localStorage.setItem(storageKey, 'true');
        this.classList.add('is-completed');
        this.textContent = '\u2705 Completed';
      }
      updateProgress();
    });

    // --- Build progress bar ---
    progressFillEl = document.createElement('div');
    progressFillEl.className = 'tp-progress-fill';

    const progressContainer = document.createElement('div');
    progressContainer.className = 'tp-progress-container';
    progressContainer.appendChild(progressFillEl);

    progressLabelEl = document.createElement('span');
    progressLabelEl.className = 'tp-progress-label';

    progressWrapperEl = document.createElement('div');
    progressWrapperEl.className = 'tp-progress-wrapper';
    progressWrapperEl.style.display = 'none';
    progressWrapperEl.appendChild(progressLabelEl);
    progressWrapperEl.appendChild(progressContainer);

    // Insert progress wrapper at the very top of md-content
    mdContent.insertBefore(progressWrapperEl, mdContent.firstChild);

    // Initial calculation
    updateProgress();

    // --- Append "Mark as Complete" button at bottom of content ---
    // Try to find the last h2/h3 that is a direct child of md-content
    const lastContentHeading = mdContent.querySelector('h2:last-of-type, h3:last-of-type, h4:last-of-type');
    if (lastContentHeading && lastContentHeading.parentNode === mdContent) {
      lastContentHeading.parentNode.insertBefore(completeBtn, lastContentHeading.nextSibling);
    } else {
      mdContent.appendChild(completeBtn);
    }
  }

  // ---- 5. Back to Top scroll progress indicator ----
  const scrollBar = document.createElement('div');
  scrollBar.className = 'tp-scroll-progress';
  document.body.appendChild(scrollBar);

  const updateScrollProgress = function() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    scrollBar.style.width = pct + '%';

    if (scrollTop > 100) {
      scrollBar.classList.add('visible');
    } else {
      scrollBar.classList.remove('visible');
    }
  };

  window.addEventListener('scroll', updateScrollProgress, { passive: true });
  updateScrollProgress();
})();
</script>
