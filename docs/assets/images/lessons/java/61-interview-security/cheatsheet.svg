    <rect x="28" y="114" width="4" height="340" rx="2" fill="#2563eb"/>
    <rect x="28" y="114" width="264" height="340" rx="8" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.15"/></g>
  <text x="38" y="134" font-size="14" font-weight="bold" fill="#2563eb" font-family="Arial, sans-serif">Key Concepts</text>
    <line x1="38" y1="137" x2="138" y2="137" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="42" y="148" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">Salt: a cryptographically</text>
  <text x="42" y="161" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">random string, unique per</text>
  <text x="42" y="174" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">user,...</text>
  <text x="42" y="190" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">Pepper: a secret</text>
  <text x="42" y="203" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">application-wide key</text>
  <text x="42" y="216" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">combined with the</text>
  <text x="42" y="229" font-size="9" fill="#1e293b" font-family="Arial, sans-serif">password...</text>
