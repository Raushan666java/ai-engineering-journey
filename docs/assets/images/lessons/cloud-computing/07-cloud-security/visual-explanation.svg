    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">User: A permanent identity tied to a person or service account. →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Group: A collection of users. Assign policies to groups, not</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">individuals. → Role: A temporary identity that can be assumed by</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">users, services, or federated identities. → Policy: A JSON document</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">defining permissions (Allow/Deny). → Resource-Based Policy: Attached</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">to a resource (e.g., S3 bucket policy). → Grant least privilege ?</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">start with minimum permissions, add as needed. → Use IAM roles instead</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">of long-term access keys for applications. → Enable MFA for all human</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">users.</text>
