    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">harmonic: $\nabla^2 u = u_{xx} + u_{yy} = 0$, $\nabla^2 v = 0$</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Definition: → Arithmetic: → Complex Conjugate: → Modulus: → Polar</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Form: → Exponential Form (Euler&apos;s Formula):</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Addition: $(a+ib) + (c+id) = (a+c) + i(b+d)$ → Multiplication:</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">$(a+ib)(c+id) = (ac-bd) + i(ad+bc)$ → Division: $\frac{a+ib}{c+id} =</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{a+ib}{c+id} \cdot \frac{c-id}{c-id} = \frac{(ac+bd) +</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">i(bc-ad)}{c^2+d^2}$ → $u$ and $v$ are harmonic: $\nabla^2 u = u_{xx} +</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">u_{yy} = 0$, $\nabla^2 v = 0$ → $u$ and $v$ are harmonic conjugates ?</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">they satisfy both CR equations → Analytic functions are infinitely</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">differentiable → If $f&apos;(z) = 0$ everywhere in a domain, then $f$</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">is constant → Identity Theorem: If two analytic functions agree on a</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">set with a limit point, they&apos;re identical</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Exponential Form (Euler&apos;s Formula):: z = re^{i\theta} | Roots of</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unity:: z_k = e^{2\pi i k/n}, \quad k = 0, 1, 2, \ldots, n-1 | complex</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">function: f(z) = u(x,y) + i\,v(x,y) | analytic: f&apos;(z_0) =</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\lim_{|\Delta z| \to 0} \frac{f(z_0 + \Delta z) - f(z_0)}{\Delta z} |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Cauchy-Riemann Equations:: \frac{\partial u}{\partial x} =</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\partial v}{\partial y}, \quad \frac{\partial u}{\partial y} =</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">-\frac{\partial v}{\partial x} | 6: \frac{\partial u}{\partial r} =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1}{r}\frac{\partial v}{\partial\theta}, \quad \frac{\partial</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">v}{\partial r} = -\frac{1}{r}\frac{\partial u}{\par</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Cauchy-Riemann Equations:  Determine if $f(z) = z^2$ is</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">analytic. Solution: $f(z) = (x+iy)^2 = x^2 - y^2...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master the core concepts covered in this chapter</text>
