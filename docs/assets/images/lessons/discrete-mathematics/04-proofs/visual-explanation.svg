    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Inductive step): \sum_{i=1}^{k+1} i = \left(\sum_{i=1}^{k} i\right) +</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">(k+1) = \frac{k(k+1)}{2} + (k+1) = \frac{k(k+1) + 2(k+1)}{2} =</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{(k+1)(k+2)}{2} | 2: \sum_{i=1}^k i^2 = \frac{k(k+1)(2k+1)}{6} |</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">3: \sum_{i=1}^{k+1} i^2 = \frac{k(k+1)(2k+1)}{6} + (k+1)^2 | 4: =</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{k+1}{6}[k(2k+1) + 6(k+1)] | 5: = \frac{k+1}{6}[2k^2 + 7k + 6] |</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">6: = \frac{k+1}{6}[2k^2 + 4k + 3k + 6]</text>
