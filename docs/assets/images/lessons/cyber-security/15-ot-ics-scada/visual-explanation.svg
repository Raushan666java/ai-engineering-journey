    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Next: → Operational Technology (OT) → Security implications per level:</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Security Levels (SL) defined by IEC 62443: → Typical PLC memory</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">regions: → Allen-Bradley (Rockwell) ControlLogix / CompactLogix:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
