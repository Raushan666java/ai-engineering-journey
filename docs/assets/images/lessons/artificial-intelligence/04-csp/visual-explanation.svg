    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Real-World Analogy — Scheduling University Classes: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Problem: → CSP Formulation: → Variables: → Domains:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unary constraints reduce a variable&apos;s domain directly (e.g.,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;X â‰  red&quot; removes red from D_X). → Binary constraints</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">relate variable pairs — the most common type, forming a constraint</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">graph. → Global constraints compactly represent complex interactions —</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">$Alldifferent$ alone captures $\binom{k}{2}$ binary inequalities. →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\mathcal{X} = \{X_1, X_2, \ldots, X_n\}$ is a finite set of</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">variables. → $\mathcal{D} = \{D_1, D_2, \ldots, D_n\}$ is a set of</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">domains, where $D_i$ is the set of values that $X_i$ may take. Domains</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">may be discrete or contin → $\mathcal{C} = \{C_1, C_2, \ldots, C_m\}$</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">is a set of constraints. Each constraint $C_j$ is a pair $\langle</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">scope, relation \rangle$ where $scope$ is  → Assignment: A mapping</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">from variables to values, e.g., $\{WA = red, NT = green\}$. →</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">Consistent assignment: An assignment that does not violate any</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">constraint.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unary: C_1: WA \neq red | Binary: C_2: WA \neq NT | 3: C_3:</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">Alldifferent(WA, NT, SA, Q, NSW, V, T) | Preference (soft): C_4:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">minimize\ Smith\_8AM\_slots | 5: \binom{k}{2} | Constraint</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">Satisfaction Problem (CSP): (\mathcal{X}, \mathcal{D}, \mathcal{C})</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example: Map Coloring:  Problem: Given a map of Australia with seven</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">territories (WA, NT, SA, Q, NSW,...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
