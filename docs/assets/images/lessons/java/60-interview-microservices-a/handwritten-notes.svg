    <text x="60" y="592" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Deployment: Monolith deploys as one WAR/JAR. Microservices deploy...</text>
    <text x="60" y="614" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Scaling: Monolith scales the entire application. Microservices scale...</text>
