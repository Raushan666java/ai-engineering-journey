    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Simplified Rule: → Absolute Left/Right vs. Immediate Left/Right: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Framework for Single Row (6 persons, all facing north): → Framework</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">for Single Row (6 persons, all facing south): → Framework for Mixed</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Direction (some face north, some south): → Standard Approach for</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">Linear Seating:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Linear (Single Row): Persons sit in a single row facing either north</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">or south (or a combination) → Circular: Persons sit around a circular</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">table facing either inward (toward the center) or outward (away from</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">the center) → Double Row (Parallel): Two parallel rows of persons</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">facing each other → If a person faces north, their left is the left</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">side of the diagram on paper → If a person faces south, their left is</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">the right side of the diagram on paper → In circular arrangements</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">facing inward, the person&apos;s left is clockwise (from the</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">person&apos;s perspective) → In circular arrangements facing outward,</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">the person&apos;s left is counterclockwise → &quot;A is to the left of</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">B&quot; (absolute positioning): A sits to the east/west of B depending</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">on perspective</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
