    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\mathbb{N} = \{0, 1, 2, 3, \ldots\}$ ? natural numbers → $\mathbb{Z}</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">= \{\ldots, -2, -1, 0, 1, 2, \ldots\}$ ? integers → $\mathbb{Q} =</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">\{a/b \mid a, b \in \mathbb{Z},\; b \neq 0\}$ ? rational numbers →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\mathbb{R}$ ? real numbers → $\{x \in \mathbb{N} \mid x &amp;lt;</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">10\}$ ? natural numbers less than 10 → $\{2k \mid k \in \mathbb{Z}\}$</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">? even integers → $\{x^2 \mid x \in \mathbb{R}\}$ ? nonnegative reals</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ $\{a/b \in \mathbb{Q} \mid a, b \in \mathbb{Z},\; b \neq 0\}$ ?</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">rationals in lowest terms</text>
