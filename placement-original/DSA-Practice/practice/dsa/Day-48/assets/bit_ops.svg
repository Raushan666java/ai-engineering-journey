<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f7fff7; stroke:#2f855a; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="560" height="180" class="box" rx="8" />
  <text x="300" y="48" text-anchor="middle" class="text title">Bit Manipulation Cheatsheet</text>
  <text x="40" y="84" class="text">- x & (-x): isolate lowest set bit</text>
  <text x="40" y="104" class="text">- x & (x-1): clear lowest set bit</text>
  <text x="40" y="124" class="text">- XOR: useful for pairwise canceling and parity</text>
  <text x="40" y="144" class="text">- Use trie for maximum XOR queries</text>
</svg>