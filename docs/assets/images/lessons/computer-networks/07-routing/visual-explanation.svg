  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish between distance-vector and link-state routing algorithms.</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Analyze the RIP protocol and its limitations due to</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">count-to-infinity. → Describe OSPF operation including area hierarchy</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">and link-state database synchronization. → Explain BGP path attributes</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">and the policy-driven nature of inter-domain routing. → Compare</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">unicast, multicast, broadcast, and anycast routing paradigms. →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Maintains a map (routing table / topology database) → Computes paths</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">using an algorithm (Bellman-Ford, Dijkstra, or policy-based) → Adapts</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">when roads close or traffic spikes (convergence)</text>
