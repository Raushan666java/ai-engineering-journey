  <text x="35" y="247" font-size="9" fill="#475569" font-family="Arial, sans-serif">It: not symmetric ($3</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">\leq 5$ but $5</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">\not\leq...</text>
  <text x="35" y="288" font-size="9" fill="#475569" font-family="Arial, sans-serif">Composition: a relation</text>
  <text x="35" y="301" font-size="9" fill="#475569" font-family="Arial, sans-serif">operation, not a lattice</text>
  <text x="35" y="314" font-size="9" fill="#475569" font-family="Arial, sans-serif">operation. A...</text>
  <text x="35" y="329" font-size="9" fill="#475569" font-family="Arial, sans-serif">Relations: sets of</text>
  <text x="35" y="342" font-size="9" fill="#475569" font-family="Arial, sans-serif">ordered pairs. They can</text>
  <text x="35" y="355" font-size="9" fill="#475569" font-family="Arial, sans-serif">be matrices or...</text>
