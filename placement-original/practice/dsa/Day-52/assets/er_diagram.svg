<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#fff8f0; stroke:#b7791f; stroke-width:2px; }
    .text { font-family: Arial, sans-serif; font-size:13px; fill:#1a202c }
    .title { font-weight:bold; font-size:14px }
  </style>

  <rect x="50" y="40" width="240" height="80" class="box" rx="6" />
  <text x="170" y="62" text-anchor="middle" class="text title">Users</text>
  <text x="170" y="82" class="text" text-anchor="middle">id, username, email, passwordHash, role</text>

  <rect x="330" y="40" width="260" height="80" class="box" rx="6" />
  <text x="460" y="62" text-anchor="middle" class="text title">Projects</text>
  <text x="460" y="82" class="text" text-anchor="middle">id, name, description, ownerId</text>

  <rect x="50" y="160" width="420" height="100" class="box" rx="6" />
  <text x="260" y="182" text-anchor="middle" class="text title">Tasks</text>
  <text x="260" y="202" class="text" text-anchor="middle">id, title, description, projectId, assignedTo, priority, status, dueDate</text>

  <rect x="500" y="160" width="280" height="80" class="box" rx="6" />
  <text x="640" y="182" text-anchor="middle" class="text title">Comments</text>
  <text x="640" y="202" class="text" text-anchor="middle">id, taskId, userId, content</text>

  <line x1="290" y1="120" x2="330" y2="120" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#b7791f" />
    </marker>
  </defs>

  <text x="50" y="320" class="text">Notes: Use foreign keys projectId -> projects.id, assignedTo -> users.id, taskId -> tasks.id</text>
</svg>