    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">McCall&apos;s Quality Model (1977): → Boehm&apos;s Quality Model</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">(1978): → FURPS+ Model (Rational/IBM): → Inspection Roles: →</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inspection metrics: → Types of static analysis:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Product Revision (ability to change): Maintainability, Flexibility,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Testability → Product Transition (ability to adapt to new</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">environments): Portability, Reusability, Interoperability → Product</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Operations (ability to run): Correctness, Reliability, Efficiency,</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Integrity, Usability → As-is Utility: Portability, Reliability,</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Efficiency → Maintainability: Testability, Understandability,</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">Modifiability → General Utility: Clarity, Documented, Device</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">Independence, Self-contained, Accuracy, Completeness, Consistency,</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">Accountability → Functionality: Feature set, security, capabilities →</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">Usability: Aesthetics, documentation, training</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {moduleB}`,
    ].join(&apos;\n&apos;);
  }
}

