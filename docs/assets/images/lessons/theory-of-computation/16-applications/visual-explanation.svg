  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">a dead state, the longest matching token is emitted. → Top-down (LL)</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">parsing: → Build the parse tree from the root downward. → Predict</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">which production to use based on the next input symbol.</text>
