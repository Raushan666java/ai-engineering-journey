    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Limits and L&apos;H?pital&apos;s Rule:  Evaluate $\lim_{x</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">\to 0} \frac{e^x - 1 - x}{x^2}$. Solution: As $x \to 0$,...</text>
