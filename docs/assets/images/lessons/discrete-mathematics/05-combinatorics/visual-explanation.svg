  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Combinatorics</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">hockey-stick identity: $\sum_{i=r}^{n} \binom{i}{r} =</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">\binom{n+1}{r+1}$ using either a combinatorial...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sum Rule (Rule of Disjunction). → Product Rule (Rule of Sequence). →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Principle of Inclusion-Exclusion (for two sets). → Theorem 5.1</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Properties of binomial coefficients). → Theorem 5.2 (Binomial</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem). → Theorem 5.3 (Pigeonhole Principle).</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\binom{n}{r} = \binom{n}{n-r}$ (symmetry) → $\binom{n}{0} =</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">\binom{n}{n} = 1$ → $\binom{n}{1} = n$ → Pascal&apos;s identity:</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\binom{n}{r} + \binom{n}{r-1} = \binom{n+1}{r}$ for $1 \leq r \leq n$</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: P(n, r) = \frac{n!}{(n-r)!} = n(n-1)(n-2)\cdots(n-r+1) |</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">combination: \binom{n}{r} = C(n, r) = \frac{n!}{r!(n-r)!} | Theorem</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">5.2 (Binomial Theorem).: (x + y)^n = \sum_{k=0}^{n} \binom{n}{k}</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">x^{n-k} y^k | 4: \frac{n!}{n_1!\, n_2! \,\cdots\, n_k!} | 5: \binom{n</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">+ r - 1}{r} | 6: \left|\bigcup_{i=1}^{n} A_i\right| = \sum_{i} |A_i| -</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{i&amp;lt;j} |A_i \cap A_j| + \sum_{i&lt;j&lt;k} |A_i \cap A_j</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cap A_k| - \cdots + (-1)^{n+1} |A_1 \</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Product rule for sequential choices; sum rule for disjoint</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">alternatives.
- Permutations are...</text>
