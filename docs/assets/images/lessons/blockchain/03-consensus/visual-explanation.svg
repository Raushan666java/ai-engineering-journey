    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Agreement: All loyal generals must agree on the same plan. → Validity:</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">The plan must be reasonable (not based on traitor messages). →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Termination: The generals must eventually reach a decision. → You need</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`2f+1` honest nodes to outvote `f` traitors → Total: `n = 3f + 1` →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Mechanism: Find a value (nonce) such that `Hash(BlockHeader + Nonce)</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">&lt; Target`. → Security: Requires enormous energy/hardware</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">investment. An attacker must control 51% of the network&apos;s hash</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">rate. → Incentive: Block rewards and transaction fees.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
