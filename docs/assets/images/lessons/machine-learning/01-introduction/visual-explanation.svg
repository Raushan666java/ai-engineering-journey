  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Introduction to Machine Learning</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Task $T$: What the system should do (e.g., classify emails as</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">spam/ham, predict housing...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Arthur Samuel → Tom Mitchell → Inductive Bias → Hybrid paradigms →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Practical implications → 1. Problem Definition</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Task $T$: What the system should do (e.g., classify emails as</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">spam/ham, predict housing prices) → Experience $E$: The data the</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">system sees (e.g., 10,000 labeled emails, 5,000 housing records) →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Performance Measure $P$: How we evaluate success (e.g., accuracy, MSE,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">F1-score) → Sebe&apos;s Bias (Preference Bias): The learner prefers</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">simpler hypotheses (e.g., Occam&apos;s razor ? shorter decision trees,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">smaller weights) → Mitchell&apos;s Bias (Language Bias): The</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">hypothesis space itself restricts what concepts can be learned (e.g.,</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">a linear classifier cannot represent XOR) → Semi-Supervised Learning:</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Combines a small set of labeled data with a large set of unlabeled</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">data. Common when labeling is expensive (medical imaging, →</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">Self-Supervised Learning: The model generates its own labels from the</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">data structure (e.g., predicting masked words in a sentence,</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">predicting the next → Multi-Task Learning: A single model is trained</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">on multiple related tasks simultaneously, sharing representations</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">across tasks.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: h \in \mathcal{H} | hypothesis space: \mathcal{H} | 3: \mathcal{H}</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 4: \mathcal{H} | 5: f: X \to Y | 6: \pi(s) \to a</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Email Spam Filter (Supervised Learning):  This example</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">demonstrates a classic binary classification problem. - Task $T$:...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway:</text>
