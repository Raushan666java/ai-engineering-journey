    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Risk tolerance: 1M/hr|
|**Authentication**|MFA, SSO, PKI|Often none or</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">shared passwords|
|**Update mechanism**|Auto- | 2: src = (is_orig ? c</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 3: orig_h : c | 4: resp_h), | 5: func_code = func, | 6: write_op =</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">(func in write_codes)
    );
    Log::write(OTModbusMonitor::LOG,</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">info);

    # Alert on</text>
