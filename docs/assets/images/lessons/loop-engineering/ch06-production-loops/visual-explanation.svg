    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">`agent.latency.p50`, `agent.latency.p95` — response time distribution</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ `agent.tokens.prompt.avg`, `agent.tokens.completion.avg` — token</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">consumption → `agent.steps.per_request` — loop iteration count →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`agent.error_rate` — fraction of requests with errors →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">`agent.drift.score` — distribution shift relative to baseline → P95</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">latency &gt; 5s for 5 consecutive minutes → page → Error rate &gt; 2%</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">in 1-minute window → warn → Drift score &gt; 0.15 relative to 24h</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">baseline → investigate</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
