    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: cloud providers across service models, pricing, and capabilities</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Compute: → Storage: → Networking: → IAM (Identity and Access</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Management) → Compute: → Storage:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">EC2 (Elastic Compute Cloud) — Virtual machines optimized for general</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">purpose (t3, m6i), compute (c6i), memory (r6i), storage (i3), and GPU</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">(p4). Suppo → Lambda — Serverless function execution supporting</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Node.js, Python, Java, Go, Ruby, .NET, and custom runtimes. Scales</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">automatically. Billed per invocat → ECS (Elastic Container Service) —</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Docker container orchestration with Fargate (serverless) and EC2</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">launch types. → EKS (Elastic Kubernetes Service) — Managed Kubernetes</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">control plane with automated upgrades and IAM integration. → S3</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Simple Storage Service) — Object storage with 99.999999999%</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">durability. Storage classes: Standard, Intelligent-Tiering, Infrequent</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">Access, Glacier → EBS (Elastic Block Store) — Block storage with gp3</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">(general purpose), io2 (provisioned IOPS up to 256K), st1</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">(throughput), sc1 (cold). Snapshots are i → RDS (Relational Database</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">Service) — Managed MySQL, PostgreSQL, Oracle, SQL Server, MariaDB,</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">Aurora. Multi-AZ for high availability, Read Replicas for  → VPC</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Virtual Private Cloud) — Isolated network environment with subnets,</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">route tables, internet/NAT gateways, security groups, network ACLs,</text>
  <text x="85" y="678" font-size="11" fill="#475569" font-family="Arial, sans-serif">VPC peeri</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {cost.toFixed(2)}/month\n`; } report += &apos;\n## Cost by</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">Environment\n&apos;; const byEnv =</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.getCostByTag(&apos;environment&apos;); for (const [env, cost] of</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">Object | 2: {cheapest.actualMonthly.toFixed(2)}/mo`); if (savings &gt;</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">0) recommendations.push(`Potential savings: | 3:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">{estimate.totalMonthly}, Annual: | 4: {b.compute} | | 5: {b.network} |</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 6: {b.totalMonthly}** |</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Multi-Cloud Cost Comparison:</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">Backup &amp; Restore; Pilot Light; Warm Standby</text>
