  <text x="510" y="377" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">मेडिटेशन (TypeScript)</text>
  <text x="510" y="393" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">को ओशो...</text>
