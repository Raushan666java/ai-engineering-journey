<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="23_trendv-title 23_trendv-desc">
<title id="23_trendv-title">AI platform landscape — pick your stack</title>
<desc id="23_trendv-desc">Providers, agent frameworks, dev toolkits and model ecosystems compared by role.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="120" y="108" width="480" height="56" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
<text x="140" y="132" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Model providers</text>
<text x="140" y="148" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace">openai · anthropic · deepseek</text>
<rect x="640" y="108" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="138" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pick by cost + quality</text>
<rect x="120" y="164" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="140" y="188" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Agent frameworks</text>
<text x="140" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">langgraph · crewai · autogen</text>
<rect x="640" y="164" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pick by orchestration</text>
<rect x="120" y="220" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="140" y="244" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Dev toolkits</text>
<text x="140" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">claude code · codex · vercel ai</text>
<rect x="640" y="220" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pick by workflow</text>
<rect x="120" y="276" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
