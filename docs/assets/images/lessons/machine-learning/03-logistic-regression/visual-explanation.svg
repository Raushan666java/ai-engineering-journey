<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Logistic Regression</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Output range: Predictions can fall outside $[0, 1]$, making them</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">uninterpretable as...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Properties → Odds → Threshold tuning → Intuition → Accuracy →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Precision</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Output range: Predictions can fall outside $[0, 1]$, making them</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">uninterpretable as probabilities → Sensitivity to outliers: Adding</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">more positive examples far from the decision boundary shifts the line</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Non-convex loss: MSE with threshold-based classification creates a</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">non-convex optimization landscape → $\sigma(0) = 0.5$ → $\sigma(z) \to</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">1$ as $z \to +\infty$ → $\sigma(z) \to 0$ as $z \to -\infty$ →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Derivative: $\sigma&apos;(z) = \sigma(z)(1 - \sigma(z))$ ? this</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">simplifies gradient computation → When $y=1$: $J = -\log(h_w(x))$. If</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">$h_w(x) \to 0$, the loss $\to \infty$ (very bad). If $h_w(x) \to 1$,</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">the loss $\to 0$ (perfect).</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: \sigma(z) = \frac{1}{1 + e^{-z}} | 2: h_w(x) = P(y=1 | x; w) =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sigma(\mathbf{w}^T\mathbf{x}) | Odds: \text{Odds} = \frac{p}{1-p} |</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">4: \frac{p}{1-p} = \frac{\sigma(\mathbf{w}^T\mathbf{x})}{1 -</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sigma(\mathbf{w}^T\mathbf{x})} = e^{\mathbf{w}^T\mathbf{x}} |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">log-odds: \log\left(\frac{p}{1-p}\right) = \mathbf{w}^T\mathbf{x} | 6:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\hat{y} = \begin{cases} 1 &amp; \text{if } h_w(x) \geq 0.5 \\ 0 &amp;</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{if } h_w(x) &amp;lt; 0.5 \end{cases}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: LogisticRegression Class in TypeScript:  Expected Output:</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">Shows training convergence, probability predictions,...</text>
