    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Eavesdropping (sniffing). → Traffic analysis. → Real-world analogy. →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Pseudocode: Packet capture on a network interface. → Python</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">implementation: Passive packet sniffer. → C++ implementation: Packet</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">sniffer (Linux raw socket).</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify the principal threats to network security: eavesdropping,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">tampering, impersonation, and denial of service. → Explain the</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">principles of symmetric and asymmetric key cryptography. → Describe</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">digital signatures, message authentication codes, and public-key</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">certificates. → Compare packet-filter, stateful, and application-layer</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">firewalls with rule evaluation. → Analyze IPSec and TLS in the context</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">of virtual private networks. → Understand DDoS attack types, IDS/IPS</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">deployment, 802.1X, WPA3, and DNSSEC. → Key expansion: Derive 10 round</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">keys from the original 128-bit key using Rijndael key schedule. →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Initial AddRoundKey: XOR plaintext block with round key 0.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: 1000&quot; packet | Include timestamps + nonces in every message;</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">use sequence numbers |
| MITM with for | 2: {params.authAlgo}`);</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">return spi;
  }

  deleteSA(spi: number): void {</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.sas.delete(s | 3: {spi}`);
    sa.seqNum++;
    const seq =</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">sa.seqNum;
    // ESP header
    const spiBytes = new  | 4:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">{spi.toString(16)} seq= | 5: {originalPacket.length}B enc= | 6:</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">{spi.toString(16)}`);
    const encrypted = espPacket.slice(8, -12);</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">const decrypted = new Uin</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Network security relies on cryptography for confidentiality (AES),</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">integrity (SHA-256, HMAC), and...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 11: Network Security</text>
