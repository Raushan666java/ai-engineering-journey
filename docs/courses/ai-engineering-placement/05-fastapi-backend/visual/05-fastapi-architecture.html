<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI Backend · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-paper-2: #f5f6f8;
      --color-ink:     #1a1b23;
      --color-muted:   #4f5d75;
      --color-accent:  #2e8555;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Module 05 · FastAPI Backend</p>
    <h1>FastAPI architecture · One request, end to end</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m05-arch-title m05-arch-desc">
      <title id="m05-arch-title">FastAPI backend request architecture</title>
      <desc id="m05-arch-desc">Architecture showing a client sending an HTTP request to FastAPI, which validates with Pydantic, applies dependency injection, reads and writes through SQLAlchemy to PostgreSQL, and returns a JSON response.</desc>

      <rect width="1000" height="620" fill="#ffffff"/>

      <!-- Arrows before boxes -->
      <!-- Client -> FastAPI (main flow, accent) -->
      <path d="M 260 220 H 380" fill="none" stroke="#2e8555" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- FastAPI -> Pydantic -->
      <path d="M 460 148 V 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- FastAPI -> SQLAlchemy -->
      <path d="M 680 176 H 760" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- SQLAlchemy -> PostgreSQL -->
      <path d="M 820 176 V 244" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e8555"/>
        </marker>
      </defs>

      <!-- Zone: Client -->
      <rect x="60" y="96" width="240" height="232" rx="8" fill="rgba(26,27,35,0.02)" stroke="rgba(26,27,35,0.10)" stroke-width="0.8"/>
      <rect x="72" y="100" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="104" y="109" fill="rgba(26,27,35,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

      <!-- Client node -->
      <rect x="84" y="192" width="192" height="56" rx="6" fill="rgba(77,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="180" y="218" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Browser / client</text>
      <text x="180" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fetch · axios · curl</text>

      <!-- Zone: API -->
      <rect x="360" y="96" width="360" height="232" rx="8" fill="rgba(26,27,35,0.02)" stroke="rgba(26,27,35,0.10)" stroke-width="0.8"/>
      <rect x="372" y="100" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="396" y="109" fill="rgba(26,27,35,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">API</text>

      <!-- FastAPI (FOCAL) -->
      <rect x="384" y="128" width="296" height="56" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="532" y="154" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">FastAPI app</text>
      <text x="532" y="172" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">routes · middleware · DI</text>

      <!-- Pydantic validation -->
      <rect x="384" y="216" width="296" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="532" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Pydantic schemas</text>
      <text x="532" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">validate · serialize</text>

      <!-- Zone: Data -->
      <rect x="740" y="96" width="220" height="232" rx="8" fill="rgba(26,27,35,0.02)" stroke="rgba(26,27,35,0.10)" stroke-width="0.8"/>
      <rect x="752" y="100" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="780" y="109" fill="rgba(26,27,35,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>

      <!-- SQLAlchemy -->
      <rect x="760" y="128" width="180" height="48" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="850" y="152" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">SQLAlchemy</text>
      <text x="850" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ORM · sessions</text>

      <!-- PostgreSQL (store) -->
      <rect x="760" y="244" width="180" height="56" rx="6" fill="rgba(26,27,35,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="850" y="270" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="850" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tables · indexes</text>

      <!-- Response arrow (dashed, bottom) -->
      <path d="M 180 248 V 420 H 532 V 300" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="344" y="408" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="364" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>

      <!-- Caption -->
      <text x="120" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL NODE</text>
      <text x="212" y="544" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">FastAPI stitches validation, dependency injection, and async DB access into one request lifecycle.</text>

      <!-- Legend strip -->
      <line x1="120" y1="588" x2="880" y2="588" stroke="rgba(26,27,35,0.10)" stroke-width="1"/>
      <text x="120" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="196" y="568" width="16" height="12" rx="2" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="220" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACCENT = MAIN FLOW</text>
      <rect x="368" y="568" width="16" height="12" rx="2" fill="rgba(26,27,35,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="392" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SHADED = STORE</text>
      <rect x="528" y="568" width="16" height="12" rx="2" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="552" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAPER = COMPONENT</text>
    </svg>
  </div>
</body>
</html>
