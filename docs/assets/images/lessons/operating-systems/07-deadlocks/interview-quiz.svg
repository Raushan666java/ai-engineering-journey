  <text x="45" y="440" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">uses multi-instance resources:</text>
        <text x="55" y="464" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. a) There is definitely a deadlock</text>
