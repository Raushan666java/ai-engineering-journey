    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Base case: $P(n_0)$ is true, and → Inductive step: For all $k \geq</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">n_0$, $P(k) \implies P(k+1)$, → Base case(s): $P(n_0), P(n_0+1),</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">\ldots, P(m)$ are true, and → Strong inductive step: For all $k \geq</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">m$, $P(n_0) \land \cdots \land P(k) \implies P(k+1)$, → Case 1: $n =</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">3k \implies n^2 = 9k^2 \equiv 0 \pmod{3}$. → Case 2: $n = 3k+1</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">\implies n^2 = 9k^2 + 6k + 1 \equiv 1 \pmod{3}$. → Case 3: $n = 3k+2</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">\implies n^2 = 9k^2 + 12k + 4 \equiv 1 \pmod{3}$.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
