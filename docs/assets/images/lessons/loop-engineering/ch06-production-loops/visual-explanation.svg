  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {this.config.maxCostPerRequest}) exceeded`); return { approved:</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">false, model, reason: &quot;Request budget exceeded&quot; }; } //</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">Check session budget if (this. | Budget tracking.: 0.50 per task,</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">10,000 tokens per request). Every LLM call deducts from the budget.</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">The governor main | 3: {this.deployment.modelVersion}`);
  }

  //</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">── Monitor ────────────────────────────────────────── | 4:</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">{latencyDelta.toFixed(2)}s`);
      score += 0.3;
    }

    const</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">errDelta = current.errorRate  | 5: {(completionDelta *</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">100).toFixed(1)}%`);
      score += 0.3;
    }

    const detected</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">= score &gt; | 6: {signals.join(&quot;; &quot;)}`);
    }</text>
  <text x="85" y="657" font-size="11" fill="#475569" font-family="Arial, sans-serif">return { detected, score, threshold: this.config.driftThreshol</text>
