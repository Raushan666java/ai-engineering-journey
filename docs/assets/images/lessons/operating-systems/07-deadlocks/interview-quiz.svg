  <text x="55" y="492" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. c) There may or may not be a deadlock</text>
  <text x="55" y="506" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. d) The graph is invalid</text>
