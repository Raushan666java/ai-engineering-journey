    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Our highest priority is to satisfy the customer through early and</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">continuous delivery of valuable software. → Welcome changing</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">requirements, even late in development. Agile processes harness change</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">for the customer&apos;s competitive advantage. → Deliver working</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">software frequently, from a couple of weeks to a couple of months,</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">with a preference to the shorter timescale. → Business people and</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">developers must work together daily throughout the project. → Build</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">projects around motivated individuals. Give them the environment and</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">support they need, and trust them to get the job done. → The most</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">efficient and effective method of conveying information to and within</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">a development team is face-to-face conversation. → Working software is</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">the primary measure of progress. → Agile processes promote sustainable</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">development. The sponsors, developers, and users should be able to</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">maintain a constant pace indefinitely.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
