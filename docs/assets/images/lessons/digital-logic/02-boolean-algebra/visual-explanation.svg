  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">SOP S(m_i) = POS ?(M_j) where j indexes the minterms NOT in the SOP →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">For an n-variable function: if F = S(m_i), then F&apos; = S(m_j) where</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">j ? i → F = ?(M_j) where j ? i → NOT: A&apos; = (A?A)&apos; → AND: A?B</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">= [(A?B)&apos;]&apos; → OR: A + B = (A&apos;?B&apos;)&apos; =</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">(A?A)&apos;?(B?B)&apos; → NOT: A&apos; = (A + A)&apos; → OR: A + B =</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">[(A + B)&apos;]&apos;</text>
