  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Connection pool exhaustion: The database connection is held for the</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">entire request, including slow view rendering or network I/O. Each</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">connection is u → Lazy loading in unexpected places: Templates trigger</text>
