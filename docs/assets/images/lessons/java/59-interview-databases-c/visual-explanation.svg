  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">production with real data. → `Page`: Includes total element count</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">(requires a `COUNT` query). Use for UIs that need total page numbers.</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ `Slice`: Only knows if there&apos;s a next slice (no count query).</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">More efficient for infinite scroll. → `List` with `Sort`: No</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">pagination header. Use for small result sets. → The number of filter</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">combinations grows combinatorially</text>
