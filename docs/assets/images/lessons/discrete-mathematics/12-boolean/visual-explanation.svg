    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: S = A \oplus B \oplus C_\text{in} | 2: C_\text{out} = AB +</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">AC_\text{in} + BC_\text{in} | 3: \{0,1\} | 4: (x+y)&apos; =</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">x&apos;y&apos; | 5: (xy)&apos; = x&apos; + y&apos; | 6: \rightarrow</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
