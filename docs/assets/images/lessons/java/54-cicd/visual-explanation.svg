<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">CI/CD for Spring Boot</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Static Analys: (Checkstyle)</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">C) Enhanced reliability. → C) The one with best operational</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">characteristics. → B) When complexity justifies the overhead.</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design and implement GitHub Actions workflows for Spring Boot with</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">matrix builds, caching, and Docker layer caching → Configure GitLab CI</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">pipelines with stages, artifacts, docker-in-docker, security scanning,</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">and environment-based deployments → Structure a build pipeline from</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">compile through test, package, publish, and deploy → Publish artifacts</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">to Maven Central, GitHub Packages, Nexus/Artifactory, and container</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">registries → Implement automated deployment strategies including</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">rolling, blue-green, and canary releases → Integrate database</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">migrations into CI/CD pipelines with Flyway → Configure approval gates</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">with quality checks, coverage thresholds, and security scanning →</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">develop</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {{ github.repository }}
  JAVA_VERSION:</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;17&quot;

concurrency:
  group: | 2: {{ runner.os }}-sonar</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">- name: Compile
        run: ./mvnw compile -B -q

      - name: U</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 3: {{ secrets.SONAR_HOST_URL }}
        with:
          args: &gt;</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">-Dsonar.projectKey= | 4: {{ matrix.java-version }}
          path: |</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">target/surefire-reports/
            targ | 5: {{ env.IMAGE_NAME }}</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">tags: |
            type=ref,event=branch
            type=ref,eve |</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">6: {{ steps.meta.outputs.created }}
            VERSION=</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">GitHub Actions; GitLab CI; Build pipelines</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">CI/CD for Spring Boot</text>
</svg>