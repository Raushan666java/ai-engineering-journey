  <text x="565" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <text x="565" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">&gt;name-&gt;toEqual(&apos;John&apos;);</text>
  <rect x="665" y="100" width="130" height="80" rx="40" fill="url(#gGreen)" filter="url(#shadowMd)"/>
  <circle cx="730" cy="126" r="15" fill="#ffffff" opacity="0.25"/>
      <text x="730" y="131" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">6</text>
  <text x="730" y="160" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">&gt;expect([&apos;dd&apos;,...</text>
  <!-- Description for step 6 -->
    <rect x="669" y="202" width="122" height="96" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="669" y="202" width="122" height="96" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="679" y1="212" x2="781" y2="212" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="730" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <text x="730" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">&gt;expect([&apos;dd&apos;,</text>
  <text x="730" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">&apos;dump&apos;,</text>
  <text x="730" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">&apos;ray&apos;,</text>
