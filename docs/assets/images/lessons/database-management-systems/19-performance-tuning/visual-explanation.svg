  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">theory → Use table partitioning and materialized views for query</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">acceleration → Diagnose slow queries using practical tools and metrics</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Apply performance tuning patterns to common database scenarios →</text>
