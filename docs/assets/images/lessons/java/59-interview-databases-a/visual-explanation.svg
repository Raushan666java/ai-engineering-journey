  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {count} IDs in one DB round-trip`);
  }

  /** Generate an ID</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">based on the strategy */
  private | 2: {entity.id} (individual — no</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">batching)`
          );
        }
      } else {
        //</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">SEQUENC | 3: {batchEntities[0].sqlTable} ` +
          `(batched, IDs</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">pre-allocated)`
        );
      }
     | 4: {i}`, price:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">Math.random() * 100 }
    }));

    console.log(`\n=== Benchmark:</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inserting | 5: {query.substring(0, 40)}`);
  }

  private</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">countTableScans(query: string): number {
    const fr | 6:</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">{q.executionTimeMs.toFixed(1)}ms): consider adding an index`</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">);
      }
    }
    return</text>
