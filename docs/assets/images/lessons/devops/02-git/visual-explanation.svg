    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Four object types: → Blob: → Tree: → Commit: → Tag: → References</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">(refs):</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
