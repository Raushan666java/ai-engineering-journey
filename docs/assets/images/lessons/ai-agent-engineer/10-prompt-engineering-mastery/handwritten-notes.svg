    <text x="60" y="468" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: {agent_name}, an AI agent specialized in</text>
    <text x="60" y="498" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="526" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Start with 120 apples</text>
    <text x="60" y="548" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. Morning: sold 1/3 ? 120 * 1/3 = 40 sold, 80 remaining</text>
    <text x="60" y="570" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">5. Afternoon: sold 1/4 of remaining ? 80 * 1/4 = 20 sold, 60 remaining</text>
