<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Day 59 — Consistent Hashing: Hash Ring with Virtual Nodes</text>
  
  <!-- Hash Ring Circle -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="#94a3b8" stroke-width="3"/>
  
  <!-- Physical Nodes (larger circles) -->
  <circle cx="540" cy="220" r="12" fill="#3b82f6"/>
  <text x="555" y="225" font-size="12" font-weight="bold" fill="#1e40af">Node A</text>
  
  <circle cx="330" cy="100" r="12" fill="#10b981"/>
  <text x="280" y="95" font-size="12" font-weight="bold" fill="#047857">Node B</text>
  
  <circle cx="260" cy="280" r="12" fill="#f59e0b"/>
  <text x="210" y="275" font-size="12" font-weight="bold" fill="#92400e">Node C</text>
  
  <!-- Virtual Nodes (smaller dots) -->
  <circle cx="520" cy="160" r="5" fill="#93c5fd"/>
  <circle cx="510" cy="280" r="5" fill="#93c5fd"/>
  <circle cx="480" cy="320" r="5" fill="#93c5fd"/>
  
  <circle cx="370" cy="120" r="5" fill="#6ee7b7"/>
  <circle cx="310" cy="140" r="5" fill="#6ee7b7"/>
  <circle cx="290" cy="190" r="5" fill="#6ee7b7"/>
  
  <circle cx="300" cy="250" r="5" fill="#fcd34d"/>
  <circle cx="340" cy="310" r="5" fill="#fcd34d"/>
  <circle cx="400" cy="340" r="5" fill="#fcd34d"/>
  
  <!-- Key placement example -->
  <circle cx="450" cy="140" r="6" fill="#ef4444"/>
  <text x="460" y="145" font-size="11" fill="#dc2626">Key1</text>
  <line x1="450" y1="140" x2="520" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Annotations -->
  <rect x="20" y="60" width="200" height="280" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="35" y="85" font-size="13" font-weight="bold" fill="#334155">How It Works:</text>
  
  <text x="35" y="110" font-size="11" fill="#475569">1. Hash nodes to ring</text>
  <text x="35" y="128" font-size="11" fill="#475569">   positions</text>
  
  <text x="35" y="153" font-size="11" fill="#475569">2. Create virtual nodes</text>
  <text x="35" y="171" font-size="11" fill="#475569">   (small dots) for better</text>
  <text x="35" y="189" font-size="11" fill="#475569">   distribution</text>
  
  <text x="35" y="214" font-size="11" fill="#475569">3. Hash key clockwise</text>
  <text x="35" y="232" font-size="11" fill="#475569">   to find next node</text>
  
  <text x="35" y="257" font-size="11" fill="#475569">4. When node added:</text>
  <text x="35" y="275" font-size="11" fill="#475569">   Only ~1/N keys move</text>
  
  <text x="35" y="300" font-size="11" font-weight="bold" fill="#059669">Benefits:</text>
  <text x="35" y="318" font-size="11" fill="#475569">✓ Minimal rebalancing</text>
  <text x="35" y="333" font-size="11" fill="#475569">✓ Uniform distribution</text>
  
  <!-- Legend -->
  <rect x="600" y="60" width="180" height="140" rx="6" fill="#fefce8" stroke="#fbbf24"/>
  <text x="615" y="82" font-size="12" font-weight="bold" fill="#92400e">Legend</text>
  <circle cx="620" cy="100" r="8" fill="#3b82f6"/>
  <text x="635" y="105" font-size="11">Physical Node</text>
  <circle cx="620" cy="125" r="4" fill="#93c5fd"/>
  <text x="635" y="130" font-size="11">Virtual Node</text>
  <circle cx="620" cy="150" r="5" fill="#ef4444"/>
  <text x="635" y="155" font-size="11">Key (lookup)</text>
  <line x1="615" y1="170" x2="645" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="650" y="175" font-size="11">Routing path</text>
</svg>