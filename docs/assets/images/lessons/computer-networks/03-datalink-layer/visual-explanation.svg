<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: The Data Link Layer</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">cumulative ACKs: ACK n means &quot;all frames up to and including n</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">received correctly.&quot;</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">1. Framing. → 2. Error detection and correction. → 3. Flow control. →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">4. Medium access control (Chapter 4). → 5. Reliability (ARQ). → Goal:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Describe the services provided by the data link layer to the network</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">layer. → Explain and compare framing methods: character count, byte</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">stuffing, and bit stuffing. → Compute error-detection codes including</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">parity, checksum, and cyclic redundancy check. → Apply Hamming codes</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">for single-bit error correction. → Analyze flow control mechanisms</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">including stop-and-wait and sliding window protocols. → Implement ARQ</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">simulators and evaluate performance trade-offs. → Sender prepends a</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">length field (character count) to each frame. → The length field</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">specifies the total number of characters/bytes in the frame (including</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">the length field itself).</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: \text{Utilization} = \frac{T_{\text{trans}}}{T_{\text{trans}} + 2</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cdot T_{\text{prop}}} | 2: \text{Utilization} = \frac{12}{12 + 2</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cdot 25000} = \frac{12}{50012} \approx 0.00024 = 0.024\% | 3: W \ge</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{2 \cdot T_{\text{prop}} \cdot R}{L} | 4: W = \frac{2 \cdot</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">T_{\text{prop}} \cdot R}{L} | 5: W = \frac{0.05 \cdot 10^{10}}{1500</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cdot 8} = \frac{500,000,000}{12,000} \approx 41,667 \text{ frames} |</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">6: D(x) \cdot x^k</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example: (7,4) Hamming Code:  For $m = 4$ data bits, $2^3 = 8 \ge 4 +</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">3 + 1 = 8$, so $r = 3$. Parity bits at...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">The data link layer provides framing, error detection and correction,</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">and flow control. Framing...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: The Data Link Layer</text>
</svg>