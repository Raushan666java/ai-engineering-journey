  <text x="300" y="788" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">— 1 —</text>
  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chapter 4: System &amp; Software</text>
    <text x="60" y="122" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Security</text>
    <line x1="55" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Overflow</tspan>: O(n) for copy</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Heap feng shui</tspan>: NP-hard, requires careful allocator manipulation</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">careful allocator manipulation</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Double-free detection</tspan>: O(1) if tcache detects; otherwise subtle</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">detects; otherwise subtle</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">SafeSEH</tspan>: a compile-time option that builds a table of valid exception handler addresses...</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">builds a table of valid exception</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">handler addresses...</text>
    <text x="60" y="396" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="424" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1: false

# Enable cloud-delivered protection
Set-MpPreference -MAPSReporting Advanced

# Set scan</text>
    <text x="60" y="446" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2: rule2 = New-AppLockerPolicy -RuleType Exe -User Everyone -Path &quot;%WINDIR%\*&quot; -Action Allow</text>
    <text x="60" y="468" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: ebp-0x50   # examine stack
0xffffd478:     0x41414141      0x41414141      0x42424242      0x424242</text>
    <text x="60" y="498" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="526" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Analyze and exploit stack/heap/SEH buffer overflows at the assembly...</text>
    <text x="60" y="548" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Configure OS hardening on Linux (Lynis, SELinux, sysctl) and Windows...</text>
    <text x="60" y="570" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. Develop and encode shellcode using msfvenom and assembly.</text>
    <text x="60" y="592" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">5. Build ROP chains and ret2libc payloads to bypass DEP/NX.</text>
    <rect x="55" y="616" width="490" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="65" y="630" font-size="12" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Interview Tip</text>
    <text x="65" y="646" font-size="11" fill="#7f1d1d" font-family="'Segoe Print', 'Comic Sans MS', cursive">What is a stack buffer overflow? Explain with stack frame layout.</text>
    <line x1="55" y1="734" x2="560" y2="734" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="754" font-size="12" font-style="italic" fill="#64748b" font-family="'Segoe Print', 'Comic Sans MS', cursive">OS Hardening; Buffer Overflows; Shellcode</text>
