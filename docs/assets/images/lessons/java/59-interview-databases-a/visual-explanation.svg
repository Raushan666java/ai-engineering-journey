  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">What: the difference between JDBC and JPA, and when would you use</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">each?</text>
