    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master 40 solved coding problems across arrays, strings, linked lists,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">trees, graphs, and dynamic programming → Understand three approaches</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">per problem: brute force, better, and optimal → Analyze time and space</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">complexity for each solution → Write clean TypeScript implementations</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">with proper type annotations → Develop pattern recognition to map</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">problems to appropriate algorithms → Pattern recognition is key: Most</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">problems map to a small set of patterns. Master the patterns, not</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">individual problems. → Always start with brute force: Even if you know</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">the optimal solution, mention the brute force first. This shows</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">structured thinking. → Discuss trade-offs: Interviewers love hearing</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">you compare time vs. space complexity trade-offs.</text>
