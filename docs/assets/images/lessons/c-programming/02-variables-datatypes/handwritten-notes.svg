  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chapter 2: Variables and Data Types</text>
    <line x1="55" y1="128" x2="560" y2="128" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="152" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="180" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Declaration</tspan>: The compiler learns about the variable&apos;s name and type. For `extern`...</text>
    <text x="60" y="202" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">the variable&apos;s name and type. For</text>
    <text x="60" y="224" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">`extern`...</text>
    <text x="60" y="246" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Definition</tspan>: Storage is reserved in memory (on stack for locals, in data segment for...</text>
    <text x="60" y="268" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">memory (on stack for locals, in data</text>
    <text x="60" y="290" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">segment for...</text>
    <text x="60" y="312" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Initialization</tspan>: The memory location is filled with a specific value at the moment of definition.</text>
    <text x="60" y="334" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">filled with a specific value at the</text>
    <text x="60" y="356" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">moment of definition.</text>
    <text x="60" y="378" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Type Sizes</tspan>: Write a program that declares `short`, `int`, `long`, `long long`, `float`,...</text>
    <text x="60" y="400" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">declares `short`, `int`, `long`, `long</text>
    <text x="60" y="422" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">long`, `float`,...</text>
    <text x="60" y="452" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="480" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">No: amount` | **No** | Dollar sign not allowed |
| `__internal` | Technically yes | But reserved for co</text>
    <text x="60" y="510" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="538" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Distinguish between variable declaration, definition, and...</text>
    <text x="60" y="560" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Declare and initialize variables of all fundamental C types with...</text>
