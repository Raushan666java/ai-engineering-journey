  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Convention over configuration — a standard project layout</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">(`src/main/java`, `src/test/java`, etc.) means a Maven project can be</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">built without any cust → Declarative dependency management —</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">dependencies are declared in `pom.xml` with groupId, artifactId, and</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">version; Maven automatically downloads them f → Use specific base</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">image tags — never `:latest`. Pin to specific versions. → Leverage</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">layer caching — order commands from least to most frequently changing.</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">Copy `pom.xml` and download dependencies before source code. → Use</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">multi-stage builds — keep JDK and build tools out of runtime images. →</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">Run as non-root user — create a dedicated user: `RUN addgroup -S</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">appgroup &amp;&amp; adduser -S appuser -G appgroup` → Optimize JVM for</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">containers — `-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0` →</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">Set memory limits — `docker run -m 512m my-app`</text>
