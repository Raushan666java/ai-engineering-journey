    <text x="300" y="70" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Combinatorics</text>
  <text x="30" y="100" font-size="12" font-weight="bold" fill="#2563eb" font-family="Arial, sans-serif">KEY CONCEPTS</text>
  <line x1="30" y1="104" x2="290" y2="104" stroke="#2563eb" stroke-width="1"/>
  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">hockey-stick identity:</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">$\sum_{i=r}^{n}</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">\binom{i}{r} =</text>
  <text x="35" y="163" font-size="9" fill="#475569" font-family="Arial, sans-serif">\binom{n+1}{r+1}$...</text>
  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">Th: follows from</text>
  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">inclusion-exclusion:</text>
  <text x="35" y="204" font-size="9" fill="#475569" font-family="Arial, sans-serif">total...</text>
  <text x="35" y="219" font-size="9" fill="#475569" font-family="Arial, sans-serif">This: a powerful</text>
  <text x="35" y="232" font-size="9" fill="#475569" font-family="Arial, sans-serif">technique for proving</text>
  <text x="35" y="245" font-size="9" fill="#475569" font-family="Arial, sans-serif">binomial...</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">There: $C_i$ ways to</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">arrange the inner</text>
  <text x="35" y="286" font-size="9" fill="#475569" font-family="Arial, sans-serif">parentheses...</text>
  <text x="35" y="301" font-size="9" fill="#475569" font-family="Arial, sans-serif">Permutations: ordered</text>
  <text x="35" y="314" font-size="9" fill="#475569" font-family="Arial, sans-serif">($P(n,r)$); combinations</text>
  <text x="35" y="327" font-size="9" fill="#475569" font-family="Arial, sans-serif">are unordered...</text>
  <text x="310" y="70" font-size="12" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">FORMULAS & TIPS</text>
  <line x1="310" y1="74" x2="570" y2="74" stroke="#059669" stroke-width="1"/>
  <text x="315" y="94" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">1:</text>
    <text x="315" y="107" font-size="9" fill="#475569" font-family="Arial, sans-serif">P(n, r) = \frac{n!}{(n-r)!} =...</text>
  <text x="315" y="122" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">combination:</text>
    <text x="315" y="135" font-size="9" fill="#475569" font-family="Arial, sans-serif">\binom{n}{r} = C(n, r) =...</text>
  <text x="315" y="150" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">Theorem 5.2 (Binomial Theorem).:</text>
    <text x="315" y="163" font-size="9" fill="#475569" font-family="Arial, sans-serif">(x + y)^n = \sum_{k=0}^{n}...</text>
  <text x="315" y="178" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">4:</text>
    <text x="315" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">\frac{n!}{n_1!\, n_2! \,\cdots\,...</text>
  <line x1="30" y1="470" x2="570" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="484" font-size="12" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">INTERVIEW PREP</text>
