<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Prompt Engineering</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Isolate the problem:: the issue with the system prompt, user prompt,</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">or model behavior?</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Dynamic few-shot selection → Standard CoT: → Zero-shot CoT: → Process:</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ The Constitution Pattern: → The Role + Constraints Pattern:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Explicit task description: State exactly what the model should do</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">(summarize, classify, generate, extract). → Output specification:</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define format, length, tone, and audience. → Constraint enumeration:</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">List constraints (e.g., &quot;do not include markdown formatting&quot;</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">or &quot;use only information from the provided context&quot;). →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Vague: &quot;Explain machine learning.&quot; → Specific: &quot;Explain</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">the bias-variance tradeoff in supervised learning using the example of</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">polynomial regression. Include a definition of underfitting  →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;You are a senior software engineer reviewing a pull</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">request...&quot; → &quot;You are a college professor explaining</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">quantum computing to first-year physics students...&quot; → &quot;You</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">are a professional editor specializing in academic papers...&quot;</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {missing.join(&apos;, &apos;)}`);
    }

    let rendered =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.template;
    for (const [name, value] of Obj | 2:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">{name}\\s*\\}\\}`, &apos;g&apos;),
          v.defaultValue
        );</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">}
    }

    rendered = rendered. | 3: {(err as Error).message}`);</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">}
    }

    const passRate = testCases.length &gt; 0 ? passedCount /</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 4: {ex.output}`);
      }
    }
    parts.push(`\n\nInput: | 5:</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">{lastInput.slice(0, 50)}`;
  }

  async optimize(
    basePrompt:</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">string,
    testCases: Array&lt;{ inp | 6: {base.user}\n\n</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">5.2.3 Example Quality:  &lt;a...</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">Prompt engineering is the discipline of designing inputs that reliably</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">produce desired model...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Prompt Engineering</text>
</svg>