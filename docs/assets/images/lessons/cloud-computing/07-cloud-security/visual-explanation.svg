  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">{resourceRisk ? &quot;all resources&quot; : &quot;specific</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">resources&quot;}`,
            action,
