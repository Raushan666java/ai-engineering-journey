    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 12.1 (Idempotent laws). → Theorem 12.2 (Domination laws). →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 12.3 (Absorption laws). → Theorem 12.4 (Involution law). →</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 12.5 (De Morgan&apos;s laws). → Example:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
