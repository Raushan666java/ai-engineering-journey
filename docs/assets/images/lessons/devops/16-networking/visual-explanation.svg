<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 16: Container Networking</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: CNI plugins: Flannel, Calico, Weave, and Cilium</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bridge Networking → Overlay Networking → Host Networking →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">MACVLAN/IPVLAN → CNI Specification Operations: → Plugin Categories:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Creates a virtual bridge (docker0) on the host → Assigns IP addresses</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">from a private subnet (172.17.0.0/16) → NAT enables outbound</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">connectivity → Containers communicate via IP or DNS names (--link) →</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Port mapping (-p 8080:80) exposes container ports on the host → Uses</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">VXLAN (Virtual Extensible LAN) or similar tunneling → Encapsulates</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Layer 2 frames in UDP packets → Enables multi-host container</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">communication without physical network changes</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {name}-dr` },
      spec: {
        host,
        subsets:</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">rules.map(r =&gt; ({
          name: r.d | 2: {svc.name}\n`;</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">report += `- Namespace: | 3: {svc.ports.join(&apos;, &apos;)}\n`;</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">report += `- External access: | 4: {dep.protocol}\n`;
        }</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">}

      report += &apos;\n&apos;;
    }

    return report;</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">}
}</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: NetworkPolicy Generator:</text>
  <line x1="500" y1="580" x2="500" y2="590" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="605" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="605" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="627" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="647" font-size="11" fill="#475569" font-family="Arial, sans-serif">Container networking spans multiple models and implementation options</text>
  <text x="85" y="665" font-size="11" fill="#475569" font-family="Arial, sans-serif">with trade-offs between...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 16: Container Networking</text>
</svg>