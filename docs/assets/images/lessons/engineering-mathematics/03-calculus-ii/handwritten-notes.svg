  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chapter 3: Multivariable Calculus</text>
    <line x1="55" y1="128" x2="560" y2="128" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="152" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="180" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">These</tspan>: the 2D analogue of topographic map elevations.</text>
    <text x="60" y="202" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">map elevations.</text>
    <text x="60" y="224" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">This</tspan>: maximized when $\mathbf{u}$ is parallel to $\nabla f$, giving $D_{\mathbf{u}} f...</text>
    <text x="60" y="246" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">parallel to $\nabla f$, giving</text>
    <text x="60" y="268" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">$D_{\mathbf{u}} f...</text>
    <text x="60" y="290" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Th</tspan>: gives a system of 3 equations in 3 unknowns.</text>
    <text x="60" y="312" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">unknowns.</text>
    <text x="60" y="342" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="370" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Definition:: \frac{\partial f}{\partial x}(a,b) = \lim_{h \to 0} \frac{f(a+h, b) - f(a,b)}{h}</text>
    <text x="60" y="392" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Higher-Order Partial Derivatives:: \frac{\partial^2 f}{\partial x^2} = \frac{\partial}{\partial x}\left(\frac{\partial f}{\partial x}\right), \quad \frac{\partial^2 f}{\partial x \parti</text>
    <text x="60" y="414" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Clairaut&apos;s Theorem (Equality of Mixed Partials):: \frac{\partial^2 f}{\partial x \partial y} = \frac{\partial^2 f}{\partial y \partial x}</text>
    <text x="60" y="444" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="472" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. $\nabla f$ points in the direction of steepest increase of $f$</text>
    <text x="60" y="494" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. $\|\nabla f\|$ is the rate of increase in that direction</text>
    <text x="60" y="516" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. $\nabla f$ is perpendicular to level curves/surfaces ($\nabla f \cdot...</text>
    <text x="60" y="538" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. $-\nabla f$ points in the direction of steepest decrease (used in...</text>
