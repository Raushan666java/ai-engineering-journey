  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">inheritance hierarchies with sealed classes and pattern-match</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">exhaustively → Declare transparent data carriers with records and</text>
