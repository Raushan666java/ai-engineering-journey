<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 10: Probabilistic Reasoning</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">reasoning under uncertainty: multiple causes, imperfect observations,</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">and the need to combine evidence to...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Input: → Output: → Steps: → CPTs defined: → Joint</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">distribution factorization:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$G = (V, E)$ is a directed acyclic graph (DAG). Each node $X_i \in V$</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">represents a random variable. Each directed edge $X_j \to X_i$</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">represents a dire → $\Theta$ is the set of conditional probability</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">tables (CPTs). For each node $X_i$, the CPT specifies $P(X_i \mid</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Parents}(X_i))$. → Identify variables -- List all relevant</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">random variables. Distinguish query variables, evidence (observable)</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">variables, and hidden (latent) variables. → Order variables -- Choose</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">a causal ordering $X_1, \ldots, X_n$ such that causes precede their</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">effects. This ordering must respect the direction of cau → Add edges</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">-- For each variable $X_i$ (in causal order), select a minimal set of</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">parents $\text{Pa}(X_i) \subseteq \{X_1, \ldots, X_{i-1}\}$ such that</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Define CPTs -- For each variable $X_i$ with $k$ parents, specify a</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">CPT of size $d_i \times \prod_{j=1}^k d_{\text{pa}_j}$ where $d$ is</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">the domain size → Validate -- Verify the DAG has no cycles. Verify the</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">product of all CPTs yields a valid joint distribution (sums to 1). →</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">No parents (root node): CPT is just the prior distribution $P(X_i)$ --</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">a single probability vector. No edges incident to the node.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">chain rule: P(X_1, X_2, \ldots, X_n) = \prod_{i=1}^n P(X_i \mid</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Parents}(X_i)) | 2: P(X_i \mid X_1, \ldots, X_{i-1}) = P(X_i</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mid \text{Pa}(X_i)) | Joint distribution factorization:: P(B, E, A,</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">J, M) = P(B) P(E) P(A \mid B, E) P(J \mid A) P(M \mid A) | 4: P(X, Y</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mid \mathcal{Z}) = P(X \mid \mathcal{Z}) \, P(Y \mid \mathcal{Z}) |</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">co-parents: P(X \mid \text{all other nodes}) = P(X \mid</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{MarkovBlanket}(X)) | Check numeric condition: P(X, Y \mid</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathcal{Z}) \stackrel{?}{=} P(X \mid \mathcal{Z}) P(Y \mid</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathcal{Z})</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bayesian networks; Conditional independence; d-separation</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 10: Probabilistic Reasoning</text>
</svg>