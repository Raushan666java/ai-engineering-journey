  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">The client sends</text>
  <text x="35" y="204" font-size="9" fill="#475569" font-family="Arial, sans-serif">requests to a load</text>
  <text x="35" y="217" font-size="9" fill="#475569" font-family="Arial, sans-serif">balancer...</text>
  <text x="35" y="232" font-size="9" fill="#475569" font-family="Arial, sans-serif">Eureka Server: The</text>
