    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish the five value categories (lvalue, prvalue, xvalue,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">glvalue, rvalue) and explain their hierarchical relationship →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement noexcept move constructors and move assignment operators for</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">resource-managing classes → Explain what std::move actually does</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">(cast, not move) and use it correctly → Apply std::forward and perfect</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">forwarding in template code → Understand forwarding references</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(T&amp;&amp; in deduced context) vs rvalue references (T&amp;&amp; in</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">concrete context) → Apply reference collapsing rules (T&amp; &amp; →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">T&amp;, T&amp;&amp; &amp;&amp; → T&amp;&amp;, etc.) → Implement the</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rule of Five for classes that manage resources → Explain why noexcept</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">enables move optimizations in std::vector reallocation</text>
