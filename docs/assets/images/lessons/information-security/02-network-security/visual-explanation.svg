    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rule Example: → Connection states: → Advantages over stateful</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">inspection: → Protocol architecture: → Two Modes: → IPSec Key Exchange</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">— IKE (Internet Key Exchange):</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Examines each packet independently (no context of previous packets) →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Filters based on: source IP, destination IP, source port, destination</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">port, protocol (TCP/UDP/ICMP) → Operates at Network Layer (Layer 3)</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">and Transport Layer (Layer 4) → Speed: Very fast (simple rule</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">matching) → Limitation: Cannot detect attacks spread across multiple</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">packets; no application-layer awareness; vulnerable to IP spoofing →</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example: Access Control Lists (ACLs) on routers → Maintains a state</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">table of active connections (connection tracking) → Examines packets</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">in context of the connection&apos;s state (NEW, ESTABLISHED, RELATED,</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">INVALID)</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {clientHello.cipherSuites.join(&apos;, &apos;)}\n`);

    // Step</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">2: Server processes and responds
    const s | 2:</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">{serverHello.keyShare.key.slice(0, 32)}...\n`);

    // Step 3: Client</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">computes shared secret
    co | 3: {clientKey.equals(serverKey)}`);</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">console.log(&apos;\n=== Handshake Complete (1-RTT) ===&apos;);</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">consol | 4: {packet.dstPort}` };
    }

    // Rule matching
    const</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">rule = this.matchRule(packet);
    if (!r | 5: {rule.id}` };
  }</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">getStats() {
    return this.stats;
  }
}

