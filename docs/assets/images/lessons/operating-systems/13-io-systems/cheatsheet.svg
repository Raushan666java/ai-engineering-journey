  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">Port-mapped I/O: Special</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">CPU instructions (`IN`,</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">`OUT` on x86)...</text>
  <text x="35" y="165" font-size="9" fill="#475569" font-family="Arial, sans-serif">Memory-mapped I/O:</text>
  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">Device registers appear</text>
  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">in the memory address...</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">Hybrid: Some devices use</text>
  <text x="35" y="219" font-size="9" fill="#475569" font-family="Arial, sans-serif">port I/O for control</text>
  <text x="35" y="232" font-size="9" fill="#475569" font-family="Arial, sans-serif">and...</text>
  <text x="35" y="247" font-size="9" fill="#475569" font-family="Arial, sans-serif">Device not responding:</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">Status register returns</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">0xFF (all bits set) -...</text>
  <text x="35" y="288" font-size="9" fill="#475569" font-family="Arial, sans-serif">Register aliasing: Same</text>
  <text x="35" y="301" font-size="9" fill="#475569" font-family="Arial, sans-serif">address maps to</text>
  <text x="35" y="314" font-size="9" fill="#475569" font-family="Arial, sans-serif">different registers...</text>
  <text x="35" y="329" font-size="9" fill="#475569" font-family="Arial, sans-serif">Bus arbitration failure:</text>
  <text x="35" y="342" font-size="9" fill="#475569" font-family="Arial, sans-serif">Device cannot get bus</text>
  <text x="35" y="355" font-size="9" fill="#475569" font-family="Arial, sans-serif">access; watchdog</text>
  <text x="35" y="368" font-size="9" fill="#475569" font-family="Arial, sans-serif">timer...</text>
