  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Bias</text>
    <text x="42" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">amplification</text>
    <text x="42" y="100" font-size="10" fill="#475569" font-family="Arial, sans-serif">Models that learn and</text>
    <text x="42" y="114" font-size="10" fill="#475569" font-family="Arial, sans-serif">magnify historical</text>
    <text x="42" y="128" font-size="10" fill="#475569" font-family="Arial, sans-serif">discrimination</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Opacity</text>
    <text x="237" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Black-box decisions</text>
    <text x="237" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">that cannot be</text>
    <text x="237" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">questioned or appealed</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Privacy erosion</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Systems that memorize</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">and expose sensitive</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">data</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">1</text>
    <text x="42" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">30,000&quot; was the</text>
    <text x="42" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">primary factor — but</text>
    <text x="42" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">it might also reveal</text>
    <text x="42" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">that &quot;zip</text>
    <text x="42" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">code&quot; (a proxy</text>
    <text x="42" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">for race) was inf</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">2</text>
    <text x="237" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif"></text>
    <text x="237" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">{true_salaries.mean():.2f}&quot;)

for</text>
    <text x="237" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">eps in [0.01, 0.1,</text>
    <text x="237" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">0.5, 1.0, 5.0]:</text>
    <text x="237" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">private_mean, true =</text>
    <text x="237" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">dp_</text>
    </g>

<g transform="rotate(-6 117.5 470)" filter="url(#shadow)">
      <rect x="30" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="42" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="42" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">The core insight:</text>
    <text x="42" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">Every line of code you</text>
    <text x="42" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">write carries...</text>
    </g>

<g transform="rotate(-6 312.5 470)" filter="url(#shadow)">
      <rect x="225" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="237" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="237" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">print(&quot;WARNING:</text>
    <text x="237" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">Potential demographic</text>
    <text x="237" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">parity violation...</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Previous:</text>
    <text x="432" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>

<g transform="rotate(-6 702.5 470)" filter="url(#shadow)">
      <rect x="615" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="627" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Next:</text>
    <text x="627" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
    <rect x="0" y="10" width="40" height="45" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M40,18 Q55,22 40,32" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="20" cy="10" rx="16" ry="4" fill="#1e293b" opacity="0.2"/>
  </g>
  <!-- Pen -->
  <g transform="translate(680, 530) rotate(-30)">
    <rect x="0" y="0" width="80" height="5" rx="2" fill="#2563eb"/>
    <polygon points="80,0 90,2.5 80,5" fill="#1e293b"/>
  </g>
  <!-- Header -->
  <text x="400" y="592" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Chapter 15: Ethics of Artificial Intelligence</text>
</svg>