  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">EIP-4844 (Proto-Danksharding): Already live (Dencun, March 2024).</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Introduces blob transactions for L2 data. → Full Danksharding: Future</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">upgrade. Full validator set randomly sampled to attest to shard blobs.</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Data Availability Sampling (DAS): Light nodes can verify data</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">availability without downloading everything. → Key metric: Blob count</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">per block (currently 3-6, planned to scale to 64+). → Liquidity lock:</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Funds must be locked in the channel. → Routing: Finding a path through</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">the network (Lightning routing). → Liveness: Both parties must be</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">online to challenge. → Limited complexity: Only payments, not</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">arbitrary smart contracts.</text>
