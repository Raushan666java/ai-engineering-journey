    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement Breadth-First Search (BFS) and Depth-First Search (DFS) —</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">recursive and iterative. → Find connected components in undirected</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">graphs. → Detect cycles in directed and undirected graphs using DFS. →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Determine whether a graph is bipartite using BFS two-coloring. →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Compute topological ordering using Kahn&apos;s algorithm and DFS-based</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">post-order. → Find strongly connected components using Kosaraju&apos;s</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">algorithm. → BFS-style: Explore all tunnels that are 1 minute from the</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">entrance first, then all tunnels 2 minutes away, then 3 minutes —</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">systematically expanding o → DFS-style: Pick a tunnel and follow it as</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">deep as possible until you hit a dead end, then backtrack and try the</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">next tunnel. This is how a maze-solvin</text>
