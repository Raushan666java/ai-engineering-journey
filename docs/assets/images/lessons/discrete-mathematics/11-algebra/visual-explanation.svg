    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Closure: $a * b \in S$ for all $a, b \in S$. → Associativity: $(a * b)</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">* c = a * (b * c)$ for all $a, b, c \in S$. → Commutativity: $a * b =</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">b * a$ for all $a, b \in S$. → Identity: There exists $e \in S$ such</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">that $a * e = e * a = a$ for all $a \in S$. → Inverse: For each $a \in</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">S$, there exists $b \in S$ such that $a * b = b * a = e$. → Example:</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">$(\mathbb{Z}^+, +)$ is a semigroup. → Example: Strings under</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">concatenation form a semigroup. → Example: Strings under concatenation</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">with the empty string $\epsilon$ as identity.</text>
