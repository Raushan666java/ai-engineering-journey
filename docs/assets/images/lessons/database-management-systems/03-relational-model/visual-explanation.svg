    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: The Relational Model</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">union-compatible: 1. Same number of attributes (same degree)</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Why the relational model dominates: → Relation: → Tuple: → Attribute:</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Domain: → Cardinality:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Data independence: Physical storage is decoupled from logical</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">structure → Set-at-a-time operations: Unlike earlier navigational</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">models (IMS, CODASYL) that processed one record at a time → Solid</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">mathematical foundation: Query optimization is provably correct via</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">algebraic equivalence → Simplicity: Users only need to understand</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">tables, keys, and a handful of operations → Relation = The entire</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">spreadsheet (table) → Tuple = One row (one student&apos;s data) →</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">Attribute = One column header (e.g., &quot;Name&quot;) → Domain = The</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">type of data allowed in a column (e.g., GPA must be 0.0â€“4.0)</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Complete University Query:  Schema: Query: Find names of</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">students enrolled in &apos;DBMS&apos; or &apos;OS&apos;.</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">Step-by-step...</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">relation; Keys; Integrity constraints</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: The Relational Model</text>
</svg>