    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Procurement &amp; Supplier Management → sourcing raw materials,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">managing purchase orders, evaluating supplier performance. → Inventory</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Management → tracking stock levels across locations, setting reorder</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">points, managing safety stock. → Warehouse Management → receiving,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">putaway, pick/pack/ship workflows, bin location optimization. → Order</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Management → order capture, fulfillment allocation, shipment</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">scheduling. → Transportation &amp; Fleet Management → carrier</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">selection, route optimization, vehicle maintenance. → Shipment</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Tracking → real-time status updates, delivery confirmation, exception</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">handling. → Demand Forecasting → historical analysis, seasonal</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">prediction, replenishment planning. → &gt;lockForUpdate()</text>
