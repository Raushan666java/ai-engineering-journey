    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Placement: Where should each container run? Which host has enough</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">resources? → Scaling: How to handle increased traffic? Automatically</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">add/remove replicas. → Health: What happens when a container crashes?</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Automatically restart. → Updates: How to update without downtime?</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rolling updates with health checks. → Networking: How do containers</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">find each other across hosts? Service discovery. → Configuration: How</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">to manage config across environments? Config maps, secrets. → Storage:</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">How to persist data when containers move? Persistent volumes. →</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">Industry standard for container orchestration</text>
