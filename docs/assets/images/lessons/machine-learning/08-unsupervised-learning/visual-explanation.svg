<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 8: Unsupervised Learning</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">The Algorithm: 1. Initialize: Choose $K$ initial centroids.</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">The Algorithm → Choosing K → Key Concepts → Point Types → Algorithm →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">The EM Algorithm</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Initialize: Choose $K$ initial centroids. → Assign: Assign each data</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">point to the nearest centroid based on Euclidean distance. → Update:</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">Calculate the mean of all points assigned to each cluster and move the</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">centroid to this new mean. → Repeat: Steps 2 and 3 until the centroids</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">no longer move significantly (convergence) or a maximum number of</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">iterations is reached. → Choose the first centroid uniformly at random</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">from the data points. → For each remaining point $x$, compute $D(x)$,</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">the distance to the nearest already-chosen centroid. → Select the next</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">centroid with probability proportional to $D(x)^2$ (weighted random</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">selection). → Repeat steps 2-3 until all $K$ centroids are chosen.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: \gamma(z_{nk}) = \frac{\pi_k \mathcal{N}(x_n \mid \mu_k,</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">\Sigma_k)}{\sum_{j=1}^K \pi_j \mathcal{N}(x_n \mid \mu_j, \Sigma_j)} |</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">2: s(i) = \frac{b(i) - a(i)}{\max(a(i), b(i))} | Davies-Bouldin Index:</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">DB = \frac{1}{K} \sum_{i=1}^K \max_{j \neq i} \frac{\sigma_i +</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sigma_j}{d(\mu_i, \mu_j)} |  (clusters are compact and</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">well-separated).

: CH = \frac{\text{tr}(B_K)}{\text{tr}(W_K)}</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">\times \frac{N - K}{K - 1} | 5: D(x)^2 | Key Concepts: \epsilon</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: K-means for Customer Segmentation with K-means++:  Grouping</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">customers based on &quot;Annual Income&quot; and &quot;Spending</text>
  <text x="85" y="598" font-size="11" fill="#475569" font-family="Arial, sans-serif">Score&quot;. Outcome:...</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Unsupervised learning finds patterns in unlabeled data.
- K-means</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">is an iterative algorithm that...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 8: Unsupervised Learning</text>
</svg>