  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">inventory suitable for European customers → Tokyo store: Sells</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">electronics and local goods for Asian market → Headquarters: Runs</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">global queries like &quot;total revenue across all stores&quot;</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">without caring where each sale was recorded → Horizontal</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">fragmentation: Each section (Menswear, Womenswear, Electronics) has</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">its own rack with a subset of products (rows) → Vertical</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">fragmentation: Customer information is split â†’ basic info (name,</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">email) at the checkout counter, sensitive info (credit card, SSN) in</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">the s → Hybrid fragmentation: Electronics section further splits TVs</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">and laptops into sub-sections, and within each, only publicly visible</text>
