    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">One floor-based puzzle carrying 4–5 questions → One box or stack</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">puzzle carrying 4–5 questions → One scheduling puzzle carrying 4–5</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">questions → The remaining 10–13 questions from other topics such as</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">syllogism, coding-decoding, inequalities, blood relations, direction</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">sense, and data sufficien → `A = 3` → A lives on floor 3 → `A = B + 2`</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ A lives two floors above B → `A ≠ even` → A is not on an even floor</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ `[A,B]` → A and B are adjacent</text>
