    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key planning activities: → Level 1: → Level 2: → Level 3: → Level 4: →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unadjusted Function Points (UFP):</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define project objectives and success criteria (SMART goals) →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify deliverables and acceptance criteria → Decompose work into</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">manageable units (WBS) → Estimate effort for each work unit → Identify</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">dependencies between activities → Allocate resources with</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">consideration of availability → Produce a schedule with milestones →</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify risks and plan responses</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {data.plannedValue.toLocaleString().padStart(11)} │`, `│ Earned</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">Value (EV) │ | 2: {data.actualCost.toLocaleString().padStart(11)} │`,</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">`│ Schedule Variance (SV) │ | 3:</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">{results.costVariance.toLocaleString().padStart(11)} │`, `│ SPI │</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">${results.schedulePerformanceIndex.toFixed(2).padStart(11)} │`, `│ CPI</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">│ ${results.c | 4:</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">{results.varianceAtCompletion.toLocaleString().padStart(11)} │`,</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;└─────────────────────────────────┴─────────────┘&apos;,</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;&apos;, `Status: Schedule is ${resul | 5:</text>
  <text x="85" y="619" font-size="11" fill="#475569" font-family="Arial, sans-serif">{result.scheduleVariance.toLocaleString()} (behind schedule)`);</text>
  <text x="85" y="637" font-size="11" fill="#475569" font-family="Arial, sans-serif">console.log(`CV: | 6:</text>
  <text x="85" y="655" font-size="11" fill="#475569" font-family="Arial, sans-serif">{result.estimateAtCompletion.toLocaleString()}`);</text>
  <text x="85" y="673" font-size="11" fill="#475569" font-family="Arial, sans-serif">console.log(`Estimated total: ${forecast.estimatedCompletionDays}</text>
  <text x="85" y="691" font-size="11" fill="#475569" font-family="Arial, sans-serif">days`); console.log(`Final cost:</text>
