      <text x="28" y="228" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">`fopen(&quot;file.txt&quot;, &quot;a&quot;)`</text>
  <rect x="180" y="206" width="700" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="228" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">Open a journal to add pages at the...</text>
  <rect x="20" y="242" width="160" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="264" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">`FILE *fp`</text>
  <rect x="180" y="242" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="264" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">Your library card → the handle to...</text>
