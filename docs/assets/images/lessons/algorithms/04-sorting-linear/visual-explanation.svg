    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Real-World Analogy: → Core Idea: → Why It Beats Ω(n log n): → Input: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Step 2 — Frequency Count: → Step 3 — Prefix Sums (Cumulative Count):</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create count array C[0..k-1], initialized to 0. → Count frequencies —</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">for each element x in A, increment C[x]. → Compute prefix sums — for i</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">= 1 to k-1, set C[i] = C[i] + C[i-1]. → Build output — for i = n-1</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">down to 0: → Return output array. → Find the maximum element to</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">determine the number of digits d. → For each digit position exp = 1,</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">10, 100, ... (up to the most significant digit): → Apply a stable sort</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(counting sort) on the digit at position exp.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
