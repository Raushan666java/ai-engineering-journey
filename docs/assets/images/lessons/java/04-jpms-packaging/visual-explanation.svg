<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Java Modules (JPMS) &amp; Packaging</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">reliable configuration: every module declares its dependencies in</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">`module-info.java`, and the module...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Notes: → When to use `requires transitive`: → Common transitive</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">dependencies: → Why this matters: → Service provider interface (SPI)</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">module: → Provider implementation module:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Explain the five core motivations for the Java module system: JAR</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">hell, strong encapsulation, reliable configuration, scalable</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">reasoning, and JDK modu → Write `module-info.java` declarations using</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`requires`, `exports`, `opens`, `provides`, `uses`, and `permits` →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish between named modules, unnamed modules, and automatic</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">modules, and understand how the module graph is resolved → Apply</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">`requires transitive` correctly for implicit readability → Configure</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">reflective access via `opens` and `open module` for frameworks like</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Spring and Hibernate → Implement the ServiceLoader provider-consumer</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">pattern and compare it with Spring&apos;s `SpringFactoriesLoader` →</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">Build custom runtime images with `jlink` and native installers with</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">`jpackage` → Architect multi-module Maven and Gradle projects with</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">JPMS, avoiding split-package and circular-dependency problems</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: JAVA_HOME/jmods \
    --add-modules com.example.myapp \</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">--output myapp-runtime

# The result | 2: JAVA_HOME/jmods \</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">--add-modules com.example.myapp \
    --launcher</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">myapp=com.example.myapp/com | 3: OUTPUT_DIR&quot; &quot; | 4:</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">OUTPUT_DIR&quot; \
    --module-source-path &quot; | 5:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">MODULE_NAME&quot;

echo &quot;=== Creating runtime image</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">===&quot;
jlink \
    --module-path &quot; | 6:</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">JAVA_HOME/jmods&quot; \
    --add-modules &quot;</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Motivation; module-info.java; Module types</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Java Modules (JPMS) &amp; Packaging</text>
</svg>