<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Intelligent Agents</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Performance: The metric for success (e.g., safety, speed, profit,</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">accuracy).</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="55" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="55" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Percept: → Output → Output: → Output: → Output: → Output:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sense → The agent collects raw input from the environment via sensors</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">(cameras, microphones, temperature probes). → Perceive → Raw sensor</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">data is converted into a structured percept (e.g., pixel array →</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;red light ahead&quot;). → Process → The agent function maps the</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">percept (or percept sequence) to an action decision. → Act → The</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">chosen action is executed via actuators (wheels, speakers, display),</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">changing the environment. → Repeat → The cycle continues indefinitely;</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">the environment may change in response to the agent&apos;s action or</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">external factors. → Percept=(&apos;A&apos;, &apos;Dirty&apos;) →</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">Action=Suck → Percept=(&apos;A&apos;, &apos;Clean&apos;) →</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">Action=Right → Percept=(&apos;B&apos;, &apos;Dirty&apos;) →</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">Action=Suck</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Vacuum-Cleaner Agent (Simple Reflex):  A simple agent that</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">operates in a world with two rooms (A and B). - PEAS: -...</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Agents interact with environments via sensors and actuators. The</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">agent function maps percept...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Intelligent Agents</text>
</svg>