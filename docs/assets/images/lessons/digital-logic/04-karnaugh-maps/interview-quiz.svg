<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#ffffff" rx="6"/>
  <!-- Top decoration -->
  <rect x="0" y="0" width="600" height="4" fill="url(#qgrad)"/>
  <defs>
    <linearGradient id="qgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
    <text x="300" y="60" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 4: Karnaugh Maps</text>
  <text x="300" y="82" font-size="12" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Self-Test Quiz — 4 Questions</text>
  <rect x="30" y="110" width="540" height="142" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="118" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="131" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q1</text>
        <text x="45" y="132" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">In a 4-variable K-map with Gray code ordering, how</text>
  <text x="45" y="148" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">many cells are adjacent to any given cell?</text>
        <text x="55" y="172" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) 2</text>
  <text x="55" y="186" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) 4</text>
  <text x="55" y="200" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) 6</text>
  <text x="55" y="214" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) 8</text>
      <text x="45" y="240" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="264" width="540" height="142" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="272" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="285" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q2</text>
        <text x="45" y="286" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">A group of 4 cells in a 4-variable K-map</text>
  <text x="45" y="302" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">eliminates how many variables?</text>
        <text x="55" y="326" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) 1</text>
  <text x="55" y="340" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) 2</text>
  <text x="55" y="354" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) 3</text>
  <text x="55" y="368" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) 4</text>
      <text x="45" y="394" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="418" width="540" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="426" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="439" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q3</text>
        <text x="45" y="440" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">An essential prime implicant is one that:</text>
        <text x="55" y="464" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) Is the largest group possible</text>
  <text x="55" y="478" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) Covers a minterm not covered by any other...</text>
  <text x="55" y="492" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) Contains only don&apos;t-care cells</text>
  <text x="55" y="506" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) Spans all four corners of the map</text>
      <text x="45" y="532" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <rect x="30" y="556" width="540" height="126" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Difficulty badge -->
      <rect x="510" y="564" width="50" height="18" rx="9" fill="#dbeafe"/>
      <text x="535" y="577" font-size="9" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q4</text>
        <text x="45" y="578" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">Don&apos;t-care conditions in a K-map:</text>
        <text x="55" y="602" font-size="10" fill="#475569" font-family="Arial, sans-serif">A. A) Must always be treated as 1</text>
  <text x="55" y="616" font-size="10" fill="#475569" font-family="Arial, sans-serif">B. B) Must always be treated as 0</text>
  <text x="55" y="630" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. C) May be treated as either 0 or 1 for...</text>
  <text x="55" y="644" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. D) Cannot be used in grouping</text>
      <text x="45" y="670" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
</svg>