<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f8fafc; stroke:#2b6cb0; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="600" height="220" class="box" rx="8" />
  <text x="320" y="48" text-anchor="middle" class="text title">Backtracking: Search Tree & Pruning</text>
  <text x="40" y="84" class="text">- Explore choices recursively</text>
  <text x="40" y="104" class="text">- Apply pruning (invalid partial solution)</text>
  <text x="40" y="124" class="text">- Backtrack and try next option</text>
  <text x="40" y="144" class="text">- Use ordering heuristics to improve pruning</text>
</svg>