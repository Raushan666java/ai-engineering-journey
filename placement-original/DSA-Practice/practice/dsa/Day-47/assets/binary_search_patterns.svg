<?xml version="1.0" encoding="UTF-8"?>
<svg width="620" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#efefef; stroke:#4a5568; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="580" height="200" class="box" rx="8" />
  <text x="310" y="48" text-anchor="middle" class="text title">Binary Search Patterns</text>
  <text x="40" y="84" class="text">- Find first/last: adjust condition and shrink window</text>
  <text x="40" y="104" class="text">- Search on answer: use feasibility function and binary search over range</text>
  <text x="40" y="124" class="text">- Exponential search: find bounds then binary search</text>
  <text x="40" y="144" class="text">- Ternary search: unimodal function optimization (continuous)</text>
</svg>