    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Control plane</tspan>: a logically centralized controller that computes forwarding rules and installs...</text>
