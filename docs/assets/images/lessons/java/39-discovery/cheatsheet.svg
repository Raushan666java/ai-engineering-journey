  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">Client-Side Discovery:</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">The client queries a</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">service registry to</text>
  <text x="35" y="163" font-size="9" fill="#475569" font-family="Arial, sans-serif">get...</text>
