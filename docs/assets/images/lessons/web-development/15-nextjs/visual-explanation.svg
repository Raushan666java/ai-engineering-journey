    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the difference between SSR and ISR? → A) SSR (Server-Side</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rendering) generates HTML for every request. ISR (Incremental Static</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Regeneration) pre-builds static pages and revalidates them after a</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">configured time period. → Q2. What is the purpose of `layout.tsx` in</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">the App Router? → B) Layouts wrap page content and persist across</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">navigations, preventing remounting of shared UI elements like navbars,</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">sidebars, and footers. → Q3. Why should you prefer Server Components</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">for data fetching? → B) Server Components fetch data during server</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">rendering, so no client JavaScript is needed for data fetching. This</text>
  <text x="85" y="429" font-size="11" fill="#475569" font-family="Arial, sans-serif">reduces bundle size and eliminates the request waterfall effect common</text>
  <text x="85" y="447" font-size="11" fill="#475569" font-family="Arial, sans-serif">in client-side fetching.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Set up a Next.js project with App Router → Implement SSR, SSG, ISR,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">and client-side rendering → Create API routes and middleware →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Optimize images, fonts, and metadata for SEO → Implement dynamic</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">imports and code splitting → Deploy Next.js applications to production</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ A) SSR renders on every request; ISR renders at build time then</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">revalidates periodically → B) ISR is faster than SSR</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {slug}`, {
    next: { revalidate: 3600 }, // Revalidate every</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">hour
  });
  return res.json();
} | 2: {params.slug}`,
    },</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">};
}

