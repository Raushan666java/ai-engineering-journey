    <text x="42" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">EXECUTE format(</text>
    <text x="42" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">&apos;SELECT * FROM %I</text>
    <text x="42" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">WHERE %I = %L&apos;,</text>
    <text x="42" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">table_name,</text>
    <text x="42" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">column_name,</text>
