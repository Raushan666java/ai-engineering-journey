    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → The Two Core Problems KR Solves: → Why It Matters for AI:</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Syntax: → Semantics: → Inference:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Storage &amp; Retrieval — How do we encode facts about the world so a</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">program can look them up quickly? A semantic network storing &quot;all</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">birds can fly&quot; + &quot; → Inference &amp; Discovery — How do we</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">derive new knowledge from existing facts? If we know &quot;every</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">professor teaches at least one course&quot; and &quot;Dr. Smith is →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Expert Systems (1980s boom) — MYCIN diagnosed blood infections using</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">~600 rules encoded as IF-THEN production rules. It outperformed junior</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">doctors. → Semantic Web (2000s–present) — Google Knowledge Graph</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">powers ~5 billion entity-relationship facts used in search, answering</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;When was Leonardo da Vinc → LLMs + Knowledge Graphs (2020s) —</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">Hybrid systems combine neural language models with symbolic knowledge</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">bases to ground responses in verified facts, r → Define the domain and</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">scope — What area of knowledge are we modeling? (e.g., University</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">domain) → Identify key concepts/classes — List the important</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">categories (Person, Student, Professor, Course) → Define class</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">hierarchy — Arrange classes in a taxonomy (Student ⊑ Person, Professor</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">⊑ Person)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
