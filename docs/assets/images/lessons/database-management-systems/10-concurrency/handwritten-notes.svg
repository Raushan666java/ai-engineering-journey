    <text x="60" y="444" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="472" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. No two counters assign same seat (lost update prevention)</text>
    <text x="60" y="494" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. No counter sees half-updated reservation (isolation)</text>
    <text x="60" y="516" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. If system crashes mid-check-in, no partial booking (atomicity)</text>
