    <text x="60" y="334" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">This</tspan>: the key to O(n+m) performance because it never backtracks in the text.</text>
    <text x="60" y="356" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">because it never backtracks in the text.</text>
    <text x="60" y="386" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="414" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Pattern matching:: + T\), compute Z-array. Every \(Z[i] = m\) means a match at position \(i - m - 1\) in the original t</text>
    <text x="60" y="436" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2: | 3&gt;2=✗ | 0 | S[3]≠S[0] ✗ | 0 | 1 | 2 |
| 4 | a | 4&gt;2=✗ | 0 | S[4]==S[0] ✓, S[5]==S[1] ✓, S[6]==S[2</text>
    <text x="60" y="458" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: &quot; + T
    Z = compute_z(S)
    m = len(P)
    return [i - m - 1 for i in range(m + 1, len(Z)) if </text>
