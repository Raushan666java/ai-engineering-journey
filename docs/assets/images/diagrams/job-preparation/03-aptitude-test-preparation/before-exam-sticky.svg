<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Before Exam</text>
    <line x1="56" y1="116" x2="544" y2="116" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="136" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Print 2 copies of admit card</text>
    <text x="56" y="156" font-size="13" fill="#333" font-family="Arial, sans-serif">    (colored if required) 2</text>
    <text x="56" y="176" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Paste recent passport photo</text>
    <text x="56" y="196" font-size="13" fill="#333" font-family="Arial, sans-serif">    on admit card 3</text>
    <text x="56" y="216" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Carry original photo ID</text>
    <text x="56" y="236" font-size="13" fill="#333" font-family="Arial, sans-serif">    (Aadhaar, PAN, Driving</text>
    <text x="56" y="256" font-size="13" fill="#333" font-family="Arial, sans-serif">    License) 4</text>
    <line x1="56" y1="330" x2="544" y2="330" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="350" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">Print 2 copies of admit</text>
    <text x="56" y="366" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">card (colored if required)</text>
    <text x="56" y="382" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">2</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>