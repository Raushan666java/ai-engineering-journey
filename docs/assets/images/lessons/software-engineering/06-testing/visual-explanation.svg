    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Verification: &quot;Are we building the product right?&quot; — checks</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">conformance to specification through static (reviews, inspections) and</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">dynamic (testing) m → Validation: &quot;Are we building the right</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">product?&quot; — checks that the system meets actual customer needs</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">through acceptance testing, prototyping, and use → Big bang: All</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">components combined at once — simple setup but hard to isolate</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">failures → Top-down: High-level components tested first, lower-level</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">components stubbed — reveals architectural issues early → Bottom-up:</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">Low-level components tested with drivers — ensures foundation is solid</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Sandwich: Combination of top-down and bottom-up — balanced approach</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Alpha testing: Customer representatives test at the developer&apos;s</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">site in a controlled environment → Beta testing: Real users test at</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">their own site in production-like conditions</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
