  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Split: Further partition the celebrity&apos;s data. Partition their</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">posts by time range, or use a sub-shard key (e.g., `user_id + post_id</text>
