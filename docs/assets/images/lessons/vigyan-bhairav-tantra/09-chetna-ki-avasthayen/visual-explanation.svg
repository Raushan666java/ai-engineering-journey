    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">अध्याय ९: चेतना की अवस्थाएँ — ओशो की व्याख्या</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">विधि — ओशो की &quot;डबल अवेयरनेस&quot; (दोहरी चेतना): → विधि — ओशो की</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">स्वप्न-जागरूकता: → विधि: → &quot;देखना ही ध्यान है&quot; — ओशो →</text>
  <text x="85" y="198" font-size="11" fill="#475569" font-family="Arial, sans-serif">प्रश्न १: → उत्तर:</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">चेतना की चार अवस्थाओं को ओशो के अनूठे दृष्टिकोण से समझेंगे → जानेंगे</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">कि क्यों ओशो कहते हैं — &quot;तुरीय तुम्हारा जन्मसिद्ध अधिकार है, कमाई</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">नहीं&quot; → साक्षी भाव (विटनेसिंग) को एकमात्र ध्यान के रूप में</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">पहचानेंगे → ओशो की मछली वाली कहानी और अन्य दृष्टांतों को समझेंगे →</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">TypeScript में चेतना अवस्था ट्रैकर बनाकर अभ्यास करेंगे → अवस्थाओं के</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">संधि-बिंदुओं पर ध्यान करना सीखेंगे → पैरों में क्या हो रहा है? कोई</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">तनाव है? कोई दर्द है? बस देखो। → हाथों में क्या है? उँगलियाँ कैसी हैं?</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">बस देखो।</text>
