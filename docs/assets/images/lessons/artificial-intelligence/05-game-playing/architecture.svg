<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowMd" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e2e8f0"/>
    </pattern>
    <pattern id="lineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#gBg)"/>
  <rect width="800" height="600" fill="url(#lineGrid)" opacity="0.35"/>
  <!-- Title -->
  <text x="400" y="36" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Game Playing and Adversarial Search</text>
  <rect x="370" y="46" width="60" height="3" rx="1.5" fill="#2563eb"/>
  <!-- Layer 1: Previous: -->
    <rect x="240" y="94" width="320" height="56" rx="28" fill="url(#gBlue)" filter="url(#shadowMd)"/>
    <rect x="240" y="94" width="320" height="56" rx="28" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="117" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Previous:</text>
    <text x="400" y="136" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">[Chapter 5: Constraint Satisfaction...</text>
  <!-- Arrow 1 → 2 -->
    <line x1="400" y1="154" x2="400" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 2: Real-World Analogy: -->
    <rect x="240" y="166" width="320" height="56" rx="8" fill="url(#gPurple)" filter="url(#shadowMd)"/>
    <rect x="240" y="166" width="320" height="56" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="189" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Real-World Analogy:</text>
    <text x="400" y="208" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">Imagine a chess grandmaster sitting across from a...</text>
  <!-- Arrow 2 → 3 -->
    <line x1="400" y1="226" x2="400" y2="234" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 3: Step 1: Evaluate D (MAX node) -->
    <rect x="240" y="238" width="320" height="56" rx="8" fill="url(#gOrange)" filter="url(#shadowMd)"/>
    <rect x="240" y="238" width="320" height="56" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="261" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Step 1: Evaluate D (MAX node)</text>
    <text x="400" y="280" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">MIN-VALUE(D) = MIN(3, 5) = 3</text>
  <!-- Arrow 3 → 4 -->
    <line x1="400" y1="298" x2="400" y2="306" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 4: Step 2: Evaluate E (MAX node) -->
    <rect x="240" y="310" width="320" height="56" rx="8" fill="url(#gBlue)" filter="url(#shadowMd)"/>
    <rect x="240" y="310" width="320" height="56" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="333" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Step 2: Evaluate E (MAX node)</text>
    <text x="400" y="352" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">MIN-VALUE(E) = MIN(6) = 6</text>
  <!-- Arrow 4 → 5 -->
    <line x1="400" y1="370" x2="400" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 5: Step 3: Evaluate F (MAX node) -->
    <rect x="240" y="382" width="320" height="56" rx="8" fill="url(#gPurple)" filter="url(#shadowMd)"/>
    <rect x="240" y="382" width="320" height="56" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="405" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Step 3: Evaluate F (MAX node)</text>
    <text x="400" y="424" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">MIN-VALUE(F) = MIN(2) = 2</text>
  <!-- Arrow 5 → 6 -->
    <line x1="400" y1="442" x2="400" y2="450" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 6: Step 4: Evaluate G (MAX node) -->
    <rect x="240" y="454" width="320" height="56" rx="28" fill="url(#gGreen)" filter="url(#shadowMd)"/>
    <rect x="240" y="454" width="320" height="56" rx="28" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="477" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Step 4: Evaluate G (MAX node)</text>
    <text x="400" y="496" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif">MIN-VALUE(G) = MIN(9, 1) = 1</text>
  <!-- Data flow side label -->
  <g transform="translate(212, 310) rotate(-90)">
    <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#dbeafe"/>
    <text x="0" y="5" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">DATA FLOW</text>
  </g>
  <rect x="572" y="34" width="72" height="20" rx="10" fill="#64748b" opacity="0.12"/>
    <text x="608" y="48" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">6 Layers</text>
</svg>