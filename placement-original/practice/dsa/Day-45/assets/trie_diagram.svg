<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#e6fffa; stroke:#059669; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="660" height="200" class="box" rx="8" />
  <text x="350" y="48" text-anchor="middle" class="text title">Trie - Prefix Tree Structure</text>
  <text x="40" y="84" class="text">Root → nodes for each character; store isWord flag and frequency at nodes for autocomplete</text>
  <text x="40" y="104" class="text">Use top-k list at nodes to return suggestions quickly</text>
  <text x="40" y="124" class="text">For wildcard search, DFS from node for '.' matches</text>
</svg>