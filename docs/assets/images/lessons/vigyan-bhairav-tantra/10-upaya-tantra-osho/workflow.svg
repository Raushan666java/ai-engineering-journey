  <text x="70" y="393" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">समझेंगे</text>
  <rect x="205" y="345" width="170" height="58" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
