    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">C) Enhanced reliability. → C) The one with best operational</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">characteristics. → B) When complexity justifies the overhead.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Configure Spring AI with OpenAI, Anthropic, and Ollama providers → Use</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">ChatClient for synchronous, streaming, and multi-turn conversations →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement structured output extraction using BeanOutputConverter →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create and register tool callbacks with the @Tool annotation →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Configure and query vector stores (PGVector, Redis, Chroma) → Build a</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">complete RAG pipeline from document ingestion to LLM augmentation →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Use embedding models and Document APIs for vector search → Design</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">prompt templates for reusable AI interactions</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {spring-ai.version}&lt;/version&gt;</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">&lt;type&gt;pom&lt;/type&gt;</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">&lt;scope&gt;import&lt;/scop | 2: {ANTHROPIC_API_KEY}
      chat:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">options:
          model: claude-3-5-sonnet-20241022
    | 3:</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">)&quot;)) {
            String[] kv =</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">pair.split(&quot;:(?=(?:[^\&quot;]*\&quot;[^\&quot;]*\&quot;)*[^\&quot;]*</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 4: &quot;, &quot;&quot;);
                String value =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">kv[1].trim().replaceAll(&quot;^\&quot;|\&quot;</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Spring AI provides a comprehensive framework for integrating AI</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">capabilities into Spring Boot...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Spring AI</text>
</svg>