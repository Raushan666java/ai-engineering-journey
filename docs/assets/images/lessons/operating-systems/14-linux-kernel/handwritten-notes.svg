    <text x="60" y="312" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Allocate task_struct</tspan>: kmem_cache_alloc(task_struct_cache) - approx 2KB from SLAB</text>
    <text x="60" y="334" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">kmem_cache_alloc(task_struct_cache) -</text>
    <text x="60" y="356" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">approx 2KB from SLAB</text>
    <text x="60" y="378" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Copy or share resources based on flags</tspan>: - `CLONE_VM` set -&gt; share address space (no copy; thread semantics)</text>
