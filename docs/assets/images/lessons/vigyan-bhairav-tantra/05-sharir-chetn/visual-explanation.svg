<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">अध्याय ५: शरीर चेतना — ओशो की शारीरिक ध्यान विधियाँ</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">ओशो वाणी: → ओशो वाणी: → मूल श्लोक: → अर्थ: → ओशो वाणी: → ओशो वाणी:</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">ओशो के &apos;शरीर मंदिर है, जेल नहीं&apos; दर्शन को समझना → शरीर-मन</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">सेतु (Body-Mind Bridge) की ओशो की अवधारणा को आत्मसात करना → विज्ञान</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">भैरव तंत्र की १५+ शारीरिक तकनीकों को ओशो के नज़रिए से समझना → ओशो के</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">डायनामिक मेडिटेशन और तांत्रिक शारीरिक विधियों के संबंध को जानना → शरीर</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">स्कैन गाइडेड मेडिटेशन (TypeScript) को ओशो शैली में कार्यान्वित करना →</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">शरीर मंदिर है, जेल नहीं — शरीर से लड़ाई नहीं, प्रेम चाहिए → बॉडी-माइंड</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">ब्रिज — शरीर और मन एक ही ऊर्जा के दो सिरे हैं → संवेदना पर ध्यान —</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">विचारों से हटकर शारीरिक संवेदनाओं पर आना ही ध्यान है</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master the core concepts covered in this chapter</text>
