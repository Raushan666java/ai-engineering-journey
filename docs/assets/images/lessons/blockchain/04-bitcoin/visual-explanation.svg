    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 4: The Bitcoin Network</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">UTXO set: the canonical state of the Bitcoin ledger — every full node</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">maintains it.</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key UTXO properties: → Transaction size matters for fees: → Key</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">properties: → Common Opcodes: → Locking Script (scriptPubKey): →</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unlocking Script (scriptSig):</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Every transaction consumes one or more existing UTXOs as Inputs. These</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">UTXOs are marked as spent and removed from the UTXO set. → Every</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">transaction creates one or more new UTXOs as Outputs. These are added</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">to the UTXO set. → Your &quot;balance&quot; is simply the sum of all</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">UTXOs associated with your addresses. → The UTXO set is the canonical</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">state of the Bitcoin ledger — every full node maintains it. →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Immutability: Once created, a UTXO&apos;s value and locking script</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">never change. → Atomicity: UTXOs must be spent entirely (you</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">can&apos;t spend &quot;half&quot; a UTXO). → Coinbase maturity:</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Coinbase transaction outputs cannot be spent for 100 blocks. → Each</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">input: ~150 bytes</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {(hashRate / 1e6).toFixed(2)} MH/s`;
  }
}
