<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowMd" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e2e8f0"/>
    </pattern>
    <pattern id="lineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#gBg)"/>
  <rect width="800" height="600" fill="url(#lineGrid)" opacity="0.35"/>
  <!-- Title -->
  <text x="400" y="36" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">अध्याय-वार माइंड मैप: 18 अध्यायों का दृश्य सारांश</text>
  <rect x="370" y="46" width="60" height="3" rx="1.5" fill="#2563eb"/>
  <!-- Layer 1: तंत्र एक धर्म नहीं, एक -->
    <rect x="240" y="78" width="320" height="46" rx="23" fill="url(#gBlue)" filter="url(#shadowMd)"/>
    <rect x="240" y="78" width="320" height="46" rx="23" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="101" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">तंत्र एक धर्म नहीं, एक</text>
    <text x="400" y="120" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 1 → 2 -->
    <line x1="400" y1="128" x2="400" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 2: विज्ञान भैरव तंत्र का  -->
    <rect x="240" y="136" width="320" height="46" rx="8" fill="url(#gPurple)" filter="url(#shadowMd)"/>
    <rect x="240" y="136" width="320" height="46" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="159" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">विज्ञान भैरव तंत्र का </text>
    <text x="400" y="178" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 2 → 3 -->
    <line x1="400" y1="186" x2="400" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 3: ओशो का आधुनिक संदर्भ — -->
    <rect x="240" y="194" width="320" height="46" rx="8" fill="url(#gOrange)" filter="url(#shadowMd)"/>
    <rect x="240" y="194" width="320" height="46" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="217" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">ओशो का आधुनिक संदर्भ —</text>
    <text x="400" y="236" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 3 → 4 -->
    <line x1="400" y1="244" x2="400" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 4: कोई पूर्वापेक्षा नहीं  -->
    <rect x="240" y="252" width="320" height="46" rx="8" fill="url(#gBlue)" filter="url(#shadowMd)"/>
    <rect x="240" y="252" width="320" height="46" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">कोई पूर्वापेक्षा नहीं </text>
    <text x="400" y="294" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 4 → 5 -->
    <line x1="400" y1="302" x2="400" y2="306" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 5: ध्यान = अनुभव — करने औ -->
    <rect x="240" y="310" width="320" height="46" rx="8" fill="url(#gPurple)" filter="url(#shadowMd)"/>
    <rect x="240" y="310" width="320" height="46" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="333" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">ध्यान = अनुभव — करने औ</text>
    <text x="400" y="352" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 5 → 6 -->
    <line x1="400" y1="360" x2="400" y2="364" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 6: प्रत्येक व्यक्ति अलग — -->
    <rect x="240" y="368" width="320" height="46" rx="8" fill="url(#gOrange)" filter="url(#shadowMd)"/>
    <rect x="240" y="368" width="320" height="46" rx="8" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="391" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">प्रत्येक व्यक्ति अलग —</text>
    <text x="400" y="410" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 6 → 7 -->
    <line x1="400" y1="418" x2="400" y2="422" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 7: प्रयोगशाला के रूप में  -->
    <rect x="240" y="426" width="320" height="46" rx="8" fill="url(#gBlue)" filter="url(#shadowMd)"/>
    <rect x="240" y="426" width="320" height="46" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="449" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">प्रयोगशाला के रूप में </text>
    <text x="400" y="468" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Arrow 7 → 8 -->
    <line x1="400" y1="476" x2="400" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Layer 8: शास्त्र से अधिक अनुभव  -->
    <rect x="240" y="484" width="320" height="46" rx="23" fill="url(#gGreen)" filter="url(#shadowMd)"/>
    <rect x="240" y="484" width="320" height="46" rx="23" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.25"/>
    <text x="400" y="507" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">शास्त्र से अधिक अनुभव </text>
    <text x="400" y="526" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="middle" font-family="Arial, sans-serif"></text>
  <!-- Data flow side label -->
  <g transform="translate(212, 310) rotate(-90)">
    <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#dbeafe"/>
    <text x="0" y="5" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">DATA FLOW</text>
  </g>
  <rect x="572" y="34" width="72" height="20" rx="10" fill="#64748b" opacity="0.12"/>
    <text x="608" y="48" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">8 Layers</text>
</svg>