  <text x="950" y="377" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">शरीर और मन एक ही ऊर्जा</text>
  <text x="950" y="393" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">के दो...</text>
