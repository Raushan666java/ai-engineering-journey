    <text x="85" y="312" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="332" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inherited attributes of `A` (the left-hand side) → Attributes of `X1`</text>
  <text x="85" y="350" font-size="11" fill="#475569" font-family="Arial, sans-serif">through `X??1` (symbols to the left of `X?`) → Attributes of `X?`</text>
  <text x="85" y="368" font-size="11" fill="#475569" font-family="Arial, sans-serif">itself (synthesized or inherited ? but inherited must follow rule 1) →</text>
  <text x="85" y="386" font-size="11" fill="#475569" font-family="Arial, sans-serif">Type checker: Inherited attributes propagate the current environment;</text>
  <text x="85" y="404" font-size="11" fill="#475569" font-family="Arial, sans-serif">synthesized attributes compute expression types. → Code generator:</text>
  <text x="85" y="422" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inherited attributes manage label numbers and temporary variable</text>
  <text x="85" y="440" font-size="11" fill="#475569" font-family="Arial, sans-serif">names; synthesized attributes build code fragments. → Desk calculator:</text>
  <text x="85" y="458" font-size="11" fill="#475569" font-family="Arial, sans-serif">Synthesized-only SDD evaluating arithmetic at parse time. → Language</text>
  <text x="85" y="476" font-size="11" fill="#475569" font-family="Arial, sans-serif">translators: SDTs mapping one language to another (e.g., infix to</text>
  <text x="85" y="494" font-size="11" fill="#475569" font-family="Arial, sans-serif">postfix, Java to JVM bytecode). → Static analysis: Liveness analysis,</text>
  <text x="85" y="512" font-size="11" fill="#475569" font-family="Arial, sans-serif">reaching definitions, available expressions (Chapter 12).</text>
  <line x1="500" y1="370" x2="500" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="395" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="395" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="417" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="437" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: ` and `$i` mechanism | | Implementing L-Attributed Definitions |</text>
  <text x="85" y="455" font-size="11" fill="#475569" font-family="Arial, sans-serif">Parameter passing in recursive-descent parsers | ### Chapter Roadmap</text>
  <text x="85" y="473" font-size="11" fill="#475569" font-family="Arial, sans-serif">```mermaid flowc | 2: = $1 + $3; } | term { | 3: ` becomes the new</text>
