    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Boolean algebra is the algebraic foundation of digital logic,</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">operating on $\{0,1\}$.
- Key...</text>
