    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">URL Shortener Requirements → Rate Limiter Requirements → Pastebin</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Requirements → URL Shortener Storage → Rate Limiter Storage → Pastebin</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Storage</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">100M URLs/month × 12 months = 1.2B URLs/year → Average entry: short</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">key (8 bytes) + long URL (2048 bytes avg) + created_at (8 bytes) +</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">user_id (8 bytes) + metadata (~200 bytes) = ~2.3KB → Total per year:</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">1.2B × 2.3KB ˜ 2.8TB → With replication factor 3 and Cassandra</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">overhead: ~10TB/year → Cache: 80% of reads hit 20% of URLs (Pareto).</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Top 200M URLs in Redis: 200M × 2.3KB ˜ 460GB. Use Redis Cluster with</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">sharding. → Bandwidth writes: 40 QPS × 2.3KB ˜ 92KB/sec (trivial) →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bandwidth reads: 400 QPS × 2.3KB ˜ 920KB/sec → 100M users × ~200</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">bytes/user (counter state) = 20GB if stored per-user</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: 23/TB/month for standard tier
- Transition infrequent-access</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">pastes to S3 Glacier after 30 days
-  | 2: {Date.now()}`;</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.tweets.set(id, { id, userId, content, timestamp: Date.now(),</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">likes: 0 });
    c | 3: 280,000 estimated for a naive single-database</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">design).
&gt; **One-Sentence Takeaway:** Concept Compari | 4: {id1</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">=== id2 ? &apos;same ID (dedup)&apos; : &apos;different ID&apos;}`);</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">us.resolve(id1);
  us.resolve(id1);
  us. | 5:</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">{url}/page2&quot;&gt;Link 2&lt;/a&gt;&lt;/body&gt;&lt;/html&gt;`,</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">contentType: &apos;text/html&apos;,
    };
  }

  private e | 6:</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">{id}`;
  }

  resolve(shortId: string): string | undefined { return</text>
  <text x="85" y="657" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.store.get(shortId); }
}</text>
