    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Deployment</tspan>: Monolith deploys as one WAR/JAR. Microservices deploy independently.</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">WAR/JAR. Microservices deploy</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">independently.</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Scaling</tspan>: Monolith scales the entire application. Microservices scale only the services...</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">application. Microservices scale only</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">the services...</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Database</tspan>: Monolith typically uses one shared database. Microservices own their data...</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">shared database. Microservices own their</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">data...</text>
    <text x="60" y="410" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Team structure</tspan>: Monolith works for small teams. Microservices align with cross-functional teams...</text>
    <text x="60" y="432" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">teams. Microservices align with</text>
    <text x="60" y="454" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">cross-functional teams...</text>
