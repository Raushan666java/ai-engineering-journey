    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Output: → The Bellman-Ford Equation: → Numbered Steps of Bellman-Ford</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Distributed Version): → Network Topology: → Link Costs: → Iteration 0</text>
