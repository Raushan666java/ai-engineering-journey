    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">The ReAct loop → Implementation in practice → Function calling APIs →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Tool definition with JSON Schema → Tool registry → Error handling</text>
