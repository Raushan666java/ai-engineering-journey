    <text x="627" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">What is the difference</text>
    <text x="627" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">between a semaphore</text>
    <text x="627" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">and a...</text>
