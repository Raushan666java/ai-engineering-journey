    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">It: three years since I am working here.&quot; ? &quot;It is three</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">years since I started...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key Rules: → Common Errors: → Definite Article (the): → Indefinite</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Articles (a/an): → Omission of Articles: → Common Preposition Usage:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Singular subject ? singular verb: &quot;The boy runs.&quot; → Plural</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">subject ? plural verb: &quot;The boys run.&quot; → Two singular</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">subjects joined by &quot;and&quot; ? plural: &quot;Ram and Shyam are</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">here.&quot; → Two singular subjects joined by &quot;or/nor&quot; ?</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">singular: &quot;Neither Ram nor Shyam is here.&quot; → When one is</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">singular and one is plural with &quot;or/nor&quot;, verb agrees with</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">nearest subject: &quot;Either the teacher or the students are</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">responsible.&quot; → Collective nouns (team, committee, family) take</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">singular verb when acting as a unit: &quot;The team is playing</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">well.&quot; → Words like &quot;each&quot;, &quot;every&quot;,</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;either&quot;, &quot;neither&quot; are singular: &quot;Each of</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">the students is present.&quot; → &quot;The number of&quot; ? singular;</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;A number of&quot; ? plural</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: 1 doesn&apos;t&quot;],
    [/\b(they|we|you)\s+doesn&apos;t\b/gi,</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot; | 2: 1 is&quot;],
    [/\b(a number of \w+) is\b/gi, &quot; |</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">3: {p1} doesn&apos;t`);
    corrected = corrected.replace(/\bthe</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">number of\s+(\w+) are\b/gi, &quot;the number of | 4:</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">{q.answer}`);

console.log(&quot;\n--- One Word Substitution</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">---&quot;);
console.log(Vocabulary.oneWordSubs</text>
