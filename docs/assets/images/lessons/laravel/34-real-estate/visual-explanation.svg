    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Schema → $table → $table → $table → $table → $table</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;when($max, fn($q, $v) =&gt; $q-&gt;where(&apos;bedrooms&apos;,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;&lt;=&apos;, $v)); → &gt;whereBetween(&apos;longitude&apos;,</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">[$lng - $lngDelta, $lng + $lngDelta]); →</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;where(&apos;property_type&apos;, $property-&gt;property_type) →</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;whereHas(&apos;listings&apos;, fn($q) =&gt; $q-&gt;active()) →</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;join(&apos;listings&apos;, &apos;properties.id&apos;,</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;=&apos;, &apos;listings.property_id&apos;) →</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;selectRaw(&apos;AVG(listings.list_price /</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">NULLIF(properties.square_feet, 0)) as avg_ppsf&apos;) →</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;value(&apos;avg_ppsf&apos;); →</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;whereJsonContains(&apos;service_areas&apos;, $property-&gt;city)</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
