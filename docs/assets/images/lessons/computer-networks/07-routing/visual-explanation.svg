  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">/** Get shortest path from source to destination */
  getPath(source:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">nu | 5: {distances[i]}`);
    }
