    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Problem: → Example 1: → Constraints: → Solution Approach: → Test</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Cases: → Time Complexity:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Understand the backtracking framework: choose, explore, un-choose →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement pruning strategies to eliminate dead ends early → Solve</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">combinatorial problems: permutations, combinations, subsets → Apply</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">constraint satisfaction to puzzles like N-Queens and Sudoku → Model</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">search problems with recursion and state management → 1 &lt;=</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">nums.length &lt;= 10 → Backtracking: For each element, include or</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">exclude it recursively. → Bit Manipulation: Use bits 0..(2^n-1) to</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">represent inclusion.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
