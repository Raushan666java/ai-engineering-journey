    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Product/Output Method: Sum of value added across all sectors → Income</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Method: Sum of all factor incomes (rent, wages, interest, profit) →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Expenditure Method: Sum of all final expenditures (C + I + G + X - M)</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Demand-Pull: Too much money chasing too few goods → Cost-Push:</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rising input costs (wages, raw materials) passed to consumers →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Stagflation: High inflation + high unemployment + low growth → Revenue</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Deficit: Revenue expenditure &gt; Revenue receipts → indicates</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">day-to-day expenses exceeding income → Fiscal Deficit: Total</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">expenditure &gt; Total receipt (excluding borrowings) → overall gap</text>
