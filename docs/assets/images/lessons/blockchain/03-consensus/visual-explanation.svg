  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: 5-10B (Bitcoin) | 51% hash rate | Economic disincentive |
| PoS |</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">33% of staked value | 51% stake |  | 2: {msg.value}`;
    const</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">prepareCount = this.log.filter(
      m =&gt; m.type ===</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;PREPARE&quot; &amp;&amp; m.view == | 3: {msg.digest}`;</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">switch (msg.type) {
            case &apos;PRE-PREPARE&apos;:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">if (from  | 4: {from}`);
                if (this.prepares.size &gt;=</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.majority()) return &apos;broadcast:commit&apos;;
     | 5:</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">{from}`);
                if (this.commits.size &gt;= this.majority())</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">return &apos;consensus:reached&apos;;
     | 6:</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">{result.hash}`);

const pos = new PoSSimulator();
pos.addValidator(new</text>
