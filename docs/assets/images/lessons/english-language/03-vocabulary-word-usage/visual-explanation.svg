    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sources of vocabulary in IBPS exams: → Synonyms → Typical Question: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Answer: → Another Format: → Answer:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">The Hindu and Business Line editorials → Banking and financial reports</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Government policy documents → Technology and cybersecurity articles</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Eliminate unfamiliar words first — if you don&apos;t know a word, it</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">is likely the correct answer or a clever distractor. Use elimination</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">based on known wo → Look at the part of speech — a synonym must be the</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">same part of speech as the given word. → Positive vs Negative</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">connotation — if the original word is positive, the synonym is likely</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">positive. → Context matters — the same word can have different</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">synonyms in different contexts.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
