<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">2.6.2 X.509</text>
    <text x="56" y="110" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Certificate</text>
    <text x="56" y="132" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Structure...</text>
    <line x1="56" y1="160" x2="544" y2="160" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="180" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Example: google.com</text>
    <text x="56" y="200" font-size="13" fill="#333" font-family="Arial, sans-serif">    certificate (inspected with</text>
    <text x="56" y="220" font-size="13" fill="#333" font-family="Arial, sans-serif">    openssl):</text>
    <text x="56" y="240" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  X509v3 extensions: X509v3</text>
    <text x="56" y="260" font-size="13" fill="#333" font-family="Arial, sans-serif">    Subject Alternative Name:</text>
    <text x="56" y="280" font-size="13" fill="#333" font-family="Arial, sans-serif">    DNS:*.google.com,...</text>
    <text x="56" y="300" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Signature Algorithm:</text>
    <text x="56" y="320" font-size="13" fill="#333" font-family="Arial, sans-serif">    sha256WithRSAEncryption</text>
    <text x="56" y="340" font-size="13" fill="#333" font-family="Arial, sans-serif">    78:9a:bc:...</text>
    <line x1="56" y1="346" x2="544" y2="346" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="366" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">Example: google.com</text>
    <text x="56" y="382" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">certificate (inspected</text>
    <text x="56" y="398" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">with openssl):</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>