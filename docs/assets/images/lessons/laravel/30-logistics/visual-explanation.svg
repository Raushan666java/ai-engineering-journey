    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">$table → ### 30.2 Inventory Prediction Agents → &lt;a</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">href=&quot;../../../assets/images/diagrams → &lt;img</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">src=&quot;../../../assets/images/diagram → &lt;a</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">href=&quot;../../../assets/images/diagrams → &lt;img</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">src=&quot;../../../assets/images/diagram</text>
