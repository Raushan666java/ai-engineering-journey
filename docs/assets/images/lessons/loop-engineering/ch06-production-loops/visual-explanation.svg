  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 6.1: ProductionLoopManager:  A lifecycle manager that</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">orchestrates deploy → monitor → drift-detect →...</text>
