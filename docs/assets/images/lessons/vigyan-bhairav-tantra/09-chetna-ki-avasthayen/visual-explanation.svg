    <text x="85" y="352" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {WitnessDepth.FORGETTING}_ | 2: {WitnessDepth.FORGETTING}_ | 3:</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">{WitnessDepth.OCCASIONAL}_ | 4: {WitnessDepth.EFFORTFUL}_ | 5:</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">{WitnessDepth.EFFORTLESS}_ | 6: {WitnessDepth.CONSTANT}_</text>
