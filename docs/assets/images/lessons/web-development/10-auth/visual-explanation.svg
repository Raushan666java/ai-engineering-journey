  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Authentication → Q1. What is the difference between 401 Unauthorized</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">and 403 Forbidden? → B) 401 indicates the client is not authenticated</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">(no valid credentials). 403 indicates the client is authenticated but</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">lacks permission for the requested resource. → Q2. Why should refresh</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">tokens be rotated? → B) Refresh token rotation invalidates the old</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">token each time a new one is issued. If a stolen token is used, the</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">legitimate user&apos;s next refresh attempt will fail, signaling</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">theft. → Q3. What salt round count is recommended for bcrypt in</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">production?</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
