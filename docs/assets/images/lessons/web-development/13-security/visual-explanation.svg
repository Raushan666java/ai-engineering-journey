    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the only reliable defense against SQL injection? → B)</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Parameterized queries (prepared statements) separate SQL code from</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">data, making injection impossible. All other approaches can be</text>
  <text x="85" y="301" font-size="11" fill="#475569" font-family="Arial, sans-serif">bypassed. → Q2. How does a Content Security Policy (CSP) prevent XSS?</text>
  <text x="85" y="319" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ B) CSP allows the server to specify which origins are trusted for</text>
  <text x="85" y="337" font-size="11" fill="#475569" font-family="Arial, sans-serif">loading scripts, styles, images, fonts, and other resources. The</text>
  <text x="85" y="355" font-size="11" fill="#475569" font-family="Arial, sans-serif">browser blocks any resource from untrusted origins. → Q3. What is the</text>
  <text x="85" y="373" font-size="11" fill="#475569" font-family="Arial, sans-serif">purpose of the `SameSite` cookie attribute? → B) `SameSite=Strict`</text>
  <text x="85" y="391" font-size="11" fill="#475569" font-family="Arial, sans-serif">prevents the browser from sending the cookie with cross-site requests,</text>
  <text x="85" y="409" font-size="11" fill="#475569" font-family="Arial, sans-serif">which blocks CSRF attacks that trick users into submitting requests</text>
  <text x="85" y="427" font-size="11" fill="#475569" font-family="Arial, sans-serif">from another site.</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify and prevent OWASP Top 10 vulnerabilities → Protect against</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">SQL injection, XSS, and CSRF attacks → Implement proper CORS, CSP, and</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">security headers → Secure API endpoints with input validation and rate</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">limiting → Apply secure authentication and session management →</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement defense-in-depth security strategies → Broken Access Control</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Cryptographic Failures</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
