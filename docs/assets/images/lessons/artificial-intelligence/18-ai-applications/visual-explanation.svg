    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Data Acquisition: Collect medical data → DICOM images (X-ray, CT,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">MRI), electronic health records (EHR), genomic sequences, wearable</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">sensor streams, a → Preprocessing: Normalize pixel intensities,</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">resample to uniform resolution, segment regions of interest, remove</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">PHI (protected health information), au → Feature Extraction: Deploy</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">deep CNNs (ResNet, DenseNet) for imaging, transformers (ClinicalBERT,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">BioBERT) for clinical text, graph neural networks for → Model</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inference: Classify pathology presence/severity, segment tumor</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">boundaries, predict protein-ligand binding affinity, estimate patient</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">risk scores → Clinical Decision Support: Package predictions into</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">clinical workflows → PACS integration, HL7/FHIR messaging, radiology</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">report generation with confid → Human-in-the-Loop Review: Flag</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">low-confidence predictions for specialist review, maintain audit</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">trail, support second-opinion workflows. → Rare pathologies: Diseases</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">with &amp;lt;100 training examples are poorly detected → solution:</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">few-shot learning with prototypical networks → Domain shift: X-rays</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">from portable machines look different from fixed machines → monitor</text>
  <text x="85" y="678" font-size="11" fill="#475569" font-family="Arial, sans-serif">input distribution with OOD detectors</text>
