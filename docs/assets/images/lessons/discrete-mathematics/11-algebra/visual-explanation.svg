    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Properties: → Semigroup: → Monoid: → Theorem 11.1 (Uniqueness). →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 11.2 (Cancellation laws). → Abelian group:</text>
