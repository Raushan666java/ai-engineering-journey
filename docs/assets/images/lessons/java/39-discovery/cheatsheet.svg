  <text x="35" y="286" font-size="9" fill="#475569" font-family="Arial, sans-serif">that handles</text>
  <text x="35" y="299" font-size="9" fill="#475569" font-family="Arial, sans-serif">registration,</text>
  <text x="35" y="312" font-size="9" fill="#475569" font-family="Arial, sans-serif">heartbeats,...</text>
  <text x="35" y="327" font-size="9" fill="#475569" font-family="Arial, sans-serif">Self-Preservation:</text>
  <text x="35" y="340" font-size="9" fill="#475569" font-family="Arial, sans-serif">Eureka stops evicting</text>
  <text x="35" y="353" font-size="9" fill="#475569" font-family="Arial, sans-serif">instances during</text>
  <text x="35" y="366" font-size="9" fill="#475569" font-family="Arial, sans-serif">network...</text>
