    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway: → Answer: → Pass 1: Understand &amp; Explore →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Pass 2: Plan &amp; Verify → Pass 3: Code &amp; Test → Try This:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Apply the 3-pass method to any DSA problem → Classify problem types</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">into patterns to reduce unfamiliar questions to known templates →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create effective Anki decks specifically for DSA retention → Use the</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">DP workflow (state ? recurrence ? base ? iteration) consistently →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Speed up complexity analysis intuition with the Big O pattern matcher</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Understand space-time tradeoffs and articulate them in interviews →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish SQL from NoSQL and choose based on access patterns → Grasp</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">system design fundamentals for the interview context</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
