  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">non-blocking, and I/O multiplexing approaches. → Implement concurrent</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">servers using select, poll, and epoll. → Understand Unix domain</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">sockets, raw sockets, and socket options. → Analyze scalability</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">trade-offs for the C10K problem. → Identify edge cases: connection</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">refused, broken pipe, EAGAIN, address in use.</text>
