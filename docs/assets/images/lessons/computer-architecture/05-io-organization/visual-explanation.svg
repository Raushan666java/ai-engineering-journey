  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">bus and device protocols → Interrupt generation — notify CPU of events</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Simple to implement → CPU busy-waits — wastes CPU cycles that could</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">be used for computation → Low throughput for high-speed devices (CPU</text>
