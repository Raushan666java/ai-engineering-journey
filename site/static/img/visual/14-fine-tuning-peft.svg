<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="14_fine_v-title 14_fine_v-desc">
<title id="14_fine_v-title">Fine-tuning vs PEFT — four paths to a custom model</title>
<desc id="14_fine_v-desc">Full fine-tuning, LoRA, QLoRA and adapters compared on cost, data, quality and use case.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="120" y="108" width="480" height="56" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
<text x="140" y="132" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Full fine-tuning</text>
<text x="140" y="148" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace">all weights · big GPU</text>
<rect x="640" y="108" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="138" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIGH cost · best ceiling</text>
<rect x="120" y="164" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="140" y="188" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">LoRA</text>
<text x="140" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">low-rank adapters</text>
<rect x="640" y="164" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOW cost · near-full quality</text>
<rect x="120" y="220" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="140" y="244" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">QLoRA</text>
<text x="140" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">quantized base + LoRA</text>
<rect x="640" y="220" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOWEST cost · on one GPU</text>
<rect x="120" y="276" width="480" height="56" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="140" y="300" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Adapters</text>
<text x="140" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">task heads</text>
<rect x="640" y="276" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">modular · multi-task</text>
<text x="120" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERVIEW ANGLE</text><text x="212" y="444" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">Pick the approach by constraint: hardware, data and quality ceiling.</text>
<line x1="120" y1="500" x2="880" y2="500" stroke="rgba(26,27,35,0.10)" stroke-width="1"/><text x="120" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="200" y="506" width="16" height="12" rx="2" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/><text x="224" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACCENT = FOCAL</text><rect x="360" y="506" width="16" height="12" rx="2" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/><text x="384" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAPER = STEP</text>
</svg>