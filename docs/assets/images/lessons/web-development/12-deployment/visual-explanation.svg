    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">What: the advantage of multi-stage Docker builds?</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the advantage of multi-stage Docker builds? → B)</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Multi-stage builds use separate stages for dependencies, building, and</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">running. The final stage copies only the compiled output and</text>
  <text x="85" y="301" font-size="11" fill="#475569" font-family="Arial, sans-serif">production dependencies, resulting in a minimal image. → Q2. Why</text>
  <text x="85" y="319" font-size="11" fill="#475569" font-family="Arial, sans-serif">should you validate environment variables at startup? → B) Startup</text>
  <text x="85" y="337" font-size="11" fill="#475569" font-family="Arial, sans-serif">validation catches misconfiguration immediately with a clear error</text>
  <text x="85" y="355" font-size="11" fill="#475569" font-family="Arial, sans-serif">message, rather than causing cryptic runtime failures when the missing</text>
  <text x="85" y="373" font-size="11" fill="#475569" font-family="Arial, sans-serif">variable is first accessed. → Q3. What is the purpose of `npm ci` vs</text>
  <text x="85" y="391" font-size="11" fill="#475569" font-family="Arial, sans-serif">`npm install` in CI? → B) `npm ci` uses the lockfile to install exact</text>
  <text x="85" y="409" font-size="11" fill="#475569" font-family="Arial, sans-serif">versions, deletes `node_modules` first, and fails if the lockfile is</text>
  <text x="85" y="427" font-size="11" fill="#475569" font-family="Arial, sans-serif">out of sync with `package.json` — ensuring deterministic builds.</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Set up build processes for frontend and backend applications → Manage</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">environment variables across deployment environments → Deploy</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">applications to Vercel, Netlify, Railway, and AWS → Configure custom</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">domains and SSL certificates → Implement CI/CD pipelines with GitHub</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Actions → Monitor production applications → &quot;4000:4000&quot; →</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">DATABASE_URL=postgresql://user:pass@db:5432/mydb</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
