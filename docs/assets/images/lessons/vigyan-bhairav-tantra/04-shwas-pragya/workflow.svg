<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowMd" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e2e8f0"/>
    </pattern>
    <pattern id="lineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#gBg)"/>
  <rect width="800" height="600" fill="url(#lineGrid)" opacity="0.35"/>
  <!-- Title -->
  <text x="400" y="40" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">अध्याय ४: श्वास-प्रज्ञा — ओशो की श्वास तकनीकें</text>
  <rect x="375" y="50" width="50" height="3" rx="1.5" fill="#2563eb"/>
  <!-- Step 3: समझ पाएंगे — ओशो ने श्वास को सभी ध्यान तकनीकों का आधार क्यों माना। -->
    <rect x="5" y="100" width="130" height="80" rx="40" fill="url(#gBlue)" filter="url(#shadowMd)"/>
  <circle cx="70" cy="126" r="15" fill="#ffffff" opacity="0.25"/>
      <text x="70" y="131" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="70" y="160" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">समझ पाएंगे — ओशो ने...</text>
  <!-- Arrow 3 → 4 -->
    <line x1="139" y1="140" x2="166" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 3 -->
    <rect x="9" y="202" width="122" height="80" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="9" y="202" width="122" height="80" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="19" y1="212" x2="121" y2="212" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="70" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">समझ पाएंगे — ओशो ने</text>
  <text x="70" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">श्वास को सभी ध्यान</text>
  <text x="70" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">तकनीकों का आधार क्यों</text>
  <text x="70" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">माना।</text>
  <rect x="170" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="235" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="235" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="235" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  <text x="235" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">जान पाएंगे — १५ श्वास...</text>
  <!-- Arrow 4 → 5 -->
    <line x1="304" y1="140" x2="331" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 4 -->
    <rect x="174" y="202" width="122" height="96" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="174" y="202" width="122" height="96" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="184" y1="212" x2="286" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="235" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">जान पाएंगे — १५ श्वास</text>
  <text x="235" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">तकनीकों की ओशो की मौलिक</text>
  <text x="235" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">व्याख्या — जो पारंपरिक</text>
  <text x="235" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">प्राणायाम से बिल्कुल अलग</text>
  <text x="235" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">है।</text>
  <rect x="335" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="400" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="400" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="400" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">5</text>
  <text x="400" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">सीख पाएंगे — &quot;जस्ट...</text>
  <!-- Arrow 5 → 6 -->
    <line x1="469" y1="140" x2="496" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 5 -->
    <rect x="339" y="202" width="122" height="96" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="339" y="202" width="122" height="96" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="349" y1="212" x2="451" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="400" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">सीख पाएंगे — &quot;जस्ट</text>
  <text x="400" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">वॉच द ब्रीथ&quot; — ओशो</text>
  <text x="400" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">का प्रसिद्ध दृष्टिकोण और</text>
  <text x="400" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">यह क्यों इतना प्रभावी</text>
  <text x="400" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">है।</text>
  <rect x="500" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="565" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="565" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="565" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">6</text>
  <text x="565" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">अनुभव कर पाएंगे — ओशो...</text>
  <!-- Arrow 6 → 7 -->
    <line x1="634" y1="140" x2="661" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 6 -->
    <rect x="504" y="202" width="122" height="96" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="504" y="202" width="122" height="96" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="514" y1="212" x2="616" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="565" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">अनुभव कर पाएंगे — ओशो की</text>
  <text x="565" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">भाषा में — श्वास के</text>
  <text x="565" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">माध्यम से चेतना की</text>
  <text x="565" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">गहराइयों तक जाने का</text>
  <text x="565" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">मार्ग।</text>
  <rect x="665" y="100" width="130" height="80" rx="40" fill="url(#gGreen)" filter="url(#shadowMd)"/>
  <circle cx="730" cy="126" r="15" fill="#ffffff" opacity="0.25"/>
      <text x="730" y="131" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">7</text>
  <text x="730" y="160" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">सक्षम होंगे —...</text>
  <!-- Description for step 7 -->
    <rect x="669" y="202" width="122" height="112" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="669" y="202" width="122" height="112" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="679" y1="212" x2="781" y2="212" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="730" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">सक्षम होंगे —</text>
  <text x="730" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">टाइपस्क्रिप्ट में</text>
  <text x="730" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">ओशो-शैली श्वास ध्यान</text>
  <text x="730" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">टाइमर बनाने में जिसमें</text>
  <text x="730" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">उनके मार्गदर्शन के शब्द</text>
  <text x="730" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">हों।</text>
</svg>