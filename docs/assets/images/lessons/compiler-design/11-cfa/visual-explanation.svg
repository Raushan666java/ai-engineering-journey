  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">computation: Process nodes in reverse DFS order, computing</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">semi-dominators via path compression.</text>
