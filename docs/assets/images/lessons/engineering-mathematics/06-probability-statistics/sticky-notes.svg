<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Desk background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="#f1f5f9" opacity="0.3"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Hypothes</text>
    <text x="42" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Testing | Reject $H_0$</text>
    <text x="42" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">if p-value &amp;lt;</text>
    <text x="42" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">$\alpha$ |...</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Th</text>
    <text x="237" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">explains why the</text>
    <text x="237" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">normal distribution</text>
    <text x="237" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">appears everywhere</text>
    <text x="237" y="124" font-size="10" fill="#475569" font-family="Arial, sans-serif">in...</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Chi-Squ</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Distribution: If $Z_1,</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">\ldots, Z_k \sim</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">N(0,1)$ independent:</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Law of Total</text>
    <text x="42" y="258" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Probability:</text>
    <text x="42" y="280" font-size="10" fill="#475569" font-family="Arial, sans-serif">P(A) = \sum_{i=1}^n</text>
    <text x="42" y="294" font-size="10" fill="#475569" font-family="Arial, sans-serif">P(A|B_i)P(B_i)</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">If $B_1, B_2,</text>
    <text x="237" y="258" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">\ldots, B_n$</text>
    <text x="237" y="276" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">partition</text>
    <text x="237" y="294" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">$S$:
$$P(A) =</text>
    <text x="237" y="312" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">\sum_{i=1}^n</text>
    <text x="237" y="330" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">P(A|B_i)P(B_i)$$</text>
    <text x="237" y="352" font-size="10" fill="#475569" font-family="Arial, sans-serif">P(B_i|A) =</text>
    <text x="237" y="366" font-size="10" fill="#475569" font-family="Arial, sans-serif">\frac{P(A|B_i)P(B_i)}{\sum_{j=1}^n</text>
    <text x="237" y="380" font-size="10" fill="#475569" font-family="Arial, sans-serif">P(A|B_j)P(B_j)}</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Previous:</text>
    <text x="432" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>

<g transform="rotate(-6 702.5 470)" filter="url(#shadow)">
      <rect x="615" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="627" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Next:</text>
    <text x="627" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
    <rect x="0" y="10" width="40" height="45" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M40,18 Q55,22 40,32" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="20" cy="10" rx="16" ry="4" fill="#1e293b" opacity="0.2"/>
  </g>
  <!-- Pen -->
  <g transform="translate(680, 530) rotate(-30)">
    <rect x="0" y="0" width="80" height="5" rx="2" fill="#2563eb"/>
    <polygon points="80,0 90,2.5 80,5" fill="#1e293b"/>
  </g>
  <!-- Header -->
  <text x="400" y="592" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Chapter 6: Probability &amp; Statistics</text>
</svg>