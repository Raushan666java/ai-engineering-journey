    );</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">const leftLinear = this.productions.every(
      p =&gt; /^[A-Z] | 6:</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">/.test(p.rhs) ||
            p.rhs.length === 2 &amp;&amp;</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">/^[A-Z][a-z]</text>
