    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">data-driven</tspan>: reasoning proceeds from premises toward conclusions. For Horn clause knowledge...</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">premises toward conclusions. For Horn</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">clause knowledge...</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">goal-driven</tspan>: reasoning proceeds from conclusions toward premises. Backward chaining is...</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">conclusions toward premises. Backward</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">chaining is...</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">most general unifier (MGU)</tspan>: the substitution that imposes the fewest constraints while achieving...</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">substitution that imposes the fewest</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">constraints while achieving...</text>
    <text x="60" y="410" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Horn clause</tspan>: a clause with at most one positive literal. A definite clause has exactly one...</text>
    <text x="60" y="432" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">positive literal. A definite clause has</text>
    <text x="60" y="454" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">exactly one...</text>
    <text x="60" y="484" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="512" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1: theta = {v_1/t_1, v_2/t_2, ..., v_n/t_n}</text>
    <text x="60" y="542" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="570" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Apply unification with the occur check to compute the Most General...</text>
    <text x="60" y="592" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Implement forward chaining for data-driven inference over Horn clause...</text>
    <text x="60" y="614" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Implement backward chaining for goal-driven query answering with loop...</text>
    <text x="60" y="636" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. Reduce any first-order logic formula to Conjunctive Normal Form (CNF)...</text>
