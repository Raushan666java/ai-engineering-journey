    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Can a binary semaphore</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">be used as a mutex?</text>
