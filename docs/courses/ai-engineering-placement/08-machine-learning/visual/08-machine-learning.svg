<text x="440" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">metrics · bias check</text>
<rect x="320" y="380" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
