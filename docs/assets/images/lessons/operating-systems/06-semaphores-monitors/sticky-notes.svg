          <text x="42" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="42" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">| Orphaned signal |</text>
    <text x="42" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">Thread exits without</text>
    <text x="42" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">calling...</text>
    </g>

<g transform="rotate(-6 312.5 470)" filter="url(#shadow)">
      <rect x="225" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="237" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="237" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">| Unlock by wrong</text>
    <text x="237" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">thread | Allowed (can</text>
    <text x="237" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">cause bugs) |...</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">&lt;&lt;</text>
    <text x="432" y="438" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">[Process</text>
    <text x="432" y="456" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Synchronization](./05-synchronization.</text>
    <text x="432" y="478" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
