    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement session-based and token-based authentication → Create</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">JWT-based authentication with refresh tokens → Implement OAuth 2.0</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">flows for third-party authentication → Apply role-based access control</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">(RBAC) and permissions → Secure passwords using bcrypt and follow</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">security best practices → Implement multi-factor authentication with</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">TOTP → A) They are synonyms → B) 401 means not authenticated, 403</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">means not authorized</text>
