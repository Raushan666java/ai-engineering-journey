    <text x="85" y="247" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: &quot; # 1234 (current script PID) echo &quot;Last BG PID: $!&quot;</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif"># 1235 (last background process PID) echo &quot;Options flag: $-&quot;</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif"># hB (current shell option flags) `` | 2: echo &quot;Done.</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Exiting.&quot; exit 0 } # Register trap for specific signals trap</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">cleanup SIGINT SIGTERM # Ignore Ctrl+C completely trap &apos;&apos;</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">SIGINT # Reset sign | Variables: ? for exit status |
|</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">**Conditionals** | if-then-else, case; test command [ ] and [[ ]] |
|</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">**Loop | 4: name&quot;    | &quot;Alice&quot;       | &quot;10&quot;</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">| Hello Alice
4    | sum= | 5: sum             | &quot;Alice&quot;</text>
  <text x="85" y="429" font-size="11" fill="#475569" font-family="Arial, sans-serif">| &quot;10&quot;           | 15
6    | echo &quot;count= | 6:</text>
  <text x="85" y="447" font-size="11" fill="#475569" font-family="Arial, sans-serif">name!&quot;   # Variable expansion in double</text>
  <text x="85" y="465" font-size="11" fill="#475569" font-family="Arial, sans-serif">quotes
literal=&apos;Hello,</text>
