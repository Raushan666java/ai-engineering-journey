<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Desk background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="#f1f5f9" opacity="0.3"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">QUIC 0-RTT is</text>
    <text x="42" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">powerful but</text>
    <text x="42" y="96" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">risky</text>
    <text x="42" y="118" font-size="10" fill="#475569" font-family="Arial, sans-serif">0-RTT data is</text>
    <text x="42" y="132" font-size="10" fill="#475569" font-family="Arial, sans-serif">vulnerable to replay</text>
    <text x="42" y="146" font-size="10" fill="#475569" font-family="Arial, sans-serif">attacks. Use</text>
    <text x="42" y="160" font-size="10" fill="#475569" font-family="Arial, sans-serif">single-use...</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">MQTT QoS 2 is</text>
    <text x="237" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">expensive</text>
    <text x="237" y="100" font-size="10" fill="#475569" font-family="Arial, sans-serif">Exactly-once delivery</text>
    <text x="237" y="114" font-size="10" fill="#475569" font-family="Arial, sans-serif">uses a 4-way handshake</text>
    <text x="237" y="128" font-size="10" fill="#475569" font-family="Arial, sans-serif">per message....</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">LoRaWAN ADR is</text>
    <text x="432" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">essential at</text>
    <text x="432" y="96" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">scale</text>
    <text x="432" y="118" font-size="10" fill="#475569" font-family="Arial, sans-serif">Without Adaptive Data</text>
    <text x="432" y="132" font-size="10" fill="#475569" font-family="Arial, sans-serif">Rate, all devices use</text>
    <text x="432" y="146" font-size="10" fill="#475569" font-family="Arial, sans-serif">the most robust...</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">1</text>
    <text x="42" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{ipv6}`;</text>
    <text x="42" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">return { ipv4, ipv6,</text>
    <text x="42" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">translated: v6 };</text>
    <text x="42" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">}
      case</text>
    <text x="42" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">&apos;nat64&apos;: {</text>
    <text x="42" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">//</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">2</text>
    <text x="237" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{hex.slice(4, 8)}`;</text>
    <text x="237" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">return { ipv4, ipv6,</text>
    <text x="237" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">translated:</text>
    <text x="237" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">synthesized };</text>
    <text x="237" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">}
      default</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FCE7F3" stroke="#9d174d" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#9d174d" font-family="Arial, sans-serif">Interview Q</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">What are the main</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">barriers to IPv6</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">adoption?</text>
