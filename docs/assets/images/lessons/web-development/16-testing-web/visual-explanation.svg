    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the main advantage of MSW over mocking the fetch function</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">directly? → B) MSW intercepts HTTP requests at the network level using</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Service Worker API (browser) or protocol-level interception (Node).</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Application code uses real fetch — no mocks leak into production code.</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Q2. Why should tests use `getByRole` instead of `getByTestId`? → B)</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">`getByRole` queries elements by their accessibility role, testing how</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">assistive technologies and keyboard users experience the component. It</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">also encourages adding proper ARIA roles. → Q3. What is the correct</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">way to test a custom React hook? → B) `renderHook` from</text>
  <text x="85" y="429" font-size="11" fill="#475569" font-family="Arial, sans-serif">`@testing-library/react` creates a minimal wrapper component to test</text>
  <text x="85" y="447" font-size="11" fill="#475569" font-family="Arial, sans-serif">hooks in isolation, providing `result` and `act` for assertions and</text>
  <text x="85" y="465" font-size="11" fill="#475569" font-family="Arial, sans-serif">updates.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Write unit tests with Vitest for functions and components → Test React</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">components with Testing Library → Implement API integration tests →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Write end-to-end tests with Playwright → Mock network requests with</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">MSW → Measure and enforce code coverage → A) MSW is faster → B) MSW</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">intercepts at the network level, so application code remains</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">unmodified and tests run as in production</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
