    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Closure: $a + b \in B$, $a \cdot b \in B$, $a&apos; \in B$. →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identity: $a + 0 = a$, $a \cdot 1 = a$. → Complements: $a + a&apos; =</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">1$, $a \cdot a&apos; = 0$. → Associativity: $(a + b) + c = a + (b +</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">c)$, $(a \cdot b) \cdot c = a \cdot (b \cdot c)$. → Commutativity: $a</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">+ b = b + a$, $a \cdot b = b \cdot a$. → Distributivity: $a + (b \cdot</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">c) = (a + b) \cdot (a + c)$ and $a \cdot (b + c) = (a \cdot b) + (a</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cdot c)$. → $x + x = x$ → $x \cdot x = x$</text>
