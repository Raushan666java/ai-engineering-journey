<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f0fff4; stroke:#2f855a; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect class="box" x="20" y="20" width="560" height="200" rx="8" />
  <text x="300" y="48" text-anchor="middle" class="text title">DP Contest Flow</text>
  <text x="40" y="84" class="text">1) Identify pattern</text>
  <text x="40" y="104" class="text">2) Choose DP template (interval/bitmask/tree)</text>
  <text x="40" y="124" class="text">3) Implement quick correct solution</text>
  <text x="40" y="144" class="text">4) Optimize if time allows</text>
  <text x="40" y="164" class="text">5) Edge-case tests</text>
</svg>