  <text x="85" y="437" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {w.word}&quot; ka paryayvachi hai:`,
        options:</text>
  <text x="85" y="455" font-size="11" fill="#475569" font-family="Arial, sans-serif">[...w.synonym.slice(0, 3), &quot;Koi nahi&quot;],
        ans | 2:</text>
  <text x="85" y="473" font-size="11" fill="#475569" font-family="Arial, sans-serif">{wordHindi}&quot; = &quot;</text>
