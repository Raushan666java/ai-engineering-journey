    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">TELL: Adds new sentences to the KB (like adding a book to the</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">catalog). → ASK: Queries the KB to determine what follows (like asking</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">the catalog a question). → Perceive the environment → get a percept. →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">TELL the KB what was perceived. → ASK the KB what action is best. →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Execute the action. → TELL(KB, Make-Percept-Sentence(percept, t)) →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">action ← ASK(KB, Make-Action-Query(t))</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
