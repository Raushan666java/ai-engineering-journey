    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1:</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;string(&apos;parcel_id&apos;)-&gt;unique()-&gt;nullable(); |</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">2: table-&gt;string(&apos;address_line_2&apos;)-&gt;nullable(); | 3:</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;string(&apos;property_type&apos;)-&gt;default(&apos;single_family&apos;);</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 4: table-&gt;integer(&apos;year_built&apos;)-&gt;nullable(); | 5:</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;decimal(&apos;lot_size&apos;, 10, 2)-&gt;nullable(); | 6:</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;integer(&apos;garage_spaces&apos;)-&gt;default(0);</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
