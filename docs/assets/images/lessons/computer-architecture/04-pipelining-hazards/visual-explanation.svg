<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Pipelining and Hazards</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: static and dynamic branch prediction techniques</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Ideal speedup: → For a k-stage pipeline: → Example: → Throughput: →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example: Execution of 3 instructions → Latency per instruction = 5</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">cycles</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Separate instruction cache (I-cache) and data cache (D-cache) —</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Harvard architecture → Stall the pipeline until resource is available</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Add more hardware resources (e.g., multiple ALUs) → RAW is a true</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">dependency — cannot be eliminated by renaming; must be resolved via</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">forwarding or stalling. → WAR and WAW are name dependencies — can be</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">eliminated by register renaming. → Predict branch not taken: continue</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">fetching from PC+4 → Predict branch taken: fetch from target address</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">after branch is decoded → Common static rule: backward branches</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">(loops) likely taken; forward branches likely not taken</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {current.rd})\n`;
        hazardCount++;</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.stats.rawHazards++;

        if (current.opcod | 2:</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">{this.instrToString(current)} reads it\n`;
        result += `  →</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">Resolved by register renaming (0 s | 3: {current.rd}\n`;</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">result += `  → Compiler scheduling: move independent instruction</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">between th | 4: {this.stats.rawHazards}\n`;
    result += `WAR</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">hazards: | 5: {this.stats.controlHazards}\n`;
    result +=</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Forwarding needed: | 6: {this.stats.stallsInserted}\n`;
    result +=</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Pipeline flushes:</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Ideal speedup:: Implementation</text>
  <line x1="500" y1="580" x2="500" y2="590" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="605" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="605" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="627" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="647" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Pipelining overlaps instruction execution across stages. A k-stage</text>
  <text x="85" y="665" font-size="11" fill="#475569" font-family="Arial, sans-serif">pipeline ideally achieves...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Pipelining and Hazards</text>
</svg>