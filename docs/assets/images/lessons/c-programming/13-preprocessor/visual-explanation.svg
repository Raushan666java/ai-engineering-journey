    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Understand the preprocessing phase and its role in compilation →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define and use object-like and function-like macros with `#define` →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Guard header files against multiple inclusion → Use conditional</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">compilation (`#ifdef`, `#ifndef`, `#if`) for portability and debugging</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Understand the dangers of macros and the alternative of `const` and</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">inline functions → Use predefined standard macros → Apply `#pragma`</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">and `#error` directives → Master the `#` stringification and `##`</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">token-pasting operators</text>
