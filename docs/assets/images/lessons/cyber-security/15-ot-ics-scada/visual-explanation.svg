    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Understand the OT/ICS/SCADA landscape including the Purdue model,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">ISA-99/IEC 62443 standards, and the fundamental differences between IT</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">and OT securi → Analyze PLC security architectures for Allen-Bradley,</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Siemens S7, and Modicon/M340 families including memory layout,</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">programming interfaces, and remot → Deep-dive into industrial</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">protocols — Modbus TCP/RTU, DNP3, Siemens S7comm, Profinet, OPC UA,</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">and BACnet — with TypeScript implementations for scannin → Reconstruct</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">major ICS attacks (Stuxnet, TRITON/TRISIS, Industroyer,</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">Incontroller/Pipedream) and extract defensive lessons → Design OT</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">network segmentation using ISA-99 zones/conduits, unidirectional</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">gateways, data diodes, and OT firewalls → Implement OT monitoring</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">strategies with passive vs active techniques, OT-SIEM, Wireshark</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">dissectors, and Zeek scripts → Configure secure remote access</text>
  <text x="85" y="586" font-size="11" fill="#475569" font-family="Arial, sans-serif">including jump boxes, session recording, vendor MFA, and air-gap</text>
  <text x="85" y="604" font-size="11" fill="#475569" font-family="Arial, sans-serif">considerations → Build working TypeScript tools: Modbus scanner,</text>
  <text x="85" y="622" font-size="11" fill="#475569" font-family="Arial, sans-serif">S7comm packet builder, DNP3 frame parser, Purdue model validator, ICS</text>
  <text x="85" y="640" font-size="11" fill="#475569" font-family="Arial, sans-serif">threat detection rules, and BACn</text>
