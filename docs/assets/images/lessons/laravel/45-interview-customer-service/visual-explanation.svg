    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1: What are the core components of a modern customer support</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">ticketing system? → Q2: Explain common SLA metrics used in customer</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">support. → Q3: What support workflow stages exist between ticket</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">creation and closure? → Q4: How do multi-channel support platforms</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">normalize interactions from different sources? → Q5: Describe how</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">customer satisfaction is measured in support platforms. → Q6: How</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">would you implement a TicketTriageAgent that classifies and routes</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">incoming support tickets?</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">First Response Time (FRT): Time from ticket creation to first agent</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">reply. Typical SLAs: 1 hour for urgent, 4 hours for standard. →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Resolution Time (RT): Time to close or resolve the ticket. Often</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">measured as Mean Time to Resolve (MTTR). → SLA Compliance Rate:</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Percentage of tickets meeting their SLA targets within a given period.</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Most teams target 90%+. → Backlog Aging: Distribution of open tickets</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">by time buckets (e.g., &amp;lt; 24h, 24â€“72h, 72h+). → Breach Count:</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Number of tickets that exceeded SLA thresholds, broken down by</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">priority and team. → Business Hours vs. Calendar Hours: Many SLAs</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">exclude weekends and after-hours, requiring configurable support</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">windows. → &gt;withInput([&apos;subject&apos; =&gt;</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">$ticket-&gt;subject, &apos;description&apos; =&gt;</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">$ticket-&gt;description]) → &gt;withOutputSchema(TriageResult::class)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: this-&gt;classifier</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">-&gt;withInput([&apos;subject&apos; =&gt; | 2: result-&gt;intent,</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;priority&apos; =&gt; | 3: result-&gt;priority ===</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;urgent&apos;) { | 4: this-&gt;analyzer</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">-&gt;withInput([
                &apos;message&apos; =&gt; | 5:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">ticket-&gt;created_at-&gt;diffInHours(now()),
            ])</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">-&gt;withOutputSchema(SentimentRes | 6: ticket-&gt;priority !==</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;urgent&apos;) {</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
