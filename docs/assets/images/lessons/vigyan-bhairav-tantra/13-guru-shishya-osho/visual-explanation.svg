    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">ओशो के &quot;गुरु&quot; की अवधारणा को समझना — गुरु एक उपस्थिति है,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">शिक्षक नहीं → पारंपरिक गुरु-शिष्य संबंधों पर ओशो की अनोखी आलोचना को</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">आत्मसात करना → दीक्षा (initiation) को ओशो के नज़रिए से देखना — बिना</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">स्पर्श के संचरण → गुरु को एक उत्प्रेरक (catalytic agent) के रूप में</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">समझना → सत्संग की ओशो की व्याख्या — transmission without touch →</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">TypeScript Osho Discourse Reference Explorer विकसित करना → कोई मंत्र</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">नहीं दिया जाता था → कोई रस्म नहीं होती थी</text>
