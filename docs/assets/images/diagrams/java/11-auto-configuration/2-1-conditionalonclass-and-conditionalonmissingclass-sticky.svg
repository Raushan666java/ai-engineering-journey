    <text x="56" y="360" font-size="13" fill="#333" font-family="Arial, sans-serif">    the...</text>
    <line x1="56" y1="366" x2="544" y2="366" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="386" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">`@ConditionalOnClass`</text>
