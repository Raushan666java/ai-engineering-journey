    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: P \Rightarrow Q | 2: P \models Q | 3: (A \wedge B) \Rightarrow C |</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">4: \neg(P \wedge Q) \equiv \neg P \vee \neg Q | 5: \{P \vee Q, \neg</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">P\} | 6: (P \vee Q) \wedge (\neg P \vee \neg Q)</text>
