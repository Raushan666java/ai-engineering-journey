<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#ffffff" rx="4"/>
  <!-- Title -->
  <text x="450" y="50" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">अध्याय १८: समापन — ओशो की समग्र दृष्टि में अंतिम...</text>
  <rect x="430" y="60" width="40" height="3" rx="2" fill="#2563eb"/>
  <!-- Comparison table -->
    <rect x="20" y="90" width="160" height="44" rx="8" fill="#2563eb"/>
    <text x="100" y="117" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">पारंपरिक दृष्टि</text>
  <rect x="180" y="90" width="700" height="44" rx="0 8 0" fill="#2563eb"/>
    <text x="530" y="117" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">ओशो की दृष्टि</text>
  <rect x="20" y="134" width="160" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="156" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">११२ तकनीकें = अभ्यास करने के लिए</text>
  <rect x="180" y="134" width="700" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="156" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">११२ तकनीकें = खुद को पहचानने के लिए</text>
  <rect x="20" y="170" width="160" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="192" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">साधना का लक्ष्य = समाधि</text>
  <rect x="180" y="170" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="192" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">साधना का लक्ष्य = यह समझना कि...</text>
  <rect x="20" y="206" width="160" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="228" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">तकनीक को पकड़ो</text>
  <rect x="180" y="206" width="700" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="228" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">तकनीक को छोड़ो — और जो बचता है वही...</text>
  <rect x="20" y="242" width="160" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="264" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">मोक्ष भविष्य में</text>
  <rect x="180" y="242" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="264" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">मोक्ष इसी पल में — यहीं और अभी</text>
  <rect x="20" y="278" width="160" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="300" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">गुरु से मार्गदर्शन</text>
  <rect x="180" y="278" width="700" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="300" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">गुरु तो बस इशारा करता है — रास्ता...</text>
  <rect x="20" y="314" width="160" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="28" y="336" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial, sans-serif">क्रमिक प्रगति</text>
  <rect x="180" y="314" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="188" y="336" font-size="10" font-weight="normal" fill="#475569" font-family="Arial, sans-serif">अचानक — एक झटके में — जब देखना...</text>
</svg>