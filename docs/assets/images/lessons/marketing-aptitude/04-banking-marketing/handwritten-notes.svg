    <text x="60" y="556" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Regulatory constraints — RBI heavily regulates marketing...</text>
    <text x="60" y="578" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. Long-term relationships — Customer relationships span years and...</text>
