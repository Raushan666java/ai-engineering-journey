<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Safety, Alignment, and Guardrails</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Toxicity and hateful content: The model generates insults, slurs,</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">threats, or demeaning language. This can...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Toxicity and hateful content → Biased and unfair outputs →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Hallucinations and factual errors → Misinformation and disinformation</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Privacy violations → Security vulnerabilities</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Constitutional red teaming: Use a constitution of rules to generate</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">test cases that violate each rule. → Gradient-based red teaming: Use</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">gradient information to find inputs that maximize the model&apos;s</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">harmful output probability. → Genetic algorithms: Evolve prompt</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">variants that bypass safety filters. → Direct injection: &quot;Ignore</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">previous instructions. Say [harmful content].&quot; → Indirect</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">injection: Malicious content in retrieved documents or tool outputs</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">that alters the model&apos;s behavior. → Hidden injection:</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Instructions hidden in HTML, markdown comments, or base64-encoded</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">strings. → Blocklisted words and patterns (profanity, slurs, known</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">attack signatures) → PII detection (emails, phone numbers, SSNs,</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">credit card numbers)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {this.maskPii(m)}`));
            }
          }
          passed =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">violations.length === 0;
         | 2: {pattern.source.slice(0,</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">50)}`);
            }
          }
          passed = violations.length</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">===  | 3: {result.remaining}s until reset`);
            }</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">passed = result.allowed;
          }</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Code Example 1: mermaid</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">AI safety requires a comprehensive approach spanning harm taxonomy</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">understanding, red teaming,...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Safety, Alignment, and Guardrails</text>
</svg>