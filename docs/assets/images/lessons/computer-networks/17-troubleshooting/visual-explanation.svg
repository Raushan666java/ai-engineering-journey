    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Apply a systematic OSI-layer troubleshooting methodology to isolate</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">network faults. → Diagnose physical layer issues: cable faults, signal</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">degradation, power over Ethernet problems. → Detect and resolve data</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">link layer issues: duplex mismatches, MAC flooding, STP problems. →</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Troubleshoot network layer issues: routing loops, MTU mismatches, ICMP</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">filtering. → Identify transport layer issues: port blocking, TIME_WAIT</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">exhaustion, connection limits. → Debug application layer issues: DNS</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">resolution failures, HTTP status errors, SSL/TLS handshake failures. →</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master diagnostic tools: ping, traceroute, netstat/ss, nslookup/dig,</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">tcpdump/Wireshark, nmap, iperf, mtr. → Analyze packet captures and</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">build systematic troubleshooting workflows.</text>
