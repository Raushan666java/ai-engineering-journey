    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">First-order necessary: $\nabla f(x^*) = 0$ → Second-order necessary:</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\nabla^2 f(x^*) \succeq 0$ (for minimum) → Second-order sufficient:</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\nabla f(x^*) = 0$ and $\nabla^2 f(x^*) \succ 0$ → Fixed: Simple but</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">may diverge if too large → Exact line search: $\alpha_k =</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">\arg\min_\alpha f(x_k - \alpha \nabla f(x_k))$ → Backtracking</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Armijo): Reduce $\alpha$ until $f(x_k - \alpha \nabla f) \leq f(x_k)</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">- c\alpha \|\nabla f\|^2$ → Diminishing: $\alpha_k \to 0$ with $\sum</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">\alpha_k = \infty$ (e.g., $\alpha_k = 1/k$) → Stationarity: $0 \in</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">\partial f(x^*) + \sum \mu_i \partial g_i(x^*)$</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
