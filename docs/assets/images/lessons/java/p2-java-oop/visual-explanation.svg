  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`extends`, `super`, and method overriding → Distinguish compile-time</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">polymorphism (overloading) from runtime polymorphism (overriding) →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design abstract base classes and decide when to use abstract classes</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">versus interfaces → Leverage interfaces with default, static, and</text>
