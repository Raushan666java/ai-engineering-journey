    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Set up Keycloak with Docker Compose and configure realms, clients,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">users, roles, and groups via the admin console → Secure Spring Boot</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">REST endpoints using the Keycloak Spring Boot adapter (legacy) and</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Spring Security OAuth2 resource server (modern) → Implement token</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">exchange between clients for service-to-service delegation → Configure</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">identity brokering with social login providers (Google, GitHub) and</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">SAML identity providers → Set up user federation with LDAP and Active</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Directory, including periodic sync and mappers → Configure the first</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">broker login flow for account linking → Implement fine-grained</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">authorization using Keycloak Authorization Services with resources,</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">scopes, permissions, and policies → Apply UMA 2.0 for user-managed</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">resource access</text>
