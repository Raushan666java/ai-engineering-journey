<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowMd" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e2e8f0"/>
    </pattern>
    <pattern id="lineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#ffffff"/>
  <rect width="600" height="800" fill="url(#gBg)"/>
  <rect width="600" height="800" fill="url(#dotGrid)"/>
  <!-- Top gradient bar -->
  <rect x="0" y="0" width="600" height="4" fill="url(#gBlue)"/>
  <!-- Extra subtle decorative accent -->
  <rect x="0" y="4" width="600" height="1" fill="#1e40af" opacity="0.06"/>
    <text x="300" y="64" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="0.3">Chapter 48: Manufacturing Interview Q&amp;A</text>
  <text x="300" y="88" font-size="12" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Self-Test Quiz — 3 Questions</text>
  <rect x="265.5" y="96" width="69" height="18" rx="9" fill="#dbeafe"/>
      <text x="300" y="108" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">concept</text>
  <g filter="url(#shadowMd)">
        <rect x="30" y="124" width="540" height="180" rx="10" fill="#ffffff"/>
        <rect x="30" y="124" width="540" height="180" rx="10" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
      </g>
  <rect x="48" y="136" width="28" height="20" rx="10" fill="#dbeafe"/>
        <text x="62" y="150" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q1</text>
  <rect x="506" y="134" width="44" height="18" rx="9" fill="#059669" opacity="0.10"/>
        <text x="528" y="147" font-size="8" font-weight="bold" fill="#059669" text-anchor="middle" font-family="Arial, sans-serif">Easy</text>
  <text x="78" y="160" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">What are the six core manufacturing domain entities</text>
  <text x="78" y="176" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">in a Laravel manufacturing platform? How do they</text>
  <text x="78" y="192" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">relate?</text>
  <line x1="48" y1="282" x2="552" y2="282" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="3,2"/>
        <text x="48" y="290" font-size="10" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <g filter="url(#shadowMd)">
        <rect x="30" y="344" width="540" height="180" rx="10" fill="#ffffff"/>
        <rect x="30" y="344" width="540" height="180" rx="10" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
      </g>
  <rect x="48" y="356" width="28" height="20" rx="10" fill="#dbeafe"/>
        <text x="62" y="370" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q2</text>
  <rect x="492" y="354" width="58" height="18" rx="9" fill="#d97706" opacity="0.10"/>
        <text x="521" y="367" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="Arial, sans-serif">Medium</text>
  <text x="78" y="380" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">Explain the difference between corrective,</text>
  <text x="78" y="396" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">preventative, predictive, and condition-based</text>
  <text x="78" y="412" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">maintenance. How would each be modeled in a Laravel</text>
  <text x="78" y="428" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">manufacturing application?</text>
  <line x1="48" y1="502" x2="552" y2="502" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="3,2"/>
        <text x="48" y="510" font-size="10" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">✓ </text>
  <g filter="url(#shadowMd)">
        <rect x="30" y="564" width="540" height="180" rx="10" fill="#ffffff"/>
        <rect x="30" y="564" width="540" height="180" rx="10" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
      </g>
  <rect x="48" y="576" width="28" height="20" rx="10" fill="#dbeafe"/>
        <text x="62" y="590" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">Q3</text>
  <rect x="506" y="574" width="44" height="18" rx="9" fill="#dc2626" opacity="0.10"/>
        <text x="528" y="587" font-size="8" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="Arial, sans-serif">Hard</text>
  <text x="78" y="600" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">What manufacturing metrics are typically tracked,</text>
  <text x="78" y="616" font-size="11" fill="#1e293b" font-family="Arial, sans-serif">and how would you calculate them in Laravel?</text>
  <line x1="48" y1="722" x2="552" y2="722" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="3,2"/>
        <text x="48" y="730" font-size="10" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">✓ </text>
</svg>