  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">तंत्र एक धर्म नहीं, एक विज्ञान है — ओशो तंत्र को एक प्रयोगात्मक</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">विज्ञान के रूप में प्रस्तुत करते हैं। → विज्ञान भैरव तंत्र का महत्व —</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">सबसे प्राचीन ध्यान शास्त्र, 112 ध्यान विधियाँ। → ओशो का आधुनिक संदर्भ</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">— प्राचीन विधियों को आधुनिक संदर्भ में पुनः व्याख्यायित। → कोई</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">पूर्वापेक्षा नहीं — किसी दीक्षा या विश्वास की आवश्यकता नहीं। → ध्यान =</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">अनुभव — करने और अनुभव करने की चीज़ है। → प्रत्येक व्यक्ति अलग — अपनी</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">प्रकृति के अनुसार विधि चुनें। → प्रयोगशाला के रूप में जीवन — स्वयं पर</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">प्रयोग करें। → शास्त्र से अधिक अनुभव — स्वयं अनुभव किया हुआ ही सत्य</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">है।</text>
