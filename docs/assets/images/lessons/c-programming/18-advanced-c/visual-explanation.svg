    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Manage multi-file C projects with header guards, `extern`, and</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Makefiles → Use function pointers for callbacks and dispatch tables →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Write variadic functions using `stdarg.h` → Parse complex C</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">declarations using the spiral rule → Understand `volatile`,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">`restrict`, and their interplay with `const` → Use `setjmp`/`longjmp`</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">for non-local error recovery → Handle signals safely with</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">`sig_atomic_t` → Use variable-length arrays and flexible array members</text>
