    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Apply unification with the occur check to compute the Most General</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unifier (MGU) for any pair of logical expressions. → Implement forward</text>
