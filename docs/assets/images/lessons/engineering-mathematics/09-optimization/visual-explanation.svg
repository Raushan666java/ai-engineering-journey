    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">General Form:: \min_{x \in \mathbb{R}^n} f(x) \quad \text{subject to}</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">\quad g_i(x) \leq 0, \; h_j(x) = 0 | Convex Function:: f(\lambda x +</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">(1-\lambda)y) \leq \lambda f(x) + (1-\lambda)f(y) | First-Order</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">Condition (for differentiable $f$):: f(y) \geq f(x) + \nabla f(x)^T (y</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">- x) | Algorithms:: x_{k+1} = x_k - \alpha_k \nabla f(x_k) | 5:</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">d_{k+1} = -\nabla f(x_{k+1}) + \beta_k d_k | 6: x_{k+1} = x_k +</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">\alpha_k d_k</text>
