  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master string traversal, manipulation, and pattern matching techniques</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Understand sliding window variations for substring problems →</text>
