  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Self-reinforcing loops: an agent that praises its own output and uses</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">it as future training data → Exploration bonuses: adding noise</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">proportional to uncertainty to encourage novel actions → Adversarial</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">amplification: two agents that each make the other&apos;s argument</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">more extreme → The gain around the loop is ≥ 1 (unity gain), AND → The</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">phase shift around the loop is 0° (or 360°). → Flip-flopping:</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">alternating between two contradictory conclusions → Thrashing:</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">repeatedly attempting and abandoning the same approach →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Tone-switching: oscillating between sycophantic and hostile in</text>
