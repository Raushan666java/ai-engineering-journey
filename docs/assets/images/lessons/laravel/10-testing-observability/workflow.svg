  <text x="235" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">request/response cycle.</text>
  <text x="235" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">These typically touch</text>
  <text x="235" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">the database,</text>
  <text x="235" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">middleware, routing, and</text>
  <text x="235" y="322" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">controllers.</text>
  <rect x="335" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
