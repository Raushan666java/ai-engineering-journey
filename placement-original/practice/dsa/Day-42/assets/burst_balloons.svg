<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .rect { fill:#fff7ed; stroke:#dd6b20; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px; fill:#2d3748 }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="560" height="160" class="rect" rx="8" />
  <text x="300" y="46" text-anchor="middle" class="text title">Burst Balloons - Interval DP Diagram</text>
  <text x="40" y="80" class="text">Index ranges considered: [i..j]</text>
  <text x="40" y="100" class="text">For each length L from 1 to n:</text>
  <text x="40" y="120" class="text">  for i in [0..n-L]: j = i+L-1; for k in [i..j]: dp[i][j] = max(dp[i][j], left + midBurst + right)</text>
</svg>