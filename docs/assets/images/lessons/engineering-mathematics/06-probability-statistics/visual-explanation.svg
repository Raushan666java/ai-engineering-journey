<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 6: Probability &amp; Statistics</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Hypothes: Testing | Reject $H_0$ if p-value &amp;lt; $\alpha$ |</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">Evidence-based decision...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sample Space: → Event: → Probability Axioms (Kolmogorov): →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Properties: → Conditional Probability: → Multiplication Rule:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$0 \leq P(E) \leq 1$ for any event $E$ → $P(S) = 1$ → For mutually</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">exclusive events $E_1, E_2, \ldots$, $P(\bigcup_{i=1}^\infty E_i) =</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{i=1}^\infty P(E_i)$ → $P(\emptyset) = 0$ → $P(E^c) = 1 - P(E)$ →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">$P(A \cup B) = P(A) + P(B) - P(A \cap B)$ → If $A \subseteq B$, then</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">$P(A) \leq P(B)$ → $E[aX + b] = aE[X] + b$</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Law of Total Probability:: P(A) = \sum_{i=1}^n P(A|B_i)P(B_i) |  If</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">$B_1, B_2, \ldots, B_n$ partition $S$:
$$P(A) = \sum_{i=1}^n</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(A|B_i)P(B_i)$$

: P(B_i|A) = \frac{P(A|B_i)P(B_i)}{\sum_{j=1}^n</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(A|B_j)P(B_j)} | discrete random variable: P(X = x_k) = p_k, \quad</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_k p_k = 1 |  has a : P(a \leq X \leq b) = \int_a^b f(x)\,dx |</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">Convolution:: f_Z(z) = \int_{-\infty}^\infty f_X(x) f_Y(z-x)\,dx | Law</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">of Large Numbers (LLN):: \bar{X}_n = \frac{1}{n}\sum_{i=1}^n X_i</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\xrightarrow{p} \mu</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Bayes&apos; Theorem:  A test for a disease is 99% accurate</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">(true positive and true negative rates)....</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Probability quantifies uncertainty via Kolmogorov&apos;s axioms
-</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bayes&apos; theorem provides a formal...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 6: Probability &amp; Statistics</text>
</svg>