    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">ओशो वाणी: → ओशो वाणी: → ओशो वाणी: → ओशो वाणी: → ओशो वाणी: → ओशो वाणी:</text>
