<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 4: Database Foundations: Replication and Indexing</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: LSM-Tree compaction strategies and their impact on read/write</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">amplification</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Search: → Insert: → Delete: → MemTable: → SSTable (Sorted String</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Table): → Bloom Filters:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Page header: Metadata (page type, free space pointer, checksum, LSN</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">for crash recovery) → Cell pointer array: Array of (offset, key) pairs</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">sorted by key → Cell data: Actual key + value pairs (or key + child</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">page pointer for internal nodes) → Start at root page → Binary search</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">within the page for the key (or the correct child pointer range) → If</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">found at leaf: return the value → If not found: follow the appropriate</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">child pointer and recurse → Repeat until leaf is reached</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">order: branching\_factor = \frac{page\_size}{key\_size +</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">pointer\_size} | 2: branching\_factor = \frac{16384}{8 + 8} \approx</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">1024 | 3: \log_{1024}(10^9) \approx \frac{9}{3.01} \approx 3 \textrm{</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">levels} | 4: P(false\ positive) = (1 - e^{-kn/m})^k | Last-Write-Wins</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">(LWW):: \text{value} = \max_{timestamp}(value_1, value_2) | R:: W + R</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt; N \implies \text{strong consistency}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: B-Tree vs LSM-Tree for a Time-Series Database:  Problem:</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design the storage layer for a metrics system that ingests 1M data...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- B-Trees use a high branching factor (~1000+) to minimize disk seeks,</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">achieving...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 4: Database Foundations: Replication and Indexing</text>
</svg>