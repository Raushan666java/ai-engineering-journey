    InventoryMovement::create([</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;product_id&apos; =&gt; | 3: quantity,</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;reference_type&apos; =&gt; &apos;order&apos;,</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;reference_id&apos; =&gt; | 4: serviceLevel = 0.95
    ): float</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">{ | 5: serviceLevel &gt;= 0.99 =&gt; 2.33, | 6: serviceLevel &gt;=</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">0.90 =&gt; 1.28,
            default =&gt; 1.04,
        };</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">return</text>
