<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 16: Approximation Algorithms</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">polynomial-time approximation scheme (PTAS): an algorithm that, for</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">any fixed \( \epsilon &gt; 0 \), achieves an approximation...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Definition 16.1. → Definition 16.2. → Problem: → Real-world analogy: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Algorithm Steps: → Pseudocode:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Initialize an empty cover set \( C \). → While there are uncovered</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">edges in \( E \): → Return \( C \). → Time: \( O(V + E) \) — each edge</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">examined at most once; removing incident edges can be done with</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">adjacency tracking. → Space: \( O(V) \) for the cover set and removed</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">flags. → Disconnected graph: Works correctly; each component handled</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">independently. → Single vertex, no edges: Returns empty cover</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(correct). → Complete graph K&lt;sub&gt;n&amp;lt;/sub&amp;gt;: Picks a</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">single edge, adds 2 vertices, removes all edges. Cover size = 2,</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">optimal = n−1. Ratio improves as n grows.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 16.1: Vertex Cover 2-Approximation in C++:</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">| Problem | Algorithm | Ratio | Lower Bound</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">|
|---------|-----------|-------|-------------|
|...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 16: Approximation Algorithms</text>
</svg>