<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f0f9ff; stroke:#2b6cb0; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:16px }
  </style>
  <rect x="20" y="20" width="660" height="260" class="box" rx="8" />
  <text x="350" y="56" text-anchor="middle" class="text title">Week 7 Assessment Flow</text>
  <text x="40" y="100" class="text">1) Candidate completes 15-problem assessment (60 minutes)</text>
  <text x="40" y="120" class="text">2) Auto-score with provided test suite</text>
  <text x="40" y="140" class="text">3) Store results and compute analytics</text>
  <text x="40" y="160" class="text">4) Generate feedback and next-step study plan</text>
</svg>