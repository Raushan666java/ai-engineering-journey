    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the N+1 problem in database queries? → A) The N+1 problem</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">occurs when code fetches a list of N parent entities, then executes N</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">additional queries to fetch related child entities — instead of one</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">query with a JOIN. → Q2. What is the primary advantage of Prisma ORM</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">over raw SQL? → B) Prisma generates a TypeScript client from the</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">schema, giving compile-time type safety and auto-completion for all</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">queries, migrations, and relations. → Q3. Which index type is best for</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">range queries (WHERE created_at &gt; ?)? → B) B-tree indexes support</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">range queries, sorting, and pattern matching. Hash indexes only</text>
  <text x="85" y="429" font-size="11" fill="#475569" font-family="Arial, sans-serif">support exact equality comparisons.</text>
