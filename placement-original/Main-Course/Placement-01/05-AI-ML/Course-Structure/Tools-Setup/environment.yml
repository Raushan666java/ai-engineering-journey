    - spacy>=3.7.0
    - gensim>=4.3.0
    
    # Computer Vision (Updated)
    - opencv-python>=4.8.0
    - pillow>=10.0.0
    - imageio>=2.31.0
    
    # MLOps (Security Fixes)
    - mlflow>=2.8.0
    - flask>=3.0.0
    - fastapi>=0.104.0
    - streamlit>=1.28.0
    
    # Utilities (Secure Versions)
    - tqdm>=4.66.0
    - requests>=2.31.0
    - beautifulsoup4>=4.12.0
    - python-dotenv>=1.0.0
    
    # Testing and quality (Updated)
    - pytest>=7.4.0
    - black>=23.9.0
    - flake8>=6.0.0