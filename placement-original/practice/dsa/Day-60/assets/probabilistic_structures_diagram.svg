<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
  <rect width="100%" height="100%" fill="#f9fafb"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">
    Day 60 — Probabilistic Data Structures: Space-Efficient Algorithms
  </text>
  
  <!-- Bloom Filter Section -->
  <g id="bloom-filter">
    <rect x="20" y="60" width="400" height="240" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="220" y="85" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">
      Bloom Filter: Membership Testing
    </text>
    
    <!-- Bit Array Visualization -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-size="12" fill="#374151">Bit Array:</text>
      <rect x="0" y="10" width="30" height="25" fill="#10b981" stroke="#059669"/>
      <text x="15" y="28" font-size="11" text-anchor="middle" fill="#fff">1</text>
      <rect x="35" y="10" width="30" height="25" fill="#e5e7eb" stroke="#9ca3af"/>
      <text x="50" y="28" font-size="11" text-anchor="middle">0</text>
      <rect x="70" y="10" width="30" height="25" fill="#10b981" stroke="#059669"/>
      <text x="85" y="28" font-size="11" text-anchor="middle" fill="#fff">1</text>
      <rect x="105" y="10" width="30" height="25" fill="#e5e7eb" stroke="#9ca3af"/>
      <text x="120" y="28" font-size="11" text-anchor="middle">0</text>
      <rect x="140" y="10" width="30" height="25" fill="#10b981" stroke="#059669"/>
      <text x="155" y="28" font-size="11" text-anchor="middle" fill="#fff">1</text>
      <text x="180" y="28" font-size="11" fill="#6b7280">...</text>
      
      <!-- Hash functions -->
      <text x="0" y="60" font-size="11" fill="#374151">Insert "user_123":</text>
      <circle cx="15" cy="90" r="3" fill="#ef4444"/>
      <line x1="15" y1="93" x2="15" y2="10" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="15" y="105" font-size="10" text-anchor="middle" fill="#ef4444">h1</text>
      
      <circle cx="85" cy="90" r="3" fill="#f59e0b"/>
      <line x1="85" y1="93" x2="85" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="85" y="105" font-size="10" text-anchor="middle" fill="#f59e0b">h2</text>
      
      <circle cx="155" cy="90" r="3" fill="#8b5cf6"/>
      <line x1="155" y1="93" x2="155" y2="10" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="155" y="105" font-size="10" text-anchor="middle" fill="#8b5cf6">h3</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(40, 220)">
      <text x="0" y="0" font-size="11" fill="#374151" font-weight="bold">Properties:</text>
      <text x="0" y="18" font-size="10" fill="#059669">✓ No false negatives</text>
      <text x="0" y="33" font-size="10" fill="#dc2626">⚠ Possible false positives</text>
      <text x="0" y="48" font-size="10" fill="#6b7280">Space: O(m) bits, m = -n·ln(p)/(ln2)²</text>
      <text x="0" y="63" font-size="10" fill="#6b7280">Time: O(k) per operation</text>
    </g>
  </g>
  
  <!-- Count-Min Sketch Section -->
  <g id="count-min-sketch">
    <rect x="480" y="60" width="400" height="240" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="680" y="85" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">
      Count-Min Sketch: Frequency Estimation
    </text>
    
    <!-- Matrix Visualization -->
    <g transform="translate(500, 100)">
      <text x="0" y="0" font-size="12" fill="#374151">Counter Matrix (d × w):</text>
      
      <!-- Row 1 -->
      <rect x="0" y="15" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="17.5" y="33" font-size="10" text-anchor="middle">12</text>
      <rect x="40" y="15" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="57.5" y="33" font-size="10" text-anchor="middle">5</text>
      <rect x="80" y="15" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="97.5" y="33" font-size="10" text-anchor="middle">8</text>
      <text x="125" y="33" font-size="10" fill="#6b7280">... w columns</text>
      
      <!-- Row 2 -->
      <rect x="0" y="45" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="17.5" y="63" font-size="10" text-anchor="middle">7</text>
      <rect x="40" y="45" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="57.5" y="63" font-size="10" text-anchor="middle">15</text>
      <rect x="80" y="45" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="97.5" y="63" font-size="10" text-anchor="middle">3</text>
      
      <!-- Row 3 -->
      <rect x="0" y="75" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="17.5" y="93" font-size="10" text-anchor="middle">9</text>
      <rect x="40" y="75" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="57.5" y="93" font-size="10" text-anchor="middle">11</text>
      <rect x="80" y="75" width="35" height="25" fill="#fed7aa" stroke="#f59e0b"/>
      <text x="97.5" y="93" font-size="10" text-anchor="middle">6</text>
      
      <text x="230" y="33" font-size="9" fill="#6b7280">d rows</text>
      <text x="230" y="48" font-size="9" fill="#6b7280">(hash</text>
      <text x="230" y="63" font-size="9" fill="#6b7280">functions)</text>
      
      <!-- Query example -->
      <text x="0" y="125" font-size="11" fill="#374151">Query("item_A"):</text>
      <text x="0" y="142" font-size="10" fill="#374151">→ min(12, 7, 9) = 7</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(500, 220)">
      <text x="0" y="0" font-size="11" fill="#374151" font-weight="bold">Properties:</text>
      <text x="0" y="18" font-size="10" fill="#059669">✓ Never underestimates</text>
      <text x="0" y="33" font-size="10" fill="#dc2626">⚠ May overestimate (collisions)</text>
      <text x="0" y="48" font-size="10" fill="#6b7280">Space: O(w·d), w=⌈e/ε⌉, d=⌈ln(1/δ)⌉</text>
      <text x="0" y="63" font-size="10" fill="#6b7280">Error: ±ε·N with prob 1-δ</text>
    </g>
  </g>
  
  <!-- HyperLogLog Section -->
  <g id="hyperloglog">
    <rect x="20" y="330" width="400" height="240" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="220" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4338ca">
      HyperLogLog: Cardinality Estimation
    </text>
    
    <!-- Register array -->
    <g transform="translate(40, 370)">
      <text x="0" y="0" font-size="12" fill="#374151">Registers (m = 2^p):</text>
      
      <rect x="0" y="10" width="30" height="30" fill="#c7d2fe" stroke="#6366f1"/>
      <text x="15" y="30" font-size="10" text-anchor="middle">0</text>
      <text x="15" y="48" font-size="8" text-anchor="middle" fill="#6b7280">R[0]</text>
      
      <rect x="35" y="10" width="30" height="30" fill="#c7d2fe" stroke="#6366f1"/>
      <text x="50" y="30" font-size="10" text-anchor="middle">3</text>
      <text x="50" y="48" font-size="8" text-anchor="middle" fill="#6b7280">R[1]</text>
      
      <rect x="70" y="10" width="30" height="30" fill="#c7d2fe" stroke="#6366f1"/>
      <text x="85" y="30" font-size="10" text-anchor="middle">1</text>
      <text x="85" y="48" font-size="8" text-anchor="middle" fill="#6b7280">R[2]</text>
      
      <rect x="105" y="10" width="30" height="30" fill="#c7d2fe" stroke="#6366f1"/>
      <text x="120" y="30" font-size="10" text-anchor="middle">5</text>
      <text x="120" y="48" font-size="8" text-anchor="middle" fill="#6b7280">R[3]</text>
      
      <text x="145" y="30" font-size="11" fill="#6b7280">... (16K registers)</text>
      
      <!-- Hash example -->
      <text x="0" y="75" font-size="11" fill="#374151">Hash → Leading Zeros:</text>
      <rect x="0" y="83" width="180" height="20" fill="#f3f4f6" stroke="#9ca3af"/>
      <text x="5" y="97" font-size="9" font-family="monospace" fill="#1f2937">101 | 0001110...</text>
      <line x1="30" y1="83" x2="30" y2="103" stroke="#ef4444" stroke-width="2"/>
      <text x="35" y="80" font-size="8" fill="#ef4444">p bits</text>
      <text x="85" y="80" font-size="8" fill="#059669">count leading 0s</text>
      
      <text x="0" y="125" font-size="10" fill="#374151">register[5] = max(old, 4)</text>
      <text x="0" y="142" font-size="10" fill="#374151">Cardinality ≈ α_m · m² / Σ(2^-R[i])</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(40, 505)">
      <text x="0" y="0" font-size="11" fill="#374151" font-weight="bold">Properties:</text>
      <text x="0" y="18" font-size="10" fill="#059669">✓ Mergeable (max registers)</text>
      <text x="0" y="33" font-size="10" fill="#059669">✓ Extremely space-efficient</text>
      <text x="0" y="48" font-size="10" fill="#6b7280">Space: O(m) registers, m=2^p</text>
      <text x="0" y="63" font-size="10" fill="#6b7280">Error: 1.04/√m (p=14 → 0.81%)</text>
    </g>
  </g>
  
  <!-- Cuckoo Filter Section -->
  <g id="cuckoo-filter">
    <rect x="480" y="330" width="400" height="240" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="680" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#9f1239">
      Cuckoo Filter: Bloom with Deletions
    </text>
    
    <!-- Bucket array -->
    <g transform="translate(500, 370)">
      <text x="0" y="0" font-size="12" fill="#374151">Buckets (4 fingerprints each):</text>
      
      <!-- Bucket 0 -->
      <rect x="0" y="12" width="90" height="35" fill="#fbcfe8" stroke="#ec4899" rx="4"/>
      <text x="5" y="26" font-size="9" font-family="monospace">AF2C</text>
      <text x="5" y="38" font-size="9" font-family="monospace">B1E4</text>
      <line x1="40" y1="12" x2="40" y2="47" stroke="#ec4899"/>
      <text x="45" y="26" font-size="9" font-family="monospace">3F9A</text>
      <text x="45" y="38" font-size="9" font-family="monospace">----</text>
      <text x="2" y="60" font-size="8" fill="#6b7280">Bucket 0</text>
      
      <!-- Bucket 1 -->
      <rect x="100" y="12" width="90" height="35" fill="#fbcfe8" stroke="#ec4899" rx="4"/>
      <text x="105" y="26" font-size="9" font-family="monospace">7C12</text>
      <text x="105" y="38" font-size="9" font-family="monospace">E8D3</text>
      <line x1="140" y1="12" x2="140" y2="47" stroke="#ec4899"/>
      <text x="145" y="26" font-size="9" font-family="monospace">----</text>
      <text x="145" y="38" font-size="9" font-family="monospace">----</text>
      <text x="102" y="60" font-size="8" fill="#6b7280">Bucket 1</text>
      
      <text x="200" y="30" font-size="10" fill="#6b7280">...</text>
      
      <!-- Two bucket choices -->
      <text x="0" y="85" font-size="11" fill="#374151">Insert item → 2 choices:</text>
      <rect x="0" y="93" width="100" height="25" fill="#fff" stroke="#ec4899" rx="4"/>
      <text x="50" y="110" font-size="10" text-anchor="middle">i₁ = hash(x)</text>
      
      <rect x="110" y="93" width="130" height="25" fill="#fff" stroke="#ec4899" rx="4"/>
      <text x="175" y="110" font-size="10" text-anchor="middle">i₂ = i₁ ⊕ hash(fp)</text>
      
      <text x="0" y="140" font-size="10" fill="#374151">If both full → cuckoo eviction!</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(500, 505)">
      <text x="0" y="0" font-size="11" fill="#374151" font-weight="bold">Properties:</text>
      <text x="0" y="18" font-size="10" fill="#059669">✓ Supports deletion</text>
      <text x="0" y="33" font-size="10" fill="#059669">✓ Faster lookup (2 buckets vs k hashes)</text>
      <text x="0" y="48" font-size="10" fill="#6b7280">Space: Better than Bloom at FP &lt;3%</text>
      <text x="0" y="63" font-size="10" fill="#6b7280">Load factor: ~95%</text>
    </g>
  </g>
</svg>