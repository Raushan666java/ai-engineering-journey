<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Predicates and Quantifiers</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Th: says: there is some $x$ satisfying $P$, and any $y$ satisfying $P$</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">must equal...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Universal quantifier: → Existential quantifier: → Common translation</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">errors: → Theorem 3.1 (Quantifier Negation). → Important: → Example</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">over integers:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;All cats are mammals&quot;: $\forall x\;(\text{Cat}(x)</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">\rightarrow \text{Mammal}(x))$ → &quot;Some cats are black&quot;:</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\exists x\;(\text{Cat}(x) \land \text{Black}(x))$ → &quot;No cats are</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">fish&quot;: $\forall x\;(\text{Cat}(x) \rightarrow</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">\neg\text{Fish}(x))$ or $\neg\exists x\;(\text{Cat}(x) \land</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Fish}(x))$ → &quot;Not all cats are black&quot;: $\neg\forall</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">x\;(\text{Cat}(x) \rightarrow \text{Black}(x))$ or $\exists</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">x\;(\text{Cat}(x) \land \neg\text{Black}(x))$ → &quot;Every student</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">has a computer&quot;: $\forall x\;(\text{Student}(x) \rightarrow</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">\exists y\;(\text{Computer}(y) \land \text{Owns}(x, y)))$ → $\forall</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">x\;(\text{Cat}(x) \land \text{Black}(x))$ means &quot;everything is a</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">black cat&quot; ? wrong! → $\exists x\;(\text{Cat}(x) \rightarrow</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Black}(x))$ is trivially true if any non-cat exists ? wrong! →</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\forall x\; \exists y\; (y = x + 1)$: TRUE ? for each $x$, choose $y</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">= x + 1$.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">truth set: \{x \in D \mid P(x)\} | Theorem 3.1 (Quantifier Negation).:</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\neg \forall x\; P(x) \equiv \exists x\; \neg P(x) | Theorem 3.1</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Quantifier Negation).: \neg \exists x\; P(x) \equiv \forall x\; \neg</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(x) | 4: \neg \forall x\; \exists y\; P(x,y) \equiv \exists x\; \neg</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\exists y\; P(x,y) \equiv \exists x\; \forall y\; \neg P(x,y) | 5:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\neg \forall x\; \exists y\; \forall z\; P(x,y,z) \equiv \exists x\;</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\forall y\; \exists z\; \neg P(x,y,z) | 6: \exists!x\; P(x) \equiv</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\exists x\; (P(x) \land \forall y\; (P(y) \rightarrow y = x))</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Evaluation of nested quantifiers over finite domains.; Theorem 3.3</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Quantifier Negation).;...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Predicates and Quantifiers</text>
</svg>