<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <style>
    .node { fill:#f6f8fa; stroke:#2c3e50; stroke-width:2px; }
    .edge { stroke:#95a5a6; stroke-width:2px; marker-end: url(#arrow); }
    .label { font-family: Arial, sans-serif; font-size:12px; fill:#2c3e50; }
    .pq { fill:#dff0d8; stroke:#3c763d; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#95a5a6" />
    </marker>
  </defs>
  <!-- Graph nodes -->
  <g transform="translate(40,20)">
    <circle class="node" cx="40" cy="40" r="20" />
    <text class="label" x="40" y="45" text-anchor="middle">S</text>

    <circle class="node" cx="180" cy="20" r="20" />
    <text class="label" x="180" y="25" text-anchor="middle">A</text>

    <circle class="node" cx="180" cy="80" r="20" />
    <text class="label" x="180" y="85" text-anchor="middle">B</text>

    <circle class="node" cx="320" cy="20" r="20" />
    <text class="label" x="320" y="25" text-anchor="middle">C</text>

    <circle class="node" cx="320" cy="80" r="20" />
    <text class="label" x="320" y="85" text-anchor="middle">D</text>

    <circle class="node" cx="460" cy="50" r="20" />
    <text class="label" x="460" y="55" text-anchor="middle">T</text>

    <!-- edges -->
    <line class="edge" x1="60" y1="40" x2="160" y2="20" />
    <text class="label" x="110" y="28">1</text>

    <line class="edge" x1="60" y1="40" x2="160" y2="80" />
    <text class="label" x="110" y="68">4</text>

    <line class="edge" x1="200" y1="20" x2="300" y2="20" />
    <text class="label" x="250" y="12">2</text>

    <line class="edge" x1="200" y1="80" x2="300" y2="80" />
    <text class="label" x="250" y="72">1</text>

    <line class="edge" x1="340" y1="20" x2="440" y2="50" />
    <text class="label" x="390" y="35">3</text>

    <line class="edge" x1="340" y1="80" x2="440" y2="50" />
    <text class="label" x="390" y="65">1</text>

    <!-- Priority queue box -->
    <rect class="pq" x="40" y="140" width="240" height="60" rx="6" />
    <text class="label" x="60" y="160">Priority Queue (vertex, dist)</text>
    <text class="label" x="60" y="178">(S,0) (A,1) (B,4) ...</text>
  </g>
</svg>