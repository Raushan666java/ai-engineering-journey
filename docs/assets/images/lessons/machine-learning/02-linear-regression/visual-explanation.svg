<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Linear Regression</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Goal: Find $w_0$ and $w_1$ that minimize the sum of squared residuals</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">between...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Goal → Conditions for invertibility → Gradient Descent Variants →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Standardization (Z-score) → Min-Max Normalization → Why scaling</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">matters</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$y$ is the predicted output (dependent variable) → $x$ is the input</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">feature (independent variable) → $w_0$ is the y-intercept (bias term)</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ $w_1$ is the slope (weight term) → $\epsilon$ is the random error</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">term, assumed $\sim \mathcal{N}(0, \sigma^2)$ → $\mathbf{y} \in</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbb{R}^n$ is the vector of target values → $\mathbf{X} \in</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbb{R}^{n \times (d+1)}$ is the design matrix (first column all 1s</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">for bias) → $\mathbf{w} \in \mathbb{R}^{d+1}$ is the parameter vector</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: y = w_0 + w_1 x + \epsilon | 2: J(w_0, w_1) = \frac{1}{2n}</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{i=1}^{n} (\hat{y}^{(i)} - y^{(i)})^2 = \frac{1}{2n}</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{i=1}^{n} (w_0 + w_1 x^{(i)} - y^{(i)})^2 | 3: w_1 =</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\sum_{i=1}^{n} (x^{(i)} - \bar{x})(y^{(i)} -</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\bar{y})}{\sum_{i=1}^{n} (x^{(i)} - \bar{x})^2} = \frac{\text{Cov}(x,</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">y)}{\text{Var}(x)} | 4: w_0 = \bar{y} - w_1 \bar{x} | 5: \mathbf{y} =</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{X}\mathbf{w} + \boldsymbol{\epsilon} | 6: J(\mathbf{w}) =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1}{2n} (\mathbf{X}\mathbf{w} - \mathbf{y})^T</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">(\mathbf{X}\mathbf{w} - \mathbf{y})</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: LinearRegression Class in TypeScript:  Expected Output:</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">Demonstrates normal equation vs. gradient descent,...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway:</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Linear Regression</text>
</svg>