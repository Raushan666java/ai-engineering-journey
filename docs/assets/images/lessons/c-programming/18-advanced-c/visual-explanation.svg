    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Real-World Analogy: → Why header guards matter: → Pattern 1 →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Traditional `#ifndef` guard (most portable): → Pattern 2 → `#pragma</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">once` (shorter, compiler-specific but widely supported): → Comparison:</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Pattern → one definition, multiple declarations:</text>
