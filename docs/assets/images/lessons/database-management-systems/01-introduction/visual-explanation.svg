    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Real-World Analogy: The Library Catalog → A Database Management System</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">(DBMS) → Key Functions of a DBMS: → Numbered Steps: How a DBMS</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Processes a Query → Pseudocode: Simple Database Engine → Dry Run</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Trace: Query Execution</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Data Definition â†’ CREATE, ALTER, DROP schema objects → Data</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Manipulation â†’ SELECT, INSERT, UPDATE, DELETE data → Data Security</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">&amp; Integrity â†’ enforce constraints and access controls →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Transaction Management â†’ ACID properties (Atomicity, Consistency,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Isolation, Durability) → Concurrency Control â†’ serialize</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">simultaneous user access → Recovery Management â†’ restore state after</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">system crash or media failure → Data Dictionary Management â†’ store</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">metadata about database objects → User submits a query (e.g., SELECT *</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">FROM students WHERE gpa &gt; 3.5)</text>
