    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Th: guarantees a point where the instantaneous rate equals the average</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">rate.</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Informal Definition: → Formal ($\epsilon$-$\delta$) Definition: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sided Limits: → Limit Laws: → Special Limits: → Continuity:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Right-hand: $\lim_{x \to a^+} f(x)$ ? approach from values greater</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">than $a$ → Left-hand: $\lim_{x \to a^-} f(x)$ ? approach from values</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">less than $a$ → The two-sided limit exists iff both one-sided limits</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">exist and are equal. → $\lim_{x \to a} [f(x) \pm g(x)] = L \pm M$ →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\lim_{x \to a} [f(x) \cdot g(x)] = L \cdot M$ → $\lim_{x \to a}</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">[f(x)/g(x)] = L/M$ (provided $M \neq 0$) → $\lim_{x \to a} [c \cdot</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">f(x)] = c \cdot L$ → $\lim_{x \to a} [f(x)]^n = L^n$</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">L&apos;H?pital&apos;s Rule:: \lim_{x \to a} \frac{f(x)}{g(x)} =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\lim_{x \to a} \frac{f&apos;(x)}{g&apos;(x)} | Definition:: f&apos;(x)</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">= \frac{df}{dx} = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h} | 3:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">f&apos;(c) = \frac{f(b) - f(a)}{b - a} | Definite Integral (Riemann</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sum):: \int_a^b f(x)\,dx = \lim_{n \to \infty} \sum_{i=1}^{n} f(x_i^*)</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\Delta x | Linearity of Integration:: \int [c_1 f(x) + c_2 g(x)]\,dx =</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">c_1 \int f(x)\,dx + c_2 \int g(x)\,dx | Substitution</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">(u-substitution):: \int f(g(x))g&apos;(x)\,dx = \int f(u)\,du</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
