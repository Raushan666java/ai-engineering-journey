    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">For banking professionals</tspan>: Always lead with customer need analysis before product recommendation — trust...</text>
