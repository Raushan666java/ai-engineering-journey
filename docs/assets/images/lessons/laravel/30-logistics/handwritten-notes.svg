  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chapter 30: Logistics &amp; Supply</text>
    <text x="60" y="122" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chain Agents</text>
    <line x1="55" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Safety Stock Simulation</tspan>: Extend `InventoryPredictionAgent` to run 10,000 Monte Carlo simulations of...</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">`InventoryPredictionAgent` to run 10,000</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Monte Carlo simulations of...</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Multi-Warehouse Route Optimization</tspan>: Modify `RouteOptimizationAgent` to support multiple origin warehouses. The...</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Modify `RouteOptimizationAgent` to</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">support multiple origin warehouses.</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">The...</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Carrier API Adapter Pattern</tspan>: Build a `CarrierApiAdapter` interface and implement adapters for FedEx, UPS,...</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">`CarrierApiAdapter` interface and</text>
    <text x="60" y="410" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">implement adapters for FedEx, UPS,...</text>
    <text x="60" y="432" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Supplier Negotiation Letter Generator</tspan>: Extend `SupplierEvaluationAgent` to generate a personalized negotiation letter...</text>
    <text x="60" y="454" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Extend `SupplierEvaluationAgent` to</text>
    <text x="60" y="476" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">generate a personalized negotiation</text>
    <text x="60" y="498" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">letter...</text>
    <text x="60" y="528" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="556" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1: table-&gt;foreignId(&apos;order_id&apos;)-&gt;constrained()-&gt;cascadeOnDelete();</text>
    <text x="60" y="578" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2: table-&gt;foreignId(&apos;carrier_id&apos;)-&gt;nullable()-&gt;constrained(&apos;suppliers&apos;);</text>
    <text x="60" y="600" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: table-&gt;string(&apos;destination_address&apos;);</text>
    <text x="60" y="630" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="658" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. &gt;where(&apos;estimated_delivery&apos;, &apos;&lt;&apos;, now())</text>
    <text x="60" y="680" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. &gt;whereNotIn(&apos;status&apos;, [&apos;delivered&apos;, &apos;cancelled&apos;]);</text>
    <text x="60" y="702" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. &gt;virtualAs(&apos;quantity_on_hand - quantity_reserved&apos;);</text>
    <text x="60" y="724" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. &gt;where(&apos;expiry_date&apos;, &apos;&lt;&apos;, $date);</text>
    <line x1="55" y1="748" x2="560" y2="748" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="768" font-size="12" font-style="italic" fill="#64748b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Data models; Inventory prediction agents; Route optimization agents</text>
