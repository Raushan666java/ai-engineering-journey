    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Planning: Decomposing a complex task into sub-steps, selecting</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">actions, and ordering operations. Planning can be single-step (the</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">model generates one  → Memory: Retaining information across</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">interactions. Short-term memory is the context window; long-term</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">memory uses external storage (vector databases,  → Tool Use:</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Interfacing with external systems — APIs, databases, search engines,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">file systems, calculators, code interpreters. Tools extend the</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">agent&apos;s  → Self-Reflection: Evaluating the quality of generated</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">actions and outcomes. The agent can critique its own reasoning, detect</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">errors, and adjust its app → Autonomy: The agent operates without</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">continuous human intervention, deciding when to ask for help and when</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">to proceed independently. → Thought: The model analyzes the current</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">state, identifies what information is needed, and decides what to do</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">next. → Action: The model invokes a tool with specific parameters. The</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">action is formatted as a structured command (e.g., JSON function</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">call). → Observation: The tool returns a result, which is appended to</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">the context.</text>
