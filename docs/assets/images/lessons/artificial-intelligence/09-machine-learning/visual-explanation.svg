    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Supervised Learning: The agent learns a function from input-output</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">pairs (labels provided). → Unsupervised Learning: The agent learns</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">patterns in the data without explicit labels (e.g., clustering). →</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Reinforcement Learning: The agent learns by interacting with an</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">environment and receiving rewards or penalties.</text>
