    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Circuit Breaker States: → Sliding Window Types:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">CLOSED: Normal operation; requests pass through. Failures are counted</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">based on the sliding window. → OPEN: Failures exceed threshold;</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">requests fail immediately without calling the backend. → HALF_OPEN:</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">After the wait duration, a limited number of trial requests are</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">allowed to test if the backend has recovered. → Count-based: Slides</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">over the last N calls → Time-based: Slides over the last N seconds →</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">SemaphoreBulkhead: Uses Java semaphores; limits concurrent calls in</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">the same thread → ThreadPoolBulkhead: Uses a thread pool; isolates</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">calls in separate threads</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
