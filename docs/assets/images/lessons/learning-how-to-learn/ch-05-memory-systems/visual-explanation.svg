<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Memory Systems &amp; Mnemonics</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">calibration: too easy and you learn nothing durable; too hard and you</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">learn nothing at all....</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway: → Answer: → How to build a memory palace in 5</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">steps: → Why it works: → Example — Remembering the 5 great extinctions</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">in order: → Java example — MemoryPalace class:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Build and navigate a memory palace to store and recall ordered</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">information → Apply visual mnemonics to encode abstract concepts as</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">vivid, retrievable images → Use the chaining system to remember</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">sequences of arbitrary items → Implement the peg system for numbered</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">recall (bones of the arm, first 10 elements, etc.) → Leverage encoding</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">specificity by creating retrieval cues at encoding time → Distinguish</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">state-dependent, context-dependent, and mood-dependent memory effects</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Apply the generation effect to convert passive review into active</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">learning → Use the testing effect (retrieval practice) to strengthen</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">long-term retention</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Memory palaces (method of loci); Visual mnemonics, chaining, and peg</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">systems; Encoding specificity...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Memory Systems &amp; Mnemonics</text>
</svg>