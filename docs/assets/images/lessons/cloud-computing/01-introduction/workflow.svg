    </filter>
    <filter id="shadowLg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e2e8f0"/>
    </pattern>
    <pattern id="lineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#gBg)"/>
  <rect width="800" height="600" fill="url(#lineGrid)" opacity="0.35"/>
  <!-- Title -->
  <text x="400" y="40" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Introduction to Cloud Computing</text>
  <rect x="375" y="50" width="50" height="3" rx="1.5" fill="#2563eb"/>
  <!-- Step 1: Agility and Speed: Provision resources in minutes instead of weeks. Development teams can spin up test environments instantly and experiment without p -->
    <rect x="5" y="100" width="130" height="80" rx="40" fill="url(#gBlue)" filter="url(#shadowMd)"/>
  <circle cx="70" cy="126" r="15" fill="#ffffff" opacity="0.25"/>
      <text x="70" y="131" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">1</text>
  <text x="70" y="160" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Agility and Speed:...</text>
  <!-- Arrow 1 → 2 -->
    <line x1="139" y1="140" x2="166" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 1 -->
    <rect x="9" y="202" width="122" height="128" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="9" y="202" width="122" height="128" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="19" y1="212" x2="121" y2="212" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="70" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Agility and Speed:</text>
  <text x="70" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Provision resources in</text>
  <text x="70" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">minutes instead of</text>
  <text x="70" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">weeks. Development teams</text>
  <text x="70" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">can spin up test</text>
  <text x="70" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">environments instantly</text>
  <text x="70" y="322" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">and experiment without p</text>
  <rect x="170" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="235" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="235" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="235" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">2</text>
  <text x="235" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Elasticity: Match...</text>
  <!-- Arrow 2 → 3 -->
    <line x1="304" y1="140" x2="331" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 2 -->
    <rect x="174" y="202" width="122" height="128" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="174" y="202" width="122" height="128" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="184" y1="212" x2="286" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="235" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Elasticity: Match</text>
  <text x="235" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">capacity to demand in</text>
  <text x="235" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">real time. No more</text>
  <text x="235" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">over-provisioning for</text>
  <text x="235" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">peak load or</text>
  <text x="235" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">under-provisioning and</text>
  <text x="235" y="322" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">losing revenue.</text>
  <rect x="335" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="400" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="400" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="400" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">3</text>
  <text x="400" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Cost Efficiency:...</text>
  <!-- Arrow 3 → 4 -->
    <line x1="469" y1="140" x2="496" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 3 -->
    <rect x="339" y="202" width="122" height="96" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="339" y="202" width="122" height="96" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="349" y1="212" x2="451" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="400" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Cost Efficiency: Convert</text>
  <text x="400" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">fixed costs to variable</text>
  <text x="400" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">costs. Pay only for what</text>
  <text x="400" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">you use, when you use</text>
  <text x="400" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">it.</text>
  <rect x="500" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
  <circle cx="565" cy="126" r="15" fill="#2563eb" opacity="0.1"/>
      <circle cx="565" cy="126" r="15" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
      <text x="565" y="131" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  <text x="565" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Global Scale: Deploy...</text>
  <!-- Arrow 4 → 5 -->
    <line x1="634" y1="140" x2="661" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 4 -->
    <rect x="504" y="202" width="122" height="112" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="504" y="202" width="122" height="112" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="514" y1="212" x2="616" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="565" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Global Scale: Deploy</text>
  <text x="565" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">applications in data</text>
  <text x="565" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">centers around the world</text>
  <text x="565" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">with a few clicks. Reach</text>
  <text x="565" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">users wherever they are</text>
  <text x="565" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">with low latency.</text>
  <rect x="665" y="100" width="130" height="80" rx="40" fill="url(#gGreen)" filter="url(#shadowMd)"/>
  <circle cx="730" cy="126" r="15" fill="#ffffff" opacity="0.25"/>
      <text x="730" y="131" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">5</text>
  <text x="730" y="160" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Innovation Access:...</text>
  <!-- Description for step 5 -->
    <rect x="669" y="202" width="122" height="128" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
    <rect x="669" y="202" width="122" height="128" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="679" y1="212" x2="781" y2="212" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="730" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Innovation Access:</text>
  <text x="730" y="242" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Leverage advanced</text>
  <text x="730" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">services (AI/ML, big</text>
  <text x="730" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">data, IoT, serverless)</text>
  <text x="730" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">that would be</text>
  <text x="730" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">prohibitively expensive</text>
  <text x="730" y="322" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">to build on-premises.</text>
</svg>