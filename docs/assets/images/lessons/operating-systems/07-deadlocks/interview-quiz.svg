  <text x="55" y="338" font-size="10" fill="#475569" font-family="Arial, sans-serif">C. c) Process priority</text>
  <text x="55" y="352" font-size="10" fill="#475569" font-family="Arial, sans-serif">D. d) CPU utilization</text>
      <text x="45" y="378" font-size="10" fill="#059669" font-family="Arial, sans-serif">✓ </text>
