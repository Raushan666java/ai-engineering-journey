<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Additional MCQs (GFG</text>
    <text x="56" y="110" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Pattern)</text>
    <line x1="56" y1="138" x2="544" y2="138" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="158" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  In Red-Black tree deletion,</text>
    <text x="56" y="178" font-size="13" fill="#333" font-family="Arial, sans-serif">    the &quot;double-black&quot;</text>
    <text x="56" y="198" font-size="13" fill="#333" font-family="Arial, sans-serif">    concept arises when:</text>
    <text x="56" y="218" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Which of the following trees</text>
    <text x="56" y="238" font-size="13" fill="#333" font-family="Arial, sans-serif">    is also a valid Red-Black</text>
    <text x="56" y="258" font-size="13" fill="#333" font-family="Arial, sans-serif">    tree?</text>
    <text x="56" y="278" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  The transformation between a</text>
    <text x="56" y="298" font-size="13" fill="#333" font-family="Arial, sans-serif">    Red-Black tree and a 2-3-4</text>
    <text x="56" y="318" font-size="13" fill="#333" font-family="Arial, sans-serif">    tree maps:</text>
    <text x="56" y="338" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Why do Java&apos;s TreeMap</text>
    <text x="56" y="358" font-size="13" fill="#333" font-family="Arial, sans-serif">    and C++&apos;s std::map use</text>
    <text x="56" y="378" font-size="13" fill="#333" font-family="Arial, sans-serif">    Red-Black trees instead...</text>
    <line x1="56" y1="384" x2="544" y2="384" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="404" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">In Red-Black tree</text>
    <text x="56" y="420" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">deletion, the</text>
    <text x="56" y="436" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">&quot;double-black&quot;</text>
    <text x="56" y="452" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">concept arises...</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>