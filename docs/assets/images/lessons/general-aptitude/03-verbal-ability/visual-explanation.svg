  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Subject-Verb Agreement:  Question: The committee ___</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">(has/have) submitted its report. Answer: has....</text>
