    <line x1="634" y1="140" x2="661" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Description for step 5 -->
    <rect x="504" y="202" width="122" height="48" rx="6" fill="#ffffff" filter="url(#shadowSm)"/>
