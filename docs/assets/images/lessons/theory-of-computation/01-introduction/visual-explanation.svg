    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define the basic mathematical objects: alphabets, strings, languages,</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">problems. → Explain the Chomsky hierarchy and the four levels of</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">formal languages. → Distinguish between decision problems,</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">optimization problems, and function problems. → Understand the</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">difference between a problem being decidable vs. merely recognizable.</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Relate automata theory, computability theory, and complexity theory</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">to real computing. → Automata Theory — finite and infinite-state</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">machines that model computation. Covers DFA, NFA, PDA, Turing</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">machines, and their language classes. → Computability Theory — what</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">can and cannot be computed. Explores the halting problem, reductions,</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">and the limits of algorithmic solvability. → Complexity Theory — how</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">efficiently problems can be solved. Studies time and space bounds, the</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">P vs NP question, and classification of problems by dif</text>
