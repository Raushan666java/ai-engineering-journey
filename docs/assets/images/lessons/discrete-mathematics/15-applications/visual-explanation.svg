    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">flow network: a directed graph $G = (V,E)$ with a source $s$ and sink</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">$t$, where each edge...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 15.1 (Max-Flow Min-Cut Theorem). → Ford-Fulkerson algorithm: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 15.2 (Hall&apos;s Marriage Theorem). → Theorem 15.3</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">(K?nig&apos;s theorem). → Theorem 15.4 (Four Color Theorem). → Theorem</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">15.5 (Greedy coloring bound).</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Capacity constraint: $0 \leq f(u,v) \leq c(u,v)$. → Flow conservation:</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\sum_v f(u,v) - \sum_v f(v,u) = 0$ for all $u \neq s, t$. → Net flow</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">into sink = net flow out of source. → Map coloring: Four colors</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">suffice for any planar map. → Register allocation: Graph coloring</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">assigns variables to CPU registers. → Scheduling: Coloring conflicts</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">(edges) in a graph of time slots. → Frequency assignment: Avoid</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">interference in radio/cell networks. → $Q$ is a finite set of states.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 15.6 (Hamming bound).: M \cdot \sum_{i=0}^{\lfloor (d-1)/2</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\rfloor} \binom{n}{i} \leq 2^n | flow network: G = (V,E) | source:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">c(u,v) \geq 0 | capacity: f: V \times V \rightarrow \mathbb{R} |</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">Capacity constraint:: 0 \leq f(u,v) \leq c(u,v) |  $0 \leq f(u,v) \leq</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">c(u,v)$.
2. : \sum_v f(u,v) - \sum_v f(v,u) = 0</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Discrete mathematics provides the foundation for virtually all of</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">computer science.
- Network...</text>
