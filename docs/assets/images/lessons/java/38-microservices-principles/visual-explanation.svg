    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Core DDD Building Blocks: → Database-per-service</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Value Object: An immutable object that describes attributes with no</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">conceptual identity (e.g., `Money`, `Address`) → Entity: An object</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">defined by its identity, not its attributes (e.g., `Order` with</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">orderId) → Aggregate: A cluster of entities and value objects treated</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">as a single unit, with one aggregate root → Domain Event: Something</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">meaningful that happened in the domain, captured for side effects →</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">Repository: A collection-like abstraction for retrieving and</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">persisting aggregates → Factory: Encapsulates complex creation logic</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">for aggregates and value objects → By Business Capability: Map each</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">business capability (e.g., Order Management, Inventory, Shipping) to a</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">separate service → By Subdomain: Use DDD subdomains (core, supporting,</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">generic) to identify service boundaries</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
