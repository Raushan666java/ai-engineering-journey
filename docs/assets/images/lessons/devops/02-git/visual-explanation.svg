  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">(parent) content += `parent | 4: {Date.now()} +0000\n`;
    content</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">+= `committer Dev Ops &lt;devops@example.com&gt; | 5: {message}\n`;</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">const hash = this.hashContent(&apos;commit&apos;, content);</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">this.objects.set(hash, { t | 6: {this.commits.size + 1}`;
    const</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">parent = this.HEAD;
    const c: Commit = { hash, message, par</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Git Internal Object Inspection:</text>
  <line x1="500" y1="580" x2="500" y2="590" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="605" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="605" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="627" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="647" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Git&apos;s object model consists of blobs (file content), trees</text>
  <text x="85" y="665" font-size="11" fill="#475569" font-family="Arial, sans-serif">(directory listings), commits...</text>
