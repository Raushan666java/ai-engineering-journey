<text x="440" y="277" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">temperature · tokens</text>
<rect x="320" y="308" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
