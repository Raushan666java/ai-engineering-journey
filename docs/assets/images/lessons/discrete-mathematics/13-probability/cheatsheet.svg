  <text x="315" y="150" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif"> $P(A \cap B) = P(A \mid B) \cdot P(B) = P(B \mid A) \cdot P(A)$.

:</text>
    <text x="315" y="163" font-size="9" fill="#475569" font-family="Arial, sans-serif">P(A_1 \cap A_2 \cap \dots \cap...</text>
  <text x="315" y="178" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">mutually independent:</text>
