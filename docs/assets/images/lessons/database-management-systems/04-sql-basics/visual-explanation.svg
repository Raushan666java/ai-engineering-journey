    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">VARCHAR(n): Stores only the actual string plus 2 bytes overhead.</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Efficient for variable-length data like names, titles. → CHAR(n):</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Always stores n characters, padded with spaces. Use for fixed-length</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">codes: ISBN, ZIP codes, state abbreviations. → Specify the table name</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">(e.g., `books`) → Define each column with name, data type, and</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">optional constraints → Optionally define table-level constraints</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(composite PK, multi-column CHECK) → The DBMS allocates metadata</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">structures for the new table → Specify the table to modify → Choose</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">the modification type: ADD, DROP, MODIFY, or RENAME</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
