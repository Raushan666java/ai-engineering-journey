    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Preference pair generation. For a set of prompts, sample two or more</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">responses from the model. A judge (human for RLHF, LLM for RLAIF)</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">labels which re → Reward model training. Train a separate reward model</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">(often parameterized as a classifier) on the preference pairs using a</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bradley-Terry or Plackett-L → Policy optimization. Use Proximal Policy</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Optimization (PPO) or REINFORCE to update the language model,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">maximizing expected reward while constraining K → Sample reasoning</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">traces from the model for each question. → Filter traces that lead to</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">correct answers. → Fine-tune the model on the filtered traces. →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Repeat. Incorrect questions get a hint (the correct answer) and the</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">model re-generates reasoning around it. → Grow step: Sample multiple</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">outputs per prompt from the current model.</text>
