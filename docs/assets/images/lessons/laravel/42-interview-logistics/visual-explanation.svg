  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Part IX: Interview Preparation → Perpetual inventory → Key components:</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Pessimistic Locking with Queue Serialization: → Redis-based</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Inventory Counter for Hot Products: → Additional patterns:</text>
