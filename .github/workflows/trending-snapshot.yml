name: Daily Trending Snapshot

on:
  schedule:
    # daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet --upgrade pip

      - name: Fetch trending data
        run: python scripts/fetch_trending.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/assets/data/trending-snapshot.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (if changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/trending-snapshot.json
          git commit -m "chore(trending): auto-update daily snapshot [skip ci]"
          git push
