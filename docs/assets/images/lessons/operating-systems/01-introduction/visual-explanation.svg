  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Tracing System Calls with strace:  The `strace` tool on</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">Linux shows every system call a program makes: Even a...</text>
