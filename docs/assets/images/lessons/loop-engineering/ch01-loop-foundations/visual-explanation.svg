  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Open-loop control → Closed-loop control → Negative feedback → Positive</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">feedback → Key insight for agents: → Gain Margin</text>
