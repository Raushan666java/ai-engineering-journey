<text x="120" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERVIEW ANGLE</text><text x="212" y="644" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">Every MLOps interview starts with "walk me through the lifecycle" — this diagram is that walk.</text>
