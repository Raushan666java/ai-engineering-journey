<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 11: Reinforcement Learning</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">reward hypothesis: any goal can be framed as maximizing cumulative</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">reward.</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Why this matters across every domain: → Initial: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Iteration 1: → Iteration 2: → Iteration 3:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Describe the reinforcement learning framework and its core components</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">(agent, environment, policy, value function). → Formulate sequential</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">decision problems as Markov Decision Processes (MDPs) and solve them</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">via dynamic programming. → Distinguish model-based RL (value</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">iteration, policy iteration) from model-free RL (Q-learning, SARSA). →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement Q-learning and SARSA with tabular representations for small</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">state spaces. → Understand deep RL architectures including DQN,</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">experience replay, and target networks. → Explain policy gradient</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">methods and the actor-critic architecture used in PPO. → The agent</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">observes the environment&apos;s state $S_t \in \mathcal{S}$. → It</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">selects an action $A_t \in \mathcal{A}$.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">cumulative discounted reward: G_t = \sum_{k=0}^{\infty} \gamma^k</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">R_{t+k+1} | Markov property: P(S_{t+1} \mid S_t, A_t, S_{t-1},</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">A_{t-1}, \dots) = P(S_{t+1} \mid S_t, A_t) | 3: V_\pi(s) = \sum_{a}</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\pi(a \mid s) \left[ R(s, a) + \gamma \sum_{s&apos;} P(s&apos; \mid s,</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">a) V_\pi(s&apos;) \right] | 4: Q_\pi(s, a) = R(s, a) + \gamma</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{s&apos;} P(s&apos; \mid s, a) \sum_{a&apos;} \pi(a&apos; \mid</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">s&apos;) Q_\pi(s&apos;, a&apos;) | 5: V^*(s) = \max_{a} \left[ R(s, a)</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">+ \gamma \sum_{s&apos;} P(s&apos; \mid s, a) V^*(s&apos;) \right] | 6:</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q^*(s, a) = R(s, a) + \gamma \sum_{s&apos;} P(s&apos; \mid s, a)</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">\max_{a&apos;} Q^*(s&apos;, a&apos;)</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Reinforcement learning enables agents to learn optimal sequential</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">decisions through interaction...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 11: Reinforcement Learning</text>
</svg>