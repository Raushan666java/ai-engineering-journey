    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">spanning tree: a subgraph \( T = (V, E&apos;) \) that is a tree</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">(connected and acyclic). A minimum...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Definition 12.1. → Key properties of any spanning tree: → One-Sentence</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Takeaway: → Theorem 12.1 (Cut Property). → Proof. → Theorem 12.2</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Cycle Property).</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Contains exactly \(|V| - 1\) edges. → There is exactly one path</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">between any two vertices. → Adding any edge creates exactly one cycle.</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Removing any edge disconnects the tree. → Sort all edges by weight</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">in non-decreasing order. → Initialize an empty MST set \( T \) and a</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">disjoint-set union (DSU) with each vertex as its own component. →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Iterate through sorted edges: → If `find(u) != find(v)` (the edge</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">connects two different components), add `(u,v)` to \( T \) and call</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">`union(u,v)`.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#1e40af"/>
