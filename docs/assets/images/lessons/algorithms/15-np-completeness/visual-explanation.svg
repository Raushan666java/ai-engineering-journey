    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">If \( A \le_p B \) and \( B \in P \), then \( A \in P \). → If \( A</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">\le_p B \) and \( A \) is NP-hard, then \( B \) is NP-hard. →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Reductions are transitive: \( A \le_p B \) and \( B \le_p C \) implies</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">\( A \le_p C \). → SAT is in NP: Given a satisfying assignment (the</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">certificate), evaluate each clause in O(number of clauses) time.</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Verification is clearly polynomial. → SAT is NP-hard: For any NP</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">language \( L \), there exists a nondeterministic Turing machine \( M</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">\) and a polynomial \( p(n) \) such that \( M \) deci → Initial</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">configuration: Encodes the starting tape contents, head position, and</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">state as Boolean variables. → Transition function: Encodes the</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">NTM&apos;s transition relation as clauses — for each time step, the</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">next configuration follows from the current one. → Acceptance</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">condition: At least one time step shows the machine in an accepting</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">state.</text>
