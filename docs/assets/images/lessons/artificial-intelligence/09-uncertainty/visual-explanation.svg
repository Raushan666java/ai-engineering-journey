<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Reasoning Under Uncertainty</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Explaining away: the most counterintuitive BN concept: two independent</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">causes become dependent...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Real-World Analogy — Diagnosing Disease from Symptoms: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bayes&apos; rule → Input: → Output: → Scenario:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Prior knowledge: Flu is common in winter (~10% of patients). COVID-19</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">is less common but present (~2%). → Evidence: Fever + cough are</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">*likely* given flu (80%), but also possible with COVID (70%) and cold</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">(30%). → Posterior judgment: Given the symptoms, flu becomes most</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">probable (say 65%), COVID next (20%), cold (10%), other (5%). →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">$P(\omega) \geq 0$ for all $\omega \in \Omega$. → $P(\Omega) = 1$. →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">For countable disjoint events $E_1, E_2, \ldots$: $P(\bigcup_i E_i) =</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_i P(E_i)$. → Prior: 60% of all emails are spam $\to$ $P(Spam) =</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">0.6$ → Likelihood: 90% of spam contains &quot;FREE&quot;, only 5% of</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">ham does $\to$ $P(\text{FREE} \mid Spam) = 0.9$, $P(\text{FREE} \mid</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">Ham) = 0.05$</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: P(A \mid B) = \frac{P(A \land B)}{P(B)}, \quad P(B) &gt; 0 |</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bayes&apos; rule: P(A \mid B) = \frac{P(B \mid A) \, P(A)}{P(B)} |</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">posterior: P(H \mid E) = \frac{P(E \mid H) \, P(H)}{P(E)} | 4: P(A</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\land B \mid C) = P(A \mid C) P(B \mid C) | 5: P(X_1, X_2, \ldots,</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">X_n) = \prod_{i=1}^n P(X_i \mid \text{Parents}(X_i)) | 6: P(B, E, A,</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">J, M) = P(B) P(E) P(A \mid B, E) P(J \mid A) P(M \mid A)</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master the core concepts covered in this chapter</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: Reasoning Under Uncertainty</text>
</svg>