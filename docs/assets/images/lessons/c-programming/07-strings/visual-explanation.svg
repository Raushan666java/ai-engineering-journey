    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">string: a sequence of characters terminated by a null character</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">(`&apos;\0&apos;`, ASCII value...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Memory layout of `greeting`: → Output: → Step 1: → Step 2: → Step 3: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Step 4:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Distinguish between string literals and character arrays → Manipulate</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">strings using the `string.h` library functions with full awareness of</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">bounds and null-termination → Read and write strings safely using</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`fgets`, `snprintf`, and bounded functions → Process strings character</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">by character using pointer arithmetic and array indexing → Understand</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">null-termination, buffer overflow risks, and reentrancy concerns →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Convert between strings and numeric types safely → Recognize</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">real-world applications of string processing in systems programming →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">Self-documenting - Readers know the function won&apos;t modify the</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">string.</text>
