    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">For exams</tspan>: Remember the five SERVQUAL dimensions (RATER: Reliability, Assurance,...</text>
