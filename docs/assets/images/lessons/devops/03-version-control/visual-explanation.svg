    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Collaboration: Multiple developers can work on the same codebase</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">without overwriting each other&apos;s work. → History: Every change is</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">logged with who made it, when, and why. → Branching: Experiment with</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">new features without affecting the stable codebase. → Recovery: Revert</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">to any previous state if something breaks. → Audit trail: Know exactly</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">what code is running in production and how it got there. → A single</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">central server stores all versioned files → Clients check out files</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">from the central repository → Most operations require network access</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">to the server</text>
