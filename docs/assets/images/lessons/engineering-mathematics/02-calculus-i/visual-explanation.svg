  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Limits describe function behavior near points; continuity ensures no</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">gaps
- Derivatives measure...</text>
