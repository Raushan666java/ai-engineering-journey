name: ai-ml-course-secure
channels:
  - conda-forge
  - defaults
  - pytorch
dependencies:
  # Python version (Updated)
  - python=3.11
  
  # Core scientific computing (Security Updates)
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
  
  # Visualization (Updated)
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.15.0
  - bokeh>=3.2.0
  
  # Machine Learning (Security Patches)
  - scikit-learn>=1.3.0
  - xgboost>=1.7.0
  - lightgbm>=4.0.0
  
  # Deep Learning (Critical Updates)
  - tensorflow>=2.15.0
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  
  # Jupyter environment
  - jupyter>=1.0.0
  - jupyterlab>=3.2.0
  - ipywidgets>=7.6.0
  
  # Development tools
  - git
  - pip
  - setuptools
  - wheel
  
