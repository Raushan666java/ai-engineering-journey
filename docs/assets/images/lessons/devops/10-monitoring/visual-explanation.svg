  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">SLI (Service Level Indicator): A quantitative measure of some aspect</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">of the level of service that is provided (e.g., Latency, Throughput).</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ SLO (Service Level Objective): A target value or range of values for</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">a service level that is measured by an SLI (e.g., &quot;99.9% of</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">requests must finish  → SLA (Service Level Agreement): A legal</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">contract between a service provider and a customer that includes</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">consequences (usually financial) if SLOs are n → Latency: The time it</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">takes to service a request. Distinguish between successful requests</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">and failed requests—a failing service might return errors ver →</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">Traffic: A measure of how much demand is being placed on the system</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">(requests per second, active users, throughput). → Errors: The rate of</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">requests that fail explicitly (5xx) or implicitly (success with wrong</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">content, slow responses). → Saturation: How &quot;full&quot; your</text>
  <text x="85" y="586" font-size="11" fill="#475569" font-family="Arial, sans-serif">service is (CPU usage, memory utilization, queue depth). The most</text>
  <text x="85" y="604" font-size="11" fill="#475569" font-family="Arial, sans-serif">overloaded component determines the system&apos;s saturation  → Budget</text>
  <text x="85" y="622" font-size="11" fill="#475569" font-family="Arial, sans-serif">is consumed by events that violate the SLO</text>
