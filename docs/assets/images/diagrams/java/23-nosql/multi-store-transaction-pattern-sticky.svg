    <text x="56" y="198" font-size="13" fill="#333" font-family="Arial, sans-serif">    partial failures...</text>
    <text x="56" y="218" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  The saga pattern (covered</text>
    <text x="56" y="238" font-size="13" fill="#333" font-family="Arial, sans-serif">    further in the transactions</text>
    <text x="56" y="258" font-size="13" fill="#333" font-family="Arial, sans-serif">    chapter) or...</text>
    <text x="56" y="278" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Save to MongoDB (source of</text>
    <text x="56" y="298" font-size="13" fill="#333" font-family="Arial, sans-serif">    truth) Product saved =...</text>
    <line x1="56" y1="330" x2="544" y2="330" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="350" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">A service that spans</text>
    <text x="56" y="366" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">multiple stores must</text>
    <text x="56" y="382" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">handle partial...</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
