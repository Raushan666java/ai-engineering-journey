name: Unified Day 41-52 Tests

on:
  push:
    paths:
      - 'practice/dsa/**'
  pull_request:
    paths:
      - 'practice/dsa/**'

jobs:
  test-all-days:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build and run tests
      run: |
        mvn -B -DskipTests=false test

  integration:
    name: Integration tests (Day-52 task-manager)
    runs-on: ubuntu-latest
    needs: test-all-days
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Day-52 integration tests
        run: |
          mvn -pl practice/dsa/Day-52/task-manager -am -DskipTests=false test

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-reports
        path: target/surefire-reports || target/failsafe-reports || target/surefire-reports/*.xml
