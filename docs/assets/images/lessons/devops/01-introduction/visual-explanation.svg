    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Waterfall (1970s-1990s): → Agile (2000s-present): → DevOps</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">(2010s-present): → The First Way: Flow/Systems Thinking → The Second</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Way: Amplify Feedback Loops → The Third Way: Culture of Continuous</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Experimentation and Learning</text>
