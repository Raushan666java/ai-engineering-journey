  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Physical Independence: The chef can replace the old gas stove with an</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">induction cooktop. The waiters...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
