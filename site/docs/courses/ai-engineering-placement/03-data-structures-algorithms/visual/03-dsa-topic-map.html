<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Structures &amp; Algorithms · Topic map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-paper-2: #f5f6f8;
      --color-ink:     #1a1b23;
      --color-muted:   #4f5d75;
      --color-accent:  #2e8555;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Module 03 · Data Structures &amp; Algorithms</p>
    <h1>DSA topic map · What interviews actually test</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m03-tree-title m03-tree-desc">
      <title id="m03-tree-title">Data structures and algorithms topic map</title>
      <desc id="m03-tree-desc">Tree rooted at complexity analysis with five branches: arrays and strings, hash maps and linked lists, stacks and queues, trees and graphs, and dynamic programming.</desc>

      <rect width="1000" height="560" fill="#ffffff"/>

      <!-- Connectors drawn before nodes -->
      <line x1="500" y1="140" x2="500" y2="176" stroke="#4f5d75" stroke-width="1"/>
      <line x1="140" y1="176" x2="860" y2="176" stroke="#4f5d75" stroke-width="1"/>
      <line x1="140" y1="176" x2="140" y2="220" stroke="#4f5d75" stroke-width="1"/>
      <line x1="320" y1="176" x2="320" y2="220" stroke="#4f5d75" stroke-width="1"/>
      <line x1="500" y1="176" x2="500" y2="220" stroke="#4f5d75" stroke-width="1"/>
      <line x1="680" y1="176" x2="680" y2="220" stroke="#4f5d75" stroke-width="1"/>
      <line x1="860" y1="176" x2="860" y2="220" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root node (FOCAL) -->
      <rect x="380" y="88" width="240" height="52" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="500" y="112" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Complexity analysis</text>
      <text x="500" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Big-O · space · time</text>

      <!-- Child 1 — Arrays & strings -->
      <rect x="64" y="220" width="152" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="140" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Arrays &amp; strings</text>
      <text x="140" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sliding window · 2 ptrs</text>

      <!-- Child 2 — Hash & linked -->
      <rect x="244" y="220" width="152" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="320" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Hash maps &amp; lists</text>
      <text x="320" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lookup · linking</text>

      <!-- Child 3 — Stacks & queues -->
      <rect x="424" y="220" width="152" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="500" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Stacks &amp; queues</text>
      <text x="500" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LIFO · FIFO</text>

      <!-- Child 4 — Trees & graphs -->
      <rect x="604" y="220" width="152" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="680" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Trees &amp; graphs</text>
      <text x="680" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BST · BFS · DFS</text>

      <!-- Child 5 — Dynamic programming -->
      <rect x="784" y="220" width="152" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="860" y="242" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Dynamic programming</text>
      <text x="860" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1D · 2D · memoization</text>

      <!-- Caption -->
      <text x="120" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERVIEW ANGLE</text>
      <text x="212" y="356" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">Arrays, hash maps, and trees appear in almost every phone screen; DP decides the on-site outcome.</text>

      <!-- Legend strip -->
      <line x1="120" y1="400" x2="880" y2="400" stroke="rgba(26,27,35,0.10)" stroke-width="1"/>
      <text x="120" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="196" y="416" width="16" height="12" rx="2" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="220" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACCENT = START HERE</text>
      <rect x="376" y="416" width="16" height="12" rx="2" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="400" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAPER = TOPIC AREA</text>
    </svg>
  </div>
</body>
</html>
