<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 14: Robotics</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">robot: a physically embodied agent that perceives its environment</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">through sensors and...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Real-world analogy: → Scenario: → Observation: → Why O(n²)</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">for Kalman? → Key takeaway:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Sense: Read raw sensor data (camera image, LIDAR scan, IMU reading). →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Process: Filter noise, extract features, estimate state (pose,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">velocity). → Plan: Decide what action to take (path to follow, joint</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">to move). → Act: Send commands to actuators (motor PWM, gripper</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">close). → Repeat: Loop back to Sense, typically at 10–1000 Hz. →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">INITIALIZE robot state s = (x, y, theta, velocity) → INITIALIZE</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">control parameters (PID gains, planning horizon) → while RUNNING do</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: u(t) = K_p e(t) + K_i \int_0^t e(\tau) d\tau + K_d \frac{de(t)}{dt}</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 2: u_{t:t+H}^* = \arg\min_u \sum_{k=t}^{t+H} \left( \|x_k -</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">x_k^{\text{ref}}\|_Q + \|u_k\|_R \right) | 3: \text{subject to }</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">x_{k+1} = f(x_k, u_k), \quad x_k \in \mathcal{X}, \quad u_k \in</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathcal{U} | 4: K = P_t^- H^T (H P_t^- H^T + R)^{-1} | 5: x_t = x_t^-</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">+ K (z_t - H x_t^-) | 6: P_t = (I - K H) P_t^-</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Architecture:; Sensors:; Actuators:</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 14: Robotics</text>
</svg>