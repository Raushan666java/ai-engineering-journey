<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git &amp; Linux CLI · Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-paper-2: #f5f6f8;
      --color-ink:     #1a1b23;
      --color-muted:   #4f5d75;
      --color-accent:  #2e8555;
      --font-sans:     system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Module 04 · Git &amp; Linux CLI</p>
    <h1>Git workflow · The lifecycle of a change</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m04-flow-title m04-flow-desc">
      <title id="m04-flow-title">Git branch workflow lifecycle</title>
      <desc id="m04-flow-desc">Flowchart of a git change lifecycle: create a branch, stage files, commit, push, open a pull request, and on review approval merge to the main branch.</desc>

      <rect width="1000" height="600" fill="#ffffff"/>

      <!-- Arrows first -->
      <path d="M 500 148 V 180" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 500 228 V 260" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 500 308 V 340" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 500 388 V 420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 500 468 V 500" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <!-- Start -->
      <rect x="440" y="104" width="120" height="44" rx="20" fill="#f5f6f8" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="130" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Branch</text>

      <!-- Stage -->
      <rect x="404" y="180" width="192" height="48" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="500" y="202" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">git add</text>
      <text x="500" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stage files</text>

      <!-- Commit (FOCAL) -->
      <rect x="404" y="260" width="192" height="48" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="500" y="282" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">git commit</text>
      <text x="500" y="298" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">snapshot</text>

      <!-- Push -->
      <rect x="404" y="340" width="192" height="48" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="500" y="362" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">git push</text>
      <text x="500" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">to remote</text>

      <!-- Pull request -->
      <rect x="404" y="420" width="192" height="48" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="500" y="442" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Pull request</text>
      <text x="500" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">review</text>

      <!-- Merge (end-ish, decision block) -->
      <rect x="392" y="500" width="216" height="48" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="500" y="522" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Approved?</text>
      <text x="500" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">merge to main</text>

      <!-- Side note: Linux/CLI -->
      <rect x="720" y="260" width="216" height="72" rx="6" fill="rgba(26,27,35,0.02)" stroke="rgba(26,27,35,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="828" y="286" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Linux &amp; CLI</text>
      <text x="828" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ssh · bash · cron</text>
      <text x="828" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the shell around git</text>

      <!-- Caption -->
      <text x="120" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL STEP</text>
      <text x="212" y="160" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">The commit is the snapshot unit — every interview question about git resolves back to it.</text>

      <!-- Legend strip -->
      <line x1="120" y1="584" x2="880" y2="584" stroke="rgba(26,27,35,0.10)" stroke-width="1"/>
      <text x="120" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="196" y="564" width="16" height="12" rx="2" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
      <text x="220" y="574" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACCENT = CORE</text>
      <rect x="336" y="564" width="16" height="12" rx="2" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
      <text x="360" y="574" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAPER = STEP</text>
      <rect x="464" y="564" width="16" height="12" rx="2" fill="rgba(26,27,35,0.02)" stroke="rgba(26,27,35,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="488" y="574" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DASHED = CONTEXT</text>
    </svg>
  </div>
</body>
</html>
