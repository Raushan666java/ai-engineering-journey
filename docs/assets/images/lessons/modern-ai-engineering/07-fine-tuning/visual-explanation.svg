<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 7: Fine-Tuning</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Domain specialization: The base model lacks knowledge of specialized</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">terminology, code syntax, legal...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">How it works → Requirements → Catastrophic forgetting → Compute needs</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">comparison → LoRA (Low-Rank Adaptation) → QLoRA</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Domain specialization: The base model lacks knowledge of specialized</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">terminology, code syntax, legal language, medical knowledge, or</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">proprietary APIs. → Format adherence: The model cannot reliably</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">produce structured output (JSON, XML, markdown tables) even with</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">detailed prompting. → Style and tone control: The application demands</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">a consistent voice — customer support should always be polite and</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">empathetic, technical docs should be → Latency or cost reduction: A</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">smaller fine-tuned model can match or exceed a larger general</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">model&apos;s performance, reducing inference cost and latency. →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Multi-task instruction following: The model struggles with complex</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">multi-step instructions or tasks that require chaining reasoning and</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">action. → Computation: For a 7B parameter model, full fine-tuning</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">requires 4–8 A100 GPUs (80 GB each) with gradient checkpointing, mixed</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">precision (bf16/fp16),  → Memory: Each parameter consumes at least 2</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">bytes (bf16) plus optimizer states (8 bytes per parameter with AdamW).</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">A 7B model may need 70–140 GB of GPU → Data: At least 1000–10,000</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">high-quality examples. More data is generally better, but data quality</text>
  <text x="85" y="678" font-size="11" fill="#475569" font-family="Arial, sans-serif">matters more than quantity.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Code Example 1: mermaid</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Fine-tuning adapts pre-trained foundation models to specialized tasks</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">when prompting and RAG are...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 7: Fine-Tuning</text>
</svg>