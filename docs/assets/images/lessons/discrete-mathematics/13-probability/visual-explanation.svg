<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 13: Probability</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">coupon collector problem: There are $n$ distinct coupons. Each</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">purchase yields a uniformly random coupon....</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Operations on events: → Kolmogorov&apos;s axioms: → Theorem 13.1</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Basic rules). → Multiplication rule: → Generalized multiplication</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">rule: → Theorem 13.2 (Independence of complements).</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">$E \cup F$: at least one occurs. → $E \cap F$: both occur. → $E&apos;$</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">(or $\overline{E}$): $E$ does not occur. → $E$ and $F$ are mutually</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">exclusive (disjoint) if $E \cap F = \emptyset$. → $0 \leq P(E) \leq 1$</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">for any event $E$. → $P(S) = 1$. → If $E_1, E_2, \dots$ are pairwise</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">disjoint, then $P(\bigcup_i E_i) = \sum_i P(E_i)$ (countable</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">additivity). → $P(\emptyset) = 0$.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">event: P(E) = \frac{|E|}{|S|} | conditional probability: P(A \mid B) =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{P(A \cap B)}{P(B)} |  $P(A \cap B) = P(A \mid B) \cdot P(B) =</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(B \mid A) \cdot P(A)$.

: P(A_1 \cap A_2 \cap \dots \cap A_n) =</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(A_1) \cdot P(A_2 \mid A_1) \cdot P(A_3 \mid A_1 \cap A_2) \cdots</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(A_n \mid A_1 \cap \dots \cap A_{n-1}) | mutually independent:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(A_{i_1} \cap \dots \cap A_{i_k}) = P(A_{i_1}) \cdots P(A_{i_k}) |</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">Bayes&apos; theorem:: P(H \mid E) = \frac{P(E \mid H) \cdot</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(H)}{P(E)} | 6: P(H_j \mid E) = \frac{P(E \mid H_j) \cdot</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(H_j)}{\sum_{i=1}^n P(E \mid H_i) \cdot P(H_i)}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Probability measures likelihood from 0 to 1; all rules derive from</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">Kolmogorov&apos;s axioms.
-...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 13: Probability</text>
</svg>