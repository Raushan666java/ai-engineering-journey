  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Components: → Instruction reference: → Minimal TypeScript Dockerfile:</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Key commands: → Volume types: → Network drivers:</text>
