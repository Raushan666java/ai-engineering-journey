    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Topic Weightage: → Select the related word from the given</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">alternatives: → Cigarette : Tobacco :: Bidi : ? → Answer: →</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Explanation: → Key Takeaway:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;123&quot; = &quot;hot cup of tea&quot;, &quot;356&quot; =</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;coffee is hot&quot;, &quot;259&quot; = &quot;tea is bitter&quot;</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Common in 1st and 2nd: &quot;hot&quot; = digit 3 → Common in 2nd and</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">3rd: &quot;is&quot; = digit 5 → Common in 1st and 3rd: &quot;tea&quot;</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">= digit 2 → In &quot;356&quot;: 3=&quot;hot&quot;, 5=&quot;is&quot;,</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">remaining 6 = &quot;coffee&quot; → A and B are siblings</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(brother-sister). C is daughter of A. → D is father of E. B is sister</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">of D, so B and D are siblings. → A (brother of B) is also sibling of</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">D.</text>
