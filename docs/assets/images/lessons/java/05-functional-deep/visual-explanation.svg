    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Functional Programming in Practice</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Monadic Parser Combinator: Implement a minimal parser combinator</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">library using `Parser&lt;T&gt;` as a monad....</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Prerequisite: → C) flatMap flattens nested streams into a single</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">stream; map transforms each element. → A) Merges two collectors into</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">one by branching a stream and combining their results. → B) Sealed</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">classes combined with switch expressions. → A) or() accepts a</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">Supplier&amp;lt;Optional&amp;gt; for fallback Optional chaining. →</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">Advanced Stream Operations</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Apply advanced stream operations including `mapMulti`, custom</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">`distinctBy`, `zip`, and `Stream.iterate` with predicates → Design</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">custom `Collector` implementations using all five components of the</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Collector` interface → Recognize and construct monad patterns with</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Optional`, `CompletableFuture`, and custom monad-like types including</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Validation` → Use specialized functional interfaces (`IntFunction`,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">`LongBinaryOperator`, etc.) and compose functions at higher arities →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Build composed function pipelines using `andThen`, `compose`, partial</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">application, and currying → Apply lazy evaluation effectively with</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Supplier`, custom `Lazy&lt;T&gt;`, and infinite streams → Design</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">immutable data carriers using records, withers, unmodifiable</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">collections, and defensive copying → Write exhaustive pattern matching</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">with switch expressions, record patterns, guarded patterns, and sealed</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">classes</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: &quot;)
                ? Validation.valid(value)</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">: Validation.invalid(&quot;Invalid email f | 2: %.2f%n&quot;, total),</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">failure -&gt; System.out.printf(&quot;Error: %s - %s%n&quot;,</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">fail | 3: &quot; + String.format(&quot;%.2f&quot;,</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">price.price()) + &quot;\n\n&quot;);</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Advanced Stream Operations; Custom Collectors; Monad Patterns</text>
