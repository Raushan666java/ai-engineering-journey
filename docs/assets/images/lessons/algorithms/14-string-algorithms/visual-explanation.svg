    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement and analyze KMP, Rabin-Karp, and Z-algorithm for pattern</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">matching. → Use Manacher&apos;s algorithm to find all palindromic</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">substrings in linear time. → Construct a suffix array and LCP array in</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">\( O(n \log n) \) time. → Apply suffix arrays to solve substring</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">queries, pattern matching, and string analysis. → Implement the</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Aho-Corasick automaton for multi-pattern matching. → Analyze</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">trade-offs between string algorithms and choose the right one for a</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">given problem. → Search engines — Google indexes trillions of web</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">pages using suffix structures → Bioinformatics — Finding a gene in the</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">human genome is a pattern-matching problem on a string of length 3.2</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">billion</text>
