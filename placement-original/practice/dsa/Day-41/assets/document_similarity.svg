<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#eef2ff; stroke:#4c51bf; stroke-width:2px; }
    .text { font-family: Arial, sans-serif; font-size:12px; fill:#2d3748 }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="40" y="30" width="200" height="60" class="box" rx="6" />
  <text x="140" y="62" text-anchor="middle" class="text title">Client/API Gateway</text>
  <rect x="280" y="30" width="220" height="80" class="box" rx="6" />
  <text x="390" y="60" text-anchor="middle" class="text title">Document Service</text>
  <rect x="280" y="120" width="220" height="60" class="box" rx="6" />
  <text x="390" y="152" text-anchor="middle" class="text title">Worker Pool (Embeddings)</text>
  <rect x="540" y="30" width="200" height="60" class="box" rx="6" />
  <text x="640" y="62" text-anchor="middle" class="text title">FAISS / Vector Index</text>
  <rect x="540" y="120" width="200" height="60" class="box" rx="6" />
  <text x="640" y="152" text-anchor="middle" class="text title">Postgres / Metadata</text>
  <line x1="240" y1="60" x2="280" y2="60" stroke="#4c51bf" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="60" x2="540" y2="60" stroke="#4c51bf" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#4c51bf" />
    </marker>
  </defs>
  <text x="40" y="420" class="text">Notes: Use async workers to compute document embeddings and maintain vector index for fast similarity queries.</text>
</svg>