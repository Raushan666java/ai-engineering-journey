  <text x="400" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">User([&apos;name&apos;</text>
  <text x="400" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">=&gt;</text>
  <text x="400" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">&apos;John&apos;]))</text>
  <rect x="500" y="100" width="130" height="80" rx="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadowSm)"/>
