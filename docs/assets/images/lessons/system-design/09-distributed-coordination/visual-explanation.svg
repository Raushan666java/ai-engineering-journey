    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">ZooKeeper / Etcd / Consul: Dedicated, highly-available coordination</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">services → Eureka (Netflix): AP-oriented registry (prioritizes</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">availability over consistency) → Kubernetes Services: DNS-based</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">registry built into the platform → Discovery: A newly elected leader</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">finds the latest epoch (term) and the latest accepted proposals from a</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">quorum of followers. → Synchronization: The leader ensures all</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">followers have the same state by transmitting any missing proposals. →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Broadcast: The leader processes client requests, assigns a</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">monotonically increasing ZooKeeper transaction ID (zxid), and</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">broadcasts them to followers. → Persistent: Exists until explicitly</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">deleted → Ephemeral: Deleted automatically when the session that</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">created it ends (client disconnect)</text>
