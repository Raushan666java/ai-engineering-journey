  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">HTML5 elements to convey content meaning, not just visual presentation</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Structure text content using headings, paragraphs, lists,</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">quotations, and code blocks → Create hyperlinks with absolute,</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">relative, and fragment targets while controlling navigation behavior</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">with `rel` attributes → Embed images, video, and audio with fallback</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">mechanisms and responsive resolution switching via the `picture`</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">element → Build complex data tables with header, body, footer sections</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">and merged cells → Design accessible forms covering every major input</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">type with labels, grouping, and server-ready submission</text>
