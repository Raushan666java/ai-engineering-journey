    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Rule 1 --- At Least One User-Defined Operand → Rule 2 --- Fixed</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Precedence and Associativity → Rule 3 --- Fixed Arity → Rule 4 --- No</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">New Operators → Rule 5 --- Some Operators Are Off-Limits → Output:</text>
