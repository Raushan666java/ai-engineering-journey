<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 6: Support Vector Machines</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">dual form: $$\max_{\alpha} \sum_{i=1}^{n} \alpha_i - \frac{1}{2}</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{i=1}^{n}...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Why maximum margin? → Functional margin → Geometric margin → Key</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">insight → The C parameter → Linear Kernel</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Larger margins correlate with better generalization (lower VC</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">dimension) → The maximum margin hyperplane is unique (unlike</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">perceptron solutions) → Margin maximization reduces the hypothesis</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">space, acting as a form of regularization → If $\alpha_i = 0$, the</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">constraint is inactive ? the point does not affect the model → If</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\alpha_i &gt; 0$ (support vector), the point lies exactly on the</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">margin boundary: $y^{(i)}(\mathbf{w}^T\mathbf{x}^{(i)} + b) = 1$ →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Large C: High penalty for violations ? narrow margin, few support</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">vectors, may overfit → Small C: Low penalty for violations ? wide</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">margin, many support vectors, may underfit → Small $\gamma$: Each</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">point influences a large region ? smoother boundary (high bias)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Functional margin: \hat{\gamma}^{(i)} =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">y^{(i)}(\mathbf{w}^T\mathbf{x}^{(i)} + b) | Geometric margin:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\gamma^{(i)} = \frac{y^{(i)}(\mathbf{w}^T\mathbf{x}^{(i)} +</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">b)}{\|\mathbf{w}\|} = \frac{\hat{\gamma}^{(i)}}{\|\mathbf{w}\|} | 3:</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\min_{\mathbf{w}, b} \frac{1}{2}\|\mathbf{w}\|^2 | 4:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">y^{(i)}(\mathbf{w}^T\mathbf{x}^{(i)} + b) \geq 1, \quad i = 1, \dots,</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">n | 5: \mathcal{L}(\mathbf{w}, b, \alpha) =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1}{2}\|\mathbf{w}\|^2 - \sum_{i=1}^{n} \alpha_i</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">\left[y^{(i)}(\mathbf{w}^T\mathbf{x}^{(i)} + b) - 1\right] | 6:</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\partial \mathcal{L}}{\partial \mathbf{w}} = 0 \implies</text>
  <text x="85" y="657" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{w} = \sum_{i=1}^{n} \alpha_i y^{(i)} \mathbf{x}^{(i)}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: SVM with Hinge Loss + Gradient Descent:</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway:</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 6: Support Vector Machines</text>
</svg>