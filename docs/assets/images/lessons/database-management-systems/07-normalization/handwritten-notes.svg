    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Chapter 7: Normalization in</text>
    <text x="60" y="122" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Database Management Systems</text>
    <line x1="55" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Normalization</tspan>: a systematic, theory-backed process of decomposing tables to eliminate these...</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">theory-backed process of decomposing</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">tables to eliminate these...</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">This</tspan>: exactly the problem unnormalized databases face.</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">databases face.</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Th</tspan>: single table stores all information about students, courses, instructors, and...</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">about students, courses, instructors,</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">and...</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">It</tspan>: not optional â€” it is a foundational discipline of relational database design.</text>
    <text x="60" y="410" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">foundational discipline of relational</text>
    <text x="60" y="432" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">database design.</text>
