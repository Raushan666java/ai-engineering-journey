  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Entropy: H(S) = -\sum_{i=1}^{c} p_i \log_2 p_i | Information Gain:</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">IG(S, A) = H(S) - \sum_{v \in Values(A)} \frac{|S_v|}{|S|} H(S_v) | 3:</text>
