    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Consistency (C): Every read receives the most recent write or an</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">error. All nodes see the same data at the same time. This is</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">*linearizability* — oper → Availability (A): Every request receives a</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">non-error response, without guarantee that it contains the most recent</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">write. The system continues to funct → Partition Tolerance (P): The</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">system continues to operate despite an arbitrary number of messages</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">being dropped or delayed between nodes (network parti → If the system</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">returns v0 from G2, it is available but not consistent (G1 has v1). →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">If the system refuses to return a value from G2 (blocks until</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">partition heals), it is consistent but not available. → The system</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">cannot be both consistent and available during a partition. → CAP is</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">about partitions. In the absence of partitions (the normal case), you</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">can have both C and A. The choice only matters when failures occur. →</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">CAP is not 2-out-of-3. You don&apos;t &quot;pick two&quot; at design</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">time. You design for consistency or availability when partitions</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">happen. Most systems choose CP</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
