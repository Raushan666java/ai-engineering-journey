    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Culture: People and process first. Collaborative culture where</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">developers and operations work together toward shared goals.</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Psychological safety enabl → Automation: Removing manual toil and</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">human error. Automated testing, deployment pipelines, infrastructure</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">provisioning, and configuration management r → Lean: Eliminate waste</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">in the software delivery process. Apply Lean manufacturing principles:</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">reduce batch sizes, limit work in progress, amplify learn →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Measurement: Data-driven decision making. Everything should be</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">measured: deployment frequency, lead time, mean time to recover,</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">change failure rate. M → Sharing: Open feedback loops and shared</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">responsibility. Blameless postmortems, cross-functional teams, and</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">transparency create a learning organization → Partially done work —</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">Code not deployed, specifications not implemented → Extra processes —</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">Unnecessary approvals, paperwork, handoffs → Extra features —</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">Gold-plating, building what wasn&apos;t requested</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
