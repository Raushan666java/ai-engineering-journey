    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">`&lt;header&gt;` → Introductory content, navigation links, branding,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">or heading group for a page or section. → `&lt;nav&gt;` → A block of</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">navigation links. Documents may contain multiple `&lt;nav&gt;`</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">elements (e.g., primary nav, table of contents, breadcrumbs). →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">`&lt;main&gt;` → The dominant content of the `&lt;body&gt;`. A</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">document must have exactly one `&lt;main&gt;` element, visible and not</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">hidden via `display: none` or `ari → `&lt;section&gt;` → A thematic</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">grouping of content, typically introduced with a heading. Not a</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">generic container; use `&lt;div&gt;` when no semantic relationship  →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">`&lt;article&gt;` → A self-contained composition that is independently</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">distributable or reusable (forum post, news story, blog entry,</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">comment). → `&lt;aside&gt;` → Content tangentially related to the</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">surrounding content, such as sidebars, pull quotes, or advertising. →</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">`&lt;footer&gt;` → Footer for its nearest ancestor sectioning content;</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">typically contains author info, copyright, or related links.</text>
