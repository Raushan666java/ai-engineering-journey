site_name: "Raushan's AI Engineering Journey"
site_url: https://raushan666java.github.io/study/
site_author: Raushan Kumar
site_description: "Laravel to AI Automation Engineer in 3 Months — Python, DSA, LangChain, RAG, Agents, Multi-Agent Systems, n8n Automation, System Design, DevOps, Placement Prep. Daily learning journal with 500+ DSA problems and 10+ projects."

repo_name: Raushan666java/ai-engineering-journey
repo_url: https://github.com/Raushan666java/ai-engineering-journey
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - assets/css/blueprint.css

extra_javascript:
  - assets/js/noise.js
  - assets/js/blueprint.js
  - assets/js/study-timer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Raushan666java
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/raushan-kumar-477465250
  analytics:
    provider: google
    property: G-XXXXXXXXXX

