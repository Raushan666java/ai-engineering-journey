<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07_systev-title 07_systev-desc">
<title id="07_systev-title">System design — one request, the full ride</title>
<desc id="07_systev-desc">A client request flows through load balancer, API gateway, cache, services, database, queue and workers.</desc>
<rect width="1000" height="760" fill="#ffffff"/>
<path d="M 440 144 L 440 168" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 440 216 L 440 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 440 288 L 440 312" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 440 360 L 440 384" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 440 432 L 440 456" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="320" y="92" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="440" y="119" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Client</text>
<text x="440" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">browser · mobile</text>
<rect x="320" y="164" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="440" y="191" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Load balancer</text>
<text x="440" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">round-robin · sticky</text>
<rect x="320" y="236" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="440" y="263" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">API gateway</text>
<text x="440" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">auth · rate-limit</text>
<rect x="320" y="308" width="240" height="52" rx="6" fill="rgba(46,133,85,0.08)" stroke="#2e8555" stroke-width="1"/>
<text x="440" y="335" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Application services</text>
<text x="440" y="349" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stateless logic</text>
<rect x="320" y="380" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="440" y="407" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Cache · DB · Queue</text>
<text x="440" y="421" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">redis · postgres · kafka</text>
<rect x="320" y="452" width="240" height="52" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1"/>
<text x="440" y="479" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Background workers</text>
<text x="440" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">async jobs</text>
<rect x="720" y="140" width="216" height="64" rx="6" fill="#ffffff" stroke="#1a1b23" stroke-width="1" stroke-dasharray="4,3"/>
<text x="828" y="173" fill="#1a1b23" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Horizontal scaling</text>
<text x="828" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stateless = add nodes</text>
<path d="M 560 172 H 716" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="120" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERVIEW ANGLE</text><text x="212" y="644" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">Draw this skeleton first, then add the company flavour: auth, search, payments, analytics.</text>
