    <line x1="184" y1="212" x2="286" y2="212" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <text x="235" y="226" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">`tests/Feature/` → Tests</text>
