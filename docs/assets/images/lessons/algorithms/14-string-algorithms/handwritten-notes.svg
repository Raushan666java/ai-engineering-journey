    <text x="60" y="516" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Implement and analyze KMP, Rabin-Karp, and Z-algorithm for pattern...</text>
    <text x="60" y="538" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Use Manacher&apos;s algorithm to find all palindromic substrings in linear...</text>
    <text x="60" y="560" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Construct a suffix array and LCP array in \( O(n \log n) \) time.</text>
