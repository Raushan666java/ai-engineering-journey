    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Analogy: → Analogy: → Analogy: → Analogy: → Analogy:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Resource Allocation → Decide which process gets the CPU, how much</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">memory each process can use, and how disk and I/O devices are shared →</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">Control Program → Prevent user programs from making errors or using</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">the computer improperly → Kernel → The core component that remains in</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">memory and provides the most essential services (scheduling, memory</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">management, IPC) → System Interface → Provide APIs (system calls) that</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">applications use to request services without needing to know hardware</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">details → Bootloader corruption → If the bootloader&apos;s checksum</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">fails, the system cannot load the kernel. Solution: redundant boot</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">sectors or recovery partition. → Insufficient memory during kernel</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">load → If the kernel image exceeds available memory on embedded</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">devices, the system panics. Solution: compressed ker → Device</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">initialization failure → A faulty driver during init can hang the boot</text>
  <text x="85" y="586" font-size="11" fill="#475569" font-family="Arial, sans-serif">process. Solution: fallback to safe mode or minimal driver set. →</text>
  <text x="85" y="604" font-size="11" fill="#475569" font-family="Arial, sans-serif">Interrupt vector conflict → Two devices claiming the same IRQ (legacy</text>
  <text x="85" y="622" font-size="11" fill="#475569" font-family="Arial, sans-serif">systems). Solution: shared IRQ handling or IOAPIC re-routing.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
