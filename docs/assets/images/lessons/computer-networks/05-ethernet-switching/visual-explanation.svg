  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">networks. → Clock synchronization → The Preamble (7 bytes of 10101010)</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">trains the receiver&apos;s PLL (phase-locked loop) to the</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">sender&apos;s bit timing. → Frame start detection → The SFD (10101011)</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">marks the boundary; the two consecutive 1 bits at the end signal</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;next byte is the destination MAC.&quot;</text>
