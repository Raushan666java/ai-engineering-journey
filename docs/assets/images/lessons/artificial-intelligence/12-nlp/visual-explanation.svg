    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">WordNet: a lexical database organizing words into synsets (sets of</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">synonyms) with...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Analogy: → Analogy: → Algorithm Steps: → Pseudocode: → Dry</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Run Trace:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Collect a training corpus of text. → Count all n-gram occurrences</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">(contiguous sequences of n words). → For each (n-1)-gram prefix,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">compute conditional probability by dividing the n-gram count by the</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">prefix count. → Apply smoothing to assign non-zero probability to</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">unseen n-grams. → To generate text, sample from the conditional</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">distribution at each step. → Evaluate model quality using perplexity</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">on held-out test data. → Compute prior P(c) for each class: count(docs</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">with label c) / total_docs. → For each class c, compute P(w|c) =</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">(count(w in c) + 1) / (total words in c + V) — Laplace smoothing.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Case Study: Google Search BERT Integration:  &lt;a...</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Statistical era; Embedding era; Pre-training era</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 12: Natural Language Processing</text>
</svg>