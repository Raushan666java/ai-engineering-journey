    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Chunking: &quot;I chose semantic chunking over fixed-size because</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">customer tickets have variable-length context that fixed boundaries</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">would break.&quot; → Vector DB: &quot;I chose pgvector over a</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">dedicated vector DB because we already use Postgres for ticket</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">storage. Eliminating ChromaDB reduces operational c → Caching:</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;Three-tier cache: exact match (Redis, 5-min TTL), semantic</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">similarity (embedding comparison, 0.95 threshold), and KV cache for</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">streaming ses → Scaling: &quot;Read replicas for vector search,</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">primary for writes. Connection pooling with 20 base + 10 overflow per</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">worker.&quot; → Cost model: Build a spreadsheet or Python script that</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">estimates daily cost for a RAG system at 10K, 100K, and 1M</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">queries/day. Identify the top-3 cost  → Cache hit-rate analysis:</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">Instrument your RAG API to log cache hits and misses. Run for 24 hours</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">and report hit rates for prompt cache vs semantic cach → Multi-region</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">prototype: Deploy your RAG API to 2 regions (e.g., US and EU). Build a</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">multi-region search that queries both and merges results. → System</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">design mock: Set a 45-minute timer and design &quot;a multi-agent</text>
  <text x="85" y="678" font-size="11" fill="#475569" font-family="Arial, sans-serif">customer support system&quot; on paper or a whiteboard. Record your</text>
  <text x="85" y="696" font-size="11" fill="#475569" font-family="Arial, sans-serif">design decisions.</text>
