<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Scalability and Load Balancing</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: vertical and horizontal scaling strategies with appropriate use</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">cases</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Advantages: → Disadvantages: → Advantages: → Disadvantages: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Shared-Nothing Architecture. → L4 is faster but dumber.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">No code changes needed. The application remains a single process with</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">a single address space. → No network coordination overhead. All</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">communication is within the machine (CPU cache, memory bus, local</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">disk). → No consistency or distributed transaction problems. →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Licensing costs often scale linearly with hardware (for per-CPU</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">licenses, this can be cheaper than per-instance cloud costs). →</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Hardware ceiling. A single x86 server cannot exceed ~64 TB RAM</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">(current max) or ~448 CPU cores. There is no way to vertically scale</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">past the largest m → Cost super-linearity. High-end machines cost</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">exponentially more than commodity servers. A 2x machine rarely costs</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">2x — it costs 3-5x because of premiu → Single point of failure. If the</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">machine dies, the system is down. Redundancy requires moving to</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">horizontal scaling anyway. → Planned downtime. Upgrades require</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">reboots (RAM, CPU replacement). This violates availability SLAs.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: P(server_i) = 1 / \min(connections_1, connections_2, ...,</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">connections_n) | 2: server_index = hash(client\_IP) \bmod N | 3:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">server = \text{nearest clockwise server from } hash(key) | 4:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">P(server_i) = 1 / \min(connections_1, connections_2, ...,</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">connections_n) | 5: server_index = hash(client\_IP) \bmod N | 6:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">server = \text{nearest clockwise server from } hash(key)</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Designing Load Balancing for a Global E-Commerce Site:</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">Scenario: An e-commerce platform with users in North America, Europe,</text>
  <text x="85" y="618" font-size="11" fill="#475569" font-family="Arial, sans-serif">and...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Vertical scaling adds resources to one machine; horizontal scaling</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">adds more machines. Horizontal...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 2: Scalability and Load Balancing</text>
</svg>