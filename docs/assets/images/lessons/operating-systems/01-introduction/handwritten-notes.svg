    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Kernel mode</tspan>: Full access -- can execute any instruction, access any memory</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">any instruction, access any memory</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">operating system</tspan>: the building manager of a computer. It:</text>
