  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">JDBC, Connection Pooling &amp; JOOQ</text>
    <line x1="55" y1="128" x2="560" y2="128" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="152" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="180" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">JDBC Core</tspan>: `DriverManager` for basic connections. `PreparedStatement` prevents SQL...</text>
    <text x="60" y="202" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">connections. `PreparedStatement`</text>
    <text x="60" y="224" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">prevents SQL...</text>
    <text x="60" y="246" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">DataSource &amp; HikariCP: `DataSource`</text>
    <text x="60" y="268" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">is the preferred connection factory.</text>
    <text x="60" y="290" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">HikariCP is Spring Boot&apos;s...</text>
    <text x="60" y="312" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">JdbcTemplate</tspan>: Eliminates JDBC boilerplate. `query()` returns lists, `queryForObject()` single...</text>
    <text x="60" y="334" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">boilerplate. `query()` returns lists,</text>
    <text x="60" y="356" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">`queryForObject()` single...</text>
    <text x="60" y="378" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">NamedParameterJdbcTemplate</tspan>: Named parameters (`:param`) instead of positional (`?`)....</text>
    <text x="60" y="400" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">parameters (`:param`) instead of</text>
    <text x="60" y="422" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">positional (`?`)....</text>
    <text x="60" y="452" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="480" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1: // BEGIN // UPDATE accounts SET balance = balance - p_amount WHERE id = p_from_account; // UPDATE accounts SET balance = balance + p_amount WHERE id =</text>
    <text x="60" y="502" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2: // BEGIN // RETURN (SELECT SUM(quantity * unit_price) FROM order_items WHERE order_id = p_order_id); // END;</text>
    <text x="60" y="524" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: // BEGIN
    //     UPDATE accounts SET balance = balance - p_amount WHERE id = p_from_account;
  </text>
    <text x="60" y="554" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="582" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Establish database connections using DriverManager and DataSource</text>
    <text x="60" y="604" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Execute SQL queries with Statement, PreparedStatement, and...</text>
    <text x="60" y="626" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. Prevent SQL injection attacks using parameterized queries</text>
    <text x="60" y="648" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. Navigate result sets and extract metadata from queries and database...</text>
