<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Real-World Protocol</text>
    <text x="56" y="110" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Stack: Loading...</text>
    <line x1="56" y1="138" x2="544" y2="138" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="158" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  Trace of what happens when</text>
    <text x="56" y="178" font-size="13" fill="#333" font-family="Arial, sans-serif">    you visit</text>
    <text x="56" y="198" font-size="13" fill="#333" font-family="Arial, sans-serif">    `https://google.com`:</text>
    <text x="56" y="218" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  The Internet Engineering</text>
    <text x="56" y="238" font-size="13" fill="#333" font-family="Arial, sans-serif">    Task Force (IETF)</text>
    <text x="56" y="258" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  The Institute of Electrical</text>
    <text x="56" y="278" font-size="13" fill="#333" font-family="Arial, sans-serif">    and Electronics Engineers</text>
    <text x="56" y="298" font-size="13" fill="#333" font-family="Arial, sans-serif">    (IEEE)</text>
    <text x="56" y="318" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  The International</text>
    <text x="56" y="338" font-size="13" fill="#333" font-family="Arial, sans-serif">    Organization for</text>
    <text x="56" y="358" font-size="13" fill="#333" font-family="Arial, sans-serif">    Standardization (ISO)</text>
    <line x1="56" y1="364" x2="544" y2="364" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="384" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">Trace of what happens when</text>
    <text x="56" y="400" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">you visit</text>
    <text x="56" y="416" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">`https://google.com`:</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>