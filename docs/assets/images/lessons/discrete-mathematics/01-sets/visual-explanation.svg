    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: A = \{1, 2, 3, 4, 5\} | 2: B = \{x \mid x \in \mathbb{N},\; x</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{ is even},\; x \leq 20\} | subset: A \subseteq B \iff \forall</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">x\,(x \in A \implies x \in B) | power set: \mathcal{P}(S) = \{T \mid T</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\subseteq S\} | 5: A \times B = \{(a, b) \mid a \in A,\; b \in B\} |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">characteristic function: \chi_A(x) = \begin{cases} 1 &amp; \text{if }</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">x \in A \\ 0 &amp; \text{if } x \notin A \end{cases}</text>
