    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Maintain a single source repository. Every team member commits to the</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">same main branch frequently. → Automate the build. Scripts should</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">compile, package, and verify without manual intervention. → Make the</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">build self-testing. Automated tests should validate correctness after</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">every build. → Everyone commits to main every day. Short-lived</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">branches reduce integration complexity. → Keep the build fast.</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">Feedback in minutes, not hours. → Unit tests run on every commit</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">(pre-push hook) → Integration tests run after unit tests pass → E2E</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">tests run on merge to main or scheduled nightly</text>
