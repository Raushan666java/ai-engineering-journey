    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Pointer to the root tree object → Parent commit(s) → Author and</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">committer (name, email, timestamp) → Commit message →</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">`refs/heads/main` — Local branch pointer → `refs/remotes/origin/main`</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">— Remote tracking branch → `refs/tags/v1.0` — Tag pointer → `HEAD` —</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Current branch or commit</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
