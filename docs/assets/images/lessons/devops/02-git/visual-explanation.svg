  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {content}`;
    return</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">createHash(&apos;sha1&apos;).update(raw).digest(&apos;hex&apos;);
  }</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">createBlob(content:  | 2: {entry.name}\0 | 3: {tree}\n`;
