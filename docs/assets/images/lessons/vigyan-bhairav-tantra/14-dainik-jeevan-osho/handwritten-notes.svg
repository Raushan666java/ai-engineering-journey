  <!-- Content -->
    <text x="60" y="90" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">अध्याय १४: दैनिक जीवन में ध्यान:</text>
    <text x="60" y="122" font-size="22" font-weight="bold" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">ओशो की विधियाँ</text>
    <line x1="55" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="184" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">ओशो की विधि</tspan>: 1. धीमे चलो — अपनी सामान्य गति से आधी गति</text>
    <text x="60" y="234" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">गति से आधी गति</text>
    <text x="60" y="256" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">ओशो की सोने की विधि</tspan>: 1. पीठ के बल लेटो — हाथ-पैर ढीले</text>
    <text x="60" y="278" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">हाथ-पैर ढीले</text>
    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">प्रश्न १</tspan>: ओशो के अनुसार, आधुनिक मनुष्य के लिए पारंपरिक बैठकर ध्यान करना कठिन क्यों है?</text>
    <text x="60" y="322" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">के लिए पारंपरिक बैठकर ध्यान करना कठिन</text>
    <text x="60" y="344" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">क्यों है?</text>
    <text x="60" y="366" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">उत्तर</tspan>: ख) उसके भीतर बहुत दबी हुई ऊर्जा और तनाव है — &quot;पहले उसे उबलने दो, तब वह शांत हो...</text>
    <text x="60" y="388" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">और तनाव है — &quot;पहले उसे उबलने दो, तब</text>
    <text x="60" y="410" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">वह शांत हो...</text>
    <text x="60" y="440" font-size="15" font-weight="bold" fill="#dc2626" font-family="'Segoe Print', 'Comic Sans MS', cursive">Formulas</text>
    <text x="60" y="468" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1: {experience ? &apos;अनुभव: &apos; + experience : &apos;&apos;}`);
    }

    /**
     * ओशो का आज का मार्गदर्शन
     */
</text>
    <text x="60" y="490" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2: {plan.morningPractice.meditation.oshoQuote}&quot;\n\n`;

        if (plan.dayPractices.length &gt; 0) {
    </text>
    <text x="60" y="512" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3: {plan.eveningPractice.scheduledTime}\n`;
        schedule += `</text>
    <text x="60" y="542" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="570" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. ओशो की क्रांतिकारी शिक्षा को समझना — &quot;ध्यान कोई अलग क्रिया नहीं, जीने...</text>
    <text x="60" y="592" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. चलने, खाने, सोने — हर क्रिया को ध्यान में बदलने की विधि सीखना</text>
    <text x="60" y="614" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">3. ओशो की सक्रिय ध्यान विधियों (डायनामिक, कुंडलिनी, नादब्रह्म) का अभ्यास...</text>
    <text x="60" y="636" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">4. &quot;क्यों बैठकर ध्यान करना आधुनिक मनुष्य के लिए कठिन है&quot; — ओशो का निदान</text>
