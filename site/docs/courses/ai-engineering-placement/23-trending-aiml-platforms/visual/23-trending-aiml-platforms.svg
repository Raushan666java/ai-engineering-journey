<text x="140" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">hugging face · ollama · vllm</text>
<rect x="640" y="276" width="240" height="56" rx="6" fill="#f5f6f8" stroke="rgba(26,27,35,0.12)" stroke-width="1"/>
<text x="760" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pick by deployment</text>
<text x="120" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERVIEW ANGLE</text><text x="212" y="444" fill="#4f5d75" font-size="8" font-family="system-ui, sans-serif" font-style="italic">"Which platform would you use and why?" — have one clear answer per slot.</text>
