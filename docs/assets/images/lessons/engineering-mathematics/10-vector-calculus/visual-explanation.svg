    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Scalar Field: → Vector Field: → Gradient of Scalar Field: → Divergence</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">of Vector Field: → Curl of Vector Field: → Laplacian:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\int_{-C} \mathbf{F} \cdot d\mathbf{r} = -\int_C \mathbf{F} \cdot</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">d\mathbf{r}$ → $\int_{C_1 + C_2} = \int_{C_1} + \int_{C_2}$ → $\nabla</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">\times \mathbf{F} = 0$ (in simply connected domain) → $\oint_C</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{F} \cdot d\mathbf{r} = 0$ for any closed curve $C$ → Path</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">independence: $\int_{C_1} \mathbf{F} \cdot d\mathbf{r} = \int_{C_2}</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{F} \cdot d\mathbf{r}$ for any paths with same endpoints →</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\mathbf{F} = \nabla \phi$ for some $\phi$ → Continuity equation:</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\frac{\partial \rho}{\partial t} + \nabla \cdot (\rho\mathbf{v}) = 0$</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Navier-Stokes: $\rho\frac{D\mathbf{v}}{Dt} = -\nabla p +</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mu\nabla^2\mathbf{v} + \rho\mathbf{g}$</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
