<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 14: Number Theory</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">prime number: an integer $p \geq 2$ whose only positive divisors are</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">$1$ and $p$. A composite...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 14.1 (Properties of divisibility). → Theorem 14.2 (Division</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">algorithm). → Theorem 14.3 (GCD-LCM product). → Theorem 14.4 (GCD as</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">linear combination). → Theorem 14.5 (Euclidean algorithm). → Extended</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">Euclidean algorithm:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">If $a \mid b$ and $b \mid c$, then $a \mid c$ (transitivity). → If $a</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mid b$ and $a \mid c$, then $a \mid (b + c)$ and $a \mid (b - c)$. →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">If $a \mid b$, then $a \mid b \cdot c$ for any integer $c$. → If $a</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mid b$ and $b \neq 0$, then $|a| \leq |b|$. → $1$ divides every</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">integer; every integer divides $0$. → $a + c \equiv b + d \pmod{m}$. →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">$a - c \equiv b - d \pmod{m}$. → $a \cdot c \equiv b \cdot d</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">\pmod{m}$.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: a = q \cdot m + r,\quad 0 \leq r &amp;lt; m | Theorem 14.5</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Euclidean algorithm).: \gcd(a,b) = \gcd(b, a \bmod b) | 3: x \equiv</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">a_1 \pmod{m_1},\; x \equiv a_2 \pmod{m_2},\; \dots,\; x \equiv a_n</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\pmod{m_n} | 4: n = p_1^{e_1} \cdot p_2^{e_2} \cdots p_k^{e_k} |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Theorem 14.14 (Fermat&apos;s Little Theorem).: a^{p-1} \equiv 1</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\pmod{p} | Theorem 14.15 (Euler&apos;s theorem).: a^{\phi(m)} \equiv 1</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\pmod{m}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Divisibility $a \mid b$ is the foundational concept; the division</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">algorithm gives unique quotient...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 14: Number Theory</text>
</svg>