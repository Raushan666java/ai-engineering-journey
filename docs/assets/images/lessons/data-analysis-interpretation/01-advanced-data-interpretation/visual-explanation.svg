    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Percentages: `(Part / Total) × 100` → Ratios: Compare row to row or</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">column to column → Averages: `Sum of values / Number of entries` →</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Growth rate: `((New - Old) / Old) × 100` → CAGR: `((Final /</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Initial)^(1/n) - 1) × 100` where n = number of years → Linked tables:</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Table 1 gives production data; Table 2 gives cost per unit. Total cost</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">= production × cost per unit. → Supplementary tables: Table 1 gives</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">company-wise revenue; Table 2 gives expense ratios. Profit = Revenue ×</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">(1 - Expense Ratio). → Comparison tables: Table 1 and Table 2 present</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">the same metrics for different years or different entities.</text>
