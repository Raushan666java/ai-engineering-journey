    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Type 1 Hypervisors (Bare-Metal). → Type 2 Hypervisors (Hosted). → Full</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Virtualization. → Paravirtualization. → Hardware-Assisted</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Virtualization. → Comparison Matrix:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">cpu: Limits CPU usage (shares, quotas, periods) → memory: Limits</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">memory usage (hard limit, soft limit, swap) → blkio: Limits block I/O</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">(reads/writes per second) → net_prio: Controls network traffic</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">priority → pids: Limits number of processes a container can create →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">devices: Controls device access (read/write/mknod permissions)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
