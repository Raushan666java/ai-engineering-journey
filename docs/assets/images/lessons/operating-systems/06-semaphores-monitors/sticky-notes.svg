<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Counting</text>
    <text x="432" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">semaphore</text>
    <text x="432" y="100" font-size="10" fill="#475569" font-family="Arial, sans-serif">A parking garage with</text>
    <text x="432" y="114" font-size="10" fill="#475569" font-family="Arial, sans-serif">50 spaces. The counter</text>
    <text x="432" y="128" font-size="10" fill="#475569" font-family="Arial, sans-serif">shows how many...</text>
