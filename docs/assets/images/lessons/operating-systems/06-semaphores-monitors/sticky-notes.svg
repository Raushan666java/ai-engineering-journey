    <text x="42" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">When `S.value &lt; 0`,</text>
    <text x="42" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">`|S.value|` = number</text>
    <text x="42" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">of processes...</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
