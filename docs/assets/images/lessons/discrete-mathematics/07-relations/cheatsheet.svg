  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">of $A_1 \times A_2</text>
  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">\times \cdots \times...</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">Components: complete</text>
