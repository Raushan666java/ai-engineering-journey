<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Shadow envelope -->
  <rect x="24" y="26" width="600" height="400" rx="3" fill="#00000020"/>
  <!-- Main sticky note -->
  <g filter="url(#shadow)" transform="rotate(1.5 300 200)">
    <rect x="22" y="22" width="600" height="400" rx="3" fill="#FFF8DC" stroke="#E8D44D" stroke-width="1"/>
    <!-- Folded corner effect -->
    <path d="M578,62 L538,22 L578,22" fill="#F0E68C" opacity="0.6"/>
    <!-- Inner content area -->
    <rect x="40" y="60" width="520" height="310" rx="2" fill="none" stroke="#FFF3B0" stroke-width="1"/>
    <text x="56" y="88" font-size="16" font-weight="bold" fill="#1a1a2e" font-family="Arial, sans-serif">Real-World Analogy</text>
    <line x1="56" y1="116" x2="544" y2="116" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="136" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  You can put the envelope</text>
    <text x="56" y="156" font-size="13" fill="#333" font-family="Arial, sans-serif">    down and pick up a different</text>
    <text x="56" y="176" font-size="13" fill="#333" font-family="Arial, sans-serif">    one (change p)</text>
    <text x="56" y="196" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  - `int * const p` — someone</text>
    <text x="56" y="216" font-size="13" fill="#333" font-family="Arial, sans-serif">    glued the envelope to your</text>
    <text x="56" y="236" font-size="13" fill="#333" font-family="Arial, sans-serif">    hand</text>
    <text x="56" y="256" font-size="13" fill="#333" font-family="Arial, sans-serif">✓  You cannot put it down</text>
    <text x="56" y="276" font-size="13" fill="#333" font-family="Arial, sans-serif">    (cannot change p), but you</text>
    <text x="56" y="296" font-size="13" fill="#333" font-family="Arial, sans-serif">    can open the...</text>
    <line x1="56" y1="330" x2="544" y2="330" stroke="#E8C840" stroke-width="1"/>
    <text x="56" y="350" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">You can put the envelope</text>
    <text x="56" y="366" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">down and pick up a</text>
    <text x="56" y="382" font-size="11" fill="#666" font-family="Arial, sans-serif" font-style="italic">different one...</text>
  </g>
  <!-- Push pin -->
  <g transform="translate(300, 18)">
    <circle cx="0" cy="0" r="8" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FCA5A5"/>
  </g>
</svg>