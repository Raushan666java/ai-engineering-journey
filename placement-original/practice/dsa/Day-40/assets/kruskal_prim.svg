<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <style>
    .node { fill:#eef6ff; stroke:#2b65ff; stroke-width:2px; }
    .edge { stroke:#9aaec3; stroke-width:2px; marker-end:url(#arrow); }
    .pq { fill:#eaf7ec; stroke:#3c8a3c; }
    .label { font-family: Arial, sans-serif; font-size:12px; fill:#263238; }
    .title { font-weight:bold; font-size:14px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9aaec3" />
    </marker>
  </defs>

  <!-- Kruskal: sorted edges list -->
  <g transform="translate(20,10)">
    <text class="label title" x="0" y="14">Kruskal (sort edges, union-find)</text>
    <rect x="0" y="24" width="300" height="36" class="pq" rx="6"></rect>
    <text class="label" x="10" y="46">Sorted edges: (u,v, w1), (x,y, w2), ...</text>
    <text class="label" x="10" y="64">Union-Find merges components when edge doesn't create cycle</text>
  </g>

  <!-- Prim: priority queue of edges from MST frontier -->
  <g transform="translate(360,10)">
    <text class="label title" x="0" y="14">Prim (grow MST with min outgoing edge)</text>
    <rect x="0" y="24" width="340" height="36" class="pq" rx="6"></rect>
    <text class="label" x="10" y="46">PQ contains frontier edges: (v, w), pick min and expand</text>
    <text class="label" x="10" y="64">InMST[] flag used to skip edges to included vertices</text>
  </g>

  <g transform="translate(20,120)">
    <text class="label">Visual: Both algorithms find MST but use different strategies; Kruskal is global sorted edges, Prim is local expansion.</text>
  </g>
</svg>