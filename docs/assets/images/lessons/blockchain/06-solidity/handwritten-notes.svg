    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Solidity</tspan>: a high-level, object-oriented language for writing smart contracts. It compiles...</text>
