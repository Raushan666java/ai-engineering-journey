<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f7fafc; stroke:#2b6cb0; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:12px }
    .title { font-weight:bold; font-size:14px }
  </style>
  <rect x="20" y="20" width="560" height="180" class="box" rx="8" />
  <text x="300" y="48" text-anchor="middle" class="text title">DP Assessment Pipeline</text>
  <text x="40" y="84" class="text">1) Candidate submits code</text>
  <text x="40" y="104" class="text">2) Sandbox runs tests with resource limits</text>
  <text x="40" y="124" class="text">3) Scoring engine aggregates results</text>
  <text x="40" y="144" class="text">4) Feedback and leaderboard updated</text>
</svg>