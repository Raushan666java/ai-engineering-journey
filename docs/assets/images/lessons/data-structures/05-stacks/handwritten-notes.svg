    <text x="60" y="152" font-size="15" font-weight="bold" fill="#2563eb" font-family="'Segoe Print', 'Comic Sans MS', cursive">Key Definitions</text>
    <text x="60" y="180" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Use a stack to detect balanced brackets</tspan>: Push opening brackets; pop and match on closing. If the stack isn&apos;t empty at...</text>
    <text x="60" y="202" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Push opening brackets; pop and match on</text>
    <text x="60" y="224" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">closing. If the stack isn&apos;t empty</text>
    <text x="60" y="246" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">at...</text>
    <text x="60" y="268" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">Postfix evaluation is stack&apos;s</text>
    <text x="60" y="290" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">killer app: Push operands; when you see</text>
    <text x="60" y="312" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">an operator, pop two operands, apply,</text>
    <text x="60" y="334" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">push result....</text>
    <text x="60" y="356" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">getMin() in O(1) needs an auxiliary</text>
    <text x="60" y="378" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">stack: The main stack holds values; the</text>
    <text x="60" y="400" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">min stack tracks the current minimum at</text>
    <text x="60" y="422" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">each...</text>
    <text x="60" y="444" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Stack overflow = recursion too deep</tspan>: Every recursive call pushes a stack frame. Deep recursion (10k+ levels)...</text>
