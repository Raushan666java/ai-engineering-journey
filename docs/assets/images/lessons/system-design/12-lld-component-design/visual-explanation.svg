    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Association: A structural link between classes drawn as a solid line.</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Can be unidirectional (arrow) or bidirectional (no arrow). A `Driver`</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">associated → Aggregation: A &quot;has-a&quot; relationship where the</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">part can exist independently from the whole. Drawn as a hollow diamond</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">on the owner side. A `Department` → Composition: A stronger</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;has-a&quot; where the part&apos;s lifetime is tied to the whole.</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Drawn as a filled diamond. A `House` is composed of `Room` objects; ro</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Inheritance (Generalization): An &quot;is-a&quot; relationship drawn</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">as a hollow triangle pointing to the parent. A `Car` extends</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Vehicle`. → Dependency: A weaker relationship where one class uses</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">another temporarily (e.g., as a method parameter). Drawn as a dashed</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">arrow. `ReportGenerator` d → Lifeline: a dashed vertical line below an</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">object (rectangular box with `name: Class`). → Activation bar: a thin</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">rectangle on the lifeline indicating when the object is active. →</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">Message: a horizontal arrow from one lifeline to another. Solid</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">arrowhead for regular call, dashed arrowhead for return.</text>
