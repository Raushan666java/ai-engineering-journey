    <text x="300" y="70" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 15: Linked Lists</text>
  <text x="30" y="100" font-size="12" font-weight="bold" fill="#2563eb" font-family="Arial, sans-serif">KEY CONCEPTS</text>
  <line x1="30" y1="104" x2="290" y2="104" stroke="#2563eb" stroke-width="1"/>
  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">malloc fails: Return</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">NULL or exit. Always</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">check.</text>
  <text x="35" y="165" font-size="9" fill="#475569" font-family="Arial, sans-serif">value is negative/zero:</text>
  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">No restriction — `data`</text>
  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">is just an int.</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">Multiple creates: Each</text>
  <text x="35" y="219" font-size="9" fill="#475569" font-family="Arial, sans-serif">call creates an</text>
  <text x="35" y="232" font-size="9" fill="#475569" font-family="Arial, sans-serif">independent node.</text>
  <text x="35" y="247" font-size="9" fill="#475569" font-family="Arial, sans-serif">Empty list (head ==</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">NULL): Loop body never</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">executes, prints just</text>
  <text x="35" y="286" font-size="9" fill="#475569" font-family="Arial, sans-serif">&quot;NULL&quot;.</text>
  <text x="35" y="301" font-size="9" fill="#475569" font-family="Arial, sans-serif">Single node: One</text>
  <text x="35" y="314" font-size="9" fill="#475569" font-family="Arial, sans-serif">iteration prints the</text>
  <text x="35" y="327" font-size="9" fill="#475569" font-family="Arial, sans-serif">node, then `current`...</text>
  <text x="35" y="342" font-size="9" fill="#475569" font-family="Arial, sans-serif">Very long list: O(n)</text>
  <text x="35" y="355" font-size="9" fill="#475569" font-family="Arial, sans-serif">time bound — no</text>
  <text x="35" y="368" font-size="9" fill="#475569" font-family="Arial, sans-serif">optimization possible</text>
  <text x="35" y="381" font-size="9" fill="#475569" font-family="Arial, sans-serif">for...</text>
  <text x="310" y="70" font-size="12" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">FORMULAS & TIPS</text>
  <line x1="310" y1="74" x2="570" y2="74" stroke="#059669" stroke-width="1"/>
  <line x1="30" y1="470" x2="570" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="484" font-size="12" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">INTERVIEW PREP</text>
