<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Desk background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="#f1f5f9" opacity="0.3"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Performance</text>
    <text x="42" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Select only needed</text>
    <text x="42" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">columns → avoids</text>
    <text x="42" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">fetching large...</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Read-only</text>
    <text x="237" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">No dirty checking</text>
    <text x="237" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">overhead → Hibernate</text>
    <text x="237" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">tracks changes only...</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Join efficiency</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">DTOs can aggregate</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">data from multiple</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">entities without...</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">1</text>
    <text x="42" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{amount} from</text>
    <text x="42" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">${fromId} to</text>
    <text x="42" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">${toId}`); const from</text>
    <text x="42" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">= this.read(fromId);</text>
    <text x="42" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">const to =</text>
    <text x="42" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">this.read(toId); const</text>
    <text x="42" y="346" font-size="10" fill="#475569" font-family="Arial, sans-serif">fromBalance =</text>
    <text x="42" y="360" font-size="10" fill="#475569" font-family="Arial, sans-serif">from.data[&apos;balance&apos;]</text>
    <text x="42" y="374" font-size="10" fill="#475569" font-family="Arial, sans-serif">as number;</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">2</text>
    <text x="237" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{fromBalance -</text>
    <text x="237" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">amount}, To:</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FCE7F3" stroke="#9d174d" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#9d174d" font-family="Arial, sans-serif">Interview Q</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">What is the difference</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">between `@ManyToMany`</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">and...</text>
    </g>

<g transform="rotate(-6 702.5 110)" filter="url(#shadow)">
      <rect x="615" y="30" width="175" height="160" rx="4" fill="#FCE7F3" stroke="#9d174d" stroke-width="1" opacity="0.95"/>
          <text x="627" y="60" font-size="12" font-weight="bold" fill="#9d174d" font-family="Arial, sans-serif">Interview Q</text>
    <text x="627" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">How do you map</text>
    <text x="627" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">inheritance</text>
    <text x="627" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">hierarchies in JPA?</text>
    </g>

<g transform="rotate(-6 117.5 470)" filter="url(#shadow)">
      <rect x="30" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="42" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="42" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">| Best Practices |</text>
    <text x="42" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">Production-ready</text>
    <text x="42" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">patterns |...</text>
    </g>

<g transform="rotate(-6 312.5 470)" filter="url(#shadow)">
      <rect x="225" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="237" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="237" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">## Common Mistakes</text>
    <text x="237" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">with Database</text>
    <text x="237" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">Migrations (GFG-Style)</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Pro Tip:</text>
    <text x="432" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
    <rect x="0" y="10" width="40" height="45" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M40,18 Q55,22 40,32" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="20" cy="10" rx="16" ry="4" fill="#1e293b" opacity="0.2"/>
  </g>
  <!-- Pen -->
  <g transform="translate(680, 530) rotate(-30)">
    <rect x="0" y="0" width="80" height="5" rx="2" fill="#2563eb"/>
    <polygon points="80,0 90,2.5 80,5" fill="#1e293b"/>
  </g>
  <!-- Header -->
  <text x="400" y="592" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">❌ WRONG: Hibernate can drop columns or change types...</text>
</svg>