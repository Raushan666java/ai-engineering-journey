    <text x="237" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">A single bathroom key.</text>
    <text x="237" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">Only one person can</text>
    <text x="237" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">use the bathroom...</text>
