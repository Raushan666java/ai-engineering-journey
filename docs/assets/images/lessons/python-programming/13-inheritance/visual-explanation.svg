    <text x="85" y="312" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="332" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create class hierarchies using inheritance → Use `super()` to delegate</text>
  <text x="85" y="350" font-size="11" fill="#475569" font-family="Arial, sans-serif">to parent classes → Understand MRO and C3 linearization for multiple</text>
  <text x="85" y="368" font-size="11" fill="#475569" font-family="Arial, sans-serif">inheritance → Apply mixin classes for reusable behaviour → Define</text>
  <text x="85" y="386" font-size="11" fill="#475569" font-family="Arial, sans-serif">abstract base classes and enforce interfaces → Use structural</text>
  <text x="85" y="404" font-size="11" fill="#475569" font-family="Arial, sans-serif">subtyping (protocols) for duck typing → A subclass is always checked</text>
  <text x="85" y="422" font-size="11" fill="#475569" font-family="Arial, sans-serif">before its parent. → The order of base classes in the class definition</text>
  <text x="85" y="440" font-size="11" fill="#475569" font-family="Arial, sans-serif">is preserved.</text>
  <line x1="500" y1="370" x2="500" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="395" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
