    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;where(&apos;estimated_delivery&apos;, &apos;&lt;&apos;, now()) →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;whereNotIn(&apos;status&apos;, [&apos;delivered&apos;,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;cancelled&apos;]); → &gt;virtualAs(&apos;quantity_on_hand -</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">quantity_reserved&apos;); → &gt;where(&apos;expiry_date&apos;,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;&lt;&apos;, $date); → &gt;virtualAs(&apos;quantity_ordered *</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">unit_cost&apos;); → &gt;where(&apos;next_maintenance_date&apos;,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;&lt;=&apos;, now()); → &gt;whereIn(&apos;type&apos;,</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">[&apos;inbound&apos;, &apos;outbound&apos;, &apos;adjustment&apos;]) →</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">&gt;where(&apos;created_at&apos;, &apos;&gt;=&apos;, $cutoff)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1:</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;foreignId(&apos;order_id&apos;)-&gt;constrained()-&gt;cascadeOnDelete();</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 2:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;foreignId(&apos;carrier_id&apos;)-&gt;nullable()-&gt;constrained(&apos;suppliers&apos;);</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 3: table-&gt;string(&apos;destination_address&apos;); | 4:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">table-&gt;decimal(&apos;shipping_cost&apos;, 10, 2)-&gt;nullable(); |</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">5: table-&gt;timestamp(&apos;estimated_delivery&apos;)-&gt;nullable();</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">| 6: table-&gt;index(&apos;tracking_number&apos;);</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
