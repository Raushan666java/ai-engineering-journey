  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Parse and explain every field of the Ethernet frame format. → Trace</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">the evolution of Ethernet from 10 Mbps shared media to 400 Gbps</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">switched networks. → Explain the operation of learning bridges and</text>
