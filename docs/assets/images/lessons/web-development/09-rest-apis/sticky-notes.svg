<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Desk background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="#f1f5f9" opacity="0.3"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Stateless</text>
    <text x="42" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Each request contains</text>
    <text x="42" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">all information needed</text>
    <text x="42" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">to process it</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Client-Server</text>
    <text x="237" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Separation of concerns</text>
    <text x="237" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">between frontend and</text>
    <text x="237" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">backend</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Cacheable</text>
    <text x="432" y="82" font-size="10" fill="#475569" font-family="Arial, sans-serif">Responses must define</text>
    <text x="432" y="96" font-size="10" fill="#475569" font-family="Arial, sans-serif">themselves as</text>
    <text x="432" y="110" font-size="10" fill="#475569" font-family="Arial, sans-serif">cacheable or not</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">1</text>
    <text x="42" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{def.method.padEnd(6)}</text>
    <text x="42" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">| \`</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">2</text>
    <text x="237" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">{def.summary} |\n`;</text>
    <text x="237" y="276" font-size="10" fill="#475569" font-family="Arial, sans-serif">}
        return</text>
    <text x="237" y="290" font-size="10" fill="#475569" font-family="Arial, sans-serif">table;
    }</text>
    <text x="237" y="304" font-size="10" fill="#475569" font-family="Arial, sans-serif">static</text>
    <text x="237" y="318" font-size="10" fill="#475569" font-family="Arial, sans-serif">tree(definitions:</text>
    <text x="237" y="332" font-size="10" fill="#475569" font-family="Arial, sans-serif">RouteDe</text>
    </g>

<g transform="rotate(-6 117.5 470)" filter="url(#shadow)">
      <rect x="30" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="42" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="42" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">&gt; [!WARNING]</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Previous:</text>
    <text x="432" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>

<g transform="rotate(-6 702.5 470)" filter="url(#shadow)">
      <rect x="615" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="627" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Next:</text>
    <text x="627" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
    <rect x="0" y="10" width="40" height="45" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M40,18 Q55,22 40,32" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="20" cy="10" rx="16" ry="4" fill="#1e293b" opacity="0.2"/>
  </g>
  <!-- Pen -->
  <g transform="translate(680, 530) rotate(-30)">
    <rect x="0" y="0" width="80" height="5" rx="2" fill="#2563eb"/>
    <polygon points="80,0 90,2.5 80,5" fill="#1e293b"/>
  </g>
  <!-- Header -->
  <text x="400" y="592" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: REST APIs and API Design</text>
</svg>