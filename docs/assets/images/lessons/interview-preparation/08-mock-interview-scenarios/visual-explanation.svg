  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Read each scenario to understand the flow and format of different</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">interview types → Cover the candidate&apos;s response and try</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">answering yourself first → Check against the rubric to evaluate your</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">own performance</text>
