    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">TypeScript adds static type checking to JavaScript, catching errors at</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">compile time. Generics...</text>
