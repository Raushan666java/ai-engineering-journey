<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Multivariable Calculus</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">These: the 2D analogue of topographic map elevations.</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Domain: → Level Curves (Contours): → Level Surfaces: → Limits: →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Continuity: → Definition:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\nabla f$ points in the direction of steepest increase of $f$ →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\|\nabla f\|$ is the rate of increase in that direction → $\nabla f$</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">is perpendicular to level curves/surfaces ($\nabla f \cdot T = 0$</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">along a level curve) → $-\nabla f$ points in the direction of steepest</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">decrease (used in gradient descent) → If $D &gt; 0$ and $f_{xx} &gt;</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">0$: local minimum → If $D &gt; 0$ and $f_{xx} &amp;lt; 0$: local</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">maximum → If $D &amp;lt; 0$: saddle point → If $D = 0$: test is</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">inconclusive</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Definition:: \frac{\partial f}{\partial x}(a,b) = \lim_{h \to 0}</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{f(a+h, b) - f(a,b)}{h} | Higher-Order Partial Derivatives::</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\partial^2 f}{\partial x^2} = \frac{\partial}{\partial</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">x}\left(\frac{\partial f}{\partial x}\right), \quad \frac{\partial^2</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">f}{\partial x \parti | Clairaut&apos;s Theorem (Equality of Mixed</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">Partials):: \frac{\partial^2 f}{\partial x \partial y} =</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\partial^2 f}{\partial y \partial x} | Gradient:: \nabla f =</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">\left\langle \frac{\partial f}{\partial x}, \frac{\partial f}{\partial</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">y}, \frac{\partial f}{\partial z} \right\rangle | Directional</text>
  <text x="85" y="619" font-size="11" fill="#475569" font-family="Arial, sans-serif">Derivative:: D_{\mathbf{u}} f(\mathbf{x}) = \nabla f(\mathbf{x}) \cdot</text>
  <text x="85" y="637" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{u} | 6: \frac{dz}{dt} = \frac{\partial f}{\partial x}</text>
  <text x="85" y="655" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{dx}{dt} + \frac{\partial f}{\partial y} \frac{dy}{dt}</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Partial Derivatives:  For $f(x,y) = x^2 \cos y + y e^x$,</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">find $\frac{\partial f}{\partial x}$ and...</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Partial derivatives compute rates of change with respect to one</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">variable at a time
- The...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Multivariable Calculus</text>
</svg>