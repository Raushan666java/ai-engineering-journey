    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Structure of a typical DI table: → Key operations on tables: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Strategy for combined tables: → Calculation tips: → Key operations: →</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key operations:</text>
