    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Answer: → Answer: → Answer: → Answer: → Answer: → Answer:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Deployment: Monolith deploys as one WAR/JAR. Microservices deploy</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">independently. → Scaling: Monolith scales the entire application.</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">Microservices scale only the services under load. → Database: Monolith</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">typically uses one shared database. Microservices own their data</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">(database-per-service). → Team structure: Monolith works for small</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">teams. Microservices align with cross-functional teams owning one</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">service each. → Communication: Monolith uses in-process method calls.</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">Microservices use network calls (HTTP/gRPC/messaging). → Failure</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">isolation: Monolith failure takes down everything. Microservices fail</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">independently (with circuit breakers). → Coexist: New features built</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">as microservices. Monolith handles old features. → Strangle: Routes</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">for old features are gradually redirected to new services.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
