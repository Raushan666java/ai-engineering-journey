<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 7: Neural Networks</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Epoch: One full pass over the entire training dataset.</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Forward pass equations: → Backward pass (chain rule, layer by layer):</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Vanishing gradients → Exploding gradients → Solutions: → Xavier</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Glorot) Initialization</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">$x_i$ are the inputs. → $w_i$ are the weights. → $b$ is the bias. →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">$f$ is the activation function. → Epoch: One full pass over the entire</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">training dataset. → Batch: A subset of samples processed together.</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">Batch size determines how many samples are used per gradient</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">computation. → Iteration: One forward + backward pass on one batch.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">activation function: y = f(\sum_{i=1}^{n} w_i x_i + b) | Forward pass</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">equations:: z^{(1)} = W^{(1)} x + b^{(1)} | Forward pass equations::</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">a^{(1)} = f(z^{(1)}) | Forward pass equations:: z^{(2)} = W^{(2)}</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">a^{(1)} + b^{(2)} | 5: a^{(2)} = f(z^{(2)}) | 6: z^{(3)} = W^{(3)}</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">a^{(2)} + b^{(3)}</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Solving XOR with an MLP:  Output (approximate):</text>
  <line x1="500" y1="580" x2="500" y2="590" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="605" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="605" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="627" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="647" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Neural networks are inspired by the biological structure of the</text>
  <text x="85" y="665" font-size="11" fill="#475569" font-family="Arial, sans-serif">brain.
- A single neuron is a...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 7: Neural Networks</text>
</svg>