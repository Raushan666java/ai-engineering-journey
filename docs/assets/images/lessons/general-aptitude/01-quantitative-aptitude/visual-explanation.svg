<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Quantitative Aptitude</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Wages: distributed in proportion to work done (or inversely</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">proportional to time taken)</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Natural Numbers: → Whole Numbers: → Integers: → Divisibility Rules: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">HCF (GCD): → LCM:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">By 2: Last digit is even → By 3: Sum of digits divisible by 3 → By 4:</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Last two digits divisible by 4 → By 5: Last digit is 0 or 5 → By 6:</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Divisible by both 2 and 3 → By 8: Last three digits divisible by 8 →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">By 9: Sum of digits divisible by 9 → By 11: Difference of sum of</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">digits at odd and even positions is 0 or multiple of 11</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Relationship:: a \times b = \text{HCF}(a,b) \times \text{LCM}(a,b) |</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">Percentage Change:: \text{Change \%} = \frac{\text{Final} -</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Initial}}{\text{Initial}} \times 100 | Successive Percentage</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">Change:: \text{Net \%} = a + b + \frac{ab}{100} | Dishonest</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Shopkeeper:: \text{Profit \%} = \frac{\text{Error}}{\text{True Value}</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">- \text{Error}} \times 100 | Average (Mean):: \text{Average} =</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\text{Sum of all terms}}{\text{Number of terms}} |</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">$$\text{Average} = \frac{\text{Sum of all terms}}{\text{Number of</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">terms}}$$

: \bar{x}_w = \frac{\sum w_i x_i}{\sum w_i}</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Percentage:  If A&apos;s salary is 20% more than B&apos;s,</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">by what percentage is B&apos;s salary less than...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Percentages use fraction conversion shortcuts for rapid</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">calculation
- Profit/loss problems:...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Quantitative Aptitude</text>
</svg>