  <text x="510" y="361" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">सक्षम होंगे —</text>
  <text x="510" y="377" font-size="10" fill="#475569" text-anchor="middle" font-family="Arial, sans-serif">टाइपस्क्रिप्ट में</text>
