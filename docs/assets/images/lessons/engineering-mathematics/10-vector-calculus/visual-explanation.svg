    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Curl of Vector Field:: \nabla \times \mathbf{F} = \begin{vmatrix}</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{i} &amp; \mathbf{j} &amp; \mathbf{k} \\</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\partial}{\partial x} &amp; \frac{\partial}{\partial y} &amp;</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{\ | Scalar Line Integral:: \int_C f\,ds = \int_a^b</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">f(\mathbf{r}(t)) \|\mathbf{r}&apos;(t)\|\,dt | Vector Line Integral</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Work):: \int_C \mathbf{F} \cdot d\mathbf{r} = \int_a^b</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif">\mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}&apos;(t)\,dt | Scalar</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">Surface Integral:: \iint_S f\,dS = \iint_D f(\mathbf{r}(u,v))</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">\|\mathbf{r}_u \times \mathbf{r}_v\|\,du\,dv | Vector Surface Integral</text>
  <text x="85" y="619" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Flux):: \iint_S \mathbf{F} \cdot d\mathbf{S} = \iint_S \mathbf{F}</text>
  <text x="85" y="637" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cdot \mathbf{n}\,dS = \iint_D \mathbf{F}(\mathbf{r}(u,v)) \cdot</text>
  <text x="85" y="655" font-size="11" fill="#475569" font-family="Arial, sans-serif">(\mathbf{r}_u \times \mathb | 6: \oint_C \mathbf{F} \cdot d\mathbf{r}</text>
  <text x="85" y="673" font-size="11" fill="#475569" font-family="Arial, sans-serif">= \iint_D \left(\frac{\partial Q}{\partial x} - \frac{\partial</text>
  <text x="85" y="691" font-size="11" fill="#475569" font-family="Arial, sans-serif">P}{\partial y}\right)\,dA</text>
