    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Boolean algebra: a set $B$ with two binary operations $+$ (OR),</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">$\cdot$ (AND), and a unary...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
