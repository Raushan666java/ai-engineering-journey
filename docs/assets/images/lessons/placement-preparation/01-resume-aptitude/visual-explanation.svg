    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">The 6-second rule in practice: → Quantification templates: → Action</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">verbs for each section: → Keywords by target company type: → Formula:</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Optimization tips:</text>
