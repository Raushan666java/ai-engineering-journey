    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- The bias-variance tradeoff is a central challenge in machine</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">learning.
- Overfitting occurs when...</text>
