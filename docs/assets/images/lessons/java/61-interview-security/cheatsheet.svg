    <rect x="308" y="114" width="4" height="340" rx="2" fill="#059669"/>
    <rect x="308" y="114" width="264" height="340" rx="8" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.15"/></g>
  <text x="318" y="134" font-size="14" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">Formulas & Tips</text>
    <line x1="318" y1="137" x2="418" y2="137" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="462" x2="562" y2="462" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,3"/>
  <g filter="url(#shadowSm)"><rect x="28" y="470" width="264" height="386" rx="8" fill="#dc2626" opacity="0.06"/>
    <rect x="28" y="470" width="4" height="386" rx="2" fill="#dc2626"/>
    <rect x="28" y="470" width="264" height="386" rx="8" fill="none" stroke="#dc2626" stroke-width="0.5" opacity="0.15"/></g>
  <text x="38" y="490" font-size="14" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">Interview Prep</text>
    <line x1="38" y1="493" x2="138" y2="493" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="42" y="504" font-size="9" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">Q:</text>
  <text x="52" y="504" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">What is the difference</text>
  <text x="52" y="516" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">between authentication</text>
  <text x="52" y="528" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">and authorization? How</text>
  <text x="52" y="540" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">does Spring Security</text>
  <text x="52" y="552" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">model these two</text>
  <text x="52" y="564" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">concepts?</text>
  <text x="42" y="580" font-size="9" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">Q:</text>
  <text x="52" y="580" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">Explain the structure of</text>
  <text x="52" y="592" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">a JSON Web Token. How</text>
  <text x="52" y="604" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">are JWT signatures</text>
  <text x="52" y="616" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">created and verified?</text>
  <text x="42" y="632" font-size="9" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">Q:</text>
  <text x="52" y="632" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">How do refresh tokens</text>
  <text x="52" y="644" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">work in a JWT-based</text>
  <text x="52" y="656" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">authentication system?</text>
  <text x="52" y="668" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">When should you rotate</text>
  <text x="52" y="680" font-size="8" fill="#1e293b" font-family="Arial, sans-serif">refresh tokens?</text>
  <g filter="url(#shadowSm)"><rect x="308" y="470" width="264" height="386" rx="8" fill="#d97706" opacity="0.06"/>
    <rect x="308" y="470" width="4" height="386" rx="2" fill="#d97706"/>
    <rect x="308" y="470" width="264" height="386" rx="8" fill="none" stroke="#d97706" stroke-width="0.5" opacity="0.15"/></g>
  <text x="318" y="490" font-size="14" font-weight="bold" fill="#d97706" font-family="Arial, sans-serif">Common Mistakes</text>
    <line x1="318" y1="493" x2="418" y2="493" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="880" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Security Interview Q&amp;A — Quick Reference · AI Engineering Journey</text>
