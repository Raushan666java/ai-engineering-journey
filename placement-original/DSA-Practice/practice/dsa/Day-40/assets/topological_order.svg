<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <style>
    .node { fill:#fff; stroke:#2c3e50; stroke-width:2px; }
    .edge { stroke:#95a5a6; stroke-width:2px; marker-end:url(#arrow); }
    .label { font-family: Arial, sans-serif; font-size:12px; fill:#2c3e50; }
    .order { font-family: Arial, sans-serif; font-size:13px; fill:#0b8043; font-weight:bold; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#95a5a6" />
    </marker>
  </defs>

  <g transform="translate(40,20)">
    <circle class="node" cx="40" cy="40" r="20" />
    <text class="label" x="40" y="45" text-anchor="middle">5</text>

    <circle class="node" cx="140" cy="20" r="20" />
    <text class="label" x="140" y="25" text-anchor="middle">2</text>

    <circle class="node" cx="240" cy="40" r="20" />
    <text class="label" x="240" y="45" text-anchor="middle">3</text>

    <circle class="node" cx="340" cy="20" r="20" />
    <text class="label" x="340" y="25" text-anchor="middle">1</text>

    <circle class="node" cx="440" cy="40" r="20" />
    <text class="label" x="440" y="45" text-anchor="middle">0</text>

    <line class="edge" x1="60" y1="40" x2="120" y2="22" />
    <line class="edge" x1="160" y1="20" x2="220" y2="22" />
    <line class="edge" x1="260" y1="40" x2="320" y2="22" />
    <line class="edge" x1="360" y1="20" x2="420" y2="22" />

    <rect x="40" y="120" width="260" height="40" rx="6" fill="#e7f4ff" stroke="#2b65ff" />
    <text class="order" x="60" y="145">Topological Order (one valid): 5 → 2 → 3 → 1 → 0</text>
  </g>
</svg>