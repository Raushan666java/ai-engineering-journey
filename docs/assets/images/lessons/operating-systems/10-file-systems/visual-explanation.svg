    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Application calls `open()` with O_CREAT flag → OS allocates a free</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">inode from the inode table → OS initialises inode metadata (owner,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">permissions, timestamps, size=0) → OS creates a directory entry</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">mapping the file name to the inode number → OS returns a file</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">descriptor to the calling process → File now exists but occupies zero</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">data blocks → Process calls `open(&quot;/home/user/file.txt&quot;,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">O_RDONLY)` → OS looks up path in directory tree (traverses `/` →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">`home` → `user` → `file.txt`)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
