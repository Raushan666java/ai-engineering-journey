  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Synonym Question:  Question: Choose the correct synonym of</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">the word &quot;AMELIORATE&quot;. a) Worsen b)...</text>
