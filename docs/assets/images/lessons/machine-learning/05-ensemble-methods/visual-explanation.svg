<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Ensemble Methods</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">The Lemonade Stand Principle: If each person predicts the day&apos;s</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">lemonade sales with ~60% accuracy, the...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">The Lemonade Stand Principle → For Bagging → For Boosting → Algorithm</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Properties → Typical values for $m$</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create bootstrap sample S_m by sampling n points with replacement from</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">training set → Train model f_m on S_m → Regression: f(x) = (1/M) S</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">f_m(x) → Classification: f(x) = mode{ f_1(x), ..., f_M(x) }  (majority</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">vote) → Each bootstrap sample contains ~63.2% of unique training</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">points ($1 - 1/e$) → The remaining ~36.8% are out-of-bag (OOB) samples</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">? used for free validation → Bagging primarily reduces variance</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">without increasing bias → Works best with high-variance base learners</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">(deep decision trees)</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: \mathbb{E}[(y - \hat{f})^2] =</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\underbrace{\text{Bias}[\hat{f}]^2}_{\text{Error from assumptions}} +</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\underbrace{\text{Var}[\hat{f}]}_{\text{Error from | For Bagging:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\text{Var}\left(\frac{1}{M}\sum_{i=1}^{M} \hat{f}_i\right) =</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1}{M}\sigma^2 | 3: \text{Var}(\text{ensemble}) = \rho\sigma^2 +</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1-\rho}{M}\sigma^2 | 4: Error = Bias^2 + Variance + \sigma^2 |</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">5: \mathbb{E}[(y - \hat{f})^2] =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\underbrace{\text{Bias}[\hat{f}]^2}_{\text{Error from assumptions}} +</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">| For Bagging: \text{Var}\left(\frac{1}{M}\sum_{i=1}^{M}</text>
  <text x="85" y="639" font-size="11" fill="#475569" font-family="Arial, sans-serif">\hat{f}_i\right) = \frac{1}{M}\sigma^2</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Random Forest Implementation (Simplified):</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">One-Sentence Takeaway:</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 5: Ensemble Methods</text>
</svg>