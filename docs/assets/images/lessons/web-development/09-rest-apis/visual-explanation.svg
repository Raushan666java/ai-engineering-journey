<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: REST APIs and API Design</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Stateless: Each request contains all information needed to process it</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. Which HTTP method should be used to partially update a resource? →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">C) PATCH applies partial modifications to a resource. PUT replaces the</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">entire resource. → Q2. What HTTP status code indicates a resource was</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">successfully created? → B) 201 Created is returned after successfully</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">creating a resource via POST. → Q3. What is the purpose of Zod&apos;s</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">`.parse()` method? → B) `.parse()` validates the input against the</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">schema and returns the typed data, or throws a `ZodError` with</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">validation details.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design RESTful APIs following resource-oriented principles → Implement</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">proper URI naming conventions and HTTP method usage → Handle request</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">validation, pagination, filtering, and sorting → Implement error</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">handling with appropriate HTTP status codes → Document APIs using</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">OpenAPI/Swagger specifications → Test APIs with automated integration</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">tests → Stateless: Each request contains all information needed to</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">process it → Client-Server: Separation of concerns between frontend</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">and backend</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: {def.method.padEnd(6)} | \` | 2: {def.summary} |\n`;
        }</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">return table;
    }

    static tree(definitions: RouteDe | 3:</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">{title}` },
            servers: [{ url:</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;http://localhost:3000/api&quot; }],
            paths: {},
  |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">4: {page}&amp;size= | 5: {baseUrl}?page=1&amp;size= | 6:</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">{baseUrl}?page=</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">REST API design follows resource-oriented principles with consistent</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">URI naming, proper HTTP method...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 9: REST APIs and API Design</text>
</svg>