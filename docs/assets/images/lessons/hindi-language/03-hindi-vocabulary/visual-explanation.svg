    <text x="85" y="312" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="332" font-size="11" fill="#475569" font-family="Arial, sans-serif">Recall 100+ synonym pairs (पर्यायवाची) and 100+ antonym pairs (विलोम)</text>
  <text x="85" y="350" font-size="11" fill="#475569" font-family="Arial, sans-serif">for competitive exams → Distinguish between अनेकार्थक शब्द (homonyms)</text>
  <text x="85" y="368" font-size="11" fill="#475569" font-family="Arial, sans-serif">and समान ध्वनि वाले भिन्नार्थक शब्द (homophones) → Use 50+ idiomatic</text>
  <text x="85" y="386" font-size="11" fill="#475569" font-family="Arial, sans-serif">expressions (मुहावरे) and 25+ proverbs (लोकोक्तियाँ) correctly in</text>
  <text x="85" y="404" font-size="11" fill="#475569" font-family="Arial, sans-serif">sentences → Classify words as तत्सम, तद्भव, देशज, and विदेशी</text>
  <text x="85" y="422" font-size="11" fill="#475569" font-family="Arial, sans-serif">(foreign-origin) → Apply vocabulary knowledge to fill-in-the-blanks,</text>
  <text x="85" y="440" font-size="11" fill="#475569" font-family="Arial, sans-serif">synonym/antonym matching, and sentence completion → --## Theory →</text>
  <text x="85" y="458" font-size="11" fill="#475569" font-family="Arial, sans-serif">Hindi shabdawali char sroton se bani: Tatsam (Sanskrit), Tadbhav</text>
  <text x="85" y="476" font-size="11" fill="#475569" font-family="Arial, sans-serif">(vikrit), Deshaj, Videshi. → 30+ mool shabdon ke 6-6 paryayvachi shabd</text>
  <text x="85" y="494" font-size="11" fill="#475569" font-family="Arial, sans-serif">yaad karne se shabd bhandar badhta hai.</text>
  <line x1="500" y1="370" x2="500" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
