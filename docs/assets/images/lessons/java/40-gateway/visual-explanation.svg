    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Routes: A route is a combination of an ID, a URI destination, a</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">collection of predicates, and a collection of filters. → Predicates:</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">Conditions that determine if a request matches a route (HTTP method,</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">headers, paths, etc.) → Filters: Modify requests and responses as they</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">pass through the gateway (pre-filters and post-filters) → Route</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Locator: Configuration source for routes (programmatic via</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">`RouteLocatorBuilder` or declarative via YAML)</text>
