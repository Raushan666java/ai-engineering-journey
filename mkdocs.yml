site_name: "AI Engineering Journey — Raushan Kumar"
site_url: https://raushan666java.github.io/ai-engineering-journey/
site_author: Raushan Kumar
site_description: "AI Engineering Journey — Laravel developer transitioning to AI Automation. 500+ public lessons: LLMs, RAG, Agents, MCP, Transformers, GATE CS, Java Spring Boot, system design."

repo_name: Raushan666java/ai-engineering-journey
repo_url: https://github.com/Raushan666java/ai-engineering-journey
edit_uri: edit/main/docs/

theme:
  favicon: assets/images/favicon.svg
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.collapse
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Image lightbox handled by custom JS in overrides/main.html

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Raushan666java
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/raushan-kumar-477465250
    - icon: fontawesome/solid/globe
      link: https://apexpillar.tech
    - icon: fontawesome/solid/envelope
      link: mailto:hello@apexpillar.tech
    - icon: fontawesome/solid/file-lines
      link: /resume/

