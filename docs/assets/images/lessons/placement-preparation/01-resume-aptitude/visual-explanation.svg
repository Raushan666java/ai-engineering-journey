    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Top third of page must contain: Name, Skills, Education CGPA, and one</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">strong project → ATS parses before a human sees it → use standard</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">section headers (no fancy icons) → Font size: 10-12pt body, 14-16pt</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">name. Margins: 0.5-0.75 inches → *Reduced [X] by [Y]% by implementing</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">[Z]* → *Served [N] users with [latency/throughput improvement]* →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">*Improved [metric] from [A] to [B] via [approach]* → *Processed [N]</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">records/requests in [timeframe]* → *Achieved</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">[accuracy/speed/reduction] of [X]% using [technique]*</text>
