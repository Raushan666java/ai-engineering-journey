<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Lambda Expressions &amp; Functional Programming</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">You: not limited to JDK interfaces. Any interface with a single</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">abstract method is a...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Functional Interfaces → Lambda Syntax → Method References → Stream</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Pipeline → Map/FlatMap → Filter/Predicate</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Define and use the core functional interfaces: `Predicate&lt;T&gt;`,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">`Function&lt;T,R&gt;`, `Consumer&lt;T&gt;`, `Supplier&lt;T&gt;`,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">`UnaryOperator&lt;T&gt;`, `BinaryOperator&lt;T&gt;`, → Write lambda</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">expressions in all syntactic forms, including single-expression,</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">block-bodied, single-parameter without parentheses, and type-inferred</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">fo → Understand variable capture rules including the effectively-final</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">constraint and what `this` means inside a lambda → Replace anonymous</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">classes and method references with lambda equivalents using four</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">method-reference forms: static, bound-instance, unbound-instance, a →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Construct stream pipelines composed of a source, zero or more</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">intermediate operations, and a terminal operation → Distinguish</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">stateless intermediate operations from stateful ones and understand</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">lazy evaluation semantics including short-circuiting → Apply `map` for</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">one-to-one element transformation and `flatMap` for one-to-many</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">expansion and flattening of nested or optional structures → Compose</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">and negate predicates using `Predicate.and()`, `.or()`, and</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">`.negate()` for fine-grained filtering</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master the core concepts covered in this chapter</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Lambda Expressions &amp; Functional Programming</text>
</svg>