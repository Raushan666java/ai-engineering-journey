    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Graphical IRs: Abstract syntax trees (ASTs) and directed acyclic</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">graphs (DAGs). → Linear IRs: Postfix notation and three-address code</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">(TAC). → Hybrid forms: Control-flow graphs with basic blocks, SSA</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">form. → Each instruction does bounded work (one operation). →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Temporaries have explicit names, making dataflow analysis</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">straightforward. → Instructions can be freely reordered, inserted, and</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">removed during optimization. → It is close enough to machine code to</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">generate efficiently. → Common-subexpression elimination: Identical</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">subexpressions produce one evaluation.</text>
