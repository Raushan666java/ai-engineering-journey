  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Read everything first: Understand all constraints before solving. →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Create a framework: Set up tables or grids based on the puzzle</text>
