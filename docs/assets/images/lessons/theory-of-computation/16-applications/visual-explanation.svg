  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Each token type (IDENTIFIER, NUMBER, WHITESPACE, etc.) is described by</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">a regular expression. → Each regular expression is converted to an NFA</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">and then to a DFA. → The DFAs are combined into a single DFA that</text>
