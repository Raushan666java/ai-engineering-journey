  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">a cache (Redis, Memcached) in front of the shard. Celebrity content is</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">read once from the database and served from cache for subseque →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Fan-out on Write: Instead of having followers read from the</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">celebrity&apos;s shard, write the post to each follower&apos;s</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">timeline (home timeline fan-out). Thi → Parallel Join: Each shard</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">performs the join locally on its own data slice. The coordinator</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">merges partial results. This works when both tables are sha →</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">Broadcast Join: Small dimension tables are broadcast to all shards,</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">which perform the join locally. Common in data warehouses. →</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">Cross-Shard Join via Scatter-Gather: Data from one table is fetched</text>
  <text x="85" y="642" font-size="11" fill="#475569" font-family="Arial, sans-serif">from all shards, then joined with data from the other table at the</text>
  <text x="85" y="660" font-size="11" fill="#475569" font-family="Arial, sans-serif">coordinator. Th → Application-Level Join: The application queries each</text>
  <text x="85" y="678" font-size="11" fill="#475569" font-family="Arial, sans-serif">shard independently and performs the join in application code.</text>
