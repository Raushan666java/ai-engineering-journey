  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">Compute height: `height</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">= 1 + max(height(left),</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">height(right))`....</text>
  <text x="35" y="165" font-size="9" fill="#475569" font-family="Arial, sans-serif">Compute balance factor:</text>
  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">`bf = height(left) -</text>
  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">height(right)`.</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">Check invariant: if |bf|</text>
  <text x="35" y="219" font-size="9" fill="#475569" font-family="Arial, sans-serif">&gt; 1, rebalance.</text>
  <text x="35" y="234" font-size="9" fill="#475569" font-family="Arial, sans-serif">Propagate upward:</text>
  <text x="35" y="247" font-size="9" fill="#475569" font-family="Arial, sans-serif">recompute heights and</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">check bf along the</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">path...</text>
  <text x="35" y="288" font-size="9" fill="#475569" font-family="Arial, sans-serif">LL: rightRotate(node)</text>
  <text x="35" y="303" font-size="9" fill="#475569" font-family="Arial, sans-serif">RR: leftRotate(node)</text>
