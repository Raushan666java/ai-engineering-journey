    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Case Study 1: Large Government IT Project — Estimation and Recovery:</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">A government agency contracted a $50M benefits management system.</text>
  <text x="85" y="598" font-size="11" fill="#475569" font-family="Arial, sans-serif">After 18...</text>
