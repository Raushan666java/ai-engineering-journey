      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 13: Computer Vision</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Comp: object detection paradigms: YOLO (single-shot) vs R-CNN</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">(two-stage).</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Previous: → Real-World Analogy → How Humans See vs How Machines</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">&quot;See&quot; → Real-World Analogy → Digital Images as Number Grids</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Common color spaces: → Step 1: → Step 2:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Describe how images are formed and represented as numerical arrays. →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Implement image filtering operations (blurring, sharpening, edge</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">detection). → Compute image gradients and apply the Canny edge</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">detection pipeline. → Extract feature descriptors (SIFT, HOG) for</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">object recognition. → Explain CNN building blocks (convolution,</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">pooling, fully connected layers). → Compare object detection</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">paradigms: YOLO (single-shot) vs R-CNN (two-stage). → Differentiate</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">semantic segmentation, instance segmentation, and panoptic</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">segmentation. → Understand Vision Transformer architecture and its</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">divergence from CNNs.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: I(x, y) \in \{0, 1, \dots, 255\} | 2: I(x, y) = [R(x, y), G(x, y),</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">B(x, y)]^\top | convolution: (I * K)[i, j] = \sum_{m=-a}^{a}</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{n=-b}^{b} I[i+m, j+n] \cdot K[m+a, n+b] | 4: \nabla I(x, y) =</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">\begin{bmatrix} \frac{\partial I}{\partial x} \\ \frac{\partial</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">I}{\partial y} \end{bmatrix} | 5: Y[i, j, o] = \sum_{m=0}^{k-1}</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\sum_{n=0}^{k-1} \sum_{c=0}^{C_{\text{in}}-1} X[i+m, j+n, c] \cdot</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">W[m, n, c, o] + b_o | Output size formula:: W_{\text{out}} =</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">\left\lfloor \frac{W_{\text{in}} - k + 2p}{s} \right\rfloor + 1</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key takeaways:; Images are data:; Convolution is fundamental:</text>
