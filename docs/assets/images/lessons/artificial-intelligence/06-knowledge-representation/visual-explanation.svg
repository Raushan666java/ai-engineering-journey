    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example:: \forall x \, (\text{Student}(x) \Rightarrow \exists y \,</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">(\text{Course}(y) \land \text{Enrolled}(x, y))) | successor-state</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">axiom: \text{On}(x, y, do(a, s)) \Leftrightarrow (a = \text{stack}(x,</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">y)) \lor (\text{On}(x, y, s) \land a \neq \text{move}(x, z)) |</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Syntax:: P, Q, R, \ldots | 4: \neg, \land, \lor, \Rightarrow,</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">\Leftrightarrow | Inference:: \alpha | Inference:: \alpha \Rightarrow</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">\beta</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="55" rx="3" fill="#831843"/>
