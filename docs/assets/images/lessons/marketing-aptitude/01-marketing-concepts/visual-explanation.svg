    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">For exams: Remember STP order (Segmentation → Targeting → Positioning)</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">and 4Ps → 7Ps...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Key Definitions: → Core Marketing Concepts: → Effective segmentation</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">criteria: → Positioning tools: → Positioning errors: → Key CRM</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">metrics:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Needs — Basic human requirements (food, shelter, belonging) → Wants —</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Needs shaped by culture and personality (a burger vs fried rice for</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">hunger) → Demands — Wants backed by purchasing power → Exchange — The</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">act of obtaining a desired object by offering something in return →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">Transaction — A trade of values between two parties → Value — The</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">ratio of perceived benefits to price paid → Perceptual maps — Visual</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">representation of consumer perceptions of brands → USP (Unique Selling</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Proposition) — A distinct benefit that sets the product apart</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
