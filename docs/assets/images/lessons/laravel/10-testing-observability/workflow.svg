  <text x="70" y="290" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">request cycle. Fast</text>
  <text x="70" y="306" font-size="10" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">execution.</text>
