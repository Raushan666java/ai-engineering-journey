    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Shorthand Notation for Quick Note-Making: → Common Variations: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Framework Setup (8 floors, ground floor = 1): → Step-by-Step Approach</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">for Floor Puzzles: → Important Reading Checklist: → Common Framework</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Topmost = Position 1):</text>
