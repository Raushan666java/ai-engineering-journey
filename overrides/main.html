{% extends "base.html" %}

{% block announce %}
<div style="text-align:center; padding: 0.4rem 1rem; background: #00d4aa20; border-bottom: 1px solid #00d4aa40; font-size: 0.8rem;">
  <strong style="color: #00d4aa;">Available for hire</strong> — Raushan Kumar, AI Automation Engineer. 
  <a href="https://linkedin.com/in/raushan-kumar-477465250" style="color: #00d4aa; text-decoration: underline; text-underline-offset: 3px;">LinkedIn</a> 
  · <a href="mailto:hello@apexpillar.tech" style="color: #00d4aa; text-decoration: underline; text-underline-offset: 3px;">Email</a> 
  · <a href="https://github.com/Raushan666java" style="color: #00d4aa; text-decoration: underline; text-underline-offset: 3px;">GitHub</a>
  · <span style="color: #00d4aa;">Dubai / Remote</span>
</div>
{% endblock %}

{% block extrahead %}
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.canonical_url }}">
<meta property="og:title" content="{% block og_title %}{{ config.site_name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ config.site_description }}{% endblock %}">
<meta property="og:image" content="{{ config.site_url }}assets/images/og-image.svg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_IN">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block tw_title %}{{ config.site_name }}{% endblock %}">
<meta name="twitter:description" content="{% block tw_description %}{{ config.site_description }}{% endblock %}">
<meta name="twitter:image" content="{{ config.site_url }}assets/images/og-image.svg">

<meta name="author" content="{{ config.site_author }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Raushan Kumar",
  "url": "{{ config.site_url }}",
  "jobTitle": "AI Automation Engineer",
  "sameAs": [
    "https://github.com/Raushan666java",
    "https://linkedin.com/in/raushan-kumar-477465250",
    "https://apexpillar.tech"
  ],
  "knowsAbout": ["AI Engineering", "LLM Engineering", "Agent Systems", "MCP", "Laravel", "Python", "RAG", "Machine Learning"]
}
</script>

{% if page and page.meta and page.meta.description %}
<meta name="description" content="{{ page.meta.description }}">
{% else %}
<meta name="description" content="{{ config.site_description }}">
{% endif %}
{% endblock %}
