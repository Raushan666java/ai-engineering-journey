    <text x="60" y="212" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">building architectures</tspan>: - Monolithic = A single-room warehouse → everything is together, fast to move...</text>
