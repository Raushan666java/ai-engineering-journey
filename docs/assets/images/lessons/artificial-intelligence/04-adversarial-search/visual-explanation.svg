    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Game Tree: Tree where each node is a board state, each edge is a move.</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Branching Factor (b): Average number of legal moves per state</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Chess: ~35, Go: ~250). → Depth (d): Number of moves until terminal</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">(Chess: ~80 ply, Tic-Tac-Toe: ~9). → Terminal State: A state where the</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">game ends (win/loss/draw). → Utility Function: Maps terminal states to</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">numeric payoffs (win = +1, loss = -1, draw = 0). → Ply: One half-move</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">(a single player&apos;s turn). Two ply = one full round. → Killer</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">heuristic: Moves that caused pruning at one depth are tried first at</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">sibling depths. → History heuristic: Track which moves caused cutoffs</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">most frequently.</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
