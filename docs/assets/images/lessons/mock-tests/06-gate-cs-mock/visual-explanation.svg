  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">GATE CS — Full-Length Mock Test</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">What: the length of the train?</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Note: → Topic Weightage: → A train running at 72 km/h crosses a pole</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">in 15 seconds. What is the length of the train? → Answer: →</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">Explanation: → Key Takeaway:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">{aⁿ | n ≥ 0}: Regular (single symbol, can be represented by a*). →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">{aⁿbⁿ | n ≥ 0}: Not regular (requires counting equal numbers, needs</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">PDA). Proved by pumping lemma. → {aⁿbᵐ | n,m ≥ 0}: Regular (a*b*). →</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">{w | w has even number of a&apos;s}: Regular (finite automaton with 2</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">states). → 5 push, 3 push, 2 push → *: pop 2, pop 3 → 3*2 = 6, push 6</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ +: pop 6, pop 5 → 5+6 = 11, push 11 → 8 push, 4 push</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="55" rx="3" fill="#1e40af"/>
