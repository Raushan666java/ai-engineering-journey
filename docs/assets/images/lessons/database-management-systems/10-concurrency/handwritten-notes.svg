    <text x="60" y="246" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">lock</tspan>: a mechanism that prevents concurrent access to a data item. Lock-based...</text>
