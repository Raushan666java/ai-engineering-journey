    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Definitions: → PACELC: → Implementation: → Cost: → Convergence</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">requires conflict resolution. → `W + R &gt; N`</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
