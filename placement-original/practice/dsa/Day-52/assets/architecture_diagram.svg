<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f4f7fb; stroke:#2b6cb0; stroke-width:2px; }
    .text { font-family: Arial, sans-serif; font-size:14px; fill:#1a202c }
    .title { font-weight:bold; font-size:16px }
    .arrow { stroke:#2b6cb0; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- API Gateway -->
  <rect x="50" y="30" width="200" height="60" rx="6" class="box" />
  <text x="150" y="62" text-anchor="middle" class="text title">API Gateway / Load Balancer</text>

  <!-- Services -->
  <rect x="320" y="20" width="220" height="120" rx="6" class="box" />
  <text x="430" y="40" text-anchor="middle" class="text title">Backend Services (Spring Boot)</text>
  <text x="430" y="64" text-anchor="middle" class="text">Auth | Task | Project | User</text>

  <!-- Database -->
  <rect x="320" y="160" width="220" height="60" rx="6" class="box" />
  <text x="430" y="192" text-anchor="middle" class="text title">PostgreSQL (Primary)</text>

  <!-- Cache -->
  <rect x="600" y="20" width="180" height="60" rx="6" class="box" />
  <text x="690" y="48" text-anchor="middle" class="text title">Redis Cache</text>

  <!-- Message Broker -->
  <rect x="600" y="120" width="180" height="60" rx="6" class="box" />
  <text x="690" y="148" text-anchor="middle" class="text title">RabbitMQ / Kafka</text>

  <!-- Storage -->
  <rect x="600" y="220" width="180" height="60" rx="6" class="box" />
  <text x="690" y="252" text-anchor="middle" class="text title">S3 (Attachments)</text>

  <!-- Arrows -->
  <line x1="250" y1="60" x2="320" y2="60" class="arrow" />
  <line x1="420" y1="140" x2="420" y2="160" class="arrow" />
  <line x1="540" y1="80" x2="600" y2="80" class="arrow" />
  <line x1="540" y1="140" x2="600" y2="140" class="arrow" />
  <line x1="540" y1="200" x2="600" y2="200" class="arrow" />

  <!-- Notes -->
  <text x="50" y="420" class="text">Legend: API Gateway → Backend → DB / Cache / Broker / Storage</text>
</svg>