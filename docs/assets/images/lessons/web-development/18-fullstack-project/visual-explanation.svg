    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. What is the advantage of a monorepo for full-stack development? →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">B) A monorepo with a shared types package ensures that the frontend</text>
  <text x="85" y="303" font-size="11" fill="#475569" font-family="Arial, sans-serif">and backend always agree on data shapes. Changing an API response type</text>
  <text x="85" y="321" font-size="11" fill="#475569" font-family="Arial, sans-serif">in the shared package immediately surfaces type errors in both</text>
  <text x="85" y="339" font-size="11" fill="#475569" font-family="Arial, sans-serif">codebases. → Q2. How does the `useApi` hook handle expired access</text>
  <text x="85" y="357" font-size="11" fill="#475569" font-family="Arial, sans-serif">tokens? → B) When the API returns 401, `useApi` calls the refresh</text>
  <text x="85" y="375" font-size="11" fill="#475569" font-family="Arial, sans-serif">endpoint with the stored refresh token. If successful, it retries the</text>
  <text x="85" y="393" font-size="11" fill="#475569" font-family="Arial, sans-serif">original request with the new access token. If refresh also fails, the</text>
  <text x="85" y="411" font-size="11" fill="#475569" font-family="Arial, sans-serif">user is redirected to login. → Q3. What is the purpose of the</text>
  <text x="85" y="429" font-size="11" fill="#475569" font-family="Arial, sans-serif">`AuthenticatedRequest` interface? → B) The `AuthenticatedRequest`</text>
  <text x="85" y="447" font-size="11" fill="#475569" font-family="Arial, sans-serif">interface extends Express `Request` with an optional `userId`</text>
  <text x="85" y="465" font-size="11" fill="#475569" font-family="Arial, sans-serif">property. The `authenticate` middleware sets this property after</text>
  <text x="85" y="483" font-size="11" fill="#475569" font-family="Arial, sans-serif">verifying the JWT, and route handlers access it to scope queries to</text>
  <text x="85" y="501" font-size="11" fill="#475569" font-family="Arial, sans-serif">the authenticated user.</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design and architect a full-stack web application from scratch → Set</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">up a monorepo with shared TypeScript types → Build a RESTful API with</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">Express and Prisma → Create a React frontend with Next.js → Implement</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">authentication and authorization → Deploy the complete application to</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">production → Apply testing and performance optimization strategies →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Frontend: Next.js 15 with App Router, React 19, TypeScript, Tailwind</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">CSS</text>
