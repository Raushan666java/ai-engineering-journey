    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Triage protocol: → The 80/20 rule: → Bottom-up approach (recommended</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">for most scenarios): → Top-down approach (better for</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">application-specific issues): → Divide and conquer approach: → Step 1</text>
  <text x="85" y="301" font-size="11" fill="#475569" font-family="Arial, sans-serif">— Define the problem precisely.</text>
