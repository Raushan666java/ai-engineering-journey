  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">s.length ≤ 2 × 10⁵ → Brute Force: Filter string, then reverse and</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">compare. Time O(n), Space O(n). → Optimal: Two pointers from both</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">ends, skip non-alphanumeric chars. Time O(n), Space O(1).</text>
