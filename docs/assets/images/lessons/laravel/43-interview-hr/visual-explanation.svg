  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Attraction → Employer branding, job postings distributed across</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">boards, career sites, and social channels → Recruitment → Sourcing,</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">screening, interviewing, assessing, and extending offers → Onboarding</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ Document collection (tax forms, ID verification), equipment</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">provisioning, system access grants, training, and orientation →</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Performance Management → Goal setting (OKRs/KPIs), regular check-ins,</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">quarterly reviews, feedback collection (360-degree), and performance</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">ratings → Development → Skill assessments, training enrollment,</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">mentorship matching, career pathing, and promotion readiness →</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">Retention &amp; Engagement → Pulse surveys, sentiment analysis,</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">recognition programs, compensation reviews, and stay interviews →</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">Offboarding → Resignation processing, exit interviews, knowledge</text>
  <text x="85" y="588" font-size="11" fill="#475569" font-family="Arial, sans-serif">transfer, equipment return, access revocation, and compliance</text>
  <text x="85" y="606" font-size="11" fill="#475569" font-family="Arial, sans-serif">recordkeeping → Sourcing → Proactive candidate discovery (job boards,</text>
  <text x="85" y="624" font-size="11" fill="#475569" font-family="Arial, sans-serif">LinkedIn, referrals, talent pools, boolean search)</text>
