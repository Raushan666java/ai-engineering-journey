    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Recognise patterns and relationships within the given data → Formulate</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">equations from textual or tabular clues → Solve for unknown values</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">systematically → Verify that derived values are consistent with all</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">given conditions → What information is available in the same row? →</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">What information is available in the same column? → What information</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">is available from other rows/columns through relationships? → What</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">percentages, ratios, or growth rates connect this value to known</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">values?</text>
