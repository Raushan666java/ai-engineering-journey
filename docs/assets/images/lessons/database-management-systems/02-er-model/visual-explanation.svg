    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify entities â†’ List all noun concepts from requirements (e.g.,</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Student, Course, Professor) → Identify relationships â†’ Find verb</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">associations between entities (e.g., Student enrolls in Course) →</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify cardinality â†’ Determine 1:1, 1:N, or M:N for each</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">relationship → Identify attributes â†’ List properties for each entity</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">(e.g., student_id, name, email) → Classify attributes â†’ Mark</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">simple/composite, single-valued/multi-valued, stored/derived, key →</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify weak entities â†’ Find entities that depend on others for</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">identity → Apply constraints â†’ Specify total/partial participation,</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">disjointness, completeness → Draw ER diagram â†’ Use rectangles,</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">diamonds, ellipses with standard notation</text>
