    <text x="60" y="300" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive"><tspan font-weight="bold">Calldata</tspan>: a read-only, non-modifiable location that avoids copying data. It&apos;s cheaper...</text>
