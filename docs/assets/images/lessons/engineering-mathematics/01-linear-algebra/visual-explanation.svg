<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Linear Algebra</text>
  <rect x="60" y="120" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">matrix: a rectangular array of numbers arranged in rows and columns.</text>
  <text x="85" y="180" font-size="11" fill="#475569" font-family="Arial, sans-serif">An $m \times n$...</text>
  <line x1="500" y1="200" x2="500" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="225" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="225" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Matrix Addition: → Scalar Multiplication: → Matrix Multiplication: →</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Properties of Matrix Multiplication: → Transpose: → Trace:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Associative: $(AB)C = A(BC)$ → Distributive: $A(B + C) = AB + AC$ →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">Not commutative: $AB \neq BA$ in general → Identity matrix $I$</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">satisfies $AI = IA = A$ → Symmetric: $A = A^T$ (entries symmetric</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">across diagonal) → Skew-symmetric: $A = -A^T$ (diagonal entries are</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">zero) → Orthogonal: $A^T A = AA^T = I$ (columns are orthonormal</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">vectors) → Diagonal: $a_{ij} = 0$ for $i \neq j$</text>
  <line x1="500" y1="410" x2="500" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="435" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="435" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="457" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="477" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: A = \begin{pmatrix} a_{11} &amp; a_{12} &amp; \cdots &amp; a_{1n}</text>
  <text x="85" y="495" font-size="11" fill="#475569" font-family="Arial, sans-serif">\\ a_{21} &amp; a_{22} &amp; \cdots &amp; a_{2n} \\ \vdots &amp;</text>
  <text x="85" y="513" font-size="11" fill="#475569" font-family="Arial, sans-serif">\vdots &amp; \ddots &amp; \vdots \\ a_{m1} &amp; a_{m2} &amp; \ |</text>
  <text x="85" y="531" font-size="11" fill="#475569" font-family="Arial, sans-serif">Matrix Addition:: (A + B)[i,j] = a_{ij} + b_{ij} | Scalar</text>
  <text x="85" y="549" font-size="11" fill="#475569" font-family="Arial, sans-serif">Multiplication:: (cA)[i,j] = c \cdot a_{ij} | Matrix Multiplication::</text>
  <text x="85" y="567" font-size="11" fill="#475569" font-family="Arial, sans-serif">C[i,j] = \sum_{k=1}^{n} a_{ik} \cdot b_{kj} | 5: \det\begin{pmatrix} a</text>
  <text x="85" y="585" font-size="11" fill="#475569" font-family="Arial, sans-serif">&amp; b \\ c &amp; d \end{pmatrix} = ad - bc | 6: \det\begin{pmatrix}</text>
  <text x="85" y="603" font-size="11" fill="#475569" font-family="Arial, sans-serif">a &amp; b &amp; c \\ d &amp; e &amp; f \\ g &amp; h &amp; i</text>
  <text x="85" y="621" font-size="11" fill="#475569" font-family="Arial, sans-serif">\end{pmatrix} = aei + bfg + cdh - ceg - bdi - afh</text>
  <line x1="500" y1="515" x2="500" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="540" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="562" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="582" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Matrix Operations and Solving Linear Systems:  Solve the</text>
  <text x="85" y="600" font-size="11" fill="#475569" font-family="Arial, sans-serif">system: $$2x + y - z = 8$$ $$-3x - y + 2z = -11$$ $$-2x + y + 2z =...</text>
  <line x1="500" y1="620" x2="500" y2="630" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="645" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="645" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="667" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="687" font-size="11" fill="#475569" font-family="Arial, sans-serif">- A matrix is a linear transformation; matrix multiplication composes</text>
  <text x="85" y="705" font-size="11" fill="#475569" font-family="Arial, sans-serif">transformations
- The...</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 1: Linear Algebra</text>
</svg>