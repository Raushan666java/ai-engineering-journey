  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">Software project management addresses the challenges of planning,</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">estimating, scheduling, and...</text>
