<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff" rx="6"/>
  <!-- Light grid -->
  <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="700" fill="url(#vgrid)"/>
    <rect x="40" y="50" width="920" height="50" rx="8" fill="#2563eb"/>
  <text x="500" y="82" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Informed Search and Heuristics</text>
  <rect x="60" y="120" width="880" height="55" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="120" width="8" height="55" rx="3" fill="#1e40af"/>
    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">admissibility: $h(n) \leq h^*(n)$).</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Real-World Analogy: → Real-World Analogy: → State: → Goal: → h1 = 4 →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">h2 = 1 + 1 + 1 + 2 = 5</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Design admissible and consistent heuristic functions using relaxation</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">and pattern databases. → Implement and analyze greedy best-first</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">search and A* search on graph problems. → Prove the optimality of A*</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">under specified conditions (admissibility and consistency). → Apply</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">memory-bounded variants (IDA*, RBFS) for large state-space problems. →</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Compare heuristics (Manhattan, Euclidean, Hamming) and choose the</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">right one for a given domain. → Blind search (BFS/DFS): Drive every</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">possible street systematically until you stumble upon the restaurant.</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">You might find it, but you&apos;ll waste hours ex → Informed search</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">(A* / GPS): Your GPS knows traffic conditions. It estimates travel</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">time using distance (how far each road goes) + traffic data (curren →</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">Identify the state space and goal condition.</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: h(n) \approx \text{cost}(n \rightarrow \text{goal}) | estimated</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">cost-to-go: f(n) = g(n) + h(n) | admissible: h(n) \leq h^*(n) |</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">monotone: h(n) \leq c(n, a, n&apos;) + h(n&apos;) | Key property —</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">Non-decreasing f:: f(n&apos;) = g(n&apos;) + h(n&apos;) = g(n) +</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">c(n,n&apos;) + h(n&apos;) \geq g(n) + h(n) = f(n) | 6: f(n) = g(n) +</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">h(n) \leq g(n) + h^*(n) = C^*</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="55" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="55" rx="3" fill="#831843"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Master the core concepts covered in this chapter</text>
  <!-- Footer note -->
  <text x="500" y="688" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">Chapter 3: Informed Search and Heuristics</text>
</svg>