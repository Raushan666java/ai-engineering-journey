    <text x="85" y="142" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Core Concept</text>
  <text x="85" y="162" font-size="11" fill="#475569" font-family="Arial, sans-serif">Types: better for unions, intersections, and computed types.</text>
  <line x1="500" y1="180" x2="500" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="205" width="880" height="75" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
    <rect x="60" y="205" width="8" height="75" rx="3" fill="#065f46"/>
    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Q1. When should you use an interface over a type alias? → B)</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Interfaces support declaration merging and extension (`extends`),</text>
  <text x="85" y="283" font-size="11" fill="#475569" font-family="Arial, sans-serif">making them ideal for public API shapes that may be extended later.</text>
  <text x="85" y="301" font-size="11" fill="#475569" font-family="Arial, sans-serif">Types are better for unions, intersections, and computed types. → Q2.</text>
  <text x="85" y="319" font-size="11" fill="#475569" font-family="Arial, sans-serif">What does `Pick&lt;User, &apos;id&apos; | &apos;name&apos;&gt;`</text>
  <text x="85" y="337" font-size="11" fill="#475569" font-family="Arial, sans-serif">produce? → B) `Pick` creates a type containing only the specified keys</text>
  <text x="85" y="355" font-size="11" fill="#475569" font-family="Arial, sans-serif">from the source type. `Omit` does the inverse — it excludes the</text>
  <text x="85" y="373" font-size="11" fill="#475569" font-family="Arial, sans-serif">specified keys. → Q3. How do discriminated unions improve type safety?</text>
  <text x="85" y="391" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ B) Discriminated unions use a literal property (like `kind`) to</text>
  <text x="85" y="409" font-size="11" fill="#475569" font-family="Arial, sans-serif">distinguish between union members. TypeScript narrows the type within</text>
  <text x="85" y="427" font-size="11" fill="#475569" font-family="Arial, sans-serif">each branch of a switch, ensuring only valid properties are accessed.</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Use TypeScript types, interfaces, and generics effectively →</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">Differentiate between types, interfaces, and type aliases → Apply</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">utility types and type narrowing patterns → Write type-safe React</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">components and API routes → Configure TypeScript for strict mode → A)</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">Always — interfaces are better → B) For object shapes that may be</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">extended or merged → C) For union types</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
