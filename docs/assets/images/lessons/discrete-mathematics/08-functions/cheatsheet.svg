<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <rect width="600" height="900" fill="#ffffff" rx="6"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="600" height="4" fill="#2563eb"/>
  <!-- Column dividers -->
  <line x1="300" y1="60" x2="300" y2="860" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,3"/>
    <text x="300" y="70" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Chapter 8: Functions</text>
  <text x="30" y="100" font-size="12" font-weight="bold" fill="#2563eb" font-family="Arial, sans-serif">KEY CONCEPTS</text>
  <line x1="30" y1="104" x2="290" y2="104" stroke="#2563eb" stroke-width="1"/>
  <text x="35" y="124" font-size="9" fill="#475569" font-family="Arial, sans-serif">Functions: a special</text>
  <text x="35" y="137" font-size="9" fill="#475569" font-family="Arial, sans-serif">case of relations ? each</text>
  <text x="35" y="150" font-size="9" fill="#475569" font-family="Arial, sans-serif">$x$ has one...</text>
  <text x="35" y="165" font-size="9" fill="#475569" font-family="Arial, sans-serif">Composition: associative</text>
  <text x="35" y="178" font-size="9" fill="#475569" font-family="Arial, sans-serif">but not commutative |</text>
  <text x="35" y="193" font-size="9" fill="#475569" font-family="Arial, sans-serif">What: the growth rate of</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">$f(n) = n \log n +</text>
  <text x="35" y="219" font-size="9" fill="#475569" font-family="Arial, sans-serif">\sqrt{n}$?</text>
  <text x="35" y="234" font-size="9" fill="#475569" font-family="Arial, sans-serif">Extended Analys:</text>
  <text x="35" y="247" font-size="9" fill="#475569" font-family="Arial, sans-serif">Definition 8.13</text>
  <text x="35" y="260" font-size="9" fill="#475569" font-family="Arial, sans-serif">(Little-o and</text>
  <text x="35" y="273" font-size="9" fill="#475569" font-family="Arial, sans-serif">Little-$\omega$).</text>
  <text x="35" y="288" font-size="9" fill="#475569" font-family="Arial, sans-serif">Comp: n! vs Stirling for</text>
  <text x="35" y="301" font-size="9" fill="#475569" font-family="Arial, sans-serif">n = 10</text>
  <text x="310" y="70" font-size="12" font-weight="bold" fill="#059669" font-family="Arial, sans-serif">FORMULAS & TIPS</text>
  <line x1="310" y1="74" x2="570" y2="74" stroke="#059669" stroke-width="1"/>
  <text x="315" y="94" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">composition:</text>
    <text x="315" y="107" font-size="9" fill="#475569" font-family="Arial, sans-serif">(g \circ f)(a) = g(f(a))</text>
  <text x="315" y="122" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">inverse:</text>
    <text x="315" y="135" font-size="9" fill="#475569" font-family="Arial, sans-serif">f^{-1}(b) = a \iff f(a) = b</text>
  <text x="315" y="150" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">Common growth rates (ordered by growth)::</text>
    <text x="315" y="163" font-size="9" fill="#475569" font-family="Arial, sans-serif">1 \prec \log n \prec \sqrt{n}...</text>
  <text x="315" y="178" font-size="9" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">Theorem 8.3 (Hierarchy of Growth).:</text>
    <text x="315" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">1 \ll \log n \ll \sqrt{n} \ll n...</text>
  <line x1="30" y1="470" x2="570" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="484" font-size="12" font-weight="bold" fill="#dc2626" font-family="Arial, sans-serif">INTERVIEW PREP</text>
  <line x1="30" y1="488" x2="290" y2="488" stroke="#dc2626" stroke-width="1"/>
  <text x="310" y="484" font-size="12" font-weight="bold" fill="#d97706" font-family="Arial, sans-serif">COMMON MISTAKES</text>
  <line x1="310" y1="488" x2="570" y2="488" stroke="#d97706" stroke-width="1"/>
  <text x="300" y="880" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Chapter 8: Functions — Quick Reference</text>
</svg>