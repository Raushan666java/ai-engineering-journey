    <text x="85" y="352" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">Use `@ManyToMany` only when the relationship truly has no attributes →</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">tags, categories, simple many-to-many labels → Use a join entity</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">whenever the relationship carries metadata (timestamps, roles,</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">quantities, status) → A join entity also makes it easier to query the</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">relationship itself: `SELECT e FROM Enrollment e WHERE e.grade =</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">&apos;A&apos;` → Performance: Select only needed columns → avoids</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">fetching large TEXT/BLOB columns → Read-only: No dirty checking</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">overhead → Hibernate tracks changes only on managed entities → Join</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">efficiency: DTOs can aggregate data from multiple entities without</text>
  <text x="85" y="534" font-size="11" fill="#475569" font-family="Arial, sans-serif">loading them → Safety: No lazy-loading exceptions outside transactions</text>
  <text x="85" y="552" font-size="11" fill="#475569" font-family="Arial, sans-serif">→ DTOs are plain objects → API boundary: Expose only intended fields</text>
  <text x="85" y="570" font-size="11" fill="#475569" font-family="Arial, sans-serif">to REST clients → never accidentally serialize lazy proxies</text>
