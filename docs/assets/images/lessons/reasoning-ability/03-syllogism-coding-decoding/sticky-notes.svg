<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Desk background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="#f1f5f9" opacity="0.3"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#e2e8f0" stroke-width="0.3"/>
  <!-- Sticky notes -->
  <g transform="rotate(-6 117.5 110)" filter="url(#shadow)">
      <rect x="30" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="42" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Look for direct</text>
    <text x="42" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">letter-to-letter</text>
    <text x="42" y="96" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">mapping first</text>
    <text x="42" y="118" font-size="10" fill="#475569" font-family="Arial, sans-serif">Compare the given word</text>
    <text x="42" y="132" font-size="10" fill="#475569" font-family="Arial, sans-serif">and its code letter by</text>
    <text x="42" y="146" font-size="10" fill="#475569" font-family="Arial, sans-serif">letter</text>
    </g>

<g transform="rotate(-6 312.5 110)" filter="url(#shadow)">
      <rect x="225" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="237" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Check for</text>
    <text x="237" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">uniform shift</text>
    <text x="237" y="100" font-size="10" fill="#475569" font-family="Arial, sans-serif">Is every letter</text>
    <text x="237" y="114" font-size="10" fill="#475569" font-family="Arial, sans-serif">shifted by the same</text>
    <text x="237" y="128" font-size="10" fill="#475569" font-family="Arial, sans-serif">amount?</text>
    </g>

<g transform="rotate(-6 507.5 110)" filter="url(#shadow)">
      <rect x="420" y="30" width="175" height="160" rx="4" fill="#FEF3C7" stroke="#92400e" stroke-width="1" opacity="0.95"/>
          <text x="432" y="60" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Check for</text>
    <text x="432" y="78" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">pattern in</text>
    <text x="432" y="96" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">differences</text>
    <text x="432" y="118" font-size="10" fill="#475569" font-family="Arial, sans-serif">If the shift is not</text>
    <text x="432" y="132" font-size="10" fill="#475569" font-family="Arial, sans-serif">uniform, is there a</text>
    <text x="432" y="146" font-size="10" fill="#475569" font-family="Arial, sans-serif">pattern (e.g., +1,...</text>
    </g>

<g transform="rotate(-6 117.5 290)" filter="url(#shadow)">
      <rect x="30" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="42" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Example:</text>
    <text x="42" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">D → %   E → ^
CAT →</text>
    </g>

<g transform="rotate(-6 312.5 290)" filter="url(#shadow)">
      <rect x="225" y="210" width="175" height="160" rx="4" fill="#DBEAFE" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
          <text x="237" y="240" font-size="12" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Example:</text>
    <text x="237" y="262" font-size="10" fill="#475569" font-family="Arial, sans-serif">- CAT → C=@, A=#, T=</text>
    </g>

<g transform="rotate(-6 117.5 470)" filter="url(#shadow)">
      <rect x="30" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="42" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="42" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">| Wrong Thinking |</text>
    <text x="42" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">Correct Approach |</text>
    </g>

<g transform="rotate(-6 312.5 470)" filter="url(#shadow)">
      <rect x="225" y="390" width="175" height="160" rx="4" fill="#FFEDD5" stroke="#9a3412" stroke-width="1" opacity="0.95"/>
          <text x="237" y="420" font-size="12" font-weight="bold" fill="#9a3412" font-family="Arial, sans-serif">Warning</text>
    <text x="237" y="442" font-size="10" fill="#475569" font-family="Arial, sans-serif">Alright, without a</text>
    <text x="237" y="456" font-size="10" fill="#475569" font-family="Arial, sans-serif">consistent pattern,</text>
    <text x="237" y="470" font-size="10" fill="#475569" font-family="Arial, sans-serif">this...</text>
    </g>

<g transform="rotate(-6 507.5 470)" filter="url(#shadow)">
      <rect x="420" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="432" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Important</text>
    <text x="432" y="438" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Equivalences:</text>
    <text x="432" y="460" font-size="10" fill="#475569" font-family="Arial, sans-serif">concept</text>
    </g>

<g transform="rotate(-6 702.5 470)" filter="url(#shadow)">
      <rect x="615" y="390" width="175" height="160" rx="4" fill="#F3E8FF" stroke="#581c87" stroke-width="1" opacity="0.95"/>
          <text x="627" y="420" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Step-by-Step</text>
    <text x="627" y="438" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Method for Venn</text>
    <text x="627" y="456" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Diagram</text>
    <text x="627" y="474" font-size="12" font-weight="bold" fill="#581c87" font-family="Arial, sans-serif">Approach:</text>
    <text x="627" y="496" font-size="10" fill="#475569" font-family="Arial, sans-serif">technique</text>
    </g>
  <!-- Coffee mug -->
  <g transform="translate(710, 460)">
    <rect x="0" y="10" width="40" height="45" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <path d="M40,18 Q55,22 40,32" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="20" cy="10" rx="20" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="20" cy="10" rx="16" ry="4" fill="#1e293b" opacity="0.2"/>
  </g>
  <!-- Pen -->
  <g transform="translate(680, 530) rotate(-30)">
    <rect x="0" y="0" width="80" height="5" rx="2" fill="#2563eb"/>
    <polygon points="80,0 90,2.5 80,5" fill="#1e293b"/>
  </g>
  <!-- Header -->
  <text x="400" y="592" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">Syllogism and Coding-Decoding</text>
</svg>