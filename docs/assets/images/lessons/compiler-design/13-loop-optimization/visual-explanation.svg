  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Both `y` and `z` are constants. → Both `y` and `z` are defined outside</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">the loop (their definitions reach the loop entry from outside). → If</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">`y` (or `z`) is defined inside the loop, that definition is itself</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">loop-invariant, and it reaches only this use (i.e., the defining</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">instruction is  → Dominance: the instruction dominates all loop exits.</text>
  <text x="85" y="442" font-size="11" fill="#475569" font-family="Arial, sans-serif">Moving it earlier cannot cause it to execute on a path that bypasses</text>
  <text x="85" y="460" font-size="11" fill="#475569" font-family="Arial, sans-serif">the original location. → Unique definition: the instruction is the</text>
  <text x="85" y="478" font-size="11" fill="#475569" font-family="Arial, sans-serif">only definition of `x` that reaches any use of `x` inside the loop. If</text>
  <text x="85" y="496" font-size="11" fill="#475569" font-family="Arial, sans-serif">another definition of `x` inside the  → No side effects: the</text>
  <text x="85" y="514" font-size="11" fill="#475569" font-family="Arial, sans-serif">instruction has no observable side effects beyond assigning `x`. In</text>
  <text x="85" y="532" font-size="11" fill="#475569" font-family="Arial, sans-serif">particular, it must not raise an exception, perform I/O, or m → Basic</text>
  <text x="85" y="550" font-size="11" fill="#475569" font-family="Arial, sans-serif">induction variable (BIV): an IV that is incremented or decremented by</text>
  <text x="85" y="568" font-size="11" fill="#475569" font-family="Arial, sans-serif">a constant each iteration, such as `i = i + 1`. BIVs are typically</text>
  <text x="85" y="586" font-size="11" fill="#475569" font-family="Arial, sans-serif">loop co → Derived induction variable (DIV): a variable whose value is</text>
  <text x="85" y="604" font-size="11" fill="#475569" font-family="Arial, sans-serif">a linear function of a BIV: `t = c1 ? i + c2`, where `i` is a BIV and</text>
