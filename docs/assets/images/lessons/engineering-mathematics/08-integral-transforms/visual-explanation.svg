    <text x="85" y="247" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="267" font-size="11" fill="#475569" font-family="Arial, sans-serif">Complex Exponential Form: → Parseval&apos;s Identity: → Gibbs</text>
  <text x="85" y="285" font-size="11" fill="#475569" font-family="Arial, sans-serif">Phenomenon: → Definition: → Inverse Transform: → Key Properties:</text>
  <line x1="500" y1="305" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="330" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="330" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="352" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="372" font-size="11" fill="#475569" font-family="Arial, sans-serif">1: f(t) = a_0 + \sum_{n=1}^\infty \left[a_n \cos\left(\frac{2\pi</text>
  <text x="85" y="390" font-size="11" fill="#475569" font-family="Arial, sans-serif">nt}{T}\right) + b_n \sin\left(\frac{2\pi nt}{T}\right)\right] | 2: a_0</text>
  <text x="85" y="408" font-size="11" fill="#475569" font-family="Arial, sans-serif">= \frac{1}{T} \int_0^T f(t)\,dt | 3: a_n = \frac{2}{T} \int_0^T f(t)</text>
  <text x="85" y="426" font-size="11" fill="#475569" font-family="Arial, sans-serif">\cos\left(\frac{2\pi nt}{T}\right) dt | 4: b_n = \frac{2}{T} \int_0^T</text>
  <text x="85" y="444" font-size="11" fill="#475569" font-family="Arial, sans-serif">f(t) \sin\left(\frac{2\pi nt}{T}\right) dt | Complex Exponential</text>
  <text x="85" y="462" font-size="11" fill="#475569" font-family="Arial, sans-serif">Form:: f(t) = \sum_{n=-\infty}^\infty c_n e^{i 2\pi nt/T} |</text>
  <text x="85" y="480" font-size="11" fill="#475569" font-family="Arial, sans-serif">Parseval&apos;s Identity:: \frac{1}{T} \int_0^T |f(t)|^2 dt = a_0^2 +</text>
  <text x="85" y="498" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{1}{2}\sum_{n=1}^\infty (a_n^2 + b_n^2) = \sum_{n=-\infty}^\infty</text>
  <text x="85" y="516" font-size="11" fill="#475569" font-family="Arial, sans-serif">|c_n|^2</text>
