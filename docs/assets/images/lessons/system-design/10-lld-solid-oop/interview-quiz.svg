      <text x="300" y="108" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Arial, sans-serif">concept</text>
  <rect x="200" y="144" width="200" height="4" rx="2" fill="#e2e8f0"/>
        <rect x="200" y="144" width="0" height="4" rx="2" fill="url(#gBlue)"/>
        <text x="300" y="164" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial, sans-serif">Progress: 0/3</text>
</svg>