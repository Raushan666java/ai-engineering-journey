    <text x="60" y="542" font-size="15" font-weight="bold" fill="#059669" font-family="'Segoe Print', 'Comic Sans MS', cursive">Workflow</text>
    <text x="60" y="570" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">1. Resource Allocation → Decide which process gets the CPU, how much...</text>
    <text x="60" y="592" font-size="13" fill="#1e293b" font-family="'Segoe Print', 'Comic Sans MS', cursive">2. Control Program → Prevent user programs from making errors or using...</text>
