  <text x="85" y="494" font-size="11" fill="#475569" font-family="Arial, sans-serif">transactions (write operations). → Contract: ABI-bound interface to</text>
  <text x="85" y="512" font-size="11" fill="#475569" font-family="Arial, sans-serif">interact with deployed contracts.</text>
