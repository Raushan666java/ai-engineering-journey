  <text x="35" y="191" font-size="9" fill="#475569" font-family="Arial, sans-serif">\subseteq S$.</text>
  <text x="35" y="206" font-size="9" fill="#475569" font-family="Arial, sans-serif">Probability: the ratio</text>
