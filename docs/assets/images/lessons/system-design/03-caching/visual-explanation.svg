    <text x="85" y="227" font-size="13" font-weight="bold" fill="#065f46" font-family="Arial, sans-serif">Architecture</text>
  <text x="85" y="247" font-size="11" fill="#475569" font-family="Arial, sans-serif">Temporal locality: → Spatial locality: → Cache effectiveness metric: →</text>
  <text x="85" y="265" font-size="11" fill="#475569" font-family="Arial, sans-serif">Pros: → Cons: → Pros:</text>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="310" width="880" height="75" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <rect x="60" y="310" width="8" height="75" rx="3" fill="#92400e"/>
    <text x="85" y="332" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial, sans-serif">Workflow</text>
  <text x="85" y="352" font-size="11" fill="#475569" font-family="Arial, sans-serif">Application checks cache for key K → If found (hit): return cached</text>
  <text x="85" y="370" font-size="11" fill="#475569" font-family="Arial, sans-serif">value. Done. → If not found (miss): query database for K → Store</text>
  <text x="85" y="388" font-size="11" fill="#475569" font-family="Arial, sans-serif">result in cache with TTL → Return result → Application writes to</text>
  <text x="85" y="406" font-size="11" fill="#475569" font-family="Arial, sans-serif">database → Application invalidates (or updates) the cache entry for</text>
  <text x="85" y="424" font-size="11" fill="#475569" font-family="Arial, sans-serif">the key → Application requests key K from cache</text>
  <line x1="500" y1="390" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="415" width="880" height="75" rx="6" fill="#fae8ff" stroke="#701a75" stroke-width="1.5"/>
    <rect x="60" y="415" width="8" height="75" rx="3" fill="#701a75"/>
    <text x="85" y="437" font-size="13" font-weight="bold" fill="#701a75" font-family="Arial, sans-serif">Formulas</text>
  <text x="85" y="457" font-size="11" fill="#475569" font-family="Arial, sans-serif">Cache effectiveness metric:: hit\_rate =</text>
  <text x="85" y="475" font-size="11" fill="#475569" font-family="Arial, sans-serif">\frac{cache\_hits}{cache\_hits + cache\_misses} | Cache effectiveness</text>
  <text x="85" y="493" font-size="11" fill="#475569" font-family="Arial, sans-serif">metric:: hit\_rate = \frac{cache\_hits}{cache\_hits + cache\_misses} |</text>
  <text x="85" y="511" font-size="11" fill="#475569" font-family="Arial, sans-serif">3: A well-tuned cache for an internet application achieves 90-99% hit</text>
  <text x="85" y="529" font-size="11" fill="#475569" font-family="Arial, sans-serif">rate. Below 85% hit rate, the cac | 4: 1, bio = | 5: 3&quot;,</text>
  <text x="85" y="547" font-size="11" fill="#475569" font-family="Arial, sans-serif">updates[&apos;name&apos;], updates[&apos;bio&apos;], user_id
    )</text>
  <text x="85" y="565" font-size="11" fill="#475569" font-family="Arial, sans-serif"># Invalidate cache — next read wil | 6: {userId}`;
  const acquired =</text>
  <text x="85" y="583" font-size="11" fill="#475569" font-family="Arial, sans-serif">await client.setNX(lockKey, &apos;1&apos;);
  if (!acquired) return;</text>
  <text x="85" y="601" font-size="11" fill="#475569" font-family="Arial, sans-serif">// anoth</text>
  <line x1="500" y1="495" x2="500" y2="505" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="880" height="75" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="60" y="520" width="8" height="75" rx="3" fill="#1e40af"/>
    <text x="85" y="542" font-size="13" font-weight="bold" fill="#1e40af" font-family="Arial, sans-serif">Real-world Example</text>
  <text x="85" y="562" font-size="11" fill="#475569" font-family="Arial, sans-serif">Example 1: Cache-Aside with Redis for a User Profile Service:</text>
  <text x="85" y="580" font-size="11" fill="#475569" font-family="Arial, sans-serif">Expected behavior: - First read for user 42: cache miss ? DB query ?</text>
  <text x="85" y="598" font-size="11" fill="#475569" font-family="Arial, sans-serif">populate...</text>
  <line x1="500" y1="600" x2="500" y2="610" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="625" width="880" height="75" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
    <rect x="60" y="625" width="8" height="75" rx="3" fill="#831843"/>
    <text x="85" y="647" font-size="13" font-weight="bold" fill="#831843" font-family="Arial, sans-serif">Key Takeaway</text>
  <text x="85" y="667" font-size="11" fill="#475569" font-family="Arial, sans-serif">- Caching exploits temporal and spatial locality. A 90%+ hit rate</text>
  <text x="85" y="685" font-size="11" fill="#475569" font-family="Arial, sans-serif">indicates a well-tuned cache;...</text>
